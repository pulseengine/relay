name: Release

# Tag-triggered: builds falcon-hello for five targets, then publishes
# a standardised PulseEngine release. Pattern mirrors
# pulseengine/synth/.github/workflows/release.yml — see that workflow
# for the cross-repo rationale (cosign-signed SHA256SUMS.txt, SBOM,
# SLSA build provenance, build-env capture).
#
# Required release assets, per the standardised pattern:
#   falcon-vX.Y.Z-<triple>.{tar.gz|zip}       # cross-compiled binaries
#   falcon-X.Y.Z.cdx.json                      # CycloneDX SBOM
#   SHA256SUMS.txt                             # one checksum file
#   SHA256SUMS.txt.sig                         # cosign detached sig
#   SHA256SUMS.txt.pem                         # Fulcio cert chain
#   SHA256SUMS.txt.cosign.bundle               # verifier-friendly bundle
#   build-env.txt                              # toolchain provenance
#   rivet-snapshot-falcon-vX.Y.Z.json          # falcon-specific (v0.9+)
#
# Tag convention: falcon-v<semver>, e.g. falcon-v0.16.2.
#
# Per-tag serial concurrency: never cancel a release mid-publish; a
# half-published release leaves the GitHub Release inconsistent.
#
# Verification one-liner (paste in release notes — see
# .github/release-notes/<vX.Y.Z>.md):
#
#   cosign verify-blob \
#     --certificate-identity-regexp \
#       'https://github.com/pulseengine/relay/.github/workflows/release.yml@.*' \
#     --certificate-oidc-issuer \
#       'https://token.actions.githubusercontent.com' \
#     --bundle SHA256SUMS.txt.cosign.bundle SHA256SUMS.txt
#   gh attestation verify falcon-vX.Y.Z-<triple>.tar.gz --repo pulseengine/relay
#
# Migration note (v0.17): the v0.7–v0.16 releases shipped per-asset
# .sha256 + .cosign.sig + .cosign.cert sidecars. Those are GONE from
# new releases — a single signed SHA256SUMS.txt covers every asset.
# Historical releases keep their old shape; consumers verifying a
# pre-v0.17 release follow the cosign verify-blob recipe in that
# release's notes.

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    tags:
      - "falcon-v*"
  # Manual re-run for a tag whose initial run failed partway. The tag
  # must already exist; this does not create tags.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)build (e.g. falcon-v0.16.2)"
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # CI-HARDENING: cap parallel rustc on the from-git tool installs (rivet/cross/
  # cyclonedx) so a cold compile cannot OOM. (create-release is on ubuntu-latest
  # so the risk is lower than the self-hosted gate, but keep it consistent.)
  CARGO_BUILD_JOBS: "2"
  # Opt the Node-20 JS actions (upload-/download-artifact@v4) into Node 24
  # ahead of GitHub's 2026-06-16 forced cutover; Node 20 removed 2026-09-16. (#153)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ── Cross-platform binary builds ──────────────────────────────────────
  build-binaries:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            cross: true
          - target: x86_64-apple-darwin
            os: macos-14
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
    env:
      TARGET: ${{ matrix.target }}
      ARCHIVE_KIND: ${{ matrix.archive }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Install cross (linux aarch64 only)
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross --locked

      - name: Build falcon-hello (native)
        if: ${{ !matrix.cross }}
        shell: bash
        run: cargo build --release --target "$TARGET" -p falcon-hello

      - name: Build falcon-hello (cross)
        if: matrix.cross
        shell: bash
        run: cross build --release --target "$TARGET" -p falcon-hello

      - name: Strip binary (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          strip "target/${TARGET}/release/falcon-hello" 2>/dev/null || true

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        env:
          # Resolve the version once: tag push -> refs/tags/falcon-vX.Y.Z;
          # workflow_dispatch -> the user-supplied tag input. Bound via
          # env: and dereferenced as $VERSION below — never expand
          # ${{ ... }} directly inside run: (command-injection vector).
          INPUT_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${INPUT_TAG:-${GITHUB_REF#refs/tags/}}"
          ARCHIVE="${VERSION}-${TARGET}.tar.gz"
          mkdir -p staging
          cp "target/${TARGET}/release/falcon-hello" staging/
          cp falcon/README.md staging/README.md 2>/dev/null || true
          cp CHANGELOG.md staging/ 2>/dev/null || true
          cp LICENSE staging/ 2>/dev/null || true
          tar -czf "$ARCHIVE" -C staging .
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - name: Package (zip)
        if: matrix.archive == 'zip'
        env:
          INPUT_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${INPUT_TAG:-${GITHUB_REF#refs/tags/}}"
          ARCHIVE="${VERSION}-${TARGET}.zip"
          mkdir -p staging
          cp "target/${TARGET}/release/falcon-hello.exe" staging/
          cp falcon/README.md staging/README.md 2>/dev/null || true
          cp CHANGELOG.md staging/ 2>/dev/null || true
          cp LICENSE staging/ 2>/dev/null || true
          cd staging && 7z a "../${ARCHIVE}" . && cd ..
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.target }}
          path: ${{ env.ARCHIVE }}
          retention-days: 7

  # ── Create the GitHub Release: SBOM, sums, SLSA, cosign ───────────────
  create-release:
    name: Create GitHub Release
    needs: [build-binaries]
    runs-on: ubuntu-latest
    permissions:
      # Keyless signing + provenance need an OIDC token; release-asset
      # upload needs contents: write; build provenance attestation
      # needs attestations: write. Mirrors pulseengine/synth.
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Flatten release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) \
            -exec cp {} release-assets/ \;
          ls -la release-assets/

      # ── Falcon-specific: rivet snapshot ──────────────────────────────
      # v0.9+: every release carries an audit-ready snapshot of the
      # rivet artifact graph at the released commit. Must run BEFORE
      # SHA256SUMS so the snapshot's digest enters the sums file.
      - uses: dtolnay/rust-toolchain@stable

      - name: Install rivet v0.19.0 (pinned; skip if cached)
        shell: bash
        # Pinned to match the verification gate (reproducible snapshots; no
        # recompile on rivet master pushes). Bump in lockstep with the gate.
        run: |
          set -euo pipefail
          if rivet --version 2>/dev/null | grep -q "0.19.0"; then
            echo "rivet 0.19.0 already on PATH"
          else
            cargo install --locked \
              --git https://github.com/pulseengine/rivet \
              --tag v0.19.0 \
              --bin rivet \
              rivet-cli
          fi

      - name: Capture rivet snapshot
        env:
          # TAG flows in via env: and is dereferenced through $TAG — never
          # expanded as ${{ ... }} inside the run: shell (untrusted input
          # safety, even though the tag is workflow-trigger constrained).
          INPUT_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          rivet snapshot capture \
            --name "$TAG" \
            --output "release-assets/rivet-snapshot-${TAG}.json"
          ls -la "release-assets/rivet-snapshot-${TAG}.json"

      # Phase 6 (per the cross-repo brief): CycloneDX SBOM for the
      # falcon-hello toolchain. Generated *before* SHA256SUMS so its
      # digest is captured in the checksum manifest; the cosign
      # signature over SHA256SUMS.txt then transitively covers the
      # SBOM.
      - name: Install cargo-cyclonedx
        run: cargo install --locked cargo-cyclonedx

      - name: Generate toolchain SBOM (CycloneDX)
        env:
          INPUT_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${INPUT_TAG:-${GITHUB_REF#refs/tags/}}"
          # falcon tags are `falcon-vX.Y.Z`; strip the prefix to get
          # bare semver `X.Y.Z` for the SBOM filename.
          BARE="${VERSION#falcon-v}"
          # cargo-cyclonedx doesn't proxy cargo's `-p` package-selection;
          # use `--manifest-path` to target falcon-hello's Cargo.toml.
          cargo cyclonedx \
            --manifest-path examples/falcon-hello/Cargo.toml \
            --format json \
            --spec-version 1.5
          SBOM_SRC="examples/falcon-hello/falcon-hello.cdx.json"
          if [ ! -f "$SBOM_SRC" ]; then
            SBOM_SRC=$(find examples/falcon-hello -maxdepth 2 -name '*.cdx.json' | head -1)
          fi
          test -n "$SBOM_SRC" && test -f "$SBOM_SRC"
          cp "$SBOM_SRC" "release-assets/falcon-${BARE}.cdx.json"
          echo "::notice::Toolchain SBOM written to release-assets/falcon-${BARE}.cdx.json"
          ls -la release-assets/

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum ./* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # ── SLSA build provenance (GitHub-native) ────────────────────────
      # actions/attest-build-provenance generates an in-toto SLSA v1
      # provenance statement for every binary archive, signs it keyless
      # via Sigstore (Fulcio cert bound to this workflow's OIDC
      # identity), and records it in the Rekor transparency log.
      # Consumers verify with `gh attestation verify <file> --repo
      # pulseengine/relay`.
      - name: Generate SLSA build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            release-assets/*.tar.gz
            release-assets/*.zip

      # ── Sigstore keyless signing (cosign) ────────────────────────────
      # Signs SHA256SUMS.txt so a consumer can verify the checksum file
      # itself was produced by this workflow (closes the gap where an
      # attacker who can replace a release asset could also replace
      # the plain checksum file). The .cosign.bundle is the
      # verifier-friendly artifact; .sig + .pem are the detached
      # signature and Fulcio certificate.
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.1'

      - name: Sign SHA256SUMS with cosign (keyless OIDC)
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          cosign sign-blob \
            --yes \
            --bundle SHA256SUMS.txt.cosign.bundle \
            --output-signature SHA256SUMS.txt.sig \
            --output-certificate SHA256SUMS.txt.pem \
            SHA256SUMS.txt
          echo "::notice::SHA256SUMS signed via Sigstore keyless flow."
          ls -la ./*

      - name: Capture build environment
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "rustc: $(rustc --version)"
            echo "cargo: $(cargo --version)"
            echo "cosign: $(cosign version 2>&1 | head -1)"
            echo "rivet: $(rivet --version 2>&1 | head -1)"
            echo "runner: $(uname -srm)"
          } > release-assets/build-env.txt
          cat release-assets/build-env.txt

      - name: Pick release notes body
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          STEM="${TAG#falcon-}"
          NOTES_FILE=".github/release-notes/${STEM}.md"
          if [ -f "$NOTES_FILE" ]; then
            echo "Using release notes from $NOTES_FILE"
            printf 'notes_path=%s\n' "$NOTES_FILE" >>"$GITHUB_OUTPUT"
          else
            echo "No release notes file at $NOTES_FILE; using gh autogen"
            printf 'notes_path=\n' >>"$GITHUB_OUTPUT"
          fi

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
          NOTES_PATH: ${{ steps.notes.outputs.notes_path }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          # Idempotent: re-running the workflow for an existing release
          # uploads/overwrites assets rather than failing. --clobber lets
          # a re-run replace assets a previous partial run left behind.
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "::notice::Release $VERSION exists; uploading assets"
            gh release upload "$VERSION" --clobber release-assets/*
          elif [ -n "${NOTES_PATH}" ]; then
            echo "::notice::Creating Release $VERSION with notes from ${NOTES_PATH}"
            gh release create "$VERSION" \
              --title "$VERSION" \
              --notes-file "${NOTES_PATH}" \
              release-assets/*
          else
            echo "::notice::Creating Release $VERSION with autogen notes"
            gh release create "$VERSION" \
              --title "$VERSION" \
              --generate-notes \
              release-assets/*
          fi

  # ── Flight Wasm component: build, attach, and GUARD (#140 / #100) ──────
  # The falcon-flight Wasm component used to be attached by a SEPARATE MANUAL
  # step, so it silently went missing twice (#100 v1.28–32, #140 v1.45–55).
  # Build + upload it here as part of the release, then a hard guard fails the
  # workflow if the asset is absent — so a third silent recurrence is impossible.
  flight-component:
    name: Build + attach flight Wasm component (+ guard)
    needs: [create-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write          # keyless cosign over the bundle SHA256SUMS (v1.77)
      packages: write          # OCI push of the flight component to ghcr.io (v1.128)
    steps:
      # relay's MODULE.bazel local_path_override's the four pulseengine rules to
      # ../<repo>, so bazel needs relay in a subdir + the rules as siblings
      # (mirrors .github/workflows/bazel.yml). build-components.sh bazel-builds
      # the P3 stream artifacts into the bundle, so the bundle SHA256SUMS (signed
      # below) attests them. Steps below run with working-directory: relay.
      - name: Checkout relay
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          path: relay
      - name: Checkout rules_wasm_component
        uses: actions/checkout@v7
        with:
          repository: pulseengine/rules_wasm_component
          path: rules_wasm_component
      - name: Checkout rules_verus
        uses: actions/checkout@v7
        with:
          repository: pulseengine/rules_verus
          path: rules_verus
      - name: Checkout rules_rocq_rust
        uses: actions/checkout@v7
        with:
          repository: pulseengine/rules_rocq_rust
          path: rules_rocq_rust
      - name: Checkout rules_lean
        uses: actions/checkout@v7
        with:
          repository: pulseengine/rules_lean
          path: rules_lean

      # relay's bazel graph pulls a toolchain via rules_nixpkgs (needs
      # nix-build) + setup-bazel — same as the cascade CI job. Without these the
      # bazel build aborts with "nix-build not found in PATH".
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@33c9ab3ef95cd57c164d9d6eb1f9a46338538d41 # pinned (was @main) — supply-chain

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@5483a91b6e3ffac6092848f1dd7eafcfad203d80 # v0.14.0 pinned
        with:
          bazelisk-cache: true
          disk-cache: bazel
          repository-cache: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          # BOTH targets (v1.131): std components build wasm32-wasip2; no_std
          # components build wasm32-unknown-unknown (see NOSTD_COMPONENTS in
          # scripts/build-components.sh — the wasip2 target links wasi-libc,
          # whose cabi_realloc pulls in memory.grow, which blocks the MCU
          # lowering). Omitting the second target fails the release at
          # "building rate (wasm32-unknown-unknown)... ERROR: no .wasm found".
          targets: wasm32-wasip2, wasm32-unknown-unknown

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Install cargo-component
        uses: taiki-e/install-action@v2.85.6
        with:
          tool: cargo-component

      # Install wasmtime so build-components.sh's flight smoke-test actually RUNS
      # at release time — the component is validated (run-stabilization < 0.1,
      # run-position-hold < 0.6) before it ships, not just built. (Per review:
      # install, don't skip — the skip in build-components.sh is only a fallback.)
      - name: Install wasmtime
        uses: taiki-e/install-action@v2.85.6
        with:
          tool: wasmtime

      - name: Build the falcon component bundle + sign + attach + guard
        working-directory: relay
        env:
          # TAG via env, dereferenced as $TAG — never expanded as ${{ }}
          # inside run: (untrusted-input safety, per the rest of this file).
          INPUT_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_BAZEL_REPIN: "1"   # crate_universe resolution on a clean checkout
        shell: bash
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-${GITHUB_REF_NAME}}"           # falcon-vX.Y.Z
          MM=$(printf '%s' "$TAG" | sed -E 's/^falcon-v([0-9]+\.[0-9]+).*/\1/')
          echo "::notice::Building falcon component bundle for $TAG (MM=$MM)"
          # build-components.sh bazel-builds the P3 stream artifacts into the
          # bundle (bazel resolves via the sibling rules checkouts above).
          bash scripts/build-components.sh "$MM"

          BUNDLE="dist/falcon-components-v${MM}"
          FLIGHT="${BUNDLE}/falcon-flight-v${MM}.wasm"
          ( cd "$BUNDLE" && { sha256sum "falcon-flight-v${MM}.wasm" 2>/dev/null || shasum -a 256 "falcon-flight-v${MM}.wasm"; } > "falcon-flight-v${MM}.wasm.sha256" )
          tar -C dist -czf "dist/falcon-components-v${MM}.tar.gz" "falcon-components-v${MM}"

          # Cosign-sign the bundle SHA256SUMS (covers every .wasm in the bundle,
          # including the P3 stream artifacts) — keyless Sigstore, same flow as
          # the main SHA256SUMS.txt. Closes the FV-RELAY-STREAM-014 attestation
          # gap (v1.77). Verify: cosign verify-blob --certificate-identity-regexp
          # 'https://github.com/pulseengine/relay/.github/workflows/release.yml@.*'
          # --certificate-oidc-issuer 'https://token.actions.githubusercontent.com'
          # --bundle SHA256SUMS.cosign.bundle SHA256SUMS
          ( cd "$BUNDLE" && cosign sign-blob \
              --yes \
              --bundle SHA256SUMS.cosign.bundle \
              --output-signature SHA256SUMS.sig \
              --output-certificate SHA256SUMS.pem \
              SHA256SUMS )

          gh release upload "$TAG" --clobber \
            "$FLIGHT" \
            "${FLIGHT}.sha256" \
            "dist/falcon-components-v${MM}.tar.gz" \
            "${BUNDLE}/manifest.json" \
            "${BUNDLE}/SHA256SUMS" \
            "${BUNDLE}/SHA256SUMS.sig" \
            "${BUNDLE}/SHA256SUMS.pem" \
            "${BUNDLE}/SHA256SUMS.cosign.bundle"

          # GUARD (#140): the release MUST carry a falcon-flight-*.wasm asset.
          echo "::notice::Asserting flight wasm asset is present on $TAG"
          if gh release view "$TAG" --json assets -q '.assets[].name' \
               | grep -qE 'falcon-flight-v[0-9.]+\.wasm$'; then
            echo "guard OK: falcon-flight wasm asset present on $TAG"
          else
            echo "::error::Release $TAG has NO falcon-flight-*.wasm asset — the #100/#140 regression. Failing."
            exit 1
          fi


      # ── Publish the flight component to ghcr.io as an OCI artifact (v1.128) ──
      # An ADDITIVE distribution channel: the same verified `falcon:flight`
      # component, pushed as an OCI 1.1 artifact with the Component-Model media
      # type via `wkg`, so it is `wkg oci pull`-able and indexable by
      # wasm.directory (a meta-registry over OCI registries). Cosign-signed by
      # immutable DIGEST, like the release bundle. NON-BLOCKING
      # (continue-on-error): the primary artifact is the cosign-signed GitHub
      # Release above; a registry hiccup must never fail a release. Tighten to
      # hard-fail once proven over a few tags. Ref: ghcr.io/<owner>/falcon-flight.
      - name: Publish cascade components to ghcr.io (OCI, cosign-signed)
        continue-on-error: true
        working-directory: relay
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Bind the tag via env — never expand ${{ ... }} inside run: (the
          # command-injection convention this file follows throughout).
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          # Validate the shape before it reaches any shell command: a release
          # tag is falcon-vX.Y.Z (+ optional prerelease). Reject anything else.
          if ! printf '%s' "$TAG" | grep -qE '^falcon-v[0-9]+\.[0-9]+\.[0-9]+([-.][A-Za-z0-9.]+)?$'; then
            echo "::error::refusing to publish OCI for a malformed tag: $TAG"; exit 1
          fi
          MM=$(printf '%s' "$TAG" | sed -E 's/^falcon-v([0-9]+\.[0-9]+).*/\1/')
          FULL=$(printf '%s' "$TAG" | sed -E 's/^falcon-v//')

          # Per-component OCI publish (jess#167 decision 5): each fine-grained
          # verified cascade stage is its own cosign-signed OCI entity, so jess
          # can `wkg oci pull` and fuse/lower/place per core. The bundle dir was
          # produced WASI-free (--no-default-features) by the build step above;
          # push straight from it (no re-download). `flight` is the runnable
          # demo; the rest are the composable stages.
          SLUGS="flight iekf position attitude rate mixer"
          BUNDLE="dist/falcon-components-v${MM}"

          # wkg = the wasm-pkg-tools CLI. PINNED (supply-chain), bumped in
          # lockstep. Pushes the wasm-component OCI media type wasm.directory
          # expects — a plain `oras push` would tag it as a generic blob.
          cargo install wkg --locked --version 0.15.1
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

          # RFC-3339 build timestamp for org.opencontainers.image.created.
          CREATED=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          published=0
          for slug in $SLUGS; do
            WASM="${BUNDLE}/falcon-${slug}-v${MM}.wasm"
            # NESTED PATH (v1.133): ghcr.io/<owner>/falcon/<stage>, not
            # ghcr.io/<owner>/falcon-<stage>. Mirrors how wasi publishes
            # (ghcr.io/webassembly/wasi/io under namespace `wasi`), and groups
            # everything falcon under one path instead of a flat hyphenated
            # list. The wasm.directory entry keeps the display name
            # `falcon-<stage>` and points `repository` at the nested path —
            # exactly wasi's shape (`name = "io"`, `repository = "wasi/io"`).
            # Bundled with the falcon:* -> pulseengine:falcon-* WIT rename so
            # consumers absorb ONE break, not two. Paths published up to
            # falcon-v1.131.1 keep serving their old versions.
            REPO="ghcr.io/${GITHUB_REPOSITORY_OWNER}/falcon/${slug}"
            if [ ! -f "$WASM" ]; then
              echo "::warning::missing ${WASM} — skipping falcon-${slug}"; continue
            fi
            # STANDARD OCI ANNOTATIONS — this is what wasm.directory renders.
            # Without them the listing reads "No description available" with no
            # license or source link, however complete the crate metadata is:
            # the web listing reads the MANIFEST ANNOTATIONS, not the wasm's
            # embedded package-metadata section. Descriptions are sourced from
            # each component crate's Cargo.toml so there is one source of truth.
            CRATE_DIR="wasm/cm/${slug}"
            [ -d "$CRATE_DIR" ] || CRATE_DIR="wasm/cm/falcon-${slug}"
            DESC=$(sed -n 's/^description *= *"\(.*\)"$/\1/p' "${CRATE_DIR}/Cargo.toml" 2>/dev/null | head -1)
            [ -n "$DESC" ] || DESC="Formally-verified falcon flight-control component (${slug})."
            ANN=(
              --annotation "org.opencontainers.image.title=pulseengine:falcon-${slug}"
              --annotation "org.opencontainers.image.description=${DESC}"
              --annotation "org.opencontainers.image.version=${FULL}"
              --annotation "org.opencontainers.image.licenses=Apache-2.0"
              --annotation "org.opencontainers.image.source=https://github.com/pulseengine/relay"
              --annotation "org.opencontainers.image.documentation=https://github.com/pulseengine/relay/blob/main/docs/OCI-DISTRIBUTION.md"
              --annotation "org.opencontainers.image.vendor=PulseEngine"
              --annotation "org.opencontainers.image.revision=${GITHUB_SHA}"
              --annotation "org.opencontainers.image.created=${CREATED}"
            )
            wkg oci push "${ANN[@]}" "${REPO}:${FULL}" "$WASM" | tee "push-${slug}.log"
            # :latest is a moving convenience pointer — pushed for discovery,
            # but NEVER signed (only immutable refs get a signature).
            wkg oci push "${ANN[@]}" "${REPO}:latest" "$WASM"
            # Sign the IMMUTABLE digest, not a mutable tag. Only if we resolved one.
            DIGEST=$(grep -oE 'sha256:[a-f0-9]{64}' "push-${slug}.log" | head -1 || true)
            if [ -n "$DIGEST" ]; then
              cosign sign --yes "${REPO}@${DIGEST}"
              echo "::notice::Published + signed ${REPO}@${DIGEST} (tags ${FULL}, latest). Pull: wkg oci pull ${REPO}:${FULL}"
              published=$((published + 1))
            else
              echo "::warning::pushed ${REPO}:${FULL} but could not resolve a digest to sign — left unsigned this run"
            fi
          done
          echo "::notice::per-component OCI publish: ${published} components signed + pushed"
