name: Bazel

# Builds the v0.7 Component Model cascade under Bazel.
#
# relay's MODULE.bazel uses local_path_override for the four
# PulseEngine rules_* repos, so they are checked out as siblings of
# relay under $GITHUB_WORKSPACE (relay/, rules_wasm_component/, ...).
# The siblings track their default branch — pin them with
# git_override in MODULE.bazel if reproducibility across drift matters.
#
# The build resolves the Nix-backed Rocq toolchain, so Nix is
# installed; the first run fetches Coq from cache.nixos.org.

on:
  push:
    branches: [main]
  # PR runs are path-filtered (CI diet): the Bazel build + Component Model
  # cascade compose the flight component (wasm/cm/flight) and build the
  # crates/proofs via Bazel. Generous globs — a too-narrow filter would let a
  # breaking PR skip this and redden main. NON-REQUIRED check; skip never blocks
  # a merge. push:main stays UNFILTERED (backstop).
  pull_request:
    branches: [main]
    paths:
      - 'crates/**'
      - 'wasm/**'
      - 'embedded/**'
      - 'proofs/**'
      - 'wit/**'
      - '**/BUILD.bazel'
      - '**/*.bzl'
      - 'MODULE.bazel'
      - 'MODULE.bazel.lock'
      - '.bazelrc'
      - '.github/workflows/bazel.yml'

# Group key: head_ref (PR branch name) for pull_request events; ref
# (e.g. refs/heads/main) for push events — unique per branch/PR.
# PRs and non-main branch pushes: cancel superseded runs.
# Main pushes: never cancel — evidence preservation (branch-protection).
concurrency:
  group: bazel-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  cascade:
    name: Component Model cascade
    runs-on: ubuntu-latest
    steps:
      # The cascade build (wasmtime 45 + full crate universe) has outgrown
      # the hosted runner's free disk (ENOSPC at 23 MB free, 2026-07-16,
      # twice on identical inputs — capacity, not flake). Drop the runner
      # image's preinstalled bloat (~15 GB) before building.
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc             /usr/local/.ghcup /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h / | tail -1
      - name: Checkout relay
        uses: actions/checkout@v7
        with:
          path: relay

      - name: Checkout rules_wasm_component
        uses: actions/checkout@v7
        with:
          repository: pulseengine/rules_wasm_component
          path: rules_wasm_component

      - name: Checkout rules_verus
        uses: actions/checkout@v7
        with:
          repository: pulseengine/rules_verus
          path: rules_verus

      - name: Checkout rules_rocq_rust
        uses: actions/checkout@v7
        with:
          repository: pulseengine/rules_rocq_rust
          path: rules_rocq_rust

      - name: Checkout rules_lean
        uses: actions/checkout@v7
        with:
          repository: pulseengine/rules_lean
          path: rules_lean

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # pinned (was @main) — supply-chain

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: bazel
          repository-cache: true

      # CARGO_BAZEL_REPIN lets crate_universe resolve the relay_crates
      # graph on a clean checkout. All run: steps are static — no
      # interpolation of event-controlled input.
      - name: Build the composed cascade
        working-directory: relay
        env:
          CARGO_BAZEL_REPIN: "1"
        # Also builds the P3 (Component-Model Preview 3) async STREAM components:
        # the full cFS set //:relay-lc-stream + //:relay-sch-stream +
        # //:relay-hk-stream + //:relay-sc-stream (#STREAM-P01..P04), plus the
        # first control-cascade stream //:falcon-rate-stream (#STREAM-P05), so
        # their P3 async build is CI-validated, not just asserted.
        run: |
          # QUERY, DO NOT ENUMERATE (#407) - BUT BUILD-UNLESS-WAIVED, not
          # build-everything. This step was a hand-written list of 19 targets,
          # the exact anti-pattern verus.yml was repaired to remove after #364:
          # "19 verus_test targets were defined and none was ever executed - a
          # hand-written target list is exactly the drift that produced that."
          # A target added to BUILD.bazel and not added here is never built, and
          # nothing says so. //:falcon-cascade-coverage is the casualty: it
          # exists, FV-FALCON-COV-001 cites it as a `steps:` entry, and no
          # workflow builds it.
          #
          # SO THE DEFAULT IS INVERTED. The query discovers every target of the
          # relevant kinds and the exclusions are an EXPLICIT, printed waiver
          # list - the same shape as kani.yml's KANI_MATRIX_WAIVERS. A new
          # component is now built automatically; anything skipped has to say
          # why, where a reader can see it.
          #
          # THE WAIVER LIST IS DELIBERATELY CONSERVATIVE, and the reason is
          # honest rather than tidy: the query selects 29 targets where the old
          # list named 19, and I CANNOT RUN `bazel query` here (nix is not on
          # PATH on this machine), so I cannot tell which of the 10 newcomers
          # build. Waiving exactly those 10 keeps today's build identical to the
          # list this replaces while still fixing the class. Removing a name
          # from WAIVED is how you find out - and CI, not a guess, is what
          # answers it.
          WAIVED="//:relay-runner //:falcon-ekf //:falcon-iekf //:falcon-position
                  //:falcon-attitude //:falcon-rate //:falcon-mixer
                  //:relay-fused //:relay-all-fused //:falcon-cascade-fused"
          # falcon-ekf is the Mahony filter and falcon-{iekf,position,attitude,
          # rate,mixer} are the non-stream stage components - none was in the
          # old list. //:falcon-cascade-fused and the two relay-*-fused are
          # meld_fuse targets in the area gale#398 describes. All ten are
          # UNVERIFIED here, not known-broken.
          #
          # //:falcon-cascade-coverage and its two siblings are NOT in this
          # query at all: kind `wasm_module_coverage_wasi` is excluded because
          # the coverage RUN is manual - bundled witness cannot parse the
          # component-format export section (#145), as the next step records.
          # That exclusion was previously by OMISSION, indistinguishable from an
          # oversight; it is now stated. Whether the target ALSO fails to fuse
          # (#407's title, duplicate cabi_realloc) remains UNESTABLISHED - it
          # has never been attempted in CI and is not attempted here, because a
          # documented-unbuildable target does not belong in a required step.
          ALL=$(bazel query '
              kind("rust_wasm_component_bindgen rule", //:*)
            + kind("meld_fuse rule", //:*)
            + //:cascade-orch
          ' 2>/dev/null | tr '\n' ' ')
          # NORMALISE BEFORE MATCHING. `$WAIVED` is written multi-line for
          # readability, so used directly as a haystack its line-final entries
          # are followed by a NEWLINE and `*" $T "*` cannot match them. Caught
          # by simulating the query before shipping: //:falcon-position and
          # //:falcon-mixer - the two names at line ends - leaked through and
          # the step selected 21 targets instead of 19. A waiver list that
          # silently fails to waive is worse than no list, because the extra
          # builds look intentional.
          WAIVED_FLAT=$(printf '%s' "$WAIVED" | tr -s '[:space:]' ' ')
          TARGETS=""
          for T in $ALL; do
            case " $WAIVED_FLAT " in *" $T "*) continue ;; esac
            TARGETS="$TARGETS $T"
          done

          # A QUERY THAT UNDER-SELECTS IS WORSE THAN THE LIST IT REPLACED,
          # because it fails SILENTLY: CI stays green and simply builds less.
          # This repo declined to narrow the Kani matrix for exactly that
          # reason. So the result is GUARDED against every target the old list
          # named, and the step fails loudly naming any that vanished.
          MUST="//:falcon-cascade //:relay-lc-stream //:relay-sch-stream
                //:relay-hk-stream //:relay-sc-stream //:falcon-rate-stream
                //:falcon-position-stream //:falcon-attitude-stream
                //:falcon-iekf-stream //:falcon-mixer-stream
                //:falcon-cascade-stream-composed //:falcon-cascade-stream-fused
                //:cascade-orch //:falcon-cascade-step
                //:falcon-cascade-step-fused //:relay-lc //:relay-sch
                //:relay-hk //:relay-sc"
          MISSING=""
          for T in $MUST; do
            case " $TARGETS " in *" $T "*) ;; *) MISSING="$MISSING $T" ;; esac
          done
          if [ -n "$MISSING" ]; then
            echo "::error::the bazel query no longer covers:${MISSING}"
            echo "::error::query returned: ${ALL}"
            echo "::error::A rule kind changed, a target was renamed, or it was waived by mistake. Do NOT relax this guard to make it green - the point is that a query building LESS than the old list must FAIL, not pass quietly."
            exit 1
          fi
          echo "::notice::bazel: building $(printf '%s\n' $TARGETS | grep -c .) discovered targets; $(printf '%s\n' $WAIVED | grep -c .) waived"
          printf '  build  %s\n' $TARGETS
          printf '  WAIVED %s\n' $WAIVED
          bazel build $TARGETS

      # Exercise the witness MC/DC path end-to-end (#145): forces the
      # harness_crates crate_universe (wasmtime/tokio) to resolve, builds the
      # //host/witness-wasi-harness rust_binary. (The coverage RUN on the fused
      # cascade stays manual — bundled witness can't parse the component-format
      # export section; see BUILD.bazel + #145.)
      - name: Build the harness + real-component MC/DC coverage
        working-directory: relay
        env:
          CARGO_BAZEL_REPIN: "1"
        run: bazel build //host/witness-wasi-harness
