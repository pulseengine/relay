name: Rocq

# Kernel-checks the Rocq/Coq proofs under proofs/rocq/ AND the machine-checked
# floating-point error-bound proofs under proofs/gappa/ (Gappa -> Flocq/Rocq,
# coqc-verified) via rules_rocq_rust (Bazel). Both sets were authored +
# locally kernel-verified but NEVER gated in CI — the same orphaned-proof gap
# that left the Kani harnesses unenforced until v1.104 and the Lean proofs
# until lean.yml. This runs `bazel test //proofs/rocq:all //proofs/gappa:all`
# so that a rules_rocq_rust / Coq / Gappa toolchain bump or an edit that breaks
# a proof (or loosens a proven bound) shows up red.
#
# NOT A REQUIRED CHECK. Branch protection on main requires 10 contexts and
# "Rocq + Gappa proofs" is not one of them (measured 2026-11-04 with
# `gh api repos/pulseengine/relay/branches/main/protection`). The reason is in
# the trigger below: PR runs are path-filtered and there is no `merge_group`
# trigger. A required context that never reports would hold a PR, and the merge
# queue, forever. push:main runs unfiltered, so a break shows up red on main;
# it does not block the merge that caused it.
#
# Separate workflow (not the cascade Bazel job): the first run fetches the
# Rocq + Flocq + Gappa + Coq-Interval toolchain via nix — heavier than the
# component-model cascade build, and it should gate on its own verdict.

on:
  push:
    branches: [main]
  # PR runs are path-filtered (CI diet): the Rocq/Gappa proofs cover the
  # relay-math FP kernels, so re-run on proof changes AND on relay-math changes
  # (drift catch — the proofs hardcode the kernel coefficients). NON-REQUIRED
  # check; skip never blocks a merge. push:main stays UNFILTERED (backstop).
  pull_request:
    branches: [main]
    paths:
      - 'proofs/rocq/**'
      - 'proofs/gappa/**'
      - 'crates/relay-math/**'
      - 'MODULE.bazel'
      - '.github/workflows/rocq.yml'

concurrency:
  group: rocq-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  rocq:
    name: Rocq + Gappa proofs
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout relay
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: relay

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/lib/jvm "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          df -h /

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # pinned — supply-chain

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@f34d6a05eae3c24acab7fa54587492daeaeffdab # v0.19.2 (tag object e1614ab8 -> commit f34d6a05)
        with:
          bazelisk-cache: true
          disk-cache: bazel
          repository-cache: true

      - name: Kernel-check every Rocq + Gappa proof
        working-directory: relay
        # :all is bazel's implicit all-rules target — every rocq_library /
        # rocq_proof_test / gappa_proof in the package, so a newly added proof
        # is gated the moment its BUILD target lands.
        run: bazel test //proofs/rocq:all //proofs/gappa:all --test_output=errors
