# CIFLOW-P01: a green PR shall merge without a human noticing it is stuck.
#
# THE MEASURED DEFECT. `main` has strict protection ("require branches to be up
# to date"), and GitHub's auto-merge NEVER updates a BEHIND branch. So every
# merge to main leaves every other open PR BEHIND, and a BEHIND PR reports ALL
# CHECKS GREEN AND NO FAILURES while being unmergeable forever. It is invisible
# in every summary view — `gh pr checks` says pass, the UI shows green ticks.
#
# Measured on 2026-10-01 alone: eight manual `gh pr update-branch` calls across
# four passes, on #500, #501, #502, #504, #506, #507, #510. Each one was a human
# (or agent) noticing. That is exactly what CIFLOW-P01's falsification forbids:
# "a PR with every required check green stays open more than 24 h without a
# human action". #373 is the original report; it recurred on every merge of the
# 2026-09-16/17 train and has recurred on every merge since.
#
# WHY A WORKFLOW AND NOT A SETTING: GitHub has no auto-update-on-base-change. The
# repo setting people reach for ("Always suggest updating pull request branches")
# only adds a BUTTON.
#
# ============================================================================
# IT USED TO UPDATE THE BRANCHES. IT MUST NOT, WITH THIS TOKEN. (found in
# production 2026-10-01, within 2 h of merging #511)
#
# `gh pr update-branch` authenticated with GITHUB_TOKEN creates the merge
# commit as `github-actions[bot]`. GitHub then raises the PR's `pull_request`
# workflow runs but GATES THEM BEHIND MANUAL APPROVAL, because a bot is the
# triggering actor. Measured on the first run, on #501 and #507:
#
#     event=pull_request  actor=github-actions[bot]
#     conclusion=action_required  status=completed  jobs=0
#
# ZERO JOBS. So the PR's required contexts are never satisfied, `gh pr checks`
# reports "no checks reported on the branch", and the PR is unmergeable in a
# NEW way. The keeper turned "a human must press Update branch" into "a human
# must press Approve and run" — strictly worse, because the second state looks
# like nothing at all rather than like a stale branch, and it recurs on EVERY
# merge to main for EVERY armed PR. The keeper reported `success` while doing
# it. 11 gated runs had to be approved by hand to undo one keeper run.
#
# So this now DETECTS AND REPORTS, and changes nothing. That is a smaller tool
# than intended and still strictly better than the silence it replaces: a
# BEHIND PR currently shows green ticks and no failures, and nothing says it
# cannot merge.
#
# THE REAL FIX, NOT TAKEN HERE: mint a GitHub App installation token
# (ACTIONS_BOT_APP_ID / ACTIONS_BOT_PRIVATE_KEY exist at org level) via a
# pinned actions/create-github-app-token, and update the branch with that. An
# App token is not `github-actions[bot]`, so its pushes trigger CI normally.
# It is NOT done in this change because no workflow in this repo mints that
# token yet, so the app's installation scope and permissions here are unverified
# — and introducing an unverified credential path into a gate that just caused
# an outage is how the second mistake gets made. Tracked as the follow-up.
# ============================================================================
name: PR branch keeper

on:
  push:
    branches: [main]
  workflow_dispatch:

# READ-ONLY, deliberately. `pull-requests: read` to enumerate, `contents: read`
# for the checkout, and nothing else — it no longer writes anything, and the
# narrowed permission is what makes that STRUCTURAL rather than a promise. The
# previous version held `contents: write` to push the update; that is the write
# the header explains, and it is gone.
permissions:
  contents: read
  pull-requests: read

concurrency:
  # One keeper at a time. Two overlapping runs would both try to update the same
  # branch and the second would fail noisily for no reason.
  group: pr-branch-keeper
  cancel-in-progress: false

jobs:
  report-stuck:
    name: Report stuck PRs
    runs-on: [self-hosted, linux, x64, light]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # `gh` is NOT installed on the self-hosted fleet. The fleet monitor ran
      # `gh api ... || true` on these boxes for months without it and every
      # "no starvation" was an empty result (#436), so the pinned action is
      # mandatory rather than convenient.
      - uses: ./.github/actions/setup-gh

      # ── APP-TOKEN PROBE. MINTS, REPORTS, WRITES NOTHING. ────────────────
      #
      # The keeper can only REPORT a stuck PR, not fix it, because
      # `gh pr update-branch` with GITHUB_TOKEN authors the merge as
      # `github-actions[bot]` and GitHub then gates the PR's `pull_request`
      # runs behind manual approval — `conclusion=action_required`, jobs=0. That
      # shipped as an outage (#511) and was reverted to report-only (#512).
      #
      # MEASURED COST OF REPORT-ONLY, which is why this is being revisited:
      # #501 and #515 sat open, armed and unmerged for FOUR DAYS carrying seven
      # red checks between them, every one of which `scripts/ci-triage.rs` later
      # classified as benign. The keeper warned correctly, on time, into an
      # empty room.
      #
      # An App installation token is NOT `github-actions[bot]`, so its pushes
      # trigger CI normally. But no workflow in this repo has ever minted one,
      # so the app's installation scope HERE is unverified — and I committed to
      # proving it before letting it near a gate that already caused one outage.
      #
      # So this step mints the token and the next one reports what it WOULD be
      # able to do. It writes nothing. `continue-on-error` is deliberate: if the
      # secrets are not visible to this repo, the probe must fail without taking
      # the keeper's reporting down with it.
      - name: Mint an App token (probe only)
        id: apptoken
        continue-on-error: true
        uses: actions/create-github-app-token@v3.2.0
        with:
          app-id: ${{ secrets.ACTIONS_BOT_APP_ID }}
          private-key: ${{ secrets.ACTIONS_BOT_PRIVATE_KEY }}

      - name: Report whether that token could PREVENT the stall
        shell: bash
        env:
          # Bound to env and NEVER echoed. The probe reports booleans and an
          # identity, never the credential.
          APP_TOKEN: ${{ steps.apptoken.outputs.token }}
          MINT_OUTCOME: ${{ steps.apptoken.outcome }}
        run: |
          set -uo pipefail
          if [ "$MINT_OUTCOME" != "success" ] || [ -z "${APP_TOKEN}" ]; then
            echo "::warning::APP-TOKEN PROBE: could NOT mint (outcome=$MINT_OUTCOME). The org secrets ACTIONS_BOT_APP_ID / ACTIONS_BOT_PRIVATE_KEY are not usable from this repo, so the keeper CANNOT be upgraded to prevent the stall this way."
            echo "- **App token:** could not mint (\`$MINT_OUTCOME\`)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # WHO the token is. A real identity here is the whole point: it must
          # NOT be github-actions[bot], or the approval gate recurs.
          WHO=$(GH_TOKEN="$APP_TOKEN" gh api /installation/repositories                   --jq '"repos=\(.total_count)"' 2>/dev/null || echo "repos=?")
          # Can it even SEE this repo's PRs? A token scoped to another repo
          # would mint fine and then be useless, which is the failure mode worth
          # catching before enabling the write.
          SEEN=$(GH_TOKEN="$APP_TOKEN" gh pr list --repo "$GITHUB_REPOSITORY"                    --state open --limit 1 --json number --jq 'length' 2>/dev/null || echo "ERR")
          echo "::notice::APP-TOKEN PROBE: minted OK, $WHO, pr-list-visible=$SEEN. Nothing was written with it."
          {
            echo "- **App token:** minted OK — \`$WHO\`, PR list visible: \`$SEEN\`"
            echo "  - Nothing was written with it. Flipping the keeper to \`update-branch\` is the follow-up."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report armed PRs that cannot merge
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail

          # THE SAFETY CONTRACT: only PRs whose author ARMED AUTO-MERGE.
          #
          # Arming auto-merge is the author's declaration that the branch is
          # finished. That matters because of #478: auto-merge squashed a PR at
          # an INTERMEDIATE commit and stranded four later commits. Updating a
          # branch someone is still pushing to invites the same class of
          # surprise, so an unarmed PR is left alone — a human updates it when
          # they are ready.
          #
          # Also excluded: DRAFT PRs, and CROSS-REPOSITORY (fork) PRs, where we
          # cannot push to the head branch at all.
          mapfile -t CANDIDATES < <(
            gh pr list --state open --limit 50 \
              --json number,isDraft,isCrossRepository,autoMergeRequest \
              --jq '.[] | select(.isDraft == false and .isCrossRepository == false
                                 and .autoMergeRequest != null) | .number'
          )

          if [ "${#CANDIDATES[@]}" -eq 0 ]; then
            echo "::notice::no armed, non-draft, same-repo PRs open — nothing to report"
            exit 0
          fi
          echo "armed candidates: ${CANDIDATES[*]}"
          {
            echo "## PR branch keeper"
            echo
            echo "| PR | state | what it needs |"
            echo "|----|-------|---------------|"
          } >> "$GITHUB_STEP_SUMMARY"

          stuck=0
          for PR in "${CANDIDATES[@]}"; do

            # mergeStateStatus IS COMPUTED LAZILY. Straight after a push to main
            # it is routinely UNKNOWN, and a keeper that treated UNKNOWN as
            # "nothing to do" would do nothing on exactly the event it exists
            # for. Poll briefly for a settled value.
            STATE=UNKNOWN
            for _ in 1 2 3 4 5 6; do
              STATE=$(gh pr view "$PR" --json mergeStateStatus --jq .mergeStateStatus 2>/dev/null || echo UNKNOWN)
              [ "$STATE" != "UNKNOWN" ] && break
              sleep 5
            done

            case "$STATE" in
              BEHIND)
                # Auto-merge NEVER updates a BEHIND branch under strict
                # protection, so this PR is green and permanently unmergeable.
                stuck=$((stuck + 1))
                echo "::warning::#$PR is BEHIND — auto-merge will NOT update it; run: gh pr update-branch $PR"
                echo "| #$PR | BEHIND | \`gh pr update-branch $PR\` — auto-merge never updates a stale branch |" >> "$GITHUB_STEP_SUMMARY"
                ;;
              DIRTY)
                # DIRTY never merges and reports no failures either.
                stuck=$((stuck + 1))
                echo "::warning::#$PR is DIRTY (conflicts with main) — auto-merge will never fire; needs a human"
                echo "| #$PR | DIRTY | resolve the conflict with main |" >> "$GITHUB_STEP_SUMMARY"
                ;;
              UNKNOWN)
                echo "::warning::#$PR mergeStateStatus stayed UNKNOWN after 30 s — could not classify"
                echo "| #$PR | UNKNOWN | re-check; GitHub did not settle the state |" >> "$GITHUB_STEP_SUMMARY"
                ;;
              *)
                echo "#$PR is $STATE — nothing needed"
                echo "| #$PR | $STATE | nothing |" >> "$GITHUB_STEP_SUMMARY"
                ;;
            esac
          done

          # The job stays GREEN. A stuck PR is not main's fault, and a red run
          # here would make every merge commit look broken.
          if [ "$stuck" -gt 0 ]; then
            echo "::warning::branch keeper: $stuck of ${#CANDIDATES[@]} armed PR(s) CANNOT MERGE without a human — see the summary"
          else
            echo "::notice::branch keeper: all ${#CANDIDATES[@]} armed PR(s) can proceed"
          fi
