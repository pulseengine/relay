name: Fleet status

# CI-fleet health: detect STARVATION (jobs queued against a label with no live
# runner) and WEDGES (jobs running far past their own normal duration), and
# publish a status summary.
#
# WHY THIS EXISTS — the failure mode is SILENCE. On 2026-08-06/07 the self-hosted
# fleet degraded three times (one wedged runner; then 4 of 7 offline; then 6 of
# 7). Each time CI simply stopped progressing and looked identical to a slow
# build: no error, no alert, no failed check. One incident burned ~3 hours with
# a PR sitting at 5/57 checks. Every diagnosis was a human hand-querying the
# runners API. That is the gap this closes.
#
# THREE SIGNALS, DELIBERATELY IN THIS ORDER:
#
#   1. STARVATION (always available). A run that has been `queued` far longer
#      than jobs take to start. This needs only repo scope, and it detects the
#      SYMPTOM — so it fires for causes we have not thought of, not just the
#      ones we have. This is the load-bearing check.
#
#   2. FLEET INVENTORY (optional). Per-runner online/offline/busy. Needs
#      `/orgs/{org}/actions/runners`, which requires **admin:org** — the default
#      GITHUB_TOKEN CANNOT read it. Set the `ORG_RUNNER_READ_TOKEN` secret to a
#      PAT with that scope to enable it; without the secret this job still runs
#      and simply reports starvation only. It degrades, it does not fail.
#
#   3. WEDGE (the `wedge` job, #429). A job stuck `in_progress` past 5x the
#      median duration of its own recent successful runs. Starvation cannot see
#      this shape — a wedged job HAS a runner and reports itself healthy. On
#      2026-09-16 one Kani leg wedged three times (52, 96, 105 min against a
#      ~3 min baseline) and each was found by a human reading durations.
#
# `gh` IS INSTALLED BY THIS WORKFLOW, not assumed. The `light` boxes do not
# ship it: the starvation step ran for months with `gh: command not found`
# swallowed by `2>/dev/null || true`, reporting "0 queued" during a 107-minute
# queue (#436). Both jobs use ./.github/actions/setup-gh (pinned + SHA-256).
#
# "COULD NOT EVALUATE" IS NOT GREEN. A failed API query used to be swallowed
# (`|| true`) into an empty result, which reads exactly like a healthy fleet.
# Both checks now report UNKNOWN and fail the monitor's own job instead.
#
# CRITICAL PLACEMENT RULE: this workflow must NOT run on `rust-cpu`. A monitor
# scheduled on the fleet it monitors goes down with it — that is precisely how
# the outage stayed invisible. Both jobs run on `light`. The wedges they look
# for happen on `rust-cpu` — watching from outside that label is the point, not
# an oversight to be "fixed". (Not hosted either: see the `wedge` job.)
#
# Security: no `${{ }}` is expanded inside any `run:` block; every input is
# bound through `env:` and dereferenced as a quoted shell variable.

on:
  schedule:
    # Every 15 minutes. Cheap (a few API calls) and short enough that a
    # degradation is caught inside one CI cycle rather than after it.
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: fleet-status
  cancel-in-progress: true

jobs:
  status:
    # NOT rust-cpu — see the placement rule above.
    runs-on: [self-hosted, linux, x64, light]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions

      - uses: ./.github/actions/setup-gh

      - name: Detect starvation (queued far longer than jobs take to start)
        id: starve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          # A self-hosted job normally starts within a couple of minutes;
          # 30 min queued means nothing is picking it up. HOSTED runners are a
          # different story: org-shared concurrency was measured at 60-120 min
          # on 2026-09-16, so a hosted job waiting an hour is contention, not a
          # dead fleet, and waking someone for it is noise (#449, #462).
          THRESHOLD_MIN: '30'
          HOSTED_THRESHOLD_MIN: '120'
        shell: bash
        run: |
          set -uo pipefail
          now=$(date -u +%s)
          stuck=0
          details=""
          age_min() {  # ISO-8601 -> minutes old; BSD and GNU date differ
            local ts
            ts=$(date -u -d "$1" +%s 2>/dev/null || date -u -j -f "%Y-%m-%dT%H:%M:%SZ" "$1" +%s 2>/dev/null || echo 0)
            [ "$ts" = "0" ] && { echo -1; return; }
            echo $(( (now - ts) / 60 ))
          }
          # MEASURE JOBS, NOT RUN STATUS (#449). A matrix run stays `queued`
          # while its legs are being served one after another, so run age said
          # "starving" three times (#447, #455, #462) for a fleet that was
          # working: #462's CI run was reported at 54 min while its first job
          # had started 4 seconds after creation. A run is starving only if a
          # JOB has been queued past the threshold AND nothing else in that run
          # has started since — otherwise the fleet is serving it, slowly.
          # A failed query must not read as an empty queue (#429).
          if ids=$(gh api "/repos/${REPO}/actions/runs?status=queued&per_page=50" \
                      --jq '.workflow_runs[].id'); then
            echo "api_ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "api_ok=false" >> "$GITHUB_OUTPUT"
            echo "::error::could not query queued runs — starvation status is UNKNOWN, not green"
            ids=""
          fi
          while read -r id; do
            [ -z "${id:-}" ] && continue
            jobs=$(gh api "/repos/${REPO}/actions/runs/${id}/jobs?per_page=100" \
                     --jq '.jobs[] | "\(.status)\t\(.started_at // "-")\t\(.created_at // "-")\t\(.name)\t\(.labels | join(","))\t\(.html_url)"') || continue
            # The most recent start anywhere in this run: proof the fleet is serving it.
            # "-" is the absent marker: an EMPTY field cannot be used here,
            # because tab is an IFS whitespace character and consecutive tabs
            # collapse — the fields would shift by one and every timestamp
            # would be a job name (measured).
            last_start=$(awk -F'\t' '$2 != "-" {print $2}' <<< "$jobs" | sort | tail -1)
            last_start_age=-1
            [ -n "$last_start" ] && last_start_age=$(age_min "$last_start")
            while IFS=$'\t' read -r status started created name labels url; do
              [ "$status" = "queued" ] || continue
              [ "${created:-}" = "-" ] && continue
              age=$(age_min "$created")
              [ "$age" -lt 0 ] && continue
              # Hosted contention is not fleet death; say which, and hold it to
              # its own threshold.
              case ",$labels," in
                *,ubuntu-latest,*|*,windows-latest,*|*,macos-latest,*|*,ubuntu-*,*) limit="$HOSTED_THRESHOLD_MIN"; kind="hosted" ;;
                *) limit="$THRESHOLD_MIN"; kind="self-hosted" ;;
              esac
              [ "$age" -lt "$limit" ] && continue
              # Something in this run started more recently than this job has
              # been waiting => the fleet is working through it.
              if [ "$last_start_age" -ge 0 ] && [ "$last_start_age" -lt "$age" ]; then
                continue
              fi
              stuck=$((stuck+1))
              details="${details}- \`${name}\` (${kind}: \`${labels}\`) — queued **${age} min**, nothing in its run has started since ([job](${url}))"$'\n'
            done <<< "$jobs"
          done <<< "$ids"
          {
            echo "stuck=$stuck"
            echo "details<<STARVE_EOF"
            echo "$details"
            echo "STARVE_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "queued-too-long: $stuck"

      - name: Fleet inventory (optional — needs admin:org PAT)
        id: fleet
        env:
          ORG_TOKEN: ${{ secrets.ORG_RUNNER_READ_TOKEN }}
          ORG: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -uo pipefail
          if [ -z "${ORG_TOKEN:-}" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "ORG_RUNNER_READ_TOKEN not set — skipping fleet inventory (starvation check still ran)"
            exit 0
          fi
          json=$(GH_TOKEN="$ORG_TOKEN" gh api --paginate "/orgs/${ORG}/actions/runners" --jq '.runners[]' 2>/dev/null || true)
          if [ -z "$json" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::could not read org runners (token scope?) — starvation check still ran"
            exit 0
          fi
          total=$(printf '%s\n' "$json"  | jq -s '[.[]|select(.labels|map(.name)|index("rust-cpu"))]|length')
          online=$(printf '%s\n' "$json" | jq -s '[.[]|select(.labels|map(.name)|index("rust-cpu"))|select(.status=="online")]|length')
          # WEDGED: offline AND busy. A runner that dropped while HOLDING a job
          # keeps that job assigned forever and no one else can take it. A plain
          # online-count misses this entirely — it is why a required check once
          # "ran" for 55 minutes and then cancelled.
          wedged=$(printf '%s\n' "$json" | jq -s -r '[.[]|select(.status!="online" and .busy)]|map(.name)|join(", ")')
          table=$(printf '%s\n' "$json" | jq -s -r 'sort_by(.name)[] | "| \(.name) | \(.status) | \(.busy) | \(.labels|map(.name)|join(" "))|"')
          {
            echo "available=true"
            echo "total=$total"
            echo "online=$online"
            echo "wedged=$wedged"
            echo "table<<FLEET_EOF"
            echo "$table"
            echo "FLEET_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "rust-cpu $online/$total online; wedged: ${wedged:-none}"

      - name: Publish status summary
        env:
          STUCK: ${{ steps.starve.outputs.stuck }}
          DETAILS: ${{ steps.starve.outputs.details }}
          API_OK: ${{ steps.starve.outputs.api_ok }}
          HAVE_FLEET: ${{ steps.fleet.outputs.available }}
          TOTAL: ${{ steps.fleet.outputs.total }}
          ONLINE: ${{ steps.fleet.outputs.online }}
          WEDGED: ${{ steps.fleet.outputs.wedged }}
          TABLE: ${{ steps.fleet.outputs.table }}
        shell: bash
        run: |
          set -uo pipefail
          {
            echo "## CI fleet status"
            echo
            if [ "${API_OK:-false}" != "true" ]; then
              echo "### 🟡 Starvation: UNKNOWN — the queued-runs query failed. This is not a pass."
            elif [ "${STUCK:-0}" -gt 0 ]; then
              echo "### 🔴 Starvation: ${STUCK} run(s) queued 30+ min"
              echo
              printf '%s\n' "${DETAILS:-}"
            else
              echo "### 🟢 No starvation — nothing queued past the threshold"
            fi
            echo
            if [ "${HAVE_FLEET:-false}" = "true" ]; then
              echo "### rust-cpu: ${ONLINE}/${TOTAL} online"
              if [ -n "${WEDGED:-}" ]; then
                echo
                echo "**⚠️ Wedged (offline while holding a job): ${WEDGED}** — the job stays"
                echo "assigned and no other runner can take it. Restart these."
              fi
              echo
              echo "| runner | status | busy | labels |"
              echo "|---|---|---|---|"
              printf '%s\n' "${TABLE:-}"
            else
              echo "_Fleet inventory unavailable — set the \`ORG_RUNNER_READ_TOKEN\` secret"
              echo "(PAT with \`admin:org\`) to include per-runner state._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Raise the alarm if starved
        if: steps.starve.outputs.stuck != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          DETAILS: ${{ steps.starve.outputs.details }}
          WEDGED: ${{ steps.fleet.outputs.wedged }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -uo pipefail
          TITLE="CI fleet: runs are starving (queued 30+ min)"
          # One rolling issue, not one per tick — reopen/comment rather than spam.
          existing=$(gh issue list --repo "$REPO" --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number' 2>/dev/null || true)
          body=$(printf 'Runs have been queued past the 30-minute threshold — jobs are not being picked up.\n\n%s\n\nWedged runners (offline while holding a job): %s\n\nThis is usually the self-hosted fleet being down, NOT a code fault: jobs queue forever against a label with no live runner, which looks identical to a slow build.\n\nDetected by: %s\n' "${DETAILS:-}" "${WEDGED:-none detected / inventory unavailable}" "$RUN_URL")
          if [ -n "${existing:-}" ]; then
            gh issue comment "$existing" --repo "$REPO" --body "$body"
          else
            gh issue create --repo "$REPO" --title "$TITLE" --label ci --body "$body" || \
              gh issue create --repo "$REPO" --title "$TITLE" --body "$body"
          fi

      - name: Fail if starvation could not be evaluated
        if: steps.starve.outputs.api_ok != 'true'
        shell: bash
        run: |
          echo "The starvation check could not query the API; reporting this run as failed rather than green."
          exit 1

  wedge:
    name: Wedged jobs (in_progress far past their median)
    # `light`, like `status` — NOT hosted. The first draft of this job ran on
    # `ubuntu-latest` (it only calls the API) and was reversed on measurement:
    # on 2026-09-16 relay's hosted jobs waited 60–120 min for a runner, because
    # hosted concurrency is shared across the org and other repos' matrices
    # held it. A wedge alarm two hours late is no better than the human it
    # replaces. `light` is three boxes (ci-01-5/-8/-10); a cold rust-script
    # install there measured 0–49 s, and the self-hosted home usually keeps it.
    runs-on: [self-hosted, linux, x64, light]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts
            .github/actions

      - uses: ./.github/actions/setup-gh

      - uses: dtolnay/rust-toolchain@stable

      - name: Install rust-script
        shell: bash
        run: command -v rust-script >/dev/null || cargo install rust-script --locked

      - name: Detect wedged jobs
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -uo pipefail
          # 0 = nothing wedged, 1 = wedged, anything else = could not evaluate.
          # `shell: bash` runs with -e, so a bare call exiting 1 would end the
          # step before rc is recorded — and a wedge would read as UNKNOWN.
          # The detector renders both files itself — no `jq` on the runner.
          rc=0
          ./scripts/ci-wedge-watch.rs --repo "$REPO" \
            --summary-md "$RUNNER_TEMP/wedge.md" --alarm-tsv "$RUNNER_TEMP/wedge.tsv" || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -gt 1 ]; then
            echo "::error::wedge check could not evaluate (exit $rc) — status is UNKNOWN, not green"
          fi

      - name: Publish wedge summary
        env:
          RC: ${{ steps.detect.outputs.rc }}
        shell: bash
        run: |
          set -uo pipefail
          case "${RC:-unset}" in
            0|1) cat "$RUNNER_TEMP/wedge.md" >> "$GITHUB_STEP_SUMMARY" ;;
            *)
              {
                echo "## Wedged jobs"
                echo
                echo "### 🟡 UNKNOWN — the check could not evaluate (exit ${RC:-unset}). This is not a pass."
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
          esac

      - name: Raise the alarm if a job is wedged
        if: steps.detect.outputs.rc == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -uo pipefail
          TITLE="CI fleet: a job is wedged in_progress (5x its median duration)"
          existing=$(gh issue list --repo "$REPO" --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')
          # One rolling issue, and each wedged job reported ONCE: a wedge lasts
          # many 15-minute ticks, and a comment per tick buries the signal.
          seen=""
          if [ -n "${existing:-}" ]; then
            seen=$(gh issue view "$existing" --repo "$REPO" --json body,comments --jq '.body, .comments[].body')
          fi
          rows=""
          while IFS=$'\t' read -r url line; do
            [ -z "${url:-}" ] && continue
            if [ -n "$seen" ] && printf '%s\n' "$seen" | grep -qF "$url"; then
              continue
            fi
            rows="${rows}${line}"$'\n'
          done < "$RUNNER_TEMP/wedge.tsv"
          if [ -z "$rows" ]; then
            echo "Every wedged job is already reported on #${existing}."
            exit 0
          fi
          body=$(printf 'Job(s) running past 5x the median duration of their own recent successful runs:\n\n%s\nA wedged job holds its runner and blocks its PR while looking exactly like a slow one. The usual remedy is `gh run cancel` on the run, then `gh run rerun --failed`; if the same runner keeps wedging, restart it.\n\nDetected by: %s\n' "$rows" "$RUN_URL")
          if [ -n "${existing:-}" ]; then
            gh issue comment "$existing" --repo "$REPO" --body "$body"
          else
            gh issue create --repo "$REPO" --title "$TITLE" --label ci --body "$body" || \
              gh issue create --repo "$REPO" --title "$TITLE" --body "$body"
          fi

      - name: Fail if the wedge check could not be evaluated
        if: steps.detect.outputs.rc != '0' && steps.detect.outputs.rc != '1'
        shell: bash
        run: |
          echo "The wedge check could not evaluate; reporting this run as failed rather than green."
          exit 1
