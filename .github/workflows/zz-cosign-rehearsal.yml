# TEMPORARY — rehearsal for #637, REMOVED BEFORE MERGE (maintainer
# decision 2026-11-05). Runs the release.yml signing steps exactly as
# pinned (cosign-installer v4.1.2 SHA, cosign v2.4.1, same sign-blob flags)
# on a dummy SHA256SUMS, keyless via OIDC, uploads nothing, and checks that
# .sig/.pem/.cosign.bundle exist and verify. The `unpinned` leg is the
# negative control for review finding 1: installer default (cosign v3)
# with the same flags. It is allowed to fail and reports what it produced.
name: cosign rehearsal (temporary, #637)

on:
  pull_request:
    paths:
      - .github/workflows/zz-cosign-rehearsal.yml
      - .github/workflows/release.yml

permissions:
  contents: read
  id-token: write

jobs:
  rehearse:
    name: cosign rehearsal (${{ matrix.leg }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.leg == 'unpinned' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: pinned-v2.4.1
            release: 'v2.4.1'
          - leg: unpinned
            release: ''
    steps:
      - name: Install cosign (pinned leg)
        if: matrix.release != ''
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ matrix.release }}
      - name: Install cosign (unpinned leg = installer default)
        if: matrix.release == ''
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign a dummy SHA256SUMS with the release.yml flags
        shell: bash
        run: |
          set -euo pipefail
          cosign version
          mkdir -p b && cd b
          printf 'deadbeef  falcon-flight-rehearsal.wasm\n' > SHA256SUMS
          rc=0
          cosign sign-blob \
              --yes \
              --bundle SHA256SUMS.cosign.bundle \
              --output-signature SHA256SUMS.sig \
              --output-certificate SHA256SUMS.pem \
              SHA256SUMS || rc=$?
          echo "sign-blob exit=$rc"
          ls -la
          missing=0
          for f in SHA256SUMS.sig SHA256SUMS.pem SHA256SUMS.cosign.bundle; do
            if [ -s "$f" ]; then echo "PRESENT $f"; else echo "MISSING $f"; missing=1; fi
          done
          [ "$rc" -eq 0 ] && [ "$missing" -eq 0 ] || { echo "REHEARSAL FAIL (${{ matrix.leg }})"; exit 1; }

      - name: Verify the bundle as a consumer would
        shell: bash
        run: |
          set -euo pipefail
          cd b
          cosign verify-blob \
            --certificate-identity-regexp '^https://github.com/pulseengine/relay/.github/workflows/zz-cosign-rehearsal.yml@.*' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            --bundle SHA256SUMS.cosign.bundle SHA256SUMS
          echo "REHEARSAL PASS (${{ matrix.leg }})"
