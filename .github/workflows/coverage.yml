name: Coverage

# Run cargo-llvm-cov on every push/PR. The workspace LCOV report +
# the human summary are uploaded as artifacts so the percentage is
# auditable per-commit.
#
# Security note: this workflow does NOT interpolate any github.event.*
# inputs into run: blocks — every `run:` calls fixed cargo commands
# only. The pinned third-party actions (dtolnay/rust-toolchain,
# taiki-e/install-action) provide the toolchain + cargo-llvm-cov.
#
# DO-178C A-7.7 / EN 50128 A.5 D.43 / IEC 61508 B.8 (HR) — statement
# coverage evidence the verified-engine pattern emits per build.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  llvm-cov:
    runs-on: [self-hosted, linux, x64, rust-cpu]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Run cargo llvm-cov (LCOV)
        run: cargo llvm-cov --workspace --lcov --output-path coverage.lcov

      - name: Run cargo llvm-cov (summary, for the log)
        run: cargo llvm-cov --workspace --summary-only

      - name: Upload LCOV artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage.lcov
          retention-days: 30
