name: Coverage

# Run cargo-llvm-cov on every push/PR. The workspace LCOV report +
# the human summary are uploaded as artifacts so the percentage is
# auditable per-commit.
#
# Security note: this workflow does NOT interpolate any github.event.*
# inputs into run: blocks — every `run:` calls fixed cargo commands
# only. The pinned third-party actions (dtolnay/rust-toolchain,
# taiki-e/install-action) provide the toolchain + cargo-llvm-cov.
#
# DO-178C A-7.7 / EN 50128 A.5 D.43 / IEC 61508 B.8 (HR) — statement
# coverage evidence the verified-engine pattern emits per build.

on:
  push:
    branches: [main]
  pull_request:

# PRs and non-main branch pushes: cancel superseded runs.
# Main pushes: never cancel — coverage artifact is the DO-178C/EN-50128
# evidence record for that commit; a cancelled run leaves a gap.
concurrency:
  group: coverage-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

# Opt the Node-20 JS actions (upload-artifact@v4) into Node 24 ahead of
# GitHub's 2026-06-16 forced cutover — validates compatibility early and
# silences the deprecation warning. Node 20 is removed 2026-09-16. (#153)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  llvm-cov:
    runs-on: [self-hosted, linux, x64, rust-cpu]
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Run cargo llvm-cov (LCOV)
        run: cargo llvm-cov --workspace --lcov --output-path coverage.lcov

      - name: Run cargo llvm-cov (summary, for the log)
        run: cargo llvm-cov --workspace --summary-only

      - name: Upload LCOV artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: coverage.lcov
          retention-days: 30
