name: Kani

# Model-checks the cFS stream-transformer engines' Kani harnesses (closes the
# gap in #6: the harnesses existed but nothing ran them). Each engine's
# `#[cfg(kani)] mod` proves its per-cycle output bound, its no-panic / error
# closure, and (lc/hs/cfdp) its state-machine transitions — the Rust-level
# companion to the Lean BackpressureSafety / WcetAnalysis specs.
#
# Separate workflow (not the cargo CI matrix) because Kani installs CBMC and
# runs CtoGOTO model checking — heavier + slower than `cargo test`. All 27
# harnesses currently verify in well under a second each locally (kani 0.67).

on:
  # MERGE QUEUE (2026-10-21). This workflow produces a REQUIRED check, so it
  # must also run on the queue's `merge_group` event — otherwise a queued PR
  # waits forever for a check that is never reported.
  #
  # QUEUE-ONLY (2026-10-22, maintainer decision). The 47-leg matrix used to run
  # THREE times per change: on the PR, in the merge queue, and on the push to
  # main. Measured 14:10Z that day: 222 of 328 jobs in the self-hosted queue
  # were this workflow, and it already led the fleet ledger by waiting time
  # (1,760 h). Now:
  #   - merge_group: the matrix runs here, once, on the exact commit that lands.
  #   - pull_request: the scope job reports DEFERRED and runs no legs; the
  #     required "Kani gate" context passes so the PR can enter the queue, where
  #     a failure ejects it. Its log says DEFERRED, never "verified".
  #   - push to main: REMOVED. Main only receives queue-tested commits, and the
  #     merge_group run's check runs attach to that same SHA, so a push run
  #     re-proved an already-green commit.
  #   - workflow_dispatch: manual full sweep of any branch (e.g. to get Kani
  #     feedback on a PR before queueing it).
  merge_group:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Cancel superseded runs per ref. Each merge-queue entry has its own
  # gh-readonly-queue/... ref, so queue entries never cancel one another. There
  # are no push-to-main runs any more (QUEUE-ONLY above); a manual dispatch on
  # main is still never cancelled.
  group: kani-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # CI diet (tier B): decide whether the 24-engine matrix needs to run at all.
  # Kani model-checks Rust harnesses under crates/**, so a PR touching only docs,
  # rivet artifacts, wit, or proofs cannot change any harness — skip the matrix
  # and let kani-gate (below) report the required check as pass. On push:main (no
  # PR base) and on any diff failure this FAILS SAFE to run=true — the required
  # gate never silently no-ops on a real code change. Native git-diff (no
  # third-party action), mirroring verification-gate.yml's #298 scope check.
  changes:
    name: Detect engine changes
    runs-on: [self-hosted, linux, x64, light]
    outputs:
      run: ${{ steps.scope.outputs.run }}
      # Why the matrix was skipped: `deferred` (pull_request — it runs in the
      # merge queue) or `out-of-scope` (no Kani-relevant file changed). Empty
      # when it runs. kani-gate fails closed on a skip without a reason.
      reason: ${{ steps.scope.outputs.reason }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scope check (do any Kani-relevant files change?)
        id: scope
        env:
          # A PULL REQUEST has `pull_request.base.sha`. A PUSH does not — it has
          # `github.event.before`, the ref's previous tip, so for a squash merge
          # to main `before...HEAD` is exactly the merged PR's diff. Reading only
          # the PR field meant every push took the backstop branch below and ran
          # all 47 legs regardless of content: four code-free merges for
          # falcon-v1.140.0 each spawned a full matrix, and because this
          # workflow's concurrency is serial on main, one of them held that
          # release's candidate for 2 h 20 m re-proving an already-green proof
          # (#548). A manual dispatch has neither field and still sweeps.
          # MERGE QUEUE: a `merge_group` run has neither of the above — it has
          # `merge_group.base_sha`, the tip the queued change is tested against.
          # Without it the case below takes the "no base sha" branch and runs
          # all 47 legs on every queue entry: correct, but it throws away the
          # point of the queue.
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        shell: bash
        run: |
          # QUEUE-ONLY: a pull request never runs the matrix — the merge queue
          # does, on the commit that will land. Decided before any diffing so no
          # base-sha corner case can turn it back into a PR-time sweep.
          if [ "${GITHUB_EVENT_NAME:-}" = "pull_request" ]; then
            echo "pull_request — Kani DEFERRED to the merge queue (merge_group runs the matrix)"
            echo "run=false" >>"$GITHUB_OUTPUT"
            echo "reason=deferred" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          # Three ways a base can be unusable, each of which must SWEEP rather
          # than skip. Collapsing them into one `-z` test is what made the push
          # case silently unconditional.
          case "${BASE_SHA:-}" in
            "")
              echo "no base sha (manual dispatch) — run the full matrix (backstop)"
              echo "run=true" >>"$GITHUB_OUTPUT"; exit 0 ;;
            0000000000000000000000000000000000000000)
              # Branch creation, or a push whose predecessor is unknown.
              echo "all-zeros base (branch created / no predecessor) — full matrix (backstop)"
              echo "run=true" >>"$GITHUB_OUTPUT"; exit 0 ;;
          esac
          # `fetch-depth: 0` is set above, but a force-push can leave `before`
          # pointing at a commit no longer reachable. Never diff against it.
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "base $BASE_SHA is not in this history (force-push?) — full matrix (backstop)"
            echo "run=true" >>"$GITHUB_OUTPUT"; exit 0
          fi
          echo "scoping against base $BASE_SHA (event: ${GITHUB_EVENT_NAME:-?})"
          CHANGED=$(git diff --name-only "$BASE_SHA"...HEAD || echo "__diff_failed__")
          if [ "$CHANGED" = "__diff_failed__" ]; then
            echo "diff failed — fail-safe to run"
            echo "run=true" >>"$GITHUB_OUTPUT"; exit 0
          fi
          # Kani-relevant: any crate source (all 38 harnesses live under
          # crates/<engine>/plain/), workspace deps, or this workflow.
          if printf '%s\n' "$CHANGED" | grep -qE '^(crates/|Cargo\.toml|Cargo\.lock|\.github/workflows/kani\.yml)'; then
            echo "Kani-relevant files changed — run the matrix"
            echo "run=true" >>"$GITHUB_OUTPUT"
          else
            echo "no Kani-relevant files changed — SKIP the matrix (kani-gate reports pass)"
            printf 'changed:\n%s\n' "$CHANGED"
            echo "run=false" >>"$GITHUB_OUTPUT"
            echo "reason=out-of-scope" >>"$GITHUB_OUTPUT"
          fi

  kani:
    name: Kani (${{ matrix.engine }})
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: [self-hosted, linux, x64, rust-cpu]
    # A cap, not a budget (#429). Without one a hung leg holds its runner for
    # GitHub's default 360 min while the PR looks merely slow. `Kani
    # (relay-mix-quad)` hung inside the Kani step FOUR times on 2026-09-16/17
    # (52, 96, 105, 125 min; normal ~3–4 min), on three different runners, so
    # it is a per-leg intermittent hang, not one bad box. Measured over 180
    # successful leg runs, the slowest was relay-notch at 25.1 min; 60 min is
    # 2.4x that. A timed-out leg is `cancelled`, which `kani-gate` below fails
    # closed on — the hang becomes a red gate to re-run, not a silent hold.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # The verified framework engines (consumed by falcon and/or wohl). Each
        # carries Kani harnesses in crates/<engine>/plain/src/kani_proofs.rs
        # (plain-only, so a verus-strip regen of engine.rs cannot wipe them).
        engine:
          - relay-lc
          - relay-sc
          - relay-hs
          - relay-sch
          - relay-cfdp
          - relay-sca
          - relay-ci
          - relay-cs
          - relay-ccsds
          - relay-hk
          - relay-ds
          - relay-fm
          - relay-mm
          - relay-md
          - relay-to
          - relay-tbl
          - relay-sec
          - relay-bus
          - relay-hal
          - relay-rc
          - relay-dronecan
          - relay-param
          - relay-fsm
          - relay-preflight
          - relay-calib
          - relay-fsafe
          - relay-mix-quad
          - relay-mavlink
          - relay-batt
          - relay-notch
          # Flight-critical control + estimator proofs. These harnesses were
          # authored alongside the engines but never added to this matrix, so
          # CI never ran them (the same orphaned-proof gap that bit relay-rc
          # for ~40 releases and relay-mix-quad's MIX-P05..08). A workspace
          # scan found 36/142 Kani harnesses unenforced across 16 crates; this
          # closes the highest-value subset — the 8 control/estimator proofs:
          #   relay-arm   verify_arming_total / verify_arming_torque_gated
          #   relay-adrc  verify_command_filter_saturation / _from_bandwidth_separation
          #   relay-geo   verify_shield_contract
          #   relay-iekf  verify_nis3_total / _spoof_monitor_no_false_alarm / _clamp_factor_bounded
          - relay-arm
          - relay-adrc
          - relay-geo
          - relay-iekf
          # The rest of the orphaned-proof sweep (v1.108): flight-support,
          # HAL sensor drivers, and infra crates whose Kani harnesses were
          # authored but never gated. All 26 harnesses across these 11 crates
          # verify SUCCESSFUL locally (cargo kani). This closes the systemic
          # 36/142 unenforced gap down to a single deferred crate: relay-traj,
          # whose verify_peak_jerk_sound hangs CBMC (>1200s, f32 intractability)
          # and needs unwind/concretisation bounding before it can be gated.
          - relay-avoid
          - relay-flowrange
          - relay-mix-multi
          - relay-nid
          - relay-offboard
          - relay-sensvote
          - falcon-baromag
          - falcon-esc-dshot
          - falcon-gnss-ubx
          # falcon-hitl (v1.141): the TRANSPORT-P01 wire binding's decoder.
          # `wire::decode_frame` and the four `decode_*` payload readers parse
          # UNTRUSTED BYTES off a socket or UART, and this crate carried ZERO
          # harnesses and no matrix entry — which the requirement itself names
          # as a promotion blocker rather than a caveat. Six harnesses, 251
          # checks, 0 failures, ~0.7 s locally on 0.67.0; all ten `cover!`s
          # SATISFIED (so no branch is dead), and mutation-tested by relaxing
          # the payload-length equality to `<`, which FAILS the structural
          # harness. Harnesses live in crates/falcon-hitl/src/kani_proofs.rs,
          # not a `plain/` sibling, because this crate has no verus split.
          # Binding v2 (#609 finding 9, #572, #527): NINE harnesses, 26 covers
          # — the dispatch harnesses now prove non-finite is REJECTED (they
          # proved it accepted at v1), three new frame types are covered, and
          # this leg is no longer ~1 s: 488 s wall locally at load ~120.
          - falcon-hitl
          - relay-log
          - relay-modextra
          # falcon-cm-rt (#574): the bump arena behind every published
          # component's `cabi_realloc`, and the CallScope protocol that
          # reclaims it per call. Previously ZERO harnesses and no entry here.
          # The harnesses (src/kani_proofs.rs) prove, over the same ArenaState
          # the allocator runs: no allocation overlaps one still live for the
          # call (P1), exhaustion is None and the cursor never wraps (P2),
          # enter reclaims iff the previous call returned (P3), alignment (P4).
          - falcon-cm-rt
    steps:
      - uses: actions/checkout@v7
      # KANI VERSION IS PINNED. The action's `kani-version` input defaults to
      # `latest`, and we did not set it — so every run installed whatever Kani
      # had most recently released. On 2026-09-16 that broke all 45 engines at
      # once:
      #
      #   kani-0.68.0 released   2026-09-16T03:43:14Z
      #   first failing CI run   2026-09-16T03:55:44Z   (12 minutes later)
      #   last passing CI run    2026-09-15T19:49       (the v1.138.0 tag)
      #
      # Every leg failed in ~11 s, which is far too fast for model checking, and
      # `cargo kani` on relay-lc passes locally on 0.67.0 (9/9 harnesses, 0
      # failures). So the proofs did not regress; the toolchain moved under a
      # REQUIRED gate and blocked every merge in the repo.
      #
      # 0.67.0 is exactly what `latest` resolved to while the gate was green
      # (released 2026-01-16), so this pins the known-good state rather than
      # choosing a new one. Moving to 0.68.0 is a deliberate change with its own
      # validation, not something an upstream release should do to us at 03:43.
      - name: Kani verify ${{ matrix.engine }}
        uses: model-checking/kani-github-action@v1
        with:
          kani-version: '0.67.0'
          working-directory: crates/${{ matrix.engine }}

  # Roll-up over the full engine matrix: ONE required context for branch
  # protection ("Kani gate"), so the formal-verification result gates merges
  # without registering a separate required check per engine.
  kani-gate:
    name: Kani gate
    runs-on: [self-hosted, linux, x64, light]
    needs: [changes, kani]
    if: always()
    steps:
      - name: All Kani engines green (or correctly skipped)?
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          KANI_RESULT: ${{ needs.kani.result }}
          SKIP_REASON: ${{ needs.changes.outputs.reason }}
        run: |
          # The scope job must have succeeded — otherwise we can't trust the
          # skip decision, so fail closed.
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "scope (changes) job did not succeed: $CHANGES_RESULT"; exit 1
          fi
          # A skip passes ONLY with a stated reason, and the log says which one —
          # a deferred PR must never read as "verified".
          case "$KANI_RESULT" in
            success) echo "Kani matrix: all engines verified" ;;
            skipped)
              case "$SKIP_REASON" in
                deferred) echo "Kani matrix: DEFERRED — not run on the PR; the merge queue runs it before this lands" ;;
                out-of-scope) echo "Kani matrix: skipped (no Kani-relevant files changed) — OK" ;;
                *) echo "Kani matrix skipped with no recorded reason ('$SKIP_REASON') — failing closed"; exit 1 ;;
              esac ;;
            *) echo "Kani matrix result: $KANI_RESULT"; exit 1 ;;
          esac
