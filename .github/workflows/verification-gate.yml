name: Verification Gate

# Mirrors the witness + spar pattern: extract `fields.steps[].run`
# from every rivet `unit-verification` artifact matching a filter,
# execute each, aggregate pass/fail per artifact, post a sticky
# PR comment.
#
# Default filter: every falcon-tagged verification artifact.
# Per-PR override: include `Verify-Filter: <expr>` in the PR body
# using rivet's S-expression filter syntax, e.g.
#   Verify-Filter: (and (has-tag "falcon") (has-tag "v0.1"))
#
# Locally:
#     python3 scripts/run-falcon-verification.py --markdown

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # PRs: cancel superseded runs when a new push arrives on the branch.
  # workflow_dispatch: never cancel — a manually triggered verification
  # run is deliberate; cancelling it silently discards the result.
  group: verify-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read
  pull-requests: write

# Opt the Node-20 JS actions (upload-artifact@v4) into Node 24 ahead of
# GitHub's 2026-06-16 forced cutover; Node 20 removed 2026-09-16. (#153)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  gate:
    name: Verification gate (rivet-driven)
    runs-on: [self-hosted, linux, x64, rust-cpu]
    # 60 (was 45, was 30): the gate executes every artifact's non-bench-only
    # cargo step serially. When a PR touches a CENTRAL crate (e.g. falcon-core),
    # the shared build cache is invalidated and many artifact steps rebuild
    # cold, so the ~370-step sweep can exceed the budget on a disk-constrained
    # runner — it timed out at 373/… all-PASS at 30, and again at 45 on
    # 2026-07-11 (45m21s, all-PASS: cold rivet install ~6 min + the
    # fetch-depth:0 clone the two-commit rule needs + sweep growth). A timeout
    # surfaces as "cancelled", which reads like a failure — the verification
    # itself has never been failing when this trips. Real fix on file: #262
    # (named-test steps shrink the sweep) + runner disk pressure.
    # 90 (was 60): a legit full sweep measured 45m21s (2026-07-11) but a
    # loaded self-hosted runner tipped it to 61m and FALSE-CANCELLED green
    # Dependabot PRs (2026-07-21). Headroom, not a slower gate.
    #
    # 150 (was 90, 2026-08-08): the sweep has grown into the ceiling AGAIN.
    # Measured across one day: ~63m (#340, passed) up to >=90m (#344, KILLED at
    # 1h30m21s), with #342 failing twice the same way. Variance now exceeds
    # headroom, so a REQUIRED check was being decided by runner load rather
    # than by whether anything is wrong. It also blocked the two PRs meant to
    # improve this very gate.
    #
    # THIS IS A STOPGAP, and the third reactive bump in a row (60 -> 90 -> 150).
    # The TREND is the problem: 45m in July, >=90m now. Raising the ceiling buys
    # time; it does not address why the sweep grew, and shipping it alone just
    # moves the cliff. Tracked in #350, where the next step is measuring the
    # COMPILE-vs-TEST split on the runner: the sweep spans 64 crates with 29
    # `--release` steps (two profile-wide compile sets), so compilation is the
    # likely dominant cost. Note that converting whole-crate steps to named ones
    # (#343 / #262) demonstrably will NOT close a 30-minute gap on its own —
    # measured, the non-falcon-core offenders run in 0-5s.
    timeout-minutes: 150
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      # CI-HARDENING (rivet OOM): cap parallel rustc so a cold rivet/cargo build
      # cannot OOM the self-hosted runner. Default is nproc parallel rustc, each
      # GB-scale during codegen/link — on a memory-constrained box that spikes
      # past RAM and the kernel OOM-kills the build. This bounds peak memory for
      # the rivet install AND every per-artifact cargo test the gate runs.
      CARGO_BUILD_JOBS: "2"
      # No workflow-level -D warnings (see ci.yml comment): pre-existing
      # cFS cfg(kani) lints would block rivet install + cargo test on
      # the wider workspace. Falcon crates compile clean.
    steps:
      - uses: actions/checkout@v7
        with:
          # The two-commit-rule check diffs against the PR base; a shallow
          # single-commit checkout has no base to diff.
          fetch-depth: 0

      # ── Two-commit rule (v1.116, rivet hygiene) ──────────────────────
      # A PR that changes implementation code must not ALSO promote any
      # artifact to verified/accepted — verification sign-off arrives in a
      # separate PR whose evidence this gate then executes. Runs FIRST so
      # the violation is reported in seconds, not after the 30-min sweep.
      - name: Two-commit rule (verification independence)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: scripts/check-verification-independence.sh "$BASE_SHA"

      # ── Scope fast-path (2026-07-21) ─────────────────────────────────
      # The falcon verification sweep (~370 steps, ~45m) only reflects
      # changes to code, deps, rivet artifacts, arch/interfaces, or the
      # gate itself. A PR touching NONE of those (docs, other workflow
      # files, bench-evidence, a Dependabot GitHub-Action pin) has nothing
      # for this gate to verify — running the full sweep on it only burns
      # runner time and, on a loaded runner, false-cancels a green PR.
      # Compute run_full from the PR diff; FAIL-SAFE to true (verify) when
      # the base cannot be determined (e.g. workflow_dispatch).
      - name: Scope check (does this PR need the full sweep?)
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          if [ -z "${BASE_SHA:-}" ]; then
            echo "no base sha (manual run) — running full sweep"
            echo "run_full=true" >>"$GITHUB_OUTPUT"; exit 0
          fi
          CHANGED=$(git diff --name-only "$BASE_SHA"...HEAD || echo "__diff_failed__")
          if [ "$CHANGED" = "__diff_failed__" ]; then
            echo "diff failed — fail-safe to full sweep"
            echo "run_full=true" >>"$GITHUB_OUTPUT"; exit 0
          fi
          # Verification-relevant paths: code, workspace deps, rivet
          # artifacts, architecture/interfaces, the gate script + this
          # workflow file. Anything else is out of this gate's scope.
          if printf '%s\n' "$CHANGED" | grep -qE \
            '^(crates/|artifacts/|spar/|wit/|Cargo\.toml|Cargo\.lock|scripts/run-falcon-verification\.py|scripts/check-verification-independence\.sh|\.github/workflows/verification-gate\.yml)'; then
            echo "verification-relevant files changed — full sweep"
            printf '%s\n' "$CHANGED" | grep -E '^(crates/|artifacts/|spar/|wit/|Cargo\.|scripts/|\.github/workflows/verification-gate)' | head
            echo "run_full=true" >>"$GITHUB_OUTPUT"
          else
            echo "no verification-relevant files changed — FAST-PASS (nothing to verify)"
            printf 'changed:\n%s\n' "$CHANGED"
            echo "run_full=false" >>"$GITHUB_OUTPUT"
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2

      # Provision the tools FV-FALCON-COV-002 expects. The dedicated
      # Coverage workflow uses the same install; mirror it here so
      # `cargo llvm-cov` succeeds inside the rivet gate too. Security
      # note: this workflow does not interpolate any github.event.*
      # inputs into run: blocks (PR body is bound via env: + sanitised
      # before reaching the script).
      - name: Install cargo-llvm-cov
        if: steps.scope.outputs.run_full == 'true'
        uses: taiki-e/install-action@v2.86.1
        with:
          tool: cargo-llvm-cov

      - name: Install rivet v0.19.0 (pinned; skip if cached)
        if: steps.scope.outputs.run_full == 'true'
        shell: bash
        # PINNED (was unpinned --git main): every push to rivet master forced a
        # cold recompile here — the OOM-prone step. Pinning to a tag means the
        # self-hosted runner's cached binary stays valid across runs, so the
        # heavy compile happens only on a deliberate bump (mirrors the spar pin).
        # Bump this tag AND re-run `rivet validate` locally when updating.
        run: |
          if rivet --version 2>/dev/null | grep -q "0.19.0"; then
            echo "rivet 0.19.0 already on PATH"
          else
            cargo install --locked \
              --git https://github.com/pulseengine/rivet \
              --tag v0.19.0 \
              --bin rivet \
              rivet-cli
          fi

      # Untrusted: github.event.pull_request.body is attacker-
      # controllable. Bind to env, dereference via $PR_BODY in a
      # double-quoted context, and treat parse-failure as the
      # "no override" path. Filter then flows to the next step
      # via GITHUB_OUTPUT (which is sanitized).
      - name: Pick verification filter (per-PR override via body)
        id: pick
        if: steps.scope.outputs.run_full == 'true'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        shell: bash
        run: |
          DEFAULT='(has-tag "falcon")'
          OVERRIDE=$(printf '%s' "$PR_BODY" \
            | grep -m1 -E '^Verify-Filter:' \
            | sed 's/^Verify-Filter:[[:space:]]*//' || true)
          if [ -n "${OVERRIDE:-}" ]; then
            printf 'filter=%s\n' "$OVERRIDE" >>"$GITHUB_OUTPUT"
          else
            printf 'filter=%s\n' "$DEFAULT" >>"$GITHUB_OUTPUT"
          fi

      - name: Run falcon verification gate
        id: verify
        if: steps.scope.outputs.run_full == 'true'
        continue-on-error: true
        env:
          FILTER: ${{ steps.pick.outputs.filter }}
        shell: bash
        run: |
          # Run ONCE: the script's exit code already reflects whether every
          # executed step passed (main() returns overall_pass), so re-running
          # in a second invocation was both wasteful AND incorrect — it made
          # non-idempotent steps (e.g. `cargo llvm-cov`, which leaves stale
          # .profraw the second run trips over) fail on the second pass.
          # `tee` keeps the per-step + markdown output on the console AND in
          # the file; `pipefail` makes the python exit code drive the gate.
          set -o pipefail
          python3 scripts/run-falcon-verification.py \
            --filter "$FILTER" \
            --markdown | tee verification-output.md

          # A filter that matches NOTHING must not pass this gate.
          #
          # The script exits 0 on an empty match set — nothing ran, so nothing
          # failed — which means a typo'd (or hostile) `Verify-Filter:` in the
          # PR body silently green-lights a REQUIRED check while verifying
          # zero artifacts. The body is attacker-controllable, so this is a
          # gate-silencing vector, not just an ergonomic foot-gun: the
          # injection risk was already handled above (env-bound, quoted), but
          # the SEMANTIC trust of the filter was not.
          #
          # Caught empirically: `(has-tag "traceability")` reads perfectly
          # plausible and matches 0 of the 195 sw-verification artifacts
          # (the tag lives on sw-reqs, not verifications) — exit code 0.
          if grep -qE '^# 0 artifact\(s\) matched' verification-output.md; then
            # NB: keep this on ONE line. A backslash-continued string whose
            # continuation starts at column 0 terminates the `run: |` block
            # scalar and makes the whole workflow file INVALID YAML — which is
            # how the first version of this guard broke its own gate.
            echo "::error::Verify-Filter matched 0 verification artifacts — refusing to pass a gate that verified nothing. Fix the filter, or drop the override to use the default."
            exit 1
          fi

      - name: Upload verification output
        if: always() && steps.scope.outputs.run_full == 'true' 
        uses: actions/upload-artifact@v7
        with:
          name: verification-output
          path: verification-output.md
          if-no-files-found: warn

      - name: Post sticky PR comment
        # Cosmetic: the verification VERDICT is owned by the separate
        # "Fail job if any verification artifact failed" step below. A comment
        # hiccup (e.g. `gh` absent on a self-hosted runner) must NEVER fail the
        # gate. Surfaced by the v1.55 smithy migration (gh is GitHub-hosted-only).
        continue-on-error: true
        if: github.event_name == 'pull_request' && always() && steps.scope.outputs.run_full == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          # Comment ONLY the markdown summary (the per-step log + full cargo
          # output is the uploaded artifact, not the PR comment).
          if grep -q '^## .*Rivet verification gate' verification-output.md; then
            sed -n '/^## .*Rivet verification gate/,$p' verification-output.md > verification-summary.md
          else
            cp verification-output.md verification-summary.md
          fi
          python3 tools/post_verification_comment.py "$PR_NUMBER" \
            --body-file verification-summary.md

      - name: Fail job if any verification artifact failed
        # Fast-pass path (run_full=false): nothing was verified and nothing
        # can have failed — the job succeeds, satisfying the required check.
        if: steps.scope.outputs.run_full == 'true' && steps.verify.outcome != 'success'
        shell: bash
        run: |
          echo "::error::One or more falcon verification artifacts failed; see the sticky PR comment"
          exit 1
