# Nightly endurance soak — ENDURANCE-P01.
#
# The stack must hold position for HOURS. The ceiling today is about 26 seconds
# on the gz plant (#403). This job exists to make that number visible every
# night and to stop it getting worse while it is being fixed.
#
# TWO TIERS, because their costs differ by three orders of magnitude:
#
#   Tier 1 — analytic plant, MULTI-HOUR. 12 h of flight costs ~16 s of wall
#     clock (~2700x real time), so hours of coverage are essentially free. This
#     tier proves the control MATH does not degrade: no integrator windup, no
#     f32 drift, no estimator rot over ~10^7 ticks.
#
#     What it is NOT: the analytic plant is close to the mixer's own inverse and
#     models no sensor noise, latency or aiding cadence. It cannot show that a
#     vehicle flies. It is the cheap half, and it is labelled as such so nobody
#     reads a 12 h PASS here as an endurance claim.
#
#   Tier 2 — gz plant, REAL PHYSICS, near real time (RTF ~0.85-0.98), so an
#     hour of flight costs about an hour. Nightly, never per-PR. This is the
#     tier that can actually satisfy ENDURANCE-P01, and today it fails early.
#
# THE RATCHET. Tier 2 does not demand an hour it cannot yet reach. It measures
# the longest duration that still holds and fails if that regresses below
# GZ_FLOOR_S. A published number that may not get worse beats a target nobody
# measures.
name: Soak

on:
  schedule:
    # 03:17 UTC — off the hour, so it does not collide with every other
    # cron in the org competing for the same self-hosted fleet.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      gz_max_s:
        description: 'Longest gz duration to attempt (seconds)'
        default: '120'

permissions:
  contents: read

jobs:
  analytic-soak:
    name: Analytic soak (multi-hour)
    runs-on: [self-hosted, linux, x64, rust-cpu]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build the bench
        run: cargo build --release -p falcon-sitl-gz

      - name: Hold for 1 h, 4 h and 12 h
        shell: bash
        # WITH NOISE, or this tier measures nothing (#435). The analytic plant
        # is perfectly symmetric and starts level at the setpoint, so with
        # IMU_NOISE unset (0.0) its horizontal loop is never excited and the
        # hold is 0.000 m by construction at any duration — including the 12 h
        # rung. sigma 0.01 rad/s is the value SWREQ-FALCON-ENDURANCE-P01's
        # table is measured at; at it the 12 h hold peaks at 0.46 m and ends at
        # 0.16 m, so the verdict's 1.0 m horizontal bar is met on merit rather
        # than vacuously.
        env:
          IMU_NOISE: '0.01'
        run: |
          set -euo pipefail
          FAIL=0
          for D in 3600 14400 43200; do
            H=$((D / 3600))
            # `set -euo pipefail` above does NOT stop at the assignment only
            # by luck: the bench exits 1 on a FAIL verdict, so under -e the
            # step DIED here and the FAIL=1/continue arm below was unreachable
            # — the tier reported a red step with no measurement instead of
            # walking the remaining rungs. Same trap the gz ladder had.
            RC=0
            OUT=$(./target/release/falcon-sitl-gz \
                    --backend=mock --scenario=flightcore --duration=$D 2>&1) || RC=$?
            echo "$OUT" | grep -E 'verdict|^PASS|^FAIL' || true

            # The scenario's own verdict is the oracle; do not re-derive it.
            if [ "$RC" != 0 ] || ! grep -q '^PASS' <<<"$OUT"; then
              echo "::error::analytic soak FAILED at ${H} h — the control math degrades over long runs"
              FAIL=1
              continue
            fi

            # A hold can pass while an integrator grows without bound underneath
            # it — that is the failure mode this tier exists to catch, and it is
            # exactly how the 15-second swing (#396) hid until it was traced.
            EST=$(sed -nE 's/.*est_z=(-?[0-9.]+)m.*/\1/p' <<<"$OUT" | tail -1)
            RMS=$(sed -nE 's/.*rms_steady=([0-9.]+)m.*/\1/p' <<<"$OUT" | tail -1)
            # Commanded -2.0 m. Measured 2026-09-16 at 1/4/12 h: est_z -1.99, rms 0.01.
            if ! awk -v e="$EST" -v r="$RMS" \
                 'BEGIN { exit !(((e + 2.0) < 0.5) && ((e + 2.0) > -0.5) && (r < 0.5)) }'; then
              echo "::error::${H} h: hold degraded — est_z=${EST} rms=${RMS}"
              FAIL=1
              continue
            fi
            echo "  ${H} h OK: est_z=${EST} m, rms=${RMS} m"
          done
          [ "$FAIL" = 0 ] || exit 1

  gz-endurance:
    name: gz endurance watch (the real ceiling)
    runs-on: ubuntu-latest
    # 150, NOT 90 (#497). The ladder's full rung set sums 5135 s of FLIGHT, and
    # measured non-flight overhead on a real run was 498 s wall for 335 s flight
    # (fresh gz server + topic wait + teardown per rung). Eight rungs therefore
    # project ~90 min against what used to be a 90-minute cap: the job would be
    # KILLED MID-LADDER, bypassing the loop's exit path, so BEST was never
    # printed and the nightly went red with no measurement -- precisely the
    # "the measurement was lost" failure the comments below say was already
    # fixed once, reintroduced by raising the cap without raising the limit.
    # Caught by independent review of the fix, not by the fix's author.
    timeout-minutes: 150
    env:
      # The longest gz hold measured good on 2026-09-16 was 25 s (three runs:
      # 0.04, 0.21, 0.10 m). The floor is what must not regress; it is NOT the
      # target. ENDURANCE-P01's target is 3600.
      # RATCHETED 25 -> 120 (#497) -> 3600 (2026-10-07). The floor is "the
      # longest duration that has held, which may not get worse".
      #
      # IT HAS NOW REACHED THE REQUIREMENT'S TARGET. #497 demoted
      # ENDURANCE-P01 partly because "at least ONE HOUR on the reference Gazebo
      # plant HAS NEVER RUN" — true then, because a `schedule` event left
      # `github.event.inputs` empty and `MAX="${GZ_MAX_S:-120}"` capped every
      # nightly at 120 s. #507 fixed that default. Since then the ladder has
      # climbed the whole way, FOUR NIGHTS RUNNING:
      #
      #   2026-10-03  longest holding duration 3600s
      #   2026-10-04  longest holding duration 3600s
      #   2026-10-05  longest holding duration 3600s
      #   2026-10-06  longest holding duration 3600s
      #
      # and every rung passed on the way up (25/40/60/90/120/300/900/3600).
      #
      # SO THE FLOOR AT 120 WAS THE SAME DEFECT #497 CAUGHT, at a worse ratio:
      # it trailed the measurement by 30x, and a 30x endurance regression would
      # have passed silently. Leaving it there because 120 was "recently raised"
      # is how a ratchet becomes a decoration. Raise this whenever the ladder
      # establishes a longer rung — that is the mechanism working, not a chore.
      #
      # 3600 is also the TARGET, so from here the ratchet and the requirement
      # coincide: any regression below an hour now fails the nightly.
      GZ_FLOOR_S: '3600'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install Gazebo Harmonic
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl lsb-release gnupg
          sudo curl -fsSL https://packages.osrfoundation.org/gazebo.gpg \
            -o /usr/share/keyrings/pkgs-osrf-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/pkgs-osrf-archive-keyring.gpg] http://packages.osrfoundation.org/gazebo/ubuntu-stable $(lsb_release -cs) main" \
            | sudo tee /etc/apt/sources.list.d/gazebo-stable.list
          sudo apt-get update
          sudo apt-get install -y gz-harmonic libgz-transport13-dev libgz-msgs10-dev pkg-config

      - name: Build the bench with the real bridge
        run: cargo build --release -p falcon-sitl-gz --features gazebo

      - name: Climb the ladder until the hold breaks
        shell: bash
        # The dispatch input is BOUND THROUGH env, never interpolated into the
        # script: `${{ }}` is expanded by Actions before bash sees the text, so
        # an actor with dispatch rights could end the assignment and run their
        # own commands with the job's ambient environment. Same rule the fleet
        # monitor states and release.yml follows.
        env:
          GZ_MAX_S: ${{ github.event.inputs.gz_max_s }}
        run: |
          set -uo pipefail
          # THE SCHEDULED RUN USED TO CAP AT 120 s, SILENTLY (#497).
          # `github.event.inputs` is empty on a `schedule` event, so GZ_MAX_S was
          # empty and this fell back to 120 -- which meant ENDURANCE-P01's
          # "at least ONE HOUR on the reference Gazebo plant" was NEVER RUN by
          # the job that exists to run it. The step printed
          # "::warning::gz hold is 120s, short of the 1 h target" and SUCCEEDED,
          # every night, for weeks. Introduced by me when I bound GZ_MAX_S
          # through `env:` to close an ACTIONS-EXPRESSION injection: that fix was
          # right, the default was not.
          #
          # AND DO NOT WRITE THAT TOKEN LITERALLY IN HERE. An earlier version of
          # this very comment spelled the expression syntax out, inside this
          # `run:` block, with empty braces. Actions expands expressions in a
          # `run:` script BEFORE bash sees the text, and it does not care that
          # the line is a shell comment -- so an empty expression made the whole
          # file invalid and GitHub REFUSED TO START THE WORKFLOW. Every event
          # produced a run with ZERO JOBS and conclusion `failure`, which reads
          # as noise rather than as "the endurance soak cannot run", and the
          # nightly was dark from the moment that comment landed (#498, 08:56)
          # until it was caught. A comment explaining an injection fix became the
          # outage -- the same "the measurement was lost" shape this file already
          # documents twice above, one layer further out.
          #
          # A scheduled run now climbs to the REQUIREMENT'S target. A manual
          # dispatch may still ask for less, because a human debugging the
          # ladder should not be forced to wait an hour.
          if [ -n "${GZ_MAX_S}" ]; then
            MAX="${GZ_MAX_S}"
          elif [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            MAX=3600
          else
            MAX=120
          fi
          echo "gz ladder cap: ${MAX}s (event=${GITHUB_EVENT_NAME})"
          BEST=0
          # PUBLISH EVERY RUNG AS IT COMPLETES. A timeout is a guess about the
          # slowest plausible run, and when it is wrong the job is killed
          # outside this loop's control -- no exit path, no summary, no number.
          # Appending each holding duration to a file the next step reads means
          # the measurement survives a kill: a truncated ladder still publishes
          # the longest rung it reached, which is exactly what the ratchet needs.
          RUNGS=/tmp/gz-soak-rungs.txt
          : > "$RUNGS"
          # Each rung gets a FRESH server: /world/falcon/control does not answer
          # a reset request, so a reused world starts wherever the last run left
          # the vehicle. Same reason scripts/gz-trial.rs restarts per trial.
          for D in 25 40 60 90 120 300 900 3600; do
            [ "$D" -gt "$MAX" ] && break
            pkill -f 'gz sim' 2>/dev/null || true
            sleep 3
            nohup gz sim -s -r -v2 examples/falcon-sitl-gz/worlds/falcon-quad.sdf \
              > /tmp/gz-soak-$D.log 2>&1 &
            IMU=/world/falcon/model/quad/link/base_link/sensor/imu_sensor/imu
            for i in $(seq 1 30); do
              gz topic -l 2>/dev/null | grep -qx "$IMU" && break
              sleep 2
            done

            # Same trap the analytic tier had (fixed in #460): `shell: bash`
            # runs with -e and the bench exits 1 on a FAIL verdict, so this
            # assignment ended the STEP at the first breaking rung — before it
            # could print the rung, the reason, or the longest-holding number
            # this job exists to publish. Every soak run on main died that way
            # and the release notes recorded the track as DARK, which reads as
            # "the hold is broken" when it actually means "the measurement was
            # lost".
            RC=0
            OUT=$(timeout $((D + 300)) ./target/release/falcon-sitl-gz \
                    --backend=gazebo --scenario=flightcore --duration=$D 2>&1) || RC=$?
            echo "── ${D}s ──"; grep -E 'verdict|^PASS|^FAIL' <<<"$OUT" || true

            if [ "$RC" = 0 ] && grep -q '^PASS' <<<"$OUT"; then
              BEST=$D
              # ...and on disk immediately, so a kill cannot lose it.
              echo "$D" >> "$RUNGS"
            else
              # Say WHICH failure it was, so a crash is never read as a hold
              # that merely broke.
              if [ "$RC" = 124 ]; then
                echo "  hold breaks at ${D}s (the bench TIMED OUT)"
              elif grep -q '^FAIL' <<<"$OUT"; then
                echo "  hold breaks at ${D}s (verdict FAIL)"
              else
                echo "  hold breaks at ${D}s (bench exited $RC without a verdict)"
              fi
              break
            fi
          done
          pkill -f 'gz sim' 2>/dev/null || true

          echo "::notice::gz endurance: longest holding duration ${BEST}s (floor ${GZ_FLOOR_S}s, ENDURANCE-P01 target 3600s)"
          # Prefer the on-disk record: if this shell were re-entered or BEST
          # lost, the rung file is still the measurement.
          if [ -s "$RUNGS" ]; then BEST=$(sort -n "$RUNGS" | tail -1); fi
          if [ "$BEST" -lt "${GZ_FLOOR_S}" ]; then
            echo "::error::gz endurance REGRESSED: ${BEST}s < floor ${GZ_FLOOR_S}s"
            exit 1
          fi
          # Deliberately NOT a failure while below target: #403 is the tracked
          # defect. Failing nightly on a known-open bug trains people to ignore
          # this job, which is how a gate stops meaning anything.
          if [ "$BEST" -lt 3600 ]; then
            echo "::warning::gz hold is ${BEST}s, short of the 1 h ENDURANCE-P01 target — tracked in #403"
          fi

  wasm-endurance:
    name: wasm endurance watch (BOTH PATHS)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      # THE WASM PATH'S OWN FLOOR: 3600, and this time the evidence is the right
      # axis. The history is worth keeping because I got it wrong once in both
      # directions. It started at 25 (the only duration the component had been
      # run to). I raised it to 3600 on a ladder that flew all eight rungs — and
      # took it straight back out, because that ladder's PASS checked ALTITUDE
      # ONLY: the harness computed a horizontal number, printed it, and this
      # job's own allowlist dropped it, so the component could have been leaving
      # the area at every rung while every rung read PASS.
      #
      # THE VERDICT NOW JUDGES THE HORIZONTAL HALF on plant truth, with the
      # native leg's bars (final < 1.0 m, peak < 2.0 m over the run). Run
      # 37639930795 re-flew the whole ladder under that verdict and the
      # component holds the hour:
      #
      #   rung     native final/peak      wasm final/peak
      #   25s      0.01 / 0.01            0.023 / 0.041
      #   120s     0.03 / 0.04            0.033 / 0.042
      #   900s     0.02 / 0.06            0.039 / 0.058
      #   3600s    0.01 / 0.06            0.026 / 0.066
      #
      # Both paths reach 3600 s, agreeing to 0.006 m on peak, ~15-30x inside the
      # requirement's own 1.0 m bound. So 3600 is established for this leg too,
      # and BOTH PATHS now ratchet at the same number — which is the point of the
      # clause.
      #
      # ON THE FLAKE EXPOSURE, which is why I hesitated before: BEST < 3600 iff
      # any of 8 sequential rungs fails, each with its own fresh gz server on a
      # hosted runner. Data rather than argument — but stated precisely, because
      # I first wrote this as "six nights at a 3600 floor with no false red" and
      # that is FALSE: those six nightlies ran at floor 120, which is what their
      # own logs print. What they DO establish is the thing that matters here —
      # all EIGHT rungs COMPLETED on each of the six nights, every one
      # publishing 3600 s, so a 3600 floor would have produced zero reds across
      # that history. Same ladder, same runner class, six samples.
      # Still: the step prints the breaking rung and which of three things
      # happened (TIMED OUT / verdict FAIL / exited without a verdict =
      # infrastructure). Read the break reason before believing REGRESSED, and
      # do not lower this floor without quoting it.
      WASM_FLOOR_S: '3600'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2, wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-component
        uses: taiki-e/install-action@v2.87.23
        with:
          tool: cargo-component

      - name: Install Gazebo Harmonic
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl lsb-release gnupg
          sudo curl -fsSL https://packages.osrfoundation.org/gazebo.gpg \
            -o /usr/share/keyrings/pkgs-osrf-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/pkgs-osrf-archive-keyring.gpg] http://packages.osrfoundation.org/gazebo/ubuntu-stable $(lsb_release -cs) main" \
            | sudo tee /etc/apt/sources.list.d/gazebo-stable.list
          sudo apt-get update
          sudo apt-get install -y gz-harmonic libgz-transport13-dev libgz-msgs10-dev pkg-config

      - name: Build the published component and the wasm harness
        shell: bash
        run: |
          set -euo pipefail
          # Same path gazebo.yml uses: the artifact a host runs is the artifact
          # we test. build-components.sh skips the bazel P3 artifacts here (the
          # sibling rules_* repos are not checked out), which is fine — the
          # cargo-component ones are what compose into the cascade.
          bash scripts/build-components.sh 1.141
          cp dist/falcon-components-v1.141/falcon-cascade-v1.141.wasm /tmp/composed.wasm
          cd tests/cascade-sitl-wasm && cargo build --release --features gazebo

      - name: Climb the wasm ladder until the hold breaks
        shell: bash
        run: |
          set -uo pipefail
          BEST=0
          DT=0.004
          # Each rung gets a FRESH SERVER: /world/falcon/control does not answer
          # a reset request, so a reused world starts wherever the last run left
          # the vehicle. Same reason the native tier and scripts/gz-trial.rs
          # restart per trial.
          for D in 25 40 60 90 120 300 900 3600; do
            pkill -f 'gz sim' 2>/dev/null || true
            sleep 3
            nohup gz sim -s -r -v2 examples/falcon-sitl-gz/worlds/falcon-quad.sdf \
              > /tmp/gz-wasm-$D.log 2>&1 &
            IMU=/world/falcon/model/quad/link/base_link/sensor/imu_sensor/imu
            for i in $(seq 1 30); do
              gz topic -l 2>/dev/null | grep -qx "$IMU" && break
              sleep 2
            done

            TICKS=$(awk -v d="$D" -v dt="$DT" 'BEGIN{printf "%d", d/dt}')
            # `|| RC=$?` rather than a bare call: `shell: bash` runs with -e and
            # the harness exits 1 on a FAIL verdict, so a bare call would END THE
            # STEP at the first breaking rung — before it printed the rung, the
            # reason, or the longest-holding number this job exists to publish.
            # The native tier had exactly this bug twice (#460, then again when
            # the cap was raised); it is not being reintroduced here.
            RC=0
            OUT=$(cd tests/cascade-sitl-wasm && timeout $((D + 300)) \
                    env BACKEND=gazebo ./target/release/cascade-sitl-wasm \
                    /tmp/composed.wasm "$TICKS" "$DT" 2>&1) || RC=$?
            echo "── wasm ${D}s (${TICKS} ticks) ──"
            # 'horizontal' IS IN THIS LIST DELIBERATELY. It was missing, and the
            # harness's horizontal number — the half ENDURANCE-P01 actually
            # turns on — never reached the log, so the ladder was read on its
            # altitude line alone. FOURTH time this repo has lost a verdict to
            # an output allowlist, after FDI_TRACE, RING_TRACE and ROTOR-OUT in
            # scripts/gz-trial.rs. When you add a number to the harness, add it
            # here in the same change or it does not exist.
            grep -E 'LOOP CLOSES|STATE RETURN|HOLD ERROR|horizontal|^PASS|^FAIL' <<<"$OUT" || true

            # INFRASTRUCTURE vs FLIGHT OUTCOME, distinguished as gazebo.yml does:
            # a component that never executed is not an endurance result at all.
            if ! grep -q 'LOOP CLOSES' <<<"$OUT"; then
              echo "::error::the wasm cascade did not EXECUTE at ${D}s — infrastructure failure, not a flight outcome"
              echo "$OUT" | tail -20
              break
            fi

            # The harness's own verdict is the oracle; do not re-derive it.
            if [ "$RC" = 0 ] && grep -q '^PASS' <<<"$OUT"; then
              BEST=$D
            else
              if [ "$RC" = 124 ]; then
                echo "  wasm hold breaks at ${D}s (TIMED OUT)"
              elif grep -q '^FAIL' <<<"$OUT"; then
                echo "  wasm hold breaks at ${D}s (verdict FAIL)"
              else
                echo "  wasm hold breaks at ${D}s (harness exited $RC without a verdict)"
              fi
              break
            fi
          done
          pkill -f 'gz sim' 2>/dev/null || true

          echo "::notice::wasm endurance: longest holding duration ${BEST}s (floor ${WASM_FLOOR_S}s, ENDURANCE-P01 target 3600s)"
          if [ "$BEST" -lt "${WASM_FLOOR_S}" ]; then
            echo "::error::wasm endurance REGRESSED: ${BEST}s < floor ${WASM_FLOOR_S}s"
            exit 1
          fi
          # UNREACHABLE while WASM_FLOOR_S == 3600, and kept deliberately: the
          # floor check above already failed anything short of the target. It
          # goes live again the moment someone lowers the floor — which is
          # precisely when "below the target" stops being a failure and starts
          # being a gap worth naming. Do not delete it as dead code; it is the
          # guard for the configuration this job used to ship with.
          # THIS JOB CAN ONLY SPEAK FOR THE WASM LEG, and the notice it used to
          # print claimed otherwise. It said "BOTH PATHS reached the hour" and
          # quoted "the native tier's 3600s … 0.02 m final / 0.05 m peak" — all
          # three HARDCODED LITERALS, inside the wasm job, with no read of the
          # gz job's result. It would have printed identically had the gz leg
          # FAILED. Worse, the figures were wrong: soak.yml's own table thirty
          # lines above records the native 3600 s rung as 0.01 / 0.06.
          #
          # Found by an independent clean-room review of the v1.140 claims, and
          # it matters because that notice was cited as one of three evidence
          # rows in ENDURANCE-P01's promotion. A cross-job claim asserted from
          # literals is the absence-looks-like-data shape this repo keeps
          # finding, with the twist that here the data was also stale.
          #
          # So: this job now reports ONLY what it measured, and POINTS AT the gz
          # job rather than speaking for it. Whoever wants the both-paths
          # statement reads two jobs, which is the honest cost of a claim about
          # two legs.
          if [ "$BEST" -lt 3600 ]; then
            echo "::warning::wasm hold is ${BEST}s, short of the 1 h ENDURANCE-P01 target. BOTH PATHS must reach it; read the 'gz endurance' job for the native leg."
          else
            echo "::notice::wasm leg reached the hour, HORIZONTALLY JUDGED: ${BEST}s (ENDURANCE-P01 clause 3). This job does NOT observe the native leg — read the 'gz endurance watch' job's own notice for that, and compare the wasm 'horizontal' lines above rather than its altitude line."
          fi
