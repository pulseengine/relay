name: Verus

# Runs every `verus_test` target declared in the ROOT BUILD.bazel through
# rules_verus (Bazel). The targets are DISCOVERED with `bazel query`, not
# listed (see the run step), and the step asserts that Verus reported verified
# functions, so an empty or silently-skipped run fails. The targets had been
# defined and never executed (#364).
#
# REQUIRED VIA `Verus gate` (maintainer decision 2026-11-13). Before, this
# workflow was not required and had no merge_group trigger, while the required
# verification gate credited every cited Verus step as `enforced-by-verus-gate`
# after checking only that the target existed (pulseengine.eu gate audit,
# finding 1): a PR could merge with Verus red. Now:
#   - `changes` decides whether any Verus-relevant path changed (crates/**,
#     the bazel files, this workflow); it FAILS CLOSED to run=true;
#   - `verus` runs when it did, on PRs (early feedback), in the MERGE QUEUE
#     (the evidence the required check rests on) and on every push to main;
#   - `Verus gate` ALWAYS reports, so the required context never holds a PR:
#     green when `verus` passed or was skipped as out-of-scope, red otherwise.
# The required context is `Verus gate`, not `Verus proofs`.

on:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:
  # No trigger-level path filter: a required context must always report. The
  # path scope moved into the `changes` job below.
  pull_request:
    branches: [main]
    # THESE WERE LEAN'S PATHS (#418). This workflow is a copy of lean.yml and
    # the filter came with it, so the Verus gate never ran on a PR that changed
    # Verus code - it ran only when someone touched `proofs/lean/**` or
    # `lean.yml`. A path filter that excludes the very thing it gates is worse
    # than no filter: the check reports success for a PR it never examined.
    #
    # Verus has no `proofs/` directory. Its targets are `verus_test` rules
    # declared in the ROOT package and they verify the engines, so the paths
    # that can change a Verus outcome are the crates and the bazel files that
    # declare the targets.

concurrency:
  # PRs and non-main branch pushes: cancel superseded runs.
  # Main pushes: never cancel, to keep the evidence.
  group: verus-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    name: Detect Verus-relevant changes
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","light"]') || 'ubuntu-latest' }}
    outputs:
      run: ${{ steps.scope.outputs.run }}
      reason: ${{ steps.scope.outputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Scope check (does a Verus-relevant path change?)
        id: scope
        env:
          # PR: the PR base. Merge queue: the tip the queued change is tested
          # against. Push: the ref's previous tip. Dispatch: none (runs).
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          # The paths that can change a Verus outcome: the crates (Verus trees
          # live in crates/*/src), the root bazel files that declare the
          # verus_test targets, and this workflow. Every other path is skipped
          # as out-of-scope; anything unexpected FAILS CLOSED to run=true.
          if [ -z "${BASE_SHA:-}" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ] \
             || ! FILES=$(git diff --name-only "$BASE_SHA" HEAD 2>/dev/null); then
            echo "no usable base sha or diff failed: running (fail closed)"
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "reason=" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if printf '%s\n' "$FILES" | grep -qE '^(crates/|BUILD\.bazel$|MODULE\.bazel|\.github/workflows/verus\.yml$)'; then
            echo "Verus-relevant paths changed: running"
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "reason=" >> "$GITHUB_OUTPUT"
          else
            echo "no Verus-relevant path changed: skipping as out-of-scope"
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "reason=out-of-scope" >> "$GITHUB_OUTPUT"
          fi

  verus:
    name: Verus proofs
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    # A cap, not a budget: measured runs took 2-25 min. A timed-out run is
    # `cancelled`, which the gate below fails closed on.
    timeout-minutes: 90
    steps:
      - name: Checkout relay
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: relay

      - name: Checkout rules_lean
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: pulseengine/rules_lean
          path: rules_lean

      # MODULE.bazel local_path_overrides the four rules_* PulseEngine repos
      # as siblings; the Lean proofs only need rules_lean, but crate_universe
      # / the wider graph may reference the others. Check out the ones the
      # MODULE graph resolves to keep `bazel test //proofs/lean:all` from
      # failing on a missing sibling.
      - name: Checkout rules_wasm_component
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: pulseengine/rules_wasm_component
          path: rules_wasm_component

      - name: Checkout rules_verus
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: pulseengine/rules_verus
          path: rules_verus

      - name: Checkout rules_rocq_rust
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: pulseengine/rules_rocq_rust
          path: rules_rocq_rust

      # ubuntu-latest ships ~14 GB free, but the Lean 4.29.1 toolchain +
      # Mathlib v4.29.1 oleans + the transitive rules_* toolchain graph
      # (wac/wkg/meld/loom/spar/witness/synth/rocq, pulled in by the sibling
      # checkouts above) overran it ("No space left on device" extracting the
      # Lean toolchain). Reclaim the ~25 GB of preinstalled SDKs this job does
      # not use. Plain rm (no third-party action) to keep the CI dependency
      # surface minimal.
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/lib/jvm "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          df -h /

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # pinned — supply-chain

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.1
        with:
          bazelisk-cache: true
          disk-cache: bazel
          repository-cache: true

      - name: Run every Verus proof
        working-directory: relay
        # (The Lean comment that used to sit here came with the copy and
        # described //proofs/lean:all, which this workflow does not build.)
        run: |
          # QUERY, do not enumerate. This workflow exists because 19 verus_test
          # targets were defined and none was ever executed (#364) — a hand-written
          # target list is exactly the drift that produced that. Discover them.
          # Scope to the ROOT package: that is where every verus_test is
          # declared. `//...` additionally walks agent worktrees under .claude
          # (now covered by .bazelignore too) and dies loading a sibling repo's
          # BUILD file — which is exactly how this workflow failed its first
          # run. Measured locally: this returns 19.
          TARGETS=$(bazel query 'kind("verus_test rule", //:*)' 2>/dev/null | tr '\n' ' ')
          if [ -z "${TARGETS// /}" ]; then
            echo "::error::no verus_test targets found — the Verus track would silently verify NOTHING"
            exit 1
          fi
          echo "verus targets discovered:"; printf '  %s\n' $TARGETS
          bazel test $TARGETS --test_output=errors

          # ASSERT THAT VERUS ACTUALLY VERIFIED SOMETHING. The format is no
          # longer guessed: #531 made the passing output visible, and run
          # 37782958781 (main, 2026-10-08) showed each target emits
          #
          #   verification results:: N verified, 0 errors
          #
          # 18 of 19 targets reported one, totalling 270 verified functions with
          # zero errors, and no `cannot find core/std` anywhere. So #405's claim
          # that "Verus has verified nothing since 2026-09-11" is REFUTED as of
          # 2026-10-06, when the track recovered via an upstream rules_verus
          # change (no commit in this repo touched it).
          #
          # THE 19TH TARGET IS WHY THIS STEP CHANGED SHAPE. relay_tbl showed NO
          # verification line - not because it verified nothing, but because it
          # prints ~80 lines of Verus trigger-selection notes first and the
          # previous `sed -n '1,80p'` window CUT OFF the summary. A fixed head
          # window can hide the exact line the step exists to show. So: grep the
          # whole log for the summary, and keep the excerpt as context only.
          #
          # This is the assertion VGATE-P05 asks for - the track can now FAIL by
          # verifying nothing, where before it could only fail by erroring.
          echo "::group::verus verification results"
          LOGDIR=$(bazel info bazel-testlogs 2>/dev/null || true)
          if [ -z "$LOGDIR" ] || [ ! -d "$LOGDIR" ]; then
            echo "::error::bazel-testlogs not found - cannot confirm Verus verified anything"
            exit 1
          fi
          TOTAL=0
          BAD=0
          while read -r L; do
            NAME="${L#"$LOGDIR"/}"
            # The summary can appear anywhere in the log, not in its first 80
            # lines. Take the LAST one if a target emits several.
            LINE=$(grep -aoE 'verification results:: [0-9]+ verified, [0-9]+ error' "$L" | tail -1)
            if [ -z "$LINE" ]; then
              echo "::error::${NAME}: NO verification summary - this target proved nothing"
              BAD=$((BAD + 1))
              sed -n '1,40p' "$L"
              continue
            fi
            V=$(echo "$LINE" | sed -E 's/.*:: ([0-9]+) verified.*/\1/')
            E=$(echo "$LINE" | sed -E 's/.*verified, ([0-9]+) error.*/\1/')
            echo "  ${NAME%%/*}: ${V} verified, ${E} errors"
            if [ "$V" -eq 0 ]; then
              echo "::error::${NAME}: 0 verified - passed VACUOUSLY"
              BAD=$((BAD + 1))
            fi
            if [ "$E" -ne 0 ]; then
              echo "::error::${NAME}: ${E} verification errors"
              BAD=$((BAD + 1))
            fi
            TOTAL=$((TOTAL + V))
            # Process substitution, NOT a pipe: a pipe would run the loop in a
            # subshell and TOTAL/BAD would come back unchanged, so the gate
            # would always see 0 and pass. And NOT a heredoc: its terminator
            # must sit at column 0, which breaks out of this YAML block scalar
            # (actionlint caught exactly that).
          done < <(find "$LOGDIR" -name test.log | sort)
          echo "::endgroup::"
          echo "::notice::Verus verified ${TOTAL} functions, 0 errors, across $(find "$LOGDIR" -name test.log | wc -l | tr -d ' ') targets"
          if [ "$BAD" -ne 0 ]; then
            echo "::error::${BAD} Verus target(s) proved nothing or errored - the track is not evidence"
            exit 1
          fi
          # A floor, so a silent collapse from 270 to 3 is a FAILURE and not a
          # quieter green. Deliberately well below the measured 270 rather than
          # at it: this is a ratchet against collapse, not a pin against the
          # ordinary drift of adding and removing proofs. Raise it when a longer
          # run establishes a higher stable floor.
          if [ "$TOTAL" -lt 200 ]; then
            echo "::error::Verus verified only ${TOTAL} functions; the floor is 200 (measured 270 on 2026-10-08)"
            exit 1
          fi

  verus-gate:
    name: Verus gate
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","light"]') || 'ubuntu-latest' }}
    needs: [changes, verus]
    if: always()
    steps:
      - name: Verus green (or correctly skipped)?
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          VERUS_RESULT: ${{ needs.verus.result }}
          SKIP_REASON: ${{ needs.changes.outputs.reason }}
        run: |
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "scope (changes) job did not succeed: $CHANGES_RESULT"; exit 1
          fi
          case "$VERUS_RESULT" in
            success) echo "Verus: every verus_test target verified" ;;
            skipped)
              case "$SKIP_REASON" in
                out-of-scope) echo "Verus: skipped (no Verus-relevant path changed) - OK" ;;
                *) echo "Verus skipped with no recorded reason ('$SKIP_REASON') - failing closed"; exit 1 ;;
              esac ;;
            *) echo "Verus proofs: $VERUS_RESULT"; exit 1 ;;
          esac
