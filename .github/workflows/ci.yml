name: CI

# Standard cargo CI for the relay workspace. fmt + clippy + test
# across linux/macos/windows. Bazel verus jobs follow in v0.2 when
# the falcon crates get Verus annotations.
#
# Runner labels start on github-hosted; flip to pulseengine
# self-hosted labels (e.g. [self-hosted, linux, x64, rust-cpu])
# once a runner pool is wired up for this repo.

on:
  # MERGE QUEUE (2026-10-21). This workflow produces a REQUIRED check, so it
  # must also run on the queue's `merge_group` event — otherwise a queued PR
  # waits forever for a check that is never reported.
  merge_group:
  push:
    branches: [main]
  # No branches or paths filter on pull_request (jig caller rule): a required
  # aggregator must report on every PR, or a PR it never ran on waits forever.
  pull_request:

concurrency:
  # PRs and non-main branch pushes: cancel superseded runs so runners
  # are freed for the newer commit immediately.
  # Main pushes: never cancel — every commit on main must carry a
  # completed verdict; branch-protection required-checks rely on this.
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # NB: RUSTFLAGS=-D warnings deliberately NOT set at workflow level.
  # Pre-existing cFS engine crates use `#[cfg(kani)]` without a
  # corresponding `check-cfg` declaration, which lights up
  # `unexpected_cfgs` lint and would block compilation. Lifting that
  # is a separate cleanup (one per cFS crate); for v0.1 we accept the
  # warning. Clippy on the falcon-scoped crates still uses
  # `-- -D warnings` to keep falcon code itself warning-free.

# jig caller REQ-022: one read-only permissions block for the whole workflow.
# No job writes: caches and artifacts use the runner's runtime token, and the
# jig reusable workflows declare `contents: read` themselves.
permissions:
  contents: read

jobs:
  fmt:
    name: Format
    # Routes fork PRs to GitHub-hosted runners by default. This is NOT a security
    # boundary: a fork PR can edit this file. Isolation is enforced by the org's
    # smithy runner-group policy and fork-PR approval (pulseengine/warte#35).
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","light"]') || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable (branch head 2026-11-15)
        with:
          toolchain: "1.100.0"
          components: rustfmt
      # `Format` is a REQUIRED status check. It carried `continue-on-error: true`
      # from d30a5e3 (2026-05-18, the v0.1.0 release) until v1.139 — so for its
      # entire life it could not report failure, and it was promoted to required
      # while in that state. The comment that stood here said "v0.1 tolerates
      # them while v0.2 cleans the workspace up"; we were at v1.138.
      #
      # The mask WAS hiding a live violation. On main 3ec4a2f this step logged
      # 893 `Diff in` hunks and `exit code 1` while the job reported success —
      # and the jobs API reports a continue-on-error step as `success` too, so
      # only the log tells. An earlier note here blamed local-vs-CI rustfmt
      # divergence; there was none: a local `cargo fmt --all` passes this check.
      # Run it. (#409)
      - run: cargo fmt --all -- --check

  workflow-lint:
    name: Workflow lint (actionlint)
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","light"]') || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # WHY THIS GATE EXISTS — it is not style, it caught a live outage.
      #
      # A workflow file that Actions cannot PARSE does not fail loudly: GitHub
      # creates a run with ZERO JOBS and conclusion `failure`, which in a long
      # run list is indistinguishable from noise. soak.yml was in exactly that
      # state from #498 (2026-10-01 08:56) until it was caught, so THE NIGHTLY
      # ENDURANCE SOAK COULD NOT START AT ALL — and the cause was a shell comment
      # inside a `run:` block that spelled out the Actions expression syntax with
      # empty braces. Actions expands expressions in `run:` scripts before bash
      # sees them and does not care that the line is a comment, so an empty
      # expression invalidated the file. A comment explaining an injection fix
      # became the outage.
      #
      # Nothing in this repo would have noticed. `yaml.safe_load` accepts the
      # file, the YAML is well-formed, and no job runs to report anything.
      # actionlint reads it the way Actions does, which is the whole point.
      #
      # Labels live in .github/actionlint.yaml — without it this emits 14
      # "label rust-cpu is unknown" warnings, and a noisy gate is an ignored one.
      # INSTALLED AS A PINNED, CHECKSUM-VERIFIED DOWNLOAD.
      #
      # The first version of this step used `taiki-e/install-action` with
      # `tool: actionlint`, which this gate itself caught on its own PR:
      #   install-action does not support actionlint ... fallback to cargo-binstall
      #   × For crate actionlint: actionlint is not found
      # actionlint is a Go binary, not a crate, so neither path can supply it.
      #
      # So it comes from its own release, with the version AND the sha256 pinned
      # here rather than trusting a checksums file fetched at the same time as
      # the artifact. Same posture as the `wkg` pin in release.yml. Bump both
      # numbers together; a mismatch fails the job loudly.
      - name: Install actionlint (pinned + checksummed)
        shell: bash
        run: |
          set -euo pipefail
          VER=1.7.12
          SHA=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          TGZ="actionlint_${VER}_linux_amd64.tar.gz"
          curl -fsSL -o "$TGZ" \
            "https://github.com/rhysd/actionlint/releases/download/v${VER}/${TGZ}"
          echo "${SHA}  ${TGZ}" | sha256sum -c -
          tar xzf "$TGZ" actionlint
          install -m755 actionlint "$HOME/.local/bin/actionlint" 2>/dev/null \
            || { mkdir -p "$HOME/.local/bin" && install -m755 actionlint "$HOME/.local/bin/actionlint"; }
          rm -f "$TGZ" actionlint
          "$HOME/.local/bin/actionlint" --version
      - run: "$HOME/.local/bin/actionlint -color .github/workflows/*.yml"

  engine-mirrors:
    name: Engine mirrors match their Verus source (relay#253)
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","light"]') || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable (branch head 2026-11-15)
        with:
          toolchain: "1.100.0"
      # verus-strip is the oracle. It is built from a pinned rules_verus commit
      # so a strip-behaviour change upstream lands here as a reviewed bump.
      - name: Build verus-strip (rules_verus b492aba)
        run: |
          cargo install --git https://github.com/pulseengine/rules_verus --rev b492aba \
            verus-strip --locked --root "$RUNNER_TEMP/vs"
      - name: Checker unit tests
        run: |
          rustc --edition 2021 --test scripts/check-engine-mirrors.rs -o "$RUNNER_TEMP/cem-test"
          "$RUNNER_TEMP/cem-test"
      - name: Held mirrors are the strip of their Verus source
        env:
          VERUS_STRIP: ${{ runner.temp }}/vs/bin/verus-strip
        run: |
          rustc --edition 2021 -O scripts/check-engine-mirrors.rs -o "$RUNNER_TEMP/cem"
          "$RUNNER_TEMP/cem"
      # Acceptance test, run on every change (gate-potency): a planted drift
      # in a held mirror (one comparison flipped) must FAIL the check. If this
      # step ever passes the planted copy, the gate is decoration.
      - name: Planted drift is caught
        env:
          VERUS_STRIP: ${{ runner.temp }}/vs/bin/verus-strip
        run: |
          set -u
          P="$RUNNER_TEMP/plant"
          rm -rf "$P" && mkdir -p "$P/scripts" "$P/crates"
          cp scripts/engine-mirror-converged.txt "$P/scripts/"
          cp -R crates/relay-ci "$P/crates/"
          F="$P/crates/relay-ci/plain/src/engine.rs"
          grep -q 'if header.length < config.min_length' "$F" || { echo "::error::planted-control anchor missing; update this step"; exit 1; }
          sed -i 's/if header.length < config.min_length/if header.length <= config.min_length/' "$F"
          RC=0; (cd "$P" && "$RUNNER_TEMP/cem") || RC=$?
          if [ "$RC" -ne 1 ]; then
            echo "::error::planted drift was not caught (exit $RC, expected 1)"
            exit 1
          fi
          echo "planted drift caught (exit 1)"

  clippy:
    name: Clippy
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","rust-cpu"]') || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable (branch head 2026-11-15)
        with:
          toolchain: "1.100.0"
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # Scope tight: only the v0.1 falcon crates. Workspace-wide
      # clippy lights up pre-existing warnings in cFS crates that
      # are out of v0.1 scope.
      - name: Float discipline (f32 flight core; f64 only at annotated boundaries)
        run: ./scripts/check-float-discipline.sh
      # Trust ledgers. Verus trusts (does not prove) each
      # #[verifier::external_body], and each kani::assume narrows a harness's
      # input range. Per crate / per file the count must equal
      # scripts/verus-trust-ceiling.txt / scripts/kani-assume-ledger.txt
      # (relay#253, maintainer decision 2026-11-13), and each ledger's TOTAL may
      # not exceed the base commit's: North Star O3's guard, entries may only
      # shrink (SWREQ-RELAY-LEDGER-P01). Unit tests first, so a broken checker
      # cannot pass vacuously. The base comparison is never skipped silently:
      # with no base commit the step passes --no-base and prints why.
      - name: Trust ledgers (external_body per crate, kani::assume per file; totals may only shrink)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          rustc --edition 2021 --test scripts/check-verus-trust.rs -o "$RUNNER_TEMP/cvt-test"
          "$RUNNER_TEMP/cvt-test"
          rustc --edition 2021 -O scripts/check-verus-trust.rs -o "$RUNNER_TEMP/cvt"
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            "$RUNNER_TEMP/cvt" --no-base "no base commit for a $EVENT event"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          B="$RUNNER_TEMP/ledger-base"
          rm -rf "$B" && mkdir -p "$B/scripts"
          for f in scripts/verus-trust-ceiling.txt scripts/kani-assume-ledger.txt; do
            if git cat-file -e "$BASE_SHA:$f" 2>/dev/null; then
              git show "$BASE_SHA:$f" > "$B/$f"
            fi
          done
          "$RUNNER_TEMP/cvt" --base "$B"
      # RATE-P05's soak oracle (S3, 2026-11-19): its planted bad inputs (the
      # ring at 2.47 rad/s, RMS at the bar, one tick out of the motor band, a
      # gate open 94.99%, a silent IMU, NaN, a truncated window) must each fail.
      # The soak runs it nightly on gz; the acceptance runs on every PR.
      - name: Soak hover check self-test (planted bad inputs)
        run: |
          rustc --edition 2021 --test scripts/soak-hover-check.rs -o "$RUNNER_TEMP/shc-test"
          "$RUNNER_TEMP/shc-test"
      # CHAIN-P01's reach parser and gate (North Star O1): a declined function,
      # a missing `Found` line, 0 functions, a non-zero exit and a missing ELF
      # must each fail. The lowering itself runs in chain.yml.
      - name: Chain walk self-test (planted synth logs)
        run: |
          rustc --edition 2021 --test scripts/chain-walk.rs -o "$RUNNER_TEMP/cw-test"
          "$RUNNER_TEMP/cw-test"
      # No fork PR reaches a self-hosted runner: every self-hosted runs-on uses
      # the fail-closed same-repo form (a deleted fork's null head.repo falls to
      # the hosted runner), every self-hosted label is one relay's pools provide
      # (plant-guard.toml), and no self-hosted job sits under a trigger a fork
      # can cause (pull_request_target, workflow_run, ...).
      #
      # `plant guard` from pulseengine/plant, which owns this check since
      # 2026-11-18 (relay donated scripts/check-selfhosted-fork-guard.rs; plant
      # parses the YAML structurally, so it also rejects the shapes the
      # line-based copy let through: `runs-on : light`, a quoted key, a
      # flow-style job, `ubuntu-gpu`, a misspelled label). Pinned by version
      # AND sha256, same posture as actionlint above. The sha256 was checked
      # against plant's cosign-signed SHA256SUMS.txt (identity: plant's
      # release.yml@refs/tags/v0.4.0). v0.4.0 is the plant the jig baseline
      # pins, and the first that reads plant-guard.toml's `trusted_workflows`
      # (v0.2.0 fails to parse it). Moves to the pulseengine varve layer once
      # plant is in a layer.
      - name: Self-hosted fork guard (plant guard, pinned)
        shell: bash
        run: |
          set -euo pipefail
          VER=0.4.0
          SHA=30bfd8b63bf95f4a4c3bd6ff890b551f550d75dc4a7b2bd3098224d76a99761f
          TGZ="plant-v${VER}-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$TGZ" \
            "https://github.com/pulseengine/plant/releases/download/v${VER}/${TGZ}"
          echo "${SHA}  $RUNNER_TEMP/${TGZ}" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$TGZ" -C "$RUNNER_TEMP" ./plant
          "$RUNNER_TEMP/plant" --version
          "$RUNNER_TEMP/plant" guard
      - name: Clippy on v0.1 falcon crates
        run: |
          cargo clippy --locked -p relay-mavlink -p relay-ekf-stub -p falcon-hello \
            -p falcon-param -p relay-fsm -p relay-preflight -p relay-calib \
            -p falcon-core -p relay-mix-quad \
            -p relay-adrc -p relay-geo -p relay-iekf \
            -p relay-batt -p relay-flowrange -p falcon-gnss-ubx -p relay-notch \
            --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        # linux runs on the smithy org pool (resilient to GitHub-hosted runner
        # incidents); macOS/Windows stay GitHub-hosted (no such runners on
        # smithy, by design).
        include:
          - label: linux
            runner: [self-hosted, linux, x64, rust-cpu]
          - label: macos
            runner: macos-latest
          - label: windows
            runner: windows-latest
    # Routes fork PRs to GitHub-hosted runners by default (self-hosted matrix
    # entries only). This is NOT a security boundary: a fork PR can edit this
    # file. Isolation is enforced by the org's smithy runner-group policy and
    # fork-PR approval (pulseengine/warte#35).
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository || !contains(matrix.runner, 'self-hosted')) && matrix.runner || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable (branch head 2026-11-15)
        with:
          toolchain: "1.100.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: cargo test
        run: cargo test --locked --workspace --all-targets

  falcon-hello-smoke:
    name: falcon-hello end-to-end demo
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","rust-cpu"]') || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable (branch head 2026-11-15)
        with:
          toolchain: "1.100.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Run falcon-hello UDP-loopback demo
        # The demo binds a FIXED UDP port pair (default 14700/14701). Several of
        # these jobs can land on the SAME self-hosted runner concurrently — which
        # happens routinely whenever more than one PR is updated at once — and the
        # second one dies with:
        #
        #   error: bind 127.0.0.1:14700: Address already in use (os error 98)
        #
        # Observed 2026-08-08 after four PRs were refreshed together. It presents
        # as a red REQUIRED check on an unrelated PR (#342 changed only a workflow
        # file), so it reads as a real regression and costs a diagnosis cycle —
        # and worse, it trains people to re-run a red gate.
        #
        # The script already honours FALCON_HELLO_PORT_BASE; CI just never set it.
        # Derive a per-run base so two concurrent jobs cannot contend. Stepping by
        # 2 matters: the demo uses base AND base+1, so consecutive bases would
        # still overlap. GITHUB_RUN_ID is injected by Actions as a plain env var,
        # so nothing is interpolated into this run: block.
        run: |
          export FALCON_HELLO_PORT_BASE=$(( 20000 + (GITHUB_RUN_ID % 10000) * 2 ))
          echo "using port pair ${FALCON_HELLO_PORT_BASE}/$((FALCON_HELLO_PORT_BASE + 1))"
          bash scripts/falcon-hello-demo.sh

  # The closed-loop SAFETY suite as a first-class, named gate. These are the
  # top-of-the-V integration tests — the whole verified cascade actually
  # flying/recovering as a system — plus the Monte-Carlo dispersion campaigns
  # (thousands of randomised trials per safety behaviour). They already run
  # inside `cargo test --workspace`, but that buries the most safety-critical
  # tests among hundreds; a dedicated required check makes them visible and
  # keeps them from being silently narrowed out of scope (the recurring
  # orphaned-verification failure mode). `--nocapture` surfaces the campaign
  # worst-case-margin lines in the CI log for trend-watching.
  closed-loop-sim:
    name: Closed-loop simulation + Monte-Carlo campaigns
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","rust-cpu"]') || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable (branch head 2026-11-15)
        with:
          toolchain: "1.100.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Closed-loop safety suite + dispersion campaigns
        run: |
          # falcon-sitl-gz: integration safety tests + the nominal-recovery
          # Monte-Carlo campaigns (motor-out / attitude / hexa).
          cargo test --locked -p falcon-sitl-gz -- --nocapture
          # falcon-plant: the plant itself, and lockstep determinism with its
          # negative controls (SWREQ-FALCON-PLANT-P01, relay#705).
          cargo test --locked -p falcon-plant -- --nocapture
          # falcon-core: the THREE-WAY fail-safe campaigns (runaway→terminate,
          # wind→RTL) that drive the full production FlightSupervisor.
          cargo test --locked -p falcon-core failsafe -- --nocapture

  # #638 finding 6: nothing in CI built wasm/cm/cascade-split, -control or
  # -estimator, or ran `cargo test` in tests/cascade-sitl-wasm (its own
  # [workspace], so the root `cargo test --workspace` never sees it). The
  # mirror_* and follow_target tests ran nowhere, and the split could drift
  # from `cascade` unseen. This job runs both:
  #   1. the crate's plain suite (the native mirror's seam and follow-target
  #      tests);
  #   2. scripts/split-differential.sh, which builds all four components as
  #      deployed (no_std, 8 KiB stack), composes the split with `wac plug`,
  #      and requires the twin to be bit-exact at 400 and 1000 Hz, the seam
  #      lifecycle tests to pass against BOTH components, and each component to
  #      be bit-identical to the native mirror (hold and rotor-out).
  #   3. both components under SITL_CALIBRATION=invalid and none.
  # Not covered here: arena_soak.rs, which needs the leaf components
  # (FALCON_*_WASM) from scripts/build-components.sh.
  cascade-split:
    name: cascade-split twin differential + cascade-sitl-wasm tests
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","rust-cpu"]') || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable (branch head 2026-11-15)
        with:
          toolchain: "1.100.0"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: tests/cascade-sitl-wasm
      - name: Install cargo-component + wac
        uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: cargo-component,wac-cli
      - name: cascade-sitl-wasm plain suite
        working-directory: tests/cascade-sitl-wasm
        run: cargo test --locked --release
      - name: cascade vs cascade-split twin, seam tests on both, both vs the mirror
        env:
          OUT: ${{ runner.temp }}/split
        run: bash scripts/split-differential.sh
      # #638 finding 9: with no valid calibration, both components must refuse
      # `arm` for the whole 10 s deadline, and the published prearm-failing
      # mask must name CalibrationPresent.
      - name: no-calibration runs refuse arm on CalibrationPresent
        env:
          OUT: ${{ runner.temp }}/split
        run: |
          set -euo pipefail
          # The same path split-differential.sh builds the harness to.
          H="${CARGO_TARGET_DIR:-$PWD/tests/cascade-sitl-wasm/target}/release/cascade-sitl-wasm"
          for cal in invalid none; do
            for w in cascade.wasm cascade-split-composed.wasm; do
              echo "== SITL_CALIBRATION=$cal $w"
              SITL_CALIBRATION=$cal "$H" "$OUT/$w"
            done
          done

  # Committed scripts get run on macOS, where /bin/bash is 3.2 and
  # /usr/bin/python3 is 3.9, while every other job here runs newer tools, so
  # nothing caught a script that only works on the newer ones. Both tools are
  # pinned: shellcheck by sha256 into a job-local path (called as
  # "$SHELLCHECK", never by PATH lookup), Python by setup-python's interpreter
  # path. curl, not `gh`: self-hosted runners do not have the GitHub CLI.
  script-portability:
    name: Script portability (shellcheck + Python 3.9 floor)
    # Required check: a fork PR runs it on a hosted runner, like every other
    # job here, or the check never reports (#638 finding 13).
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","light"]') || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # SHELLCHECK_SHA256 is the release asset's `digest` for
      # shellcheck-v0.11.0.linux.x86_64.tar.gz from
      # https://github.com/koalaman/shellcheck/releases/tag/v0.11.0,
      # re-hashed locally on 2026-10-29. .tar.gz, not .tar.xz: no xz needed.
      - name: Install shellcheck (pinned by path and sha256)
        env:
          SHELLCHECK_VERSION: 0.11.0
          SHELLCHECK_SHA256: b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/shellcheck-$SHELLCHECK_VERSION"
          asset="shellcheck-v$SHELLCHECK_VERSION.linux.x86_64.tar.gz"
          rm -rf "$dir" && mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/$asset" \
            "https://github.com/koalaman/shellcheck/releases/download/v$SHELLCHECK_VERSION/$asset"
          echo "$SHELLCHECK_SHA256  $dir/$asset" | sha256sum -c -
          tar xzf "$dir/$asset" -C "$dir" --strip-components=1 "shellcheck-v$SHELLCHECK_VERSION/shellcheck"
          got=$("$dir/shellcheck" --version | sed -n 's/^version: //p')
          if [ "$got" != "$SHELLCHECK_VERSION" ]; then
            echo "::error::pinned shellcheck reports '$got', expected '$SHELLCHECK_VERSION'"
            exit 1
          fi
          echo "SHELLCHECK=$dir/shellcheck" >> "$GITHUB_ENV"

      # Severity warning and up. Info-level findings (SC2086 and friends) are
      # not gated.
      - name: shellcheck tracked shell scripts
        run: |
          set -euo pipefail
          git ls-files -z '*.sh' '*.bash' | xargs -0 -r "$SHELLCHECK" -S warning

      - id: py39
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.9"

      # Under 3.9 the compile step is the real 3.9 parser; the AST pass catches
      # what parses on 3.9 but fails when it runs (unguarded tomllib, `X | None`
      # annotations without `from __future__ import annotations`, ...). The
      # self-test first: a checker only ever seen to pass could not fail.
      - name: Python 3.9 floor
        env:
          PY39: ${{ steps.py39.outputs.python-path }}
        run: |
          set -euo pipefail
          "$PY39" -c 'import sys; assert sys.version_info[:2] == (3, 9), sys.version'
          "$PY39" scripts/check-py-floor.py --self-test
          git ls-files -z '*.py' | xargs -0 -r "$PY39" scripts/check-py-floor.py

  # ---------------------------------------------------------------------
  # jig shadow pilot, phase 1 (relay is pilot 2; same shape as warte#194).
  # Nothing here changes a required context or what runs: `required / verdict`
  # reports without being required, sieve's verdict is only recorded, and
  # enforce-skips is unset. Both jig calls pin the same RECORD commit (jig
  # v0.1.4 record, #16; its defaults self-job=required, baseline-job=baseline
  # match v0.1.3), never a tag commit: a tag commit carries no binary
  # checksum. kani.yml and verus.yml get their own verdicts (required-kani,
  # required-verus) once jig v0.1.4 adds self-job/baseline-job.
  baseline:
    uses: pulseengine/jig/.github/workflows/baseline.yml@0f3d82c1dec9e4d5ce1adee1c4e0bbbd84508849
    with:
      audit: cargo-audit
      bazel: true
      guard-config: plant-guard.toml
      controls-only: "lock-stale toolchain-floating guard-unguarded verdict-sees-failure"

  # sieve's path classifier. Shadow mode: no job reads these outputs yet, so
  # everything still runs; each run's verdict lands in the jig record so the
  # skips sieve would make can be compared with what ran. sieve v0.3.0 by
  # version and sha256 (from its cosign-verified SHA256SUMS.txt, signed by
  # release.yml@refs/tags/v0.4.2, checked 2026-11-22). --record keeps the
  # sieve.classify.v1 verdict as an artifact for `sieve observe`.
  # fetch-depth 0 and no blob filter: scope_leaf_edits must read workflows at
  # base and head, or sieve falls back to run_all.
  classify:
    name: classify
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","light"]') || 'ubuntu-24.04' }}
    timeout-minutes: 10
    env:
      SIEVE_VERSION: v0.4.2
      SIEVE_SHA256: 51ef59f5cf8b542d142c073446d5773147a5806c84be56c5c4e30783e6cd6647
    outputs:
      run_all: ${{ steps.classify.outputs.run_all }}
      rust: ${{ steps.classify.outputs.rust }}
      nested: ${{ steps.classify.outputs.nested }}
      scripts: ${{ steps.classify.outputs.scripts }}
      cascade: ${{ steps.classify.outputs.cascade }}
      mirrors: ${{ steps.classify.outputs.mirrors }}
      bazel: ${{ steps.classify.outputs.bazel }}
      rocq: ${{ steps.classify.outputs.rocq }}
      lean: ${{ steps.classify.outputs.lean }}
      spar: ${{ steps.classify.outputs.spar }}
      verify: ${{ steps.classify.outputs.verify }}
      github: ${{ steps.classify.outputs.github }}
      lockfiles: ${{ steps.classify.outputs.lockfiles }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch pinned sieve
        run: |
          d="$RUNNER_TEMP/sieve"; mkdir -p "$d"; cd "$d"
          a="sieve-$SIEVE_VERSION-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL -o "$a" "https://github.com/pulseengine/sieve/releases/download/$SIEVE_VERSION/$a"
          echo "$SIEVE_SHA256  $a" | sha256sum -c -
          tar -xzf "$a"
          echo "$d" >> "$GITHUB_PATH"
      - id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          EVENT: ${{ github.event_name }}
        run: sieve classify --config sieve.toml --event "$EVENT" --base "$BASE_SHA" --format github-output --explain --record "$RUNNER_TEMP/sieve-verdict.json"
      - name: Keep the sieve verdict
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sieve-verdict-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sieve-verdict.json
          if-no-files-found: error
          retention-days: 90

  # The one context that will replace the list: red on any failure,
  # cancellation, skip of a selected class, or a job missing from needs.
  # Shadow: reported, not required.
  required:
    needs: [baseline, classify, fmt, workflow-lint, engine-mirrors, clippy, test, falcon-hello-smoke, closed-loop-sim, cascade-split, script-portability]
    if: always()
    uses: pulseengine/jig/.github/workflows/required.yml@0f3d82c1dec9e4d5ce1adee1c4e0bbbd84508849
    with:
      needs-json: ${{ toJSON(needs) }}
      never-skip: "fmt workflow-lint engine-mirrors clippy test falcon-hello-smoke closed-loop-sim cascade-split script-portability"
