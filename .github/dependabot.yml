version: 2
# Grouped monthly updates (fleet template, owner decision 2026-11-21; template:
# pulseengine/rivet .github/dependabot.yml). Every entry runs monthly (the 1st,
# 02:00 UTC), keeps at most 2 PRs open, and waits 7 days after a release
# (cooldown). Lockstep groups come first because Dependabot puts a dependency in
# the FIRST group it matches; then one minor-patch group. Majors stay
# ungrouped, one PR each, so a breaking change is read on its own. Security
# updates ignore the schedule and the limit.
#
# Why grouped (2026-10-21): ungrouped, one upstream release arrived as several
# PRs (wit-bindgen 0.62 -> 0.63 came twice, #576 and #578, on the SAME line of
# the root Cargo.toml), and every merge sends every other open PR back through
# a full CI cycle (Kani matrix included) on a shared rust-cpu pool (#514).
#
# cargo and MODULE.bazel.lock: relay builds through Bazel crate_universe and
# CI runs lockfile_mode=error (#720), and Dependabot does not regenerate the
# lock, so a cargo bump that moves it goes red on the verify-only
# `.github/actions/bazel-lock-check` step (Lockfiles workflow). That step
# never pushes: it prints the signed-commit fix and uploads the regenerated
# lock as the `module-bazel-lock` artifact, and someone pushes it onto the PR.
updates:
  # Every dtolnay/rust-toolchain step sets `toolchain:` explicitly (#722,
  # #724), so a move to the master pin (where the input is required) is safe.
  # A grouped action PR must still pass the per-pin check: BOTH the new and the
  # OLD SHA must exist in the action's own repository (commits API exit code,
  # with a negative and a positive control) — release.yml ran a fork-network
  # commit that was not in setup-bazel's history for four months (#583). An
  # action PR that touches release.yml is a signing-path change and gets
  # maintainer review before it merges.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "02:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    labels:
      - dependencies
    groups:
      github-actions-all:
        patterns:
          - "*"
  - package-ecosystem: cargo
    directories:
      - /
      - /crates/relay-ccsds
      - /crates/relay-cfdp
      - /crates/relay-ci
    schedule:
      interval: monthly
      time: "02:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    labels:
      - dependencies
    groups:
      # gz-msgs and gz-transport are version-locked (the Gazebo bridge pins
      # both to the same harmonic release); one PR for the pair, not two
      # (#596 + #597).
      gz-family:
        patterns:
          - "gz-msgs"
          - "gz-transport"
      minor-patch:
        update-types:
          - minor
          - patch
  # fuzz/ stays its own entry: it is its own workspace with ONE direct
  # dependency, libfuzzer-sys. Listed with the directories above it also
  # "updated" wit-bindgen, which it only reaches through path deps inheriting
  # `workspace = true` from the ROOT manifest, so each such PR edited the root
  # Cargo.toml and duplicated the root update (#576 vs #578, then #598 vs #578
  # on 2026-10-22). Allow only what fuzz/ declares.
  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: monthly
      time: "02:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    labels:
      - dependencies
    allow:
      - dependency-name: libfuzzer-sys
