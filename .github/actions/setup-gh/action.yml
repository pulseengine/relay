name: Set up gh (pinned, checksum-verified)
description: >
  Puts a GitHub CLI on PATH for jobs on self-hosted runners that do not ship one.
  The fleet monitor's starvation check ran `gh api ... 2>/dev/null || true` on
  the `light` boxes for months without `gh` installed, so every "no starvation"
  was an empty result (#436). A missing tool must fail loudly, and the tool
  itself must be the one we reviewed.

# Pinned to a release two weeks old at the time of pinning (v2.101.0 was two
# days old). The SHA-256 was checked against the release's own
# gh_2.100.0_checksums.txt AND a local download; a republished asset fails here.
# Bumping: change both values together, from the release's checksums file.
runs:
  using: composite
  steps:
    - name: Install gh
      shell: bash
      env:
        GH_VERSION: '2.100.0'
        GH_SHA256: 'e4d4bb4498e8d007abe545b6568926793ace1b6447da598294a610018cb164be'
      run: |
        set -euo pipefail
        dir="$RUNNER_TEMP/gh-$GH_VERSION"
        if [ ! -x "$dir/bin/gh" ]; then
          tgz="$RUNNER_TEMP/gh-$GH_VERSION.tar.gz"
          curl -sSfL --retry 3 -o "$tgz" \
            "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_amd64.tar.gz"
          echo "${GH_SHA256}  ${tgz}" | sha256sum -c -
          mkdir -p "$dir"
          tar xzf "$tgz" -C "$dir" --strip-components=1
          rm -f "$tgz"
        fi
        echo "$dir/bin" >> "$GITHUB_PATH"
        "$dir/bin/gh" --version | head -1
