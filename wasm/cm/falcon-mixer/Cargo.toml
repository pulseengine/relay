# Standalone (own [workspace]) — cargo-component crates carry a
# generated `bindings` module and don't build under plain `cargo`,
# so they are kept out of the relay cargo workspace and built only
# via `cargo component build`.
[package]
name = "falcon-mixer-cm"
description = "Falcon v0.7 — mixer as a Component Model component (wac cascade)"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/pulseengine/relay"
rust-version = "1.85"

[lib]
crate-type = ["cdylib"]

[dependencies]
relay-mix-quad = { path = "../../../crates/relay-mix-quad" }
wit-bindgen-rt = { version = "0.41.0", features = ["bitflags"] }

[package.metadata.component]
package = "falcon:cascade"

[package.metadata.component.target]
path = "../../../wit/falcon-cascade"
world = "mixer-component"

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
codegen-units = 1

[workspace]

[features]
default = ["bazel-bindings"]
bazel-bindings = []
