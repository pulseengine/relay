# Standalone cargo-component crate — kept out of the relay cargo
# workspace (generated bindings module won't build under plain cargo).
[package]
name = "falcon-rate-cm"
description = "Formally-verified body-rate PID controller as a WebAssembly Component — body-rate setpoint + gyro → body torque. Airframe-agnostic; part of the falcon:cascade control loop."
homepage = "https://pulseengine.eu"
documentation = "https://github.com/pulseengine/relay/blob/main/docs/OCI-DISTRIBUTION.md"
authors = ["PulseEngine"]
keywords = ["flight-control", "verified", "drone", "embedded", "wasm"]
categories = ["aerospace", "science::robotics"]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/pulseengine/relay"
rust-version = "1.85"

[lib]
crate-type = ["cdylib"]

[dependencies]
relay-rate = { path = "../../../crates/relay-rate" }
wit-bindgen-rt = { version = "0.41.0", features = ["bitflags"] }
# no_std (cargo-component path) global allocator — single-threaded wasm.
lol_alloc = "0.4"

[package.metadata.component]
package = "falcon:cascade"

[package.metadata.component.target]
path = "../../../wit/falcon-cascade"
world = "rate-component"

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
codegen-units = 1

[workspace]

[features]
# Two INDEPENDENT concerns — do not conflate them again (see lib.rs):
#   bazel-bindings : where the WIT bindings come from (bazel-generated crate
#                    vs cargo-component's local `mod bindings`)
#   std            : link std, or build no_std (WASI-free, lowerable)
# Bazel sets crate_features explicitly and rules_rust does NOT apply Cargo's
# default-features, so a Bazel build gets bazel-bindings WITHOUT std -> no_std.
default = ["bazel-bindings", "std"]
bazel-bindings = []
std = []
