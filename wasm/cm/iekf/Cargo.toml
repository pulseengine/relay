# Standalone cargo-component crate — kept out of the relay cargo
# workspace (generated bindings module won't build under plain cargo).
[package]
name = "falcon-iekf-cm"
description = "Falcon v1.4 — IEKF (SE₂(3)) as a Component Model component, exporting the falcon:cascade/ekf interface"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/pulseengine/relay"
rust-version = "1.85"

[lib]
crate-type = ["cdylib"]

[dependencies]
relay-iekf = { path = "../../../crates/relay-iekf" }
relay-math = { path = "../../../crates/relay-math" }
wit-bindgen-rt = { version = "0.41.0", features = ["bitflags"] }

[package.metadata.component]
package = "falcon:cascade"

[package.metadata.component.target]
path = "../../../wit/falcon-cascade"
world = "ekf-component"

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
codegen-units = 1

[workspace]
