# Standalone cargo-component crate — kept out of the relay cargo
# workspace (generated bindings module won't build under plain cargo).
[package]
name = "falcon-attitude-cm"
description = "Formally-verified geometric SO(3) attitude controller as a WebAssembly Component — attitude setpoint + vehicle state → body-rate setpoint."
homepage = "https://pulseengine.eu"
documentation = "https://github.com/pulseengine/relay/blob/main/docs/OCI-DISTRIBUTION.md"
authors = ["PulseEngine"]
keywords = ["flight-control", "verified", "drone", "embedded", "wasm"]
categories = ["aerospace", "science::robotics"]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/pulseengine/relay"
rust-version = "1.85"

[lib]
crate-type = ["cdylib"]

[dependencies]
relay-att = { path = "../../../crates/relay-att" }
wit-bindgen-rt = { version = "0.41.0", features = ["bitflags"] }
falcon-cm-rt = { path = "../../../crates/falcon-cm-rt" }

[package.metadata.component]
package = "pulseengine:falcon-cascade"

[package.metadata.component.target]
path = "../../../wit/falcon-cascade"
world = "attitude-component"

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
codegen-units = 1

[workspace]

[features]
std = []
default = ["bazel-bindings", "std"]
bazel-bindings = []
