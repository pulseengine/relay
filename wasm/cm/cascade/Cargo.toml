# Standalone cargo-component crate — the cascade orchestrator.
[package]
name = "falcon-cascade-cm"
description = "Falcon v0.7 — cascade orchestrator (imports 5 controllers, exports step)"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/pulseengine/relay"
rust-version = "1.85"

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen-rt = { version = "0.41.0", features = ["bitflags"] }
falcon-cm-rt = { path = "../../../crates/falcon-cm-rt" }

[package.metadata.component]
package = "pulseengine:falcon-cascade"

[package.metadata.component.target]
path = "../../../wit/falcon-cascade"
world = "cascade"

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
codegen-units = 1

[workspace]

[features]
std = []
default = ["bazel-bindings", "std"]
bazel-bindings = []
