[package]
name = "falcon-flight-component"
description = "Self-contained DEMO component: runs falcon-core's FlightCore against a simulated plant compiled into the component and returns a stabilization metric. It cannot be driven by a host. The drivable flight core is the falcon-cascade component in the falcon-components bundle."
version = "0.1.0"
edition = "2021"
publish = false
# Embedded component metadata — cargo-component bakes these into the wasm
# `package-metadata` section, and wasm.directory renders them (description,
# licenses, source) alongside the WIT. Standalone crate (own [workspace]),
# so it can't inherit the repo root's fields — set them explicitly. This is
# the metadata contract for EVERY published relay component (see
# docs/OCI-DISTRIBUTION.md).
license = "Apache-2.0"
repository = "https://github.com/pulseengine/relay"
homepage = "https://pulseengine.eu"
documentation = "https://github.com/pulseengine/relay/blob/main/docs/OCI-DISTRIBUTION.md"
authors = ["PulseEngine"]
keywords = ["flight-control", "verified", "drone", "embedded", "wasm"]
categories = ["aerospace", "science::robotics"]

[dependencies]
falcon-core = { path = "../../../crates/falcon-core" }
relay-math = { path = "../../../crates/relay-math" }
wit-bindgen-rt = { version = "0.41.0", features = ["bitflags"] }
falcon-cm-rt = { path = "../../../crates/falcon-cm-rt" }

[lib]
crate-type = ["cdylib"]

[package.metadata.component]
package = "pulseengine:falcon-flight"

[package.metadata.component.target]
path = "../../../wit/falcon-flight/flight.wit"
world = "flight-demo"

[profile.release]
opt-level = "s"
lto = true

# standalone (not in the host cargo workspace) — built only by cargo-component
# for wasm32-wasip2, like embedded/falcon-cortex-m.
[workspace]

[features]
default = ["bazel-bindings", "std"]
bazel-bindings = []
std = []
