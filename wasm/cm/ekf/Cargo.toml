# Standalone cargo-component crate — kept out of the relay cargo
# workspace (generated bindings module won't build under plain cargo).
[package]
name = "falcon-ekf-cm"
description = "LEGACY Mahony complementary attitude filter on SO(3) (relay-ekf) as a WebAssembly Component. Despite the name, not an extended Kalman filter, and not the estimator the falcon flight core uses (the invariant EKF, relay-iekf)."
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/pulseengine/relay"
rust-version = "1.85"

[lib]
crate-type = ["cdylib"]

[dependencies]
relay-ekf = { path = "../../../crates/relay-ekf" }
wit-bindgen-rt = { version = "0.41.0", features = ["bitflags"] }
falcon-cm-rt = { path = "../../../crates/falcon-cm-rt" }

[package.metadata.component]
package = "pulseengine:falcon-cascade"

[package.metadata.component.target]
path = "../../../wit/falcon-cascade"
world = "ekf-component"

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
codegen-units = 1

[workspace]

[features]
std = []
default = ["bazel-bindings", "std"]
bazel-bindings = []
