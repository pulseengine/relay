[workspace]
resolver = "3"
members = [
    "crates/relay-primitives",
    "crates/relay-sc",
    "crates/relay-sca",
    "crates/relay-hk",
    "crates/relay-lc",
    "crates/relay-sch",
    "crates/relay-cs",
    "crates/relay-ds",
    "crates/relay-fm",
    "crates/relay-hs",
    "crates/relay-tbl",
    "crates/relay-ci",
    "crates/relay-to",
    "crates/relay-md",
    "crates/relay-mm",
    "crates/relay-ccsds",
    "crates/relay-cfdp",
    "crates/relay-lc-diff",
    "crates/relay-mavlink",
    "crates/relay-nid",
    "crates/relay-ekf-stub",
    "crates/relay-ekf",
    "crates/relay-rate",
    "crates/relay-att",
    "crates/relay-mix-quad",
    "crates/relay-arm",
    "crates/relay-iekf",
    "crates/relay-geo",
    "crates/relay-adrc",
    "crates/relay-traj",
    "crates/relay-pos",
    "crates/relay-fsm",
    "crates/falcon-core",
    "examples/falcon-hello",
    "examples/falcon-ekf-bench",
    "examples/falcon-sitl-hover",
    "examples/falcon-hitl-rfspoof",
    "examples/falcon-sitl-gz",
    "coverage_subjects/geofence_subject_rs",
    "host/falcon-config",
    "host/relay-sb",
    "host/relay-es",
    "host/relay-evs",
    "host/relay-time",
    "host/witness-wasi-harness",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/pulseengine/relay"
rust-version = "1.85.0"

[workspace.dependencies]
wit-bindgen = { version = "0.57.1", default-features = false }
# Pinned below 1.11: proptest 1.11.0 regressed its f32 range sampler
# (float_samplers.rs:466 internal assertion fails on narrow ranges), which
# flakily failed the dt-jitter proptests on Linux CI. Re-allow 1.11+ once fixed.
proptest = ">=1.7, <1.11"

# Workspace-wide lint config. Engines use `#[cfg(kani)]` for the Kani
# model-checker harness paths (they're built only under `cargo kani`,
# which sets the `kani` cfg). Stable rustc sees the cfg as unexpected
# and warns by default — declare it here so all member crates inherit
# the check-cfg whitelist without per-crate boilerplate. Member crates
# pick this up via `[lints] workspace = true` in their own Cargo.toml.
[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

# All guest components are no_std + no alloc.
# Memory comes from Kiln's capability-based allocator (safe_managed_alloc!)
# or from Gale's mem_slab / heap on embedded targets.
#
# Host crates (host/*) may use std for development/testing but must
# have a no_std path for the Synth → Gale embedded pipeline.
