[package]
name = "falcon-sitl-gz"
description = "Falcon v0.16+ — Gazebo SITL: pluggable Physics trait, MockPhysics + GazeboPhysics (real bridge behind `gazebo` feature)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "falcon-sitl-gz"
path = "src/main.rs"

[features]
# Default: stub GazeboPhysics (v0.16.1 contract) — every default build
# stays lean. No gz-transport deps.
default = []
# v0.18: real gz-transport bridge. Pulls in tokio + gz-transport-rs +
# zmq (libzmq compiled from C source via zeromq-src). ~30-60 s extra
# build time; opt-in only. v0.19.2 added `prost` direct dep for the
# locally-defined gz.msgs.Actuators message (not exported by
# gz-transport-rs 0.1.0).
gazebo = ["dep:tokio", "dep:gz-transport-rs", "dep:prost"]

[dependencies]
relay-ekf = { path = "../../crates/relay-ekf" }
relay-rate = { path = "../../crates/relay-rate" }
relay-att = { path = "../../crates/relay-att" }
relay-mix-quad = { path = "../../crates/relay-mix-quad" }
relay-arm = { path = "../../crates/relay-arm" }
relay-iekf = { path = "../../crates/relay-iekf" }
relay-geo = { path = "../../crates/relay-geo" }
relay-adrc = { path = "../../crates/relay-adrc" }
relay-pos = { path = "../../crates/relay-pos" }
relay-lc = { path = "../../crates/relay-lc" }
relay-sc = { path = "../../crates/relay-sc" }
libm = "0.2"

# Optional — only when feature `gazebo` is on.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "macros"], optional = true }
gz-transport-rs = { version = "0.1", optional = true }
# v0.19.2 — local `gz.msgs.Actuators` definition so the bridge can talk
# to Harmonic's MulticopterMotorModel plugin (which subscribes Actuators,
# not the per-rotor Double the v0.18 bridge published).
prost = { version = "0.13", features = ["derive"], optional = true }
