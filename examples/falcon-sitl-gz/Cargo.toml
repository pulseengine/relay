[package]
name = "falcon-sitl-gz"
description = "Falcon v0.16+ — Gazebo SITL: pluggable Physics trait, MockPhysics + GazeboPhysics (real bridge behind `gazebo` feature)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "falcon-sitl-gz"
path = "src/main.rs"

[features]
# Default: stub GazeboPhysics (v0.16.1 contract) — every default build
# stays lean. No gz-transport deps.
default = []
# v1.113: real gz bridge on the C++-backed `gz-transport` crate (links the
# installed gz-transport13 via gz-transport-sys + pkg-config). Replaces the
# pure-Rust `gz-transport-rs` 0.1.0, which discovers but cannot complete the
# subscription handshake with Harmonic (see the gz-transport-rs diagnosis).
# Needs the gz-transport13 dev libs + PKG_CONFIG_PATH incl. the brew pkgconfig
# dir. Opt-in only. gz-msgs supplies the protobuf message types.
gazebo = ["dep:gz-transport", "dep:gz-msgs", "dep:crossbeam-channel"]

[dependencies]
relay-ekf = { path = "../../crates/relay-ekf" }
relay-rate = { path = "../../crates/relay-rate" }
relay-att = { path = "../../crates/relay-att" }
relay-mix-quad = { path = "../../crates/relay-mix-quad" }
relay-arm = { path = "../../crates/relay-arm" }
relay-iekf = { path = "../../crates/relay-iekf" }
relay-geo = { path = "../../crates/relay-geo" }
relay-traj = { path = "../../crates/relay-traj" }
relay-adrc = { path = "../../crates/relay-adrc" }
falcon-config = { path = "../../host/falcon-config" }
relay-pos = { path = "../../crates/relay-pos" }
relay-lc = { path = "../../crates/relay-lc" }
relay-sc = { path = "../../crates/relay-sc" }
# v1.113 — the PRODUCTION flight core, flown through the SITL plant via the
# `FlightBackend`→`Physics` adapter (src/flightcore.rs). The sim now exercises
# the same verified cascade + rotor-out FDI that ships, not a parallel copy.
falcon-core = { path = "../../crates/falcon-core" }
# FAULT-P04 campaign drives the FlightSupervisor (Arm/Takeoff events, Mode).
relay-fsm = { path = "../../crates/relay-fsm" }
libm = "0.2"

# Optional — only when feature `gazebo` is on. C++-backed gz-transport that
# links the installed gz-transport13 (Harmonic); gz-msgs supplies the protobuf
# message types (IMU/NavSat/Actuators/Pose_V/Magnetometer/Odometry).
gz-transport = { version = "0.10", features = ["harmonic"], optional = true }
gz-msgs = { version = "0.10", features = ["harmonic"], optional = true }
crossbeam-channel = { version = "0.5", optional = true }
