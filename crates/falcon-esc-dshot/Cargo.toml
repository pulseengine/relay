[package]
name = "falcon-esc-dshot"
description = "Falcon ESC + battery driver — DShot digital throttle frames (CRC4) from the verified mixer, and a battery voltage/threshold monitor"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
# The async ESC bank (DShotEsc) emits frames through the relay-hal PwmOut sink
# (the v1.81 actuator seam; relay#214 / jess#62) — jess binds FlexIO+eDMA under
# PwmOut. The DShot frame encoding stays the pure verified body in this crate.
relay-hal = { path = "../relay-hal" }

[lints]
workspace = true
