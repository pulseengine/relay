[package]
name = "relay-mavlink"
description = "Relay MAVLink v2 codec — falcon's ground-station interop bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
# Cargo tests use plain/ (verus-stripped). Verus verification uses src/ via Bazel.
path = "plain/src/lib.rs"
crate-type = ["rlib"]

[dependencies]

# no_std + no alloc. All MAVLink parsing happens over caller-provided
# byte buffers; no internal allocation.

[dev-dependencies]
proptest.workspace = true
