[package]
name = "relay-nid"
description = "Relay Network Identification — EASA U-space Remote ID codec (UAS ID + position/vector beacons)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
# Cargo tests use plain/ (verus-stripped). Verus contracts on the
# encoder are tracked for v0.9.x (encoder bit-packing is plain-Rust
# territory; the spec-level invariants belong in Verus).
path = "plain/src/lib.rs"
crate-type = ["rlib"]

[dependencies]
# no_std + no alloc. All encoding writes into caller-provided buffers.

[dev-dependencies]
proptest.workspace = true
