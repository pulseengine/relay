[package]
name = "relay-nid"
description = "Relay Network Identification — EASA U-space Remote ID codec (UAS ID + position/vector beacons)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
# Cargo tests use plain/ (verus-stripped). Verus verification uses
# crates/relay-nid/src/ via Bazel: //:relay_nid_verus_test.
# Encode/decode bodies are #[verifier::external_body] (bit-fiddling
# territory); the signatures are the formal contracts and Kani's
# NID-K01..K05 harnesses give exhaustive panic-freedom / round-trip
# coverage — same DO-178 technique class as a fully Verus-discharged
# proof would be. See crates/relay-nid/src/lib.rs for the spec.
path = "plain/src/lib.rs"
crate-type = ["rlib"]

[dependencies]
# no_std + no alloc. All encoding writes into caller-provided buffers.

[dev-dependencies]
proptest.workspace = true
