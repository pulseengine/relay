[package]
name = "relay-lc"
description = "Relay Limit Checker — stream transformer: sensor readings → limit violations"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
# Cargo tests use plain/ (verus-stripped). Verus verification uses src/ via Bazel.
path = "plain/src/lib.rs"
crate-type = ["rlib"]

[features]
default = []
c-api = []

[dependencies]
wit-bindgen = { workspace = true, default-features = false }
relay-primitives = { path = "../relay-primitives" }

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true

# Two worlds live in wit/ (relay-limit-checker + relay-limit-checker-stream,
# one unified package since the v1.56 fix); cargo-component needs the default
# named explicitly when other workspace components resolve this crate.
[package.metadata.component.target]
path = "wit"
world = "relay-limit-checker"
