[package]
name = "relay-att"
description = "Relay attitude controller — quaternion-error proportional control (v0.4)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
# Cargo tests use plain/ (verus-stripped). Verus verification uses src/ via Bazel.
path = "plain/src/lib.rs"
crate-type = ["rlib"]

[dependencies]
# No transcendentals needed in the small-angle path; no_std + no_alloc.

[dev-dependencies]
proptest.workspace = true
