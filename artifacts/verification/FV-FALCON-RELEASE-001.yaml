artifacts:
  - id: FV-FALCON-RELEASE-001
    type: sw-verification
    title: "Release pipeline standardised on the synth pattern (v0.17.0)"
    status: approved
    description: >
      v0.17.0 standardises the falcon release pipeline on the
      cross-repo PulseEngine pattern (`pulseengine/synth/.github/
      workflows/release.yml` is the reference). Closes the
      cross-repo release-engineering brief that named six tools'
      release pipelines as inconsistent (per-file .sha256 sidecars
      vs SHA256SUMS.txt vs nothing; per-file cosign sigs vs
      single signed manifest; SBOM present/absent; SLSA
      attestation present/absent).

      What changes:

      Gone (from v0.7–v0.16):
        - <archive>.sha256 per-file sidecars
        - <archive>.cosign.sig per-file detached sigs
        - <archive>.cosign.cert per-file Fulcio certs

      Added (per the brief):
        - SHA256SUMS.txt — single checksum manifest covering
          every release asset.
        - SHA256SUMS.txt.sig — cosign detached sig over the
          manifest.
        - SHA256SUMS.txt.pem — Fulcio cert chain.
        - SHA256SUMS.txt.cosign.bundle — verifier-friendly bundle.
        - falcon-X.Y.Z.cdx.json — CycloneDX SBOM (spec 1.5) for
          the falcon-hello crate, generated *before* SHA256SUMS so
          its digest enters the manifest (transitively cosign-
          signed).
        - SLSA v1 build provenance for every .tar.gz / .zip via
          actions/attest-build-provenance@v2. Signed keyless via
          Sigstore, recorded in Rekor. Consumer verifies with
          `gh attestation verify`.
        - build-env.txt — rustc / cargo / cosign / rivet / runner
          versions, captured at release time.

      Unchanged:
        - falcon-vX.Y.Z-<triple>.{tar.gz|zip} — five cross-compiled
          binaries (linux x86_64/aarch64, darwin x86_64/aarch64,
          windows x86_64).
        - rivet-snapshot-falcon-vX.Y.Z.json — falcon-specific audit
          snapshot. Reordered to run BEFORE SHA256SUMS so its
          digest enters the manifest (also transitively
          cosign-signed).

      Workflow shape (8 phases, per the brief):
        1. Build binary archives → release-assets/.
        2. Capture rivet snapshot → release-assets/.
        3. cargo cyclonedx → release-assets/falcon-X.Y.Z.cdx.json.
        4. sha256sum ./* > SHA256SUMS.txt.
        5. actions/attest-build-provenance@v2 over *.tar.gz / *.zip.
        6. sigstore/cosign-installer@v3 (cosign v2.4.1) +
           cosign sign-blob SHA256SUMS.txt with --bundle + --sig +
           --pem.
        7. Write build-env.txt.
        8. gh release upload everything in release-assets/.

      Required permissions (per the brief):
        contents: write
        id-token: write
        attestations: write

      Verification one-liner (in .github/release-notes/v0.17.0.md):
        cosign verify-blob \
          --certificate-identity-regexp \
            'https://github.com/pulseengine/relay/.github/workflows/release.yml@.*' \
          --certificate-oidc-issuer \
            'https://token.actions.githubusercontent.com' \
          --bundle SHA256SUMS.txt.cosign.bundle SHA256SUMS.txt
        sha256sum --check --ignore-missing SHA256SUMS.txt
        gh attestation verify <asset> --repo pulseengine/relay

      Honest dispositions:
        - Historical releases (v0.7 through v0.16.1) keep their
          old per-asset sidecar shape. The historical verification
          recipe stays valid for them; only v0.17.0+ uses the
          standardised shape. This is the intended migration
          boundary.
        - The change is release-engineering only — no feature
          delta from v0.16.1. cargo tests, rivet artifacts, dossier
          crosswalks, verified-engine pipeline all unchanged.
        - The first release to use the new shape is v0.17.0
          itself — the GitHub Release page for this tag is the
          live evidence the pipeline change works end-to-end.
    tags: [release, supply-chain, cosign, sbom, slsa, v0.17.0]
    fields:
      method: release-engineering
      reference: "pulseengine/synth/.github/workflows/release.yml"
      workflow: .github/workflows/release.yml
      release-notes: .github/release-notes/v0.17.0.md
      assets-added: ["SHA256SUMS.txt", "SHA256SUMS.txt.{sig,pem,cosign.bundle}", "falcon-X.Y.Z.cdx.json", "build-env.txt", "SLSA attestations"]
      assets-removed: ["per-file .sha256", "per-file .cosign.sig", "per-file .cosign.cert"]
      steps:
        - run: gh release view falcon-v0.17.0 --json assets
        - run: cosign verify-blob --bundle SHA256SUMS.txt.cosign.bundle SHA256SUMS.txt
        - run: gh attestation verify falcon-v0.17.0-aarch64-apple-darwin.tar.gz --repo pulseengine/relay
    links:
      - type: verifies
        target: SWREQ-FALCON-WORLD-P01
