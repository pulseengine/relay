artifacts:
  - id: FV-FALCON-GNSS-001
    type: sw-verification
    title: "Noisy + intermittent GNSS: variance-matched hold vs over-trust divergence (v1.19.0)"
    status: implemented
    description: >
      Verification of the v1.19.0 GNSS-realism layer (20 falcon-core tests pass,
      clippy clean), realism arc release 4:

      1. holds_under_noisy_intermittent_gps — through the FlightBackend seam,
         with 0.3 m per-axis fix noise + a recurring 0.6 s outage every 3 s, a
         variance-matched filter (pos_var = (0.3 m)² = 0.09) smooths the noise
         and dead-reckons through the outages, holding peak drift < 1.5 m.

      2. variance_matching_helps_and_over_trust_no_longer_diverges (renamed and
         re-measured in v1.140, #452) — at v1.19 the optimistic default variance
         (0.01 = 1 cm²) made this loop DIVERGE (> 10 m, ~2400 m observed), and
         that divergence was this artifact's stated motivation for set_pos_var.
         It was not the variance alone. The estimator also fused the
         accelerometer as gravity every tick, and a multirotor's accelerometer
         reads specific force along the thrust axis, so the tilt estimate was
         pulled level while the vehicle tilted (#434). With the gravity update
         suppressed while flying and aided, the same over-trusting run peaks at
         0.40 m and the matched run at 0.18 m: matching the variance still
         helps by 2.3x, and no longer separates convergence from divergence.
         The honest motivation for set_pos_var is now accuracy, not stability.

      SimBackend gained Pathology.gps_noise (continuous fix noise) and
      gps_dropout_period (recurring intermittent outage, beyond v1.9's single
      window); FlightCore gained set_pos_var. The gz Harmonic realism is
      the gz world generated by worlds/gen-realism-world.py gnss — the navsat sensor's
      position/velocity <noise> (the base world had none; validates with gz sdf).
      STATUS DROPPED to `implemented` in v1.140: claim 2's measurement changed
      with the estimator, so this artifact is re-verified in the code-free
      promotion PR that follows the change (the two-commit rule), not in the
      commit that changed the behaviour.
    tags: [verification, falcon, gnss, sensor-fidelity, realism, v1.19, v1.140]
    fields:
      method: test
      steps:
        - run: "cargo test -p falcon-core"
        - run: "cargo clippy -p falcon-core"
    links:
      - type: verifies
        target: SWREQ-FALCON-GNSS-P01
