artifacts:
  - id: FV-FALCON-MAVLINK-001
    type: unit-verification
    title: "Unit + property tests for relay-mavlink (v0.1)"
    status: approved
    description: >
      Cargo unit + proptest verification of the relay-mavlink v2
      codec. Covers the CRC-16/MCRF4XX algorithm, HEARTBEAT encode
      and decode, frame envelope construction, frame parsing,
      negative cases (truncated, bad magic, bad CRC, bad payload
      length, unsupported message), and arbitrary-input fuzz
      (proptest) showing the parser never panics.

      33 tests in the crate, all green:
        crc::tests::*           (5 tests, including MAVLink reference
                                 vector for CRC-16/MCRF4XX = 0x6F91
                                 on "123456789")
        heartbeat::tests::*     (11 tests + 1 proptest case)
        frame::tests::*         (12 tests + 2 proptest cases)

      Verus SMT verification (which would discharge SWREQ-FALCON-
      MAVLINK-P01..P03 formally) is deferred to v0.2 when the
      no_std/no_alloc verification track is wired up alongside the
      real EKF. v0.1 verification posture: extensive testing without
      formal proof — same overdo-chain layer that the existing cFS
      engines pass today.
    tags: [verification, falcon, mavlink, unit-test, proptest, v0.1]
    fields:
      method: automated-test
      proptest-cases-default: 256
      test-count: 33
      steps:
        # Pass/fail is inferred from exit code. spar's verification
        # gate (modeled on tools/post_verification_comment.py in the
        # spar repo) extracts these and runs them in CI.
        - run: cargo test -p relay-mavlink
        # Release-mode rerun catches optimization-sensitive bugs
        # (UB-via-LLVM, signed-integer-overflow wraparound) that
        # debug builds mask. Same suite, different opt level.
        - run: cargo test -p relay-mavlink --release
        # Elevated proptest case count for an explicit fuzz pass.
        # Production CI bumps this further on nightly runs.
        - run: PROPTEST_CASES=4096 cargo test -p relay-mavlink
    links:
      - type: verifies
        target: SWREQ-FALCON-MAVLINK-P01
      - type: verifies
        target: SWREQ-FALCON-MAVLINK-P02
      - type: verifies
        target: SWREQ-FALCON-MAVLINK-P03
      - type: implements
        target: FEAT-FALCON-v0.1
