artifacts:
  - id: SYSV-RELAY-FALCON-EKF
    type: sys-verification
    title: "SYSREQ-FALCON-001 verification — Mahony EKF evidence (v0.17.x)"
    status: approved
    description: >
      Trace-topology artifact wiring the existing relay-ekf evidence
      to SYSREQ-FALCON-001 (state estimation) at the SYS.5 level.
      Evidence already in the codebase (FV-FALCON-EKF-001 carries
      the detail): cargo unit + proptest cases in crates/relay-ekf
      (16 tests covering EKF-P01..P05 — unit-quaternion preservation,
      no NaN/inf under adversarial accel, innovation monotone with
      tilt disagreement, static-rest gravity alignment, yaw does not
      destabilise tilt), bench tests in examples/falcon-ekf-bench
      (5 cases), end-to-end binary smoke. Refs: FV-FALCON-EKF-001
      (sw-verification with full evidence chain).
    tags: [verification, system, falcon, ekf, trace-topology, v0.17.x]
    fields:
      method: automated-test
      steps:
        - run: cargo test -p relay-ekf
        - run: cargo test -p falcon-ekf-bench
        - run: cargo run -q -p falcon-ekf-bench --release
    links:
      - type: verifies
        target: SYSREQ-FALCON-001

