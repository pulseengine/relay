artifacts:
  - id: FV-FALCON-SIMMC-003
    type: sw-verification
    title: "Estimator-robustness campaign — IEKF under dispersed sensor noise + GNSS dropout (v1.111)"
    status: implemented
    release: falcon-v1.111.0
    description: >
      The first genuinely STOCHASTIC dispersion campaign (the attitude/failsafe
      campaigns are deterministic sweeps; here the noise IS the dispersion).
      examples/falcon-sitl-gz/src/campaign.rs
      estimator_robustness_monte_carlo_campaign drives the REAL relay_iekf::Iekf
      against a static-hover truth across 600 seeded-random trials, each with a
      dispersed noise + GNSS-dropout realisation, asserting the estimate stays
      consistent and reconverges.

      Per trial (Box-Muller Gaussian noise, reproducible from (seed, index)):
        - gyro noise σ ∈ [0.001, 0.02] rad/s, accel σ ∈ [0.02, 0.30] m/s²,
          GNSS σ ∈ [0.10, 1.00] m — the dispersion vector.
        - one GNSS-dropout window (start 5–8 s, duration 1–3 s) during which the
          filter must DEAD-RECKON on the IMU, then RECONVERGE when GNSS returns.
        - propagate(noisy IMU) + update_gravity (tilt aiding) every step;
          update_position (noisy GNSS) at 5 Hz outside the dropout.

      INVARIANTS across all trials (recoverable envelope, rejection-free — the
      envelope is the σ + dropout ranges): tilt error bounded; position error
      bounded during the dropout (dead-reckoning, not divergence) AND reconverges
      below a small bound after GNSS returns; NEES (nees_position — the
      chi-square consistency statistic) stays finite and bounded (no filter
      divergence or overconfident-covariance blow-up); no NaN.

      600 trials, 0 failures. Worst case (measured, seed 0x0FA1_C0DE_E57E_0001):
      tilt error 0.016 rad (~0.9°, gravity aiding holds tight), dead-reckoning
      drift 9.5 m through the dropout, reconverged position error 1.71 m, peak
      NEES 56.9 (a brief consistency spike during the dropout — bounded, not a
      divergence). Regression bounds sit just above these.

      Honest scope: static-hover truth (isolates noise-rejection + dropout
      reconvergence cleanly). A maneuvering truth (constant-velocity / aggressive
      trajectory) + the spoof-monitor path are the next estimator-campaign
      slices. NAMED GATE: runs under the ci.yml "Closed-loop simulation" job
      (cargo test -p falcon-sitl-gz) + the workspace test.
    tags: [verification, falcon, simulation, monte-carlo, estimator, iekf, nees, v1.111]
    fields:
      method: simulation
      test-count: 1
      steps:
        - run: "cargo test -p falcon-sitl-gz estimator_robustness_monte_carlo_campaign  # bench-only (heavy IEKF sim; runs in the closed-loop-sim CI job + workspace test)"
    links:
      - type: verifies
        target: SWREQ-FALCON-IEKF-P01
      - type: verifies
        target: SWREQ-FALCON-EKF-P05
