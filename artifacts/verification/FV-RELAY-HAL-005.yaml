artifacts:
  - id: FV-RELAY-HAL-005
    type: sw-verification
    title: "battery AdcIn re-target + BatteryState inter-core carrier — completes the HAL transport matrix (v1.85)"
    status: implemented
    description: >
      Verifies SWREQ-RELAY-HAL-P05. Unit tests (crates/falcon-esc-dshot):
        - battery_adc_matches_sync_classify: BatteryAdc::read_state over a mock
          AdcIn (count C) equals the sync BatteryMonitor::classify(C); read_voltage
          equals voltage(C). The ADC re-target keeps the verified classify; only
          the transport differs.
        - battery_adc_propagates_error: a failing AdcIn yields Err.
        - battery_state_rides_the_intercore_ring (relay#177): a BatteryState
          pushed to a relay-bus SpscRing pops byte-identical + FIFO.
        - existing sync + Kani tests unchanged.
      ORACLE: `cargo test -p falcon-esc-dshot` green; clippy clean.
    tags: [verification, relay, relay-hal, falcon-esc-dshot, adcin, "v1.85", issue-177]
    fields:
      method: automated-test
      # Test-level evidence: each step names the SPECIFIC test that proves a
      # requirement clause, not a crate-wide `cargo test`. The verification gate
      # runs each named test, so the requirement<->test map is mechanical, not
      # prose. (Test-level-traceability practice — pulseengine.eu#89.)
      steps:
        # clause 1: async AdcIn path == sync BatteryMonitor classify + voltage
        - run: "cargo test -p falcon-esc-dshot battery_adc_matches_sync_classify"
        # clause: the async path is fallible (transport error -> health source)
        - run: "cargo test -p falcon-esc-dshot battery_adc_propagates_error"
        # clause 2 (relay#177): a BatteryState rides the inter-core ring FIFO
        - run: "cargo test -p falcon-esc-dshot battery_state_rides_the_intercore_ring"
    links:
      - type: verifies
        target: SWREQ-RELAY-HAL-P05
