artifacts:
  - id: SYSV-RELAY-CFS-CS
    type: sys-verification
    title: "SYSREQ-CS-001 verification — Checksum Services evidence (v0.17.x)"
    status: approved
    description: >
      Trace-topology artifact wiring the existing relay-cs evidence
      to SYSREQ-CS-001 at the SYS.5 level. Evidence already in the
      codebase: Verus SMT/Z3 contracts CS-P01..CS-P05 discharged
      by //:relay_cs_verus_test; cargo unit tests in
      crates/relay-cs/plain/src/engine.rs::tests (10 tests, CRC
      determinism, mismatch detection, region table bounds).
      Refs: FV-CS-001 (formal), UV-CS-001 (unit tests), FV-CS-P-001
      and SV-RELAY-006 (sw-verification roll-up).
    tags: [verification, system, checksum, cfs, trace-topology, v0.17.x]
    fields:
      method: formal-verification
      steps:
        - run: bazel test //:relay_cs_verus_test
        - run: cargo test -p relay-cs
    links:
      - type: verifies
        target: SYSREQ-CS-001

