artifacts:
  - id: FV-FALCON-FAULT-005
    type: sw-verification
    title: "FAULT-P02 on the REAL plant — a single rotor loss is recovered on the gz falcon-quad, not only in the campaign plant (v1.141)"
    status: implemented
    release: falcon-v1.141.0
    description: >
      DEMOTED verified -> implemented 2026-10-01 (#499). ITS OWN "EVIDENCE
      REQUIRED" SAYS NATIVE **AND** WASM, three times each. The promotion
      shipped the native half only and never relaxed that bar, so this was
      verified against half its own stated criterion while the text still
      demanded both. #398 -- the issue it answers -- was reported against the
      WASM cascade and is still OPEN.

      The wasm half is not merely unrun, it is UNJUDGEABLE today:
      tests/cascade-sitl-wasm has a FAIL_ROTOR knob but NO rotor-out verdict --
      no isolation check, no true tilt, no disarm -- and its `peak_tilt` is
      actually peak |a_xy|. Run as-is it fails on an ALTITUDE-HOLD bar, which is
      the wrong oracle for a three-rotor quad and the exact error this artifact
      corrected for the native leg.

      The native measurement stands and reproduces: the reviewer got 6/6 PASS,
      isolated Some(0), landed and disarmed, peak tilt 0.135-0.233 rad, and the
      revert brings the ring straight back (2.32-2.52 rad/s, one trial never
      isolating, peak tilt 3.142).

      Re-verification of SWREQ-FALCON-FAULT-P02 against the gz plant, opened
      by a regression rather than filed as a new requirement: the property
      already exists and is `implemented`.

      THE REGRESSION (#398). With the v0.10 seam carrying per-rotor RPM, the
      wasm cascade's FDI sees the loss but the vehicle does not recover on
      the gz falcon-quad. Rotor 0 killed at 4.00 s of a 10 s hold at 2 m:
      with ESC telemetry supplied it ends at altitude 0.000 m; withheld
      (NO_RPM=1), 0.008 m. The trajectories differ, so the telemetry reaches
      the FDI; both end on the ground. Meanwhile the motor_out Monte-Carlo
      campaign reports 2000 dispersed trials, 0 failures, on its own plant.
      That gap between campaign and real plant is the one
      relay-rotor-out-parasitic-and-idealized-harness already cost once.

      EVIDENCE REQUIRED FOR `verified`: the same rotor-out scenario on the gz
      plant, native AND wasm, run three times against a PRISTINE server (gz
      rig rule — the world does not reset), judged by CONTROLLED DESCENT:
      the FDI isolates the failed rotor, peak tilt after the loss stays
      bounded, the vehicle touches down and disarms.

      TWO CORRECTIONS to this artifact's own earlier text, both made on
      2026-09-23 before any measurement was accepted:

      (1) IT DEMANDED MORE THAN THE REQUIREMENT DOES. It asked for "holding
      altitude after the loss". SWREQ-FALCON-FAULT-P02's own
      verification-criteria says "an injected rotor loss is isolated and the
      body settles upright (no tumble)", and the requirement text names the
      rank deficiency explicitly (Mueller & D'Andrea: the quad relinquishes
      yaw and cannot hold altitude on three rotors). The campaign code says
      the same. Altitude hold was never the claim; controlled descent is.
      This is a correction toward the requirement, not a relaxation of it —
      and it is recorded here rather than silently applied.

      (2) IT ASKED FOR AN UNRUNNABLE STEP. "the command and its output
      recorded as steps" would put `gz sim` in a `steps:` entry. gz is not on
      the runners; this is the third instance of the rc=127 class, after
      `gh pr view` (#461) and `./target/release/falcon-sitl-gz`
      (FV-FALCON-ENDURANCE-001). The measurement belongs in a cited
      bench-evidence finding; `steps:` assert the code properties that make
      it reproducible.

      MEASURED 2026-09-23 ON main e1d00be — IT DOES NOT HOLD. Twelve
      pristine-server trials: 11 FAIL / 1 PASS (first four tabled below), in
      bench-evidence/gz-sim/2026-09-23-v1.140-rotor-out-on-the-real-plant.md.
      Control first: `--scenario=flightcore` PASSES on the same rig (2 m hold,
      final 0.11 m, horizontal 0.01 m), so the bench can fly and the failure
      is the rotor loss. Then, rotor 0 killed at 10.0 s of 25 s:

        trial   isolated   peak tilt after   peak horiz after   landed/disarmed
        rot1    None       3.142 rad (180°)  9.55 m             no / no
        rot2    Some(0)    0.886 rad (50.8°) 3.94 m             11.148 s / yes
        rot3    Some(0)    0.867 rad (49.7°) 8.38 m             10.972 s / yes
        diag    Some(0)    1.272 rad (72.9°) 5.32 m             11.000 s / yes

      Two failure modes from an unchanged binary on an unchanged world: one
      total inversion with no isolation, and three isolate-and-come-down runs
      whose peak tilt is 50–73° against a 0.5 rad bar. THE SPREAD IS THE
      FINDING — whether the FDI isolates at all flips between runs, and an
      intermittent FDI on a safety property is worse than a consistently
      failing one, because a campaign that samples it a few times can report
      success. (rot1's 9.55 m is inside the 10.0 m horizontal bar, so that
      threshold is not carrying weight and is not validated by these runs.)

      SCOPE: THIS IS THE NATIVE HALF ONLY. `--scenario=supervised-rotorout`
      drives the native FlightSupervisor, and the gz branch applies tuning
      (set_pos_var / set_process_floor / set_altitude_gains /
      set_altitude_integral_gain) that the component does not receive —
      main.rs says outright that "the wasm cascade flies this same FlightCore
      with NONE of this tuning". #398 was reported against the WASM cascade,
      so this is adjacent to that report, not a reproduction of it. The wasm
      leg is tests/cascade-sitl-wasm (gazebo.yml), not this binary.

      CORRECTED TALLY. The four rows above were the first four trials. Tracing
      the cause took eight more, and ONE OF THEM PASSED (T2: isolated Some(0),
      peak tilt 0.338 rad). Twelve pristine-server trials, same binary, same
      world: 11 FAIL / 1 PASS, with three total inversions. The property is
      INTERMITTENT, not uniformly broken — so a campaign that samples it a few
      times can report success. That hazard is now demonstrated, not argued.

      ROOT CAUSE — FOUND (FDI_TRACE, added to the scenario in this change).
      The detector only runs while `fdi_steady = tilt_cos > 0.90 && rp_rate2 <
      4.0` (about 26° tilt, 2 rad/s roll+pitch). Traced over the 25 ticks
      BEFORE the kill — a healthy, passing hover — rp_rate2 oscillates
      3.596..4.521, straddling the 4.0 threshold: the vehicle hovers at
      1.90-2.12 rad/s roll/pitch against a 2.0 rad/s gate, and THE GATE IS
      SHUT 33.8% OF PRE-KILL TICKS (corrected 2026-09-23 by clean-room review --
      see CORRECTION below). Whether a loss is
      detectable at all is therefore decided by the limit-cycle phase at the
      instant of failure. The code's own comment records the gate being raised
      1 -> 2 rad/s because the gz plant limit-cycled "near 1 rad/s"; the limit
      cycle is now ~2 rad/s and that margin is consumed.

      THE PREDICTION HELD 5 OF 5. Gate state on the kill tick vs outcome:
      G2 OPEN -> isolated in ONE tick; G3 shut -> never isolated, 3.142 rad;
      G4/G5/G6 OPEN -> isolated. It is one-way: once the vehicle departs,
      tilt_cos falls and rp_rate2 stays high, so a gate shut at the kill NEVER
      reopens (G2: closes at +0.024 s, tilt_cos walks 0.99 -> 0.68 over 0.4 s).

      TWO DEFECTS, NOT ONE. (1) Detection is a coin flip — but NOT a defect in
      the residual logic: with the gate open the residual is unambiguous
      ([1.000 0 0 0]) and isolation takes one tick. (2) Even with immediate
      isolation the recovery is weak — G2/G4/G5/G6 all isolated within a tick
      and still peaked at 1.01-1.46 rad (58-84°) against FAULT-003's
      analytic-plant claim of 0.274 rad worst case. Perfect detection alone
      would NOT make this property hold.

      THE FIX IS NOT THE GATE. Raising the threshold again would make the runs
      pass without making the vehicle safer — the vacuous-gate shape this
      release train keeps finding. The limit cycle is the defect -- and it is NOT
      a hover: independent reproduction measured mode=Takeoff at the kill
      (1.49 m against a 2.0 m target, still climbing). It is a saturated climb
      that never reaches hover: ~2 rad/s (115°/s) roll/pitch ringing during a hover the position
      loop reports as good (0.11 m). The position hold MASKS a ringing
      attitude loop. Worth checking against the wobble the bench engineer
      reported from the Wireshark capture, which had the same character.

      THIS FALSIFIES FV-FALCON-FAULT-003 (which was `verified`; demoted to
      `implemented` in this same change). That artifact's
      own falsification reads: "wrong if a single-rotor-out from a settled
      hover is observed to exceed ~45° tilt ... on the analytic plant (this
      oracle) OR THE GZ PLANT". All four trials exceed 45° (49.7, 50.8, 72.9,
      180). It named the gz plant itself. Sharper still: FAULT-003 says the
      defect it fixed was a flip "to ~180° (reproduced on the real gz plant)"
      — which is rot1. Either that fix did not hold on gz or something since
      regressed it. NOT claimed: that FAULT-003's own analytic oracle is
      wrong (worst peak tilt 0.274 rad over 200 full-loop trials); it was not
      re-run. The gap is oracle-vs-gz — the same gap FAULT-003 was written to
      close. FV-FALCON-SIMMC-005 (1500 trials, worst 1.20 rad against a 1.4
      bound) is also `verified` on a non-gz plant; its looser bound is not
      directly breached here but it should be re-read in this light.
      A `verified` artifact whose kill-criterion has been met is a MAINTAINER
      decision (demote, or judge the gz clause over-reach) — not something
      this pass resolves silently.

      MOVED v1.140 -> v1.141 on 2026-09-23 (maintainer scope decision, and
      logged here rather than applied silently). This CANNOT be verified while
      #270 stands: the FDI gate is shut ~34% of pre-kill ticks because
      the rate loop limit-cycles once it is actually loaded, so rotor-loss
      detectability is decided by limit-cycle phase at the instant of failure.
      The ring's PRIMARY cause is not yet identified — anti-windup was
      hypothesised, tested and FALSIFIED (its gate-shut gain was raw-signal
      derived and is withdrawn) but
      the cycle survives at 1.91 rad/s against a 0.1 bar.

      v1.140's own theme — the hold — is done and measured. Holding a finished
      release hostage to an open control investigation is the scope-management
      error, not the fix. Rotor-out is a hold property under a fault, so it
      belongs with the rate-loop work in v1.141, and v1.142's SHOWCASE-P01
      (engine drop) depends on it.

      ======================================================================
      VERIFIED 2026-09-25. IT NOW HOLDS, AND THE CAUSE WAS ONE NUMBER.

      Everything above is the record of it FAILING. What changed is not the
      rotor-out logic: `gyro_lpf` and the harmonic `notch` are filter DESIGNS
      built from the loop rate the caller declares, and
      `FlightSupervisor::new` hardcoded `FlightCore::new(0.5, 1000.0)` while
      the gz bench steps it at 250 Hz. A 60 Hz low-pass then had its real
      corner at a quarter of the intended frequency. `run_flightcore` passed
      `1.0 / dt` and was correct — which is the entire reason one path rang
      and the other did not, on the same plant and commit. See
      SWREQ-FALCON-RATE-P05; the fix (`resync_loop_rate`) takes the rate from
      the backend's own `dt()` rather than trusting the caller.

      EVIDENCE — 3 pristine-server gz trials (the rig rule), the tightened
      #474 verdict, rotor 0 killed at 10.0 s of 25 s:

        trial   isolated   peak tilt after   peak horiz after   landed/disarmed
        P1      Some(0)    0.220 rad         0.99 m             13.400 s / yes
        P2      Some(0)    0.212 rad         0.95 m             11.200 s / yes
        P3      Some(0)    0.176 rad         0.82 m             11.236 s / yes

      PASS 3/3, against FAIL 11/12 with three 180° inversions before. Peak
      tilt is now 0.176-0.220 rad against the 0.5 rad bar — a 2.3x margin,
      not a near miss. Control on the same rig: `--scenario=flightcore`
      PASSES at final_dist 0.12 m, horizontal 0.01 m, unchanged by the fix.

      STILL THE NATIVE HALF ONLY. `--scenario=supervised-rotorout` drives the
      native FlightSupervisor. #398 was reported against the WASM cascade, and
      the component receives none of the bench's tuning. This artifact does
      NOT close the wasm half; that needs tests/cascade-sitl-wasm.

      NOT CLAIMED: the real airframe. This is the gz plant.

      WHY THE STEPS BELOW DO NOT RUN GZ: gz is not on the runners (the rc=127
      class, twice recorded). The steps assert the code properties that make
      the measurement reproducible plus the mock-plant test that CI can run;
      the gz numbers live in the cited bench-evidence finding. Note the
      NEGATIVE assertion — a step that only checks presence cannot catch a
      regression that re-introduces a hardcoded rate.
      ======================================================================

      ======================================================================
      THE WASM HALF, MEASURED 2026-10-01 -- AND THIS ARTIFACT IS STILL NOT
      PROMOTED. Read the clause-by-clause reckoning below before anyone
      promotes it; the missing piece is structural, not a gap in the running.

      This closes the gap #499 demoted it for. That demotion said the promotion
      "shipped the native half only" while the EVIDENCE REQUIRED clause demands
      "native AND wasm", and that the wasm leg was "not merely unrun, it is
      UNJUDGEABLE today". Both are now addressed: the harness has a verdict
      (#502, merged), and the measurement is below.

      BUT THE CRITERION HAS FOUR CLAUSES AND THE WASM LEG MEETS THREE:

        clause                          native      wasm
        FDI isolates the failed rotor   yes 3/3     yes 3/3 (rotor 0, 2 ticks)
        peak tilt stays bounded         yes 3/3     yes 3/3 (0.184-0.381 rad)
        the vehicle touches down        yes 3/3     yes 3/3 (1.42-2.00 s)
        ...AND DISARMS                  yes 3/3     IMPOSSIBLE

      The fourth is not unmeasured, it CANNOT EXIST in this component: the
      published cascade wraps FlightCore, not FlightSupervisor, so there is no
      mode machine and no disarm latch to observe (#414, open). No amount of
      running the wasm leg will satisfy that clause.

      SO THIS STAYS `implemented`, and promoting it is A SCOPE DECISION FOR THE
      MAINTAINER: either narrow the disarm clause to the native leg (defensible
      -- disarm is a FlightSupervisor property and the wasm component is a
      FlightCore binding), or hold the artifact until #414 puts a mode and a
      failsafe in the published state. Promoting it on three of four clauses
      would be the SAME ERROR #499 caught, one level finer: verified against
      part of its own stated criterion while the text still demands all of it.
      Recorded rather than resolved here, deliberately.

      The wasm leg was not merely unmeasured, it was UNJUDGEABLE. Its
      `peak_tilt` was `sqrt(ax^2 + ay^2)` -- lateral specific force, not tilt
      -- and nothing could ask the component WHICH rotor it had isolated. The
      @0.11.0 observer export (TRANSPORT-P01) is what makes the verdict exist:
      `failed-rotor` is read through the published Component Model ABI.

      MEASURED on gz falcon-quad, rotor 0 killed at 10.0 s of 25 s at 250 Hz,
      three PRISTINE servers (the rig rule -- the world does not reset), in
      bench-evidence/gz-sim/2026-10-01-v1.141-wasm-rotor-out-through-the-seam.md:

        trial  isolated   latency        touchdown  peak tilt   peak horiz
        G1     Some(0)    2 tk (10 ms)   1.43 s     0.184 rad   0.94 m
        G2     Some(0)    2 tk (10 ms)   1.42 s     0.196 rad   1.01 m
        G3     Some(0)    2 tk (10 ms)   2.00 s     0.381 rad   1.01 m

      PASS 3/3, against the native leg's 0.95-1.00 m and 0.197-0.213 rad. The
      seqlock held alongside: 6250 read-state calls, coherent every tick,
      valid mask 0x7f.

      THE WEAKEST PART OF THIS RESULT, STATED RATHER THAN SMOOTHED: the
      horizontal excursions match native to within 0.06 m, but THE TILT DOES
      NOT. G3's 0.381 rad is 76% of the 0.5 rad bar -- a 1.3x margin where
      native has 2.3x -- and the wasm spread (0.184 -> 0.381) is wider than
      native's (0.197 -> 0.213). Three trials per side is too few to call that
      either way. The component receives none of the bench's gz tuning beyond
      the `configure` seam, which is the obvious candidate and is NOT tested
      here.

      IT CAN FAIL, demonstrated on the same plant, not argued. `NO_RPM=1`
      withholds ESC telemetry and leaves the FDI inert: 0/6250 ticks carried
      RPM, isolated=None, and the airframe INVERTED to 3.142 rad (180 deg),
      never touching down. Two independent bars fire. That reproduces
      deliberately the inversion this property first failed with (rot1 above).

      THREE HARNESS DEFECTS found getting here, all the same shape -- something
      measured nothing while reporting cleanly:

      (1) THE HARNESS HAD NO FLOOR. The native scenario calls
      set_ground_contact(true) ("This scenario LANDS, so the plant needs a
      floor to land on", examples/falcon-sitl-gz/src/main.rs:1484); this one
      never did, so on mock the airframe sank 1.01 m THROUGH the ground plane
      and kept flying -- the defect the mock plant's own ground comment already
      records ("ended 359 m below its launch point while the verdict called it
      landed"). Now enabled, GATED on FAIL_ROTOR to match native: the clamp
      feeds the specific-force derivation (#485), so enabling it
      unconditionally would move the nominal hold this harness is the CI oracle
      for. Re-verified unchanged at 1.96 m.

      (2) THE JUDGED WINDOW ENDS AT TOUCHDOWN. Nothing terminates this flight
      -- the component wraps FlightCore, so there is no failsafe to disarm
      (#414) -- so peak_horiz over a whole run measures the TICK BUDGET, not
      the control law. It read 24.91 m on mock, of which 21.65 m accumulated
      AFTER the vehicle reached the ground: the floor clamps only p_ned[2] and
      v_ned[2], so a still-powered airframe slides on a frictionless plane
      (velocity 1.41 -> 2.58 m/s over 8 s at a constant 0.029 rad tilt).
      Touchdown is defined by the PHYSICS rather than chosen, and it is what
      the native leg measured (loss 10.000 s -> landing 11.264 s); the rule and
      its reason were written into the harness BEFORE the number it produces
      was looked at. The full-run figure is still printed and labelled, as the
      measure of the missing failsafe. An EMPTY WINDOW now FAILS rather than
      meeting every bar vacuously at 0.0.

      (3) gz-trial.rs's KEEP allowlist swallowed the whole verdict:
      `line.contains(k)` is case-sensitive, so the existing lowercase "rotor"
      does not match "ROTOR-OUT". Third trace this allowlist has eaten, after
      FDI_TRACE and RING_TRACE. A dropped verdict reads as a quiet pass.

      STILL NOT CLAIMED: the real airframe (this is gz); wasm/native
      EQUIVALENCE (the tilt margins differ, see above); any tuning explanation
      for that difference; a failsafe (#414 -- which is exactly why the window
      must be bounded by the physics); and the mock plant's numbers as
      comparable (mock touches down 5.02 s after the loss against gz's
      1.42-2.00 s; different plant, different number).

      WHY THE WASM STEPS DO NOT RUN gz: gz is not on the runners (the rc=127
      class). The steps assert the harness properties that make the measurement
      reproducible and that the verdict CANNOT be met vacuously; the numbers
      live in the cited finding. The negative step was validated by PLANTING
      the defect it looks for (judging the full-run figure) and confirming it
      fires -- a step that has never failed is not evidence.
    tags: [verification, falcon, fault, rotor-out, gazebo, wasm, v1.141]
    fields:
      method: simulation
      steps:
        # THE PRIMARY ORACLE IS THE TEST BELOW, not the greps.
        # Independent review (#499) reverted `resync_loop_rate` to an early
        # `return` -- the tree where the cycle measures 2.4 rad/s and rotor-out
        # fails -- and EVERY grep step here still passed rc=0, because the
        # grepped tokens are all still present. Demonstrated side by side:
        #   mutation applied -> this test FAILS ("got 1000 Hz")
        #   mutation applied -> all three greps STILL PASS
        # The greps are kept as cheap structural assertions; they are NOT the
        # evidence, and this artifact no longer claims they can catch a
        # regression.
        - run: "cargo test -p falcon-core the_filters_follow_the_backend_rate_not_the_declared_one"
        # The fix: the loop rate comes from the backend, not the caller.
        - run: "grep -q 'fn resync_loop_rate' crates/falcon-core/plain/src/lib.rs"
        - run: "grep -q 'self.resync_loop_rate(dt);' crates/falcon-core/plain/src/lib.rs"
        # ...and it carries the state that makes the resync possible. NOTE the
        # hardcoded `FlightCore::new(0.5, 1000.0)` in `FlightSupervisor::new`
        # is STILL THERE and this artifact does not claim otherwise: the
        # constructor cannot know the rate (no backend yet), so the resync
        # corrects it on the first tick instead. I wrote a step asserting the
        # constant was gone, ran it, and it failed — recorded rather than
        # quietly dropped, because a step nobody executes is not evidence.
        - run: "grep -q 'designed_hz' crates/falcon-core/plain/src/lib.rs"
        # The verdict still judges controlled descent, with the #474 bars.
        - run: "grep -q 'peak_tilt_after < 0.5' examples/falcon-sitl-gz/src/main.rs"
        - run: "grep -q 'isolated == Some(0)' examples/falcon-sitl-gz/src/main.rs"
        # The scenario exists, and the rotor-out chain passes on a plant CI has.
        - run: "grep -q 'supervised-rotorout' examples/falcon-sitl-gz/src/main.rs"
        - run: "cargo test -p falcon-core survives_single_rotor_failure_without_flipping"
        - run: "cargo test -p falcon-core fdi_isolates_dead_rotor_and_reconfigures"
        # ── THE WASM HALF (tests/cascade-sitl-wasm) ──────────────────────
        # Isolation is read through the PUBLISHED observer export, which is the
        # only reason this leg has a verdict at all.
        - run: "grep -q 'st.failed_rotor != 0xFF' tests/cascade-sitl-wasm/src/main.rs"
        # The plant has a floor, gated on the fault exactly as native gates it.
        - run: "grep -q 'plant.set_ground_contact(true)' tests/cascade-sitl-wasm/src/main.rs"
        - run: "grep -q 'if fail_rotor.is_some() {' tests/cascade-sitl-wasm/src/main.rs"
        # The judged window is bounded by touchdown, and says so in its output.
        - run: "grep -q 'touchdown_tick = Some(tick);' tests/cascade-sitl-wasm/src/main.rs"
        - run: "grep -q 'the judged window ends here' tests/cascade-sitl-wasm/src/main.rs"
        # An empty window FAILS rather than meeting every bar at 0.0.
        - run: "grep -q 'airborne_ticks < 25' tests/cascade-sitl-wasm/src/main.rs"
        # The bar is on the JUDGED excursion...
        - run: "grep -q 'peak_horiz_after >= 10.0' tests/cascade-sitl-wasm/src/main.rs"
        # ...and NEGATIVE: never on the full-run figure, which past touchdown
        # measures a frictionless slide. Validated by planting
        # `peak_horiz_full >= 10.0` and confirming this step fires.
        - run: "! grep -qE 'peak_horiz_full *>=' tests/cascade-sitl-wasm/src/main.rs"
        # The trial runner no longer drops the verdict it is meant to carry.
        - run: "grep -qF '\"ROTOR-OUT\"' scripts/gz-trial.rs"
    links:
      - type: verifies
        target: SWREQ-FALCON-FAULT-P02
