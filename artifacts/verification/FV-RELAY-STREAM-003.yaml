artifacts:
  - id: FV-RELAY-STREAM-003
    type: sw-verification
    title: "relay-hk P3 async stream component — runs the verified engine, builds as Component-Model P3 (v1.64)"
    status: implemented
    description: >
      Verifies SWREQ-RELAY-STREAM-P03 for the Housekeeping combiner — the third
      relay engine promoted to a real WASM Component-Model Preview 3 (P3) async
      stream transformer, following the established template (FV-RELAY-STREAM-001
      / 002).

      Evidence:
      1. The WIT (crates/relay-hk/wit/housekeeping_stream.wit) declares genuine
         P3 stream types: `monitor: func(batches: stream<source-batch>) ->
         stream<hk-packet>`.
      2. The implementation (crates/relay-hk/src/wasm_stream_component.rs) is a
         real async stream transformer: `async fn monitor(mut batches:
         StreamReader<SourceBatch>) -> StreamReader<HkPacket>` with
         `wit_stream::new()`, `while let Some(batch) = batches.next().await`, and
         `writer.write(...).await`.
      3. RUNS THE VERIFIED ENGINE: `use relay_hk::engine;` and //:relay-hk-stream
         `deps` on relay-hk-engine (crate_name relay_hk over the verified plain/
         tree), so the streaming monitor() invokes the ACTUAL Verus-verified
         CopyTable::collect (HK-P02 no-overflow, HK-P04 entry-count bounded) — no
         inline copy.
      4. The mechanical ORACLE: the //:relay-hk-stream bazel target
         (wasi_version = "p3") builds it as a P3 component, EXERCISED in CI
         (.github/workflows/bazel.yml builds it alongside //:relay-lc-stream and
         //:relay-sch-stream), so "valid P3 async component running the verified
         engine" is CI-validated, not asserted.

      Honest scope (same as STREAM-001/002): verifies AUTHORED + BUILDS as P3
      async running the verified engine; does NOT verify end-to-end execution on
      kiln's async scheduler (shipped but dormant).
    tags: [verification, relay, relay-hk, stream, async, p3, component-model, "v1.64"]
    fields:
      method: automated-test
      steps:
        - run: bazel build //:relay-hk-stream
    links:
      - type: verifies
        target: SWREQ-RELAY-STREAM-P03
