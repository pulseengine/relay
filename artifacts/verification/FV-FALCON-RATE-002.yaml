artifacts:
  - id: FV-FALCON-RATE-002
    type: sw-verification
    title: "RATE-P05 — the inner rate loop tracks under load on the gz plant, once the filters are designed for the rate they run at (v1.141)"
    status: implemented
    release: falcon-v1.142.0
    description: >
      Verifies SWREQ-FALCON-RATE-P05 on the gz falcon-quad.

      THE MEASUREMENT. `--backend=gazebo --scenario=supervised-rotorout
      --duration=25`, three trials each against a PRISTINE server (the gz rig
      rule — the world does not reset), evaluated over the UNFAULTED hover
      window t in [5,10) s (the rotor is killed at 10.0 s), 1250 ticks each.
      RATE-P05's own bars are roll/pitch RMS < 0.1 rad/s, no motor within 2% of
      a limit, and the FDI steady gate open for at least 95% of ticks:

        trial   rp RMS      motor min   motor max   gate open
        V1      0.00174     0.5813      0.5860      100.0%
        V2      0.00174     0.5813      0.5860      100.0%
        V3      0.00180     0.5810      0.5863      100.0%

      PASS 3/3. The RMS margin is 57x, the motors sit in a 0.005-wide band
      nowhere near either limit, and the gate never closes once.

      WHAT IT MEASURES, AND WHY THAT MATTERS. `rp_rate2` and `gate_open` here
      are read from `FlightCore::fdi_diag()` — the quantities the FDI gate
      ACTUALLY tests, which are the LOW-PASS FILTERED gyro (`gyro_f`), not the
      raw one. An earlier round of this measurement computed the gate-shut
      fraction from the RAW gyro and reported 96.8% where the true figure was
      33.8%; the clean-room reviewer caught it by arithmetic before any re-run
      (a gate shut 96.8% of the time that never reopens cannot produce 9
      isolations in 12 trials). RING_TRACE now emits the gate's own values so
      that class of error cannot recur.

      WHAT CHANGED, AND IT WAS ONE NUMBER. `gyro_lpf` and the harmonic `notch`
      are filter DESIGNS: their coefficients come from a sample rate, and
      `CascadePartition::new` took that rate from what the CALLER declared.
      `FlightSupervisor::new` hardcoded `FlightCore::new(0.5, 1000.0)` while
      the gz bench steps it at 250 Hz, so a 60 Hz low-pass had its real corner
      at a quarter of the intended frequency, with all the phase lag that
      implies. `run_flightcore` passed `1.0 / dt` and was correct — which is
      the entire reason one path rang and the other did not, on the same plant
      and the same commit. Before/after, same window:

        declared 1000 Hz, stepped at 250      declared 250, stepped at 250
          roll/pitch RMS  2.47 rad/s            0.0017 rad/s
          motors          0.12 <-> 1.0000       0.5810 - 0.5863
          gate open       66%                   100.0%

      `resync_loop_rate` takes the rate from the backend's own `dt()` and
      rebuilds both filters on a >2% mismatch. It is deliberately NOT a setter:
      a setter is forgettable in exactly the way the hardcoded constructor
      already was, and six shipped entry points hardcode their rate the same
      way.

      IT CAN FAIL, AND IT DID. This is not a bar chosen to be met. The same
      scenario under the same verdict measured 11 FAIL / 1 PASS across twelve
      trials before the fix, with three 180-degree inversions
      (bench-evidence/gz-sim/2026-09-23-v1.140-rotor-out-on-the-real-plant.md).
      Reverting `resync_loop_rate` restores a 2.47 rad/s RMS and a gate shut a
      third of the time.

      NOT CLAIMED. (1) The real airframe — this is the gz plant. (2) The wasm
      cascade: the component receives none of the bench's tuning, and
      `supervised-rotorout` drives the native FlightSupervisor. (3) That the
      two anti-windup defects explored alongside were the cause. they were real
      defects ON INSPECTION but are NOT MERGED (stranded on branch
      phase0/rate-loop-antiwindup; verified absent from main 2026-10-01 --
      last_torque_scale, set_delivered_fraction, u_delivered_frac and the
      ground-hold adrc.reset() are all absent). Their measured benefit
      (2.47 -> 2.02 -> 1.91 rad/s) is ALSO VOID: it was measured on the
      MIS-DESIGNED filter, a regime that no longer exists. They must be
      re-measured against the fixed baseline before any claim is made. An
      earlier version of this text said "are fixed"; that was wrong and is
      corrected here rather than quietly dropped. And the ESO was
      never the problem; the filter in front of it was.

      WHY THE STEPS DO NOT RUN GZ: gz is not on the runners (the rc=127 class,
      recorded twice). The steps assert the code properties that make this
      measurement reproducible plus the loop tests CI can run; the gz numbers
      live in the cited finding. The NEGATIVE assertion matters — a step that
      only checks presence cannot catch a regression that re-hardcodes a rate.
      ======================================================================
      DEMOTED verified -> implemented (2026-10-08, #529), by maintainer
      decision. This artifact cites a mechanism that is not in the code it
      verifies.

      Its description names `last_torque_scale`, `set_delivered_fraction` and
      `u_delivered_frac`. `git grep` over `origin/main -- 'crates/**'
      'examples/**'` returns NOTHING for all three; they live only on
      `phase0/rate-loop-antiwindup`, unmerged since 2026-09-23.

      ITS OWN STEPS ALL PASS, which is exactly why this went unnoticed. They
      grep `fn resync_loop_rate`, `self.gyro_lpf = GyroLpf::new(60.0, actual)`,
      `"RING "` in scripts/gz-trial.rs and others — every one of which is
      genuinely on main. The steps verify real things; they simply do not cover
      the mechanism the description leads with. An artifact can be
      simultaneously step-green and describing absent code, and this is the
      specimen.

      NO FAILING STEP WAS ADDED HERE, deliberately and per the same decision.
      Adding `grep -q 'u_delivered_frac'` now would redden a required check
      until the branch lands, which is a forcing function the maintainer
      explicitly did not choose. The step gets added WITH the code, as the
      precondition for re-promotion.

      ======================================================================
      RE-SCOPED falcon-v1.141.0 -> falcon-v1.142.0 (2026-10-08, maintainer
      decision). THIS ARTIFACT FOLLOWS ITS FIX.

      It was demoted verified -> implemented on 2026-10-08 (#529) because it
      describes `last_torque_scale`, `set_delivered_fraction` and
      `u_delivered_frac`, none of which exist in any code on main - they live
      only on `phase0/rate-loop-antiwindup`, 8 commits, no PR, unmerged since
      2026-09-23.

      THAT FIX IS SCOPED TO v1.142, by the same decision that scoped #270's
      rate-loop remedy there. So leaving this artifact in v1.141 made that
      release structurally unable to reach all-verified: its scope contained
      two artifacts whose mechanism ships in a LATER release. A readiness query
      is supposed to answer "can we cut this?", and it cannot do that while the
      answer is "no, for a reason the plan does not record".

      Surfaced by `rivet query '(and (= release "falcon-v1.141.0")
      (!= status "verified"))'` rather than noticed, and moved deliberately:
      the release-planning rule is that deferring scope is a decision to be
      logged, not a silent drift.

      RE-PROMOTION BAR IS UNCHANGED AND HIGHER THAN BEFORE: the symbols present
      in shipped code AND a `steps:` entry greping them, so the same
      prose-only-citation drift cannot recur. See also the symbol-grep clause
      added to SWREQ-RELAY-BOARD-P01 (#534).

      ======================================================================
      THE SYMBOLS ARE ON MAIN AS OF 2026-10-13 (#556), AND THE PASSAGES ABOVE
      SAYING THEY ARE NOT ARE NOW FALSE. Read this before trusting them:

        git grep -n 'u_delivered_frac|set_delivered_fraction|last_torque_scale' \
          origin/main -- 'crates/**'
        # relay-adrc, relay-mix-quad and falcon-core all match.

      #556 ported them from `phase0/rate-loop-antiwindup`. It did so under the
      title "the ring is anti-windup, not tuning", WHICH THIS ARTIFACT ALREADY
      REFUTES: the root cause is #488's `resync_loop_rate` (filters designed for
      1 kHz, stepped at 250 Hz; reverting it restores 2.47 rad/s), and "the ESO
      was never the problem; the filter in front of it was".

      SO THIS CHANGES EXACTLY ONE THING AND NOT THE CLAIM. The re-promotion bar
      named above has two halves -- the symbols present in shipped code AND a
      `steps:` entry greping them. The first half is now met, incidentally
      rather than deliberately. The steps are added here, which is what this
      artifact said to do when the code landed ("the step gets added WITH the
      code, as the precondition for re-promotion") and which closes the half of
      #529 that actually matters: the citation stops being prose-only, so the
      gate can see this drift in EITHER direction from now on.

      WHAT IS STILL NOT MET, and why this stays `implemented`: the measured
      benefit remains VOID. 2.47 -> 2.02 -> 1.91 rad/s was measured on the
      MIS-DESIGNED filter, a regime that no longer exists, and nothing has
      re-measured it against the fixed baseline. A gz run on 2026-10-13
      (dispatch 38454332223) read 0.0015 rad/s pre-kill with the mechanism
      present, against 0.00174 recorded without it -- evidence of NO REGRESSION,
      and of no benefit either. Maintainer decision 2026-10-13: keep the code,
      re-measure against the fixed baseline, correct the record. This is the
      record half; the measurement half is still owed.


      ---- EVIDENCE SCOPE (review of v1.140 defect A, PR #644) ----
      The frame-jitter fix (filter design rate on the median of the last 16
      frame periods, re-designed keeping state; near-Nyquist band rebuilt
      with zeroed state as before) is evidenced against main (725f146) by
      ONE grid harness, zg_grid.rs (8604 cells: loop rate 10-10000 Hz x rotor
      vibration 0 / 0.1 / 0.25 / 0.3 switched on after Loiter x pre-arm plain
      / 3 rad/s bump / 0.5 rad/s rotation x dt fixed / strict alternation /
      balanced random two-level, +-12.5 %; supervised takeoff, 20 s). At 250
      Hz and above it is NO WORSE than main in every cell (0 worse). Below
      250 Hz under rotor vibration >= 0.25 the outcome is chaotic on main
      itself (main against main with the pre-arm hold one tick longer flips
      601 cells) and is NOT EVIDENCED either way. Below 250 Hz at lower vibration, against main with the same dt pattern: vibration 0 is no worse in every cell; vibration 0.1 has 7 mode-worse and 36 tilt-worse cells (+0.01 to +0.025 rad, mostly 100-120 Hz jittered dt; mode flips Loiter->Land/Disarmed at 191.5-200 Hz random dt and 70 Hz alternation), against a +1-tick noise floor of 17 mode-worse and 17 tilt-worse - comparable, not demonstrated to be noise. Per cell, the branch is not no-worse than main's FIXED-dt cells below 250 Hz (881 worse), but main's own jittered cells fail that comparison more often (1412), so it measures dt jitter rather than this change. At 140-200 Hz with rotor
      vibration >= 0.25, jittered dt now behaves like main's FIXED dt
      (failures of 363 at vib 0.25 / 0.3: alternation 38 / 99, random 84 /
      107; main fixed dt 38 / 97; main jittered 0-2), where main's per-frame
      zeroed rebuild happened to fly jittered dt better.
      The harness, its runner and the analysis scripts live in the
      falcon-v1.142 issue for this scope.
      ---- END EVIDENCE SCOPE ----
    tags: [verification, falcon, rate-loop, adrc, limit-cycle, gazebo, v1.141]
    fields:
      method: simulation
      steps:
        # THE PRIMARY ORACLE IS THE TEST BELOW, not the greps.
        # Independent review (#499) reverted `resync_loop_rate` to an early
        # `return` -- the tree where the cycle measures 2.4 rad/s and rotor-out
        # fails -- and EVERY grep step here still passed rc=0, because the
        # grepped tokens are all still present. Demonstrated side by side:
        #   mutation applied -> this test FAILS ("got 1000 Hz")
        #   mutation applied -> all three greps STILL PASS
        # The greps are kept as cheap structural assertions; they are NOT the
        # evidence, and this artifact no longer claims they can catch a
        # regression.
        - run: "cargo test -p falcon-core the_filters_follow_the_backend_rate_not_the_declared_one"
        # The fix: the loop rate comes from the backend, not the caller.
        - run: "grep -q 'fn resync_loop_rate' crates/falcon-core/plain/src/lib.rs"
        - run: "grep -q 'self.resync_loop_rate(dt);' crates/falcon-core/plain/src/lib.rs"
        - run: "grep -q 'designed_hz' crates/falcon-core/plain/src/lib.rs"
        # Both rate-dependent filters are re-designed, not just one. Since the
        # review of v1.140 (defect A) they are re-designed in
        # `redesign_filters` on the median of the last 16 frame periods,
        # keeping their state, instead of rebuilt in `resync_loop_rate`.
        - run: "grep -q 'self.gyro_lpf.retune(60.0, rate);' crates/falcon-core/plain/src/lib.rs"
        - run: "grep -q 'self.notch.set_sample_rate(rate);' crates/falcon-core/plain/src/lib.rs"
        # The instrument reports the gate's OWN filtered quantity, not raw gyro.
        - run: "grep -q 'sup.core().fdi_diag()' examples/falcon-sitl-gz/src/main.rs"
        # ...and gz-trial does not silently swallow it (it did, for FDI_TRACE).
        - run: "grep -qF '\"RING \"' scripts/gz-trial.rs"
        # Loop behaviour CI can actually run.
        - run: "cargo test -p falcon-core hold_converges_with_5hz_position_aiding"
        - run: "cargo test -p falcon-core an_overestimated_hover_thrust_does_not_reenable_the_inflight_gravity_update"
        - run: "cargo test -p falcon-core adrc_absorbs_motor_lag"
        # THE SYMBOL-GREP HALF OF THE RE-PROMOTION BAR (#529, #534). The
        # description names these three; a prose-only citation is exactly how
        # this artifact stayed step-green while describing absent code. These
        # make the drift visible to the gate in either direction.
        - run: "grep -q 'u_delivered_frac' crates/relay-adrc/plain/src/lib.rs"
        - run: "grep -q 'fn set_delivered_fraction' crates/relay-adrc/plain/src/lib.rs"
        - run: "grep -q 'fn last_torque_scale' crates/relay-mix-quad/plain/src/lib.rs"
        - run: "grep -q 'self.adrc.set_delivered_fraction' crates/falcon-core/plain/src/lib.rs"
    links:
      - type: verifies
        target: SWREQ-FALCON-RATE-P05
