artifacts:
  - id: FV-RELAY-FLEET-002
    type: sw-verification
    title: "FLEET-P01 — starvation is measured from JOBS, and hosted contention is not reported as a dead fleet (v1.140)"
    status: implemented
    release: falcon-v1.140.0
    description: >
      DEMOTED verified -> implemented 2026-10-01 by independent review (#497).
      ITS EVIDENCE CANNOT FAIL. All four steps are string greps. The reviewer
      inverted the starvation comparison in a scratch copy
      (`[ "$age" -lt "$limit" ]` -> `-ge` in fleet-status.yml), so the alarm can
      never fire for a genuinely old job -- and ALL FOUR STEPS STILL EXITED 0.

      Worse, it never ran at all: tagged `relay` but not `falcon`, while the
      verification gate's default filter is `(has-tag "falcon")`. 397 artifacts
      matched; this was not among them. So even the vacuous greps were never
      executed by CI.

      And the stub-`gh` replay the whole argument rests on IS NOT COMMITTED.
      `HOSTED_THRESHOLD_MIN` appears only in the workflow and in this artifact's
      own prose -- there is no harness anyone else can run.

      Re-promotion needs a COMMITTED replay harness that fails when the
      comparison is inverted, plus the `falcon` tag so a gate runs it. The
      underlying fix (measure queued JOBS, hold hosted runners to their own
      threshold) is not disputed -- only the claim that it is verified.

      Extends FV-RELAY-FLEET-001. The wedge half of the monitor was right the
      one time it fired (#450). The starvation half was wrong three times out
      of three (#447, #455, #462), because it measured RUN status: a matrix run
      stays `queued` while its legs are served one after another, so #462's CI
      run was reported "queued 54 min" when its first job had started four
      seconds after creation.

      THE RULE NOW. A run is starving only if a JOB has been queued past its
      threshold AND nothing else in that run has started since. Hosted runners
      get their own threshold (120 min against 30), because org-shared hosted
      concurrency was measured at 60–120 min on 2026-09-16: a hosted job
      waiting an hour is contention, not a dead fleet, and the two need
      different operator actions — "wait" versus "go restart a box". The alarm
      now names the runner labels and says which kind it is.

      REPLAYED AGAINST ALL THREE ALARMS, with a stub `gh` feeding the shapes
      they had, under the flags GitHub uses for `shell: bash`
      (`--noprofile --norc -eo pipefail`):
        - #462's CI run (a leg queued 54 min, another leg started 4 s in) —
          NOT flagged.
        - #462's Gazebo run (hosted, genuinely waiting 67 min) — NOT flagged;
          it is under the hosted threshold and is contention.
        - a self-hosted Kani leg queued 45 min with nothing in its run started —
          FLAGGED, with its labels and the reason.
      The block also runs clean against the live API (exit 0, `api_ok=true`).

      A BUG THAT EXECUTION FOUND. The first draft emitted an empty field for a
      job with no `started_at`. Tab is an IFS **whitespace** character, so
      consecutive tabs collapse and every later field shifted by one: the
      timestamp being parsed was a job NAME, `age` came out −1, and every case
      was silently skipped — the check would have reported a healthy fleet
      always. The absent marker is `-` now. Reading the block would not have
      shown this; running it did.

      NOT CLAIMED: detection latency. The schedule still runs every few hours
      rather than on its cron (#436), so an unattended starvation is found late
      whatever this rule says.
      ======================================================================
      THE INSUFFICIENCY IS CLOSED (2026-10-09), and it was PROVEN before it was
      fixed. An independent clean-room review inverted the starvation
      comparison at .github/workflows/fleet-status.yml:142 -

          [ "$age" -lt "$limit" ] && continue        ->  -ge

      which makes the loop `continue` on exactly the jobs that are TOO OLD, so
      the alarm can NEVER fire. All four of this artifact's steps still exited
      0. Its own cause, in its own words: every step greps for a path, a
      variable name or a prose string, and none mentions an operator.

      scripts/fleet-replay.rs now replays the detector against five fixtures.
      It extracts the REAL step body AND its env from the workflow and stubs
      ONLY the two `gh api` calls, so what runs is the workflow's own code. The
      thresholds are READ from the step's `env:` and then ASSERTED to be 30 and
      120 - hardcoding them would let a threshold change silently re-interpret
      every fixture, and reading without asserting would let it quietly make
      them meaningless, since "60 minutes is too old" only means anything
      relative to a 30-minute limit.

      BOTH DIRECTIONS ARE ASSERTED, deliberately. "Old job => alarm" alone would
      still pass if the comparison were replaced by `true`; "young job => no
      alarm" alone would pass if it were `false`. The five cases are: 60 min
      self-hosted with nothing started (must alarm), 5 min self-hosted (must
      not), 60 min hosted under the 120 limit (must not - hosted contention is
      not fleet death, #514), 180 min hosted (must), and 60 min self-hosted with
      something started 2 min ago (must not - the #449 fix that stopped three
      false alarms, #447/#455/#462).

      MEASURED AGAINST THE SAME INVERSION, side by side:

        the four grep steps     4 pass, 0 fail      blind
        scripts/fleet-replay.rs 4 of 5 FAIL, exit 1 caught

      The workflow was restored byte-identical afterwards (sha256 match, empty
      git diff).

      TWO STALE BLOCKERS IN THE TEXT ABOVE, corrected rather than left. The same
      review found that this artifact's stated re-promotion blockers had moved
      without its text being updated: its tags now include `falcon`, and gate
      run 37849855680 matched 207 artifacts INCLUDING this one with all four
      steps PASS - so "tagged relay but not falcon ... this was not among them"
      is no longer true. The blocker that DID stand was the missing harness,
      and that is what this change adds.

      STATUS STAYS `implemented`. Promotion is a separate code-free PR
      (two-commit rule), and it should cite the side-by-side measurement above
      rather than the fact that the steps pass - which is the distinction this
      artifact exists to make.

    tags: [verification, relay, falcon, ci, fleet, starvation, v1.140]
    fields:
      method: automated-test
      steps:
        # Jobs, not run status; both thresholds; the absent marker.
        - run: "grep -q 'actions/runs/${id}/jobs' .github/workflows/fleet-status.yml"
        - run: "grep -q 'HOSTED_THRESHOLD_MIN' .github/workflows/fleet-status.yml"
        - run: "grep -q 'started_at // \\\"-\\\"' .github/workflows/fleet-status.yml"
        - run: "grep -q 'nothing in its run has started since' .github/workflows/fleet-status.yml"
        # THE STEP THAT CLOSES THIS ARTIFACT'S OWN DEFECT. The four greps above
        # assert that the detector's INGREDIENTS are present; none of them can
        # notice the comparison between them being wrong. An independent
        # clean-room review proved it: inverting
        #   [ "$age" -lt "$limit" ] && continue   (fleet-status.yml:142)
        # to `-ge` makes the loop `continue` on exactly the jobs that are TOO
        # OLD, so the alarm can never fire — and all four greps still exited 0.
        #
        # scripts/fleet-replay.rs extracts the REAL step body and its env from
        # fleet-status.yml, stubs ONLY the two `gh api` calls, and runs it
        # against five fixtures with known job ages. It does not re-implement
        # the comparison — re-implementing it would test the harness's copy
        # rather than the workflow's, which is how a harness comes to agree with
        # itself forever.
        #
        # MEASURED, same inversion, side by side:
        #   the four greps  4 pass, 0 fail   (blind)
        #   this harness    4 of 5 cases FAIL, exit 1
        # The workflow was restored byte-identical afterwards (sha256 match).
        #
        # It runs in the gate because verification-gate.yml already installs
        # rust-script (:218). That was CHECKED, not assumed: an `actionlint`
        # step added to another artifact the same day failed in the gate with
        # rc=127 because that runner has no actionlint. A step invoking a TOOL
        # is runner-dependent until shown otherwise.
        - run: "./scripts/fleet-replay.rs"
    links:
      - type: verifies
        target: SWREQ-RELAY-FLEET-P01
