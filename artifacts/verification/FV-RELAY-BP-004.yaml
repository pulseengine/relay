artifacts:
  - id: FV-RELAY-BP-004
    type: sw-verification
    title: "relay-bp strict primary-CRC and Bundle Age rules — encoder refusal, RFC 9173 strict verdicts, Kani (BP-P04)"
    status: implemented
    description: >
      Verifies SWREQ-RELAY-BP-P04. `encode` runs the decoder's own bundle
      validation in Mode::Strict before writing a byte, so it refuses a primary
      CRC type 0 unless a BIB lists block 0 among its targets (RFC 9171 4.3.1)
      and refuses creation time 0 without exactly one Bundle Age block (4.4.2).
      There is no non-strict encoder.

      Strict-mode vector verdicts (table in vectors.rs): RFC 9173 A.1.4 and
      A.2.4 are classified as violating (PrimaryCrcMissing; both also lack the
      Bundle Age block their creation time 0 needs, shown separately), as are
      A.1.1.3, A.3.1.4 and A.4.5 (A.4's BIB is encrypted by its BCB, so no
      target 0 can be read). A.3.5 is DISPUTED (errata) and recorded as
      disputed, not as a conformance vector: this crate observes it as passing
      the strict rules (its BIB targets [0, 2] and it carries one Bundle Age
      block), and the test pins that observation without claiming it.

      Kani BP-K07: for symbolic primary CRC type (0/1/2), flags (1-byte head,
      fragment bit free), creation time 0 or non-zero, 0..=2 Bundle Age blocks
      and a BIB on block 0 present or absent, encode's gate passes EXACTLY when
      both rules hold and the bundle is not a fragment, and otherwise encode
      returns Invalid; cover! shows both outcomes are reached. It is checked
      through encode itself with an empty output buffer (BufferTooSmall is only
      reachable after the gate passes, since nothing is written before it); a
      version emitting into a 64 B buffer did not finish in 1200 s locally. That
      the emitted bytes pass the strict decoder is shown by the unit tests and
      proptests::canonical_round_trip, not by K07.
    tags: [verification, falcon, relay-bp, dtn, codec, encoder, kani, issue-626]
    fields:
      method: formal-verification
      steps:
        - run: "cargo test -p relay-bp vectors::rfc9173_vectors_strict_verdicts"
        - run: "cargo test -p relay-bp vectors::rfc9173_a1_a2_strict_reject"
        - run: "cargo test -p relay-bp vectors::rfc9173_a3_recorded_as_disputed"
        - run: "cargo test -p relay-bp encode::tests::encoder_refuses_primary_crc_none_without_bib"
        - run: "cargo test -p relay-bp encode::tests::encoder_accepts_primary_crc_none_with_bib_targeting_primary"
        - run: "cargo test -p relay-bp encode::tests::encoder_refuses_creation_time_zero_without_age_block"
        - run: "cargo test -p relay-bp encode::tests::encoder_refuses_structurally_invalid_bundle"
        - run: "cargo test -p relay-bp decode::tests::strict_rejects_missing_primary_crc"
        - run: "cargo test -p relay-bp decode::tests::strict_rejects_creation_time_zero_without_age"
        # Kani BP-K07, gated by the kani.yml matrix (relay-bp entry).
        - run: "cargo kani -p relay-bp --harness verify_encoder_never_violates_strict"
    links:
      - type: verifies
        target: SWREQ-RELAY-BP-P04
