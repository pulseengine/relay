    fields:
      method: formal-verification
      steps:
        # Cross-checked against BUILD.bazel by the gate
        # (enforced-by-verus-gate); EXECUTED by verus.yml.
        # The old citation //:verus_relay_ccsds never existed (#364).
        - run: "bazel test //:relay_ccsds_verus_test"
    links:
      - type: verifies
        target: SWDD-CCSDS-001
