artifacts:
  - id: FV-RELAY-EVIDENCE-001
    type: sw-verification
    title: "EVIDENCE — no verified/accepted artifact rests on evidence that does not run or does not resolve (#415, v1.139)"
    status: verified
    release: falcon-v1.139.0
    description: >
      Verification of SWREQ-RELAY-EVIDENCE-P01.

      THE ORACLE. scripts/check-evidence.rs reads the verification gate's own
      --dry-run labels over all 302 verification artifacts (one source of truth
      for "does this step run"), reads statuses from the YAML, and fails on any
      verified/accepted artifact with (a) no step executed by the gate, the Kani
      gate, or lean.yml/rocq.yml, or (b) a citation that does not resolve: a
      missing path or cargo package, a `cargo test` filter matching no fn or
      mod, an unset variable, a `/path/to/` or `<name>` placeholder, a bare
      `.wasm` with no path, a lone `cd`, or `--backend=gazebo` without
      `--features gazebo` unless the step says it intends the stub. The Verus
      gate is not counted as evidence while verus.yml fails (#405). Exit 2 =
      could not evaluate.

      FIRST RUN, 2026-09-17: 15 verified artifacts flagged; review found
      false positives in the checker itself (generics read as placeholders;
      module-name test filters), fixed rather than waived. True findings: 6.
      Three were repaired (OCI-002/OCI-004 real build paths; SIM-003's stub run
      is intended and now says so). Three had evidence nothing could run and,
      by maintainer decision, were demoted to `implemented` with a restore
      criterion each: FV-FALCON-OCI-001, FV-FALCON-COV-004, FV-FALCON-COV-005 —
      and SWREQ-FALCON-OCI-P01 with them, whose only verifier was OCI-001.
      After: exit 0.
      A HOLE THIS ARTIFACT HAD, closed 2026-09-18. "Resolves to something that
      exists" was checked against the TREE, not against the machine the gate
      runs on. A step could exist, resolve and run on a laptop and still be
      unrunnable where it is checked. It happened here: FV-RELAY-REVIEW-139's
      first draft cited `gh pr view` as its evidence and the gate failed it
      with rc=127 — gh is not installed on the self-hosted fleet (#153/#436).
      The gate caught it, the checker did not. `check-evidence.rs` now refuses
      a step that invokes `gh`, with a test for it and for the substring case
      (`flight_gh_guard` must not trip). Three existing artifacts cite gh
      (FV-FALCON-RELEASE-001, FV-RELAY-SUPPLY-002) and are reported; none is
      `verified`, so none was resting on it.

    tags: [verification, relay, traceability, evidence, v1.139]
    fields:
      method: automated-test
      steps:
        # The rules, including #415's cases and the fixed false positives.
        - run: "rust-script --test scripts/check-evidence.rs"
        # The whole tree: no verified artifact on unresolvable evidence.
        - run: "./scripts/check-evidence.rs"
    links:
      - type: verifies
        target: SWREQ-RELAY-EVIDENCE-P01
