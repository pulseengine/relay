artifacts:
  - id: FV-RELAY-BP-002
    type: sw-verification
    title: "relay-bp conformance accept/reject — RFC 9173 Appendix A vector table + per-shape unit tests (BP-P02)"
    status: verified
    description: >
      Verifies SWREQ-RELAY-BP-P02. Accept side: the six RFC 9173 Appendix A
      bundles (A.1.1.3, A.1.4, A.2.4, A.3.1.4, A.3.5, A.4.5; hex transcribed
      from the RFC text with the section cited in vectors.rs, never generated by
      this crate) decode structurally with their expected block counts, and the
      A.1/A.3 fields match the RFC's diagnostic notation. Inner indefinite
      arrays are accepted up to MAX_INNER_INDEF_DEPTH (2) and rejected beyond.

      Reject side, one named test per listed shape: non-shortest arguments (CBOR
      layer and inside a block), indefinite byte strings in block data, more
      than one payload block, more than one Bundle Age block, payload not last,
      primary item count outside 8..11 or inconsistent with its CRC type; plus
      outer definite array, trailing bytes, missing payload, duplicate or zero
      block numbers, payload number not 1, version not 7, invalid CRC type or
      length, canonical item count, duplicate hop count, bad Bundle Age data.

      RFC 9171 publishes no hex example bundle; RFC 9173 Appendix A is the
      RFC-sourced corpus. Wireshark bpv7 captures (download-in-CI) are not wired
      yet.
    tags: [verification, falcon, relay-bp, dtn, codec, conformance, issue-626]
    fields:
      method: automated-test
      steps:
        - run: "cargo test -p relay-bp vectors::rfc9173_vectors_structural_verdicts"
        - run: "cargo test -p relay-bp decode::tests::rfc9173_a1_original_decodes_fields"
        - run: "cargo test -p relay-bp decode::tests::rfc9173_a3_original_carries_bundle_age"
        - run: "cargo test -p relay-bp cbor::tests::rejects_non_shortest_uint_each_width"
        - run: "cargo test -p relay-bp cbor::tests::accepts_shortest_form_boundaries"
        - run: "cargo test -p relay-bp cbor::tests::rejects_reserved_additional_info"
        - run: "cargo test -p relay-bp cbor::tests::rejects_indefinite_strings"
        - run: "cargo test -p relay-bp decode::tests::rejects_non_shortest_form_in_block"
        - run: "cargo test -p relay-bp decode::tests::rejects_indefinite_byte_string_in_block_data"
        - run: "cargo test -p relay-bp decode::tests::rejects_more_than_one_payload_block"
        - run: "cargo test -p relay-bp decode::tests::rejects_more_than_one_bundle_age_block"
        - run: "cargo test -p relay-bp decode::tests::rejects_payload_not_last"
        - run: "cargo test -p relay-bp decode::tests::rejects_primary_item_count_out_of_range"
        - run: "cargo test -p relay-bp decode::tests::rejects_primary_item_count_crc_mismatch"
        - run: "cargo test -p relay-bp decode::tests::accepts_inner_indefinite_arrays_within_depth"
        - run: "cargo test -p relay-bp decode::tests::rejects_inner_indefinite_arrays_beyond_depth"
        - run: "cargo test -p relay-bp decode::tests::rejects_outer_definite_array"
        - run: "cargo test -p relay-bp decode::tests::rejects_trailing_bytes"
        - run: "cargo test -p relay-bp decode::tests::rejects_missing_payload"
        - run: "cargo test -p relay-bp decode::tests::rejects_duplicate_block_number"
        - run: "cargo test -p relay-bp decode::tests::rejects_block_number_zero"
        - run: "cargo test -p relay-bp decode::tests::rejects_payload_block_number_not_one"
        - run: "cargo test -p relay-bp decode::tests::rejects_unsupported_version"
        - run: "cargo test -p relay-bp decode::tests::rejects_invalid_crc_type"
        - run: "cargo test -p relay-bp decode::tests::rejects_wrong_crc_length"
        - run: "cargo test -p relay-bp decode::tests::rejects_block_item_count"
        - run: "cargo test -p relay-bp decode::tests::rejects_duplicate_hop_count_block"
        - run: "cargo test -p relay-bp decode::tests::rejects_invalid_bundle_age_data"
    links:
      - type: verifies
        target: SWREQ-RELAY-BP-P02
