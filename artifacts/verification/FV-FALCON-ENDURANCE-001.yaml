artifacts:
  - id: FV-FALCON-ENDURANCE-001
    type: sw-verification
    title: "ENDURANCE-P01 — a 12 h hold on a plant that can tilt, and a nightly job that measures it (v1.140)"
    status: verified
    release: falcon-v1.140.0
    description: >
      Verifies SWREQ-FALCON-ENDURANCE-P01. `implemented`, not `verified`: the
      two-commit rule puts promotion in the code-free PR that follows, and the
      nightly job has not yet run with the noise this artifact relies on.

      THE MEASUREMENT (mock plant, gyro sigma 0.01 rad/s, 250 Hz loop, 5 Hz
      aiding), horizontal peak / horizontal final / altitude error. The 12 h
      row is the nightly tier's rung; this artifact's own step runs the 1 h
      one, so a per-PR gate does not spend seven minutes of wall clock:

        120 s   0.24 / 0.11 / 0.01 m
        1 h     0.37 / 0.13 / 0.01 m
        12 h    0.46 / 0.16 / 0.01 m

      IT CAN FAIL, and it used to be unable to. Every one of those rows was
      0.000 m horizontal before #435, at every noise level and aiding rate
      tried, because `MockPhysics` applied no torque: the vehicle could not
      tilt, so it could not be pushed off station or corrected back. Two
      changes were needed, and the first alone was not enough — with torque but
      no disturbance the excursion is still exactly 0.000 m, because the run
      starts level at the setpoint on a symmetric plant.

      AND IT CATCHES WHAT IT HID. The same torque-capable, disturbed plant run
      against the pre-#452 estimator diverges: 1746 m horizontal at 120 s and
      124 km at 1 h, with the altitude estimate at 5e22 m — the fault the gz
      plant shows as a 40 s ceiling (#403/#434).

      THE GUARDRAIL MEASURES THE SAME THING. `soak.yml`'s analytic tier now
      runs with `IMU_NOISE: '0.01'`. Without it the nightly job would keep
      reporting a 12 h PASS at 0.000 m horizontal while this requirement claims
      a measured hold — the gate passing vacuously. Caught in review of #456.

      NOT CLAIMED: that the analytic tier says anything about the real plant.
      It models no aerodynamics, no latency and no aiding pathology beyond the
      divisor; gz is the tier that can satisfy a flight claim, and its ladder
      is FV-FALCON-HOLD-001.

      ITS SOAK STEPS CANNOT DETECT A SOAK THAT DOES NOT RUN (found 2026-10-01).
      All three of this artifact's soak assertions are CONTENT GREPS:

        grep -q 'backend=mock --scenario=flightcore' .github/workflows/soak.yml
        grep -q '43200' .github/workflows/soak.yml
        grep -q "IMU_NOISE: '0.01'" .github/workflows/soak.yml

      For about 7.5 hours that day soak.yml was INVALID TO ACTIONS and the
      nightly could not start at all — #498 put an empty `${{ }}` inside a `run:`
      block (in a shell comment, which Actions expands anyway), so GitHub emitted
      runs with ZERO JOBS and conclusion `failure`. Every grep above passed the
      whole time, because the strings were still in the file. The requirement this
      verifies says the hold shall be "watched nightly"; its evidence checks what
      the watch SAYS, never that the watch RUNS.

      Fixed at the gate rather than here: ci.yml now carries a
      `Workflow lint (actionlint)` job that reads the workflow the way Actions
      does (#507). A step asserting validity belongs on this artifact too, and is
      deliberately NOT added in the same change that introduces the gate — that is
      the independence the two-commit rule exists for. Status unchanged.

      The outage does NOT falsify this artifact's measurements: the nightlies it
      cites ran before #498 landed, and the dark window was one day. What it
      falsifies is the idea that these steps WATCH anything.
    tags: [verification, falcon, endurance, soak, sensor-fidelity, v1.140]
    fields:
      method: simulation
      steps:
        # A ONE-HOUR hold at the sigma the table is measured at, built by the
        # step itself. The first draft ran ./target/release/falcon-sitl-gz and
        # failed the gate with rc=127: that binary exists on the machine that
        # built it, not in a clean checkout — the same machine-dependence as a
        # `gh` step. The 12 h rung is the NIGHTLY job's (pinned below), because
        # 7 minutes of wall clock does not belong in a per-PR gate.
        - run: "IMU_NOISE=0.01 cargo run --release -q -p falcon-sitl-gz -- --backend=mock --scenario=flightcore --duration=3600"
        # The nightly tier runs the 12 h rung, and with the noise (#435).
        - run: "grep -q 'backend=mock --scenario=flightcore' .github/workflows/soak.yml"
        - run: "grep -q '43200' .github/workflows/soak.yml"
        # The plant applies the verified mixer's torque, and the knob exists.
        - run: "grep -q 'relay_mix_quad::motors_to_torque_signs(achieved)' examples/falcon-sitl-gz/src/physics.rs"
        - run: "grep -q 'IMU_NOISE' examples/falcon-sitl-gz/src/main.rs"
        # The nightly job runs the tier with that noise, not at 0.0.
        - run: "grep -q \"IMU_NOISE: '0.01'\" .github/workflows/soak.yml"
        # ── THE CLAUSES #497 DEMOTED THE REQUIREMENT FOR ────────────────────
        # Everything above exercises the ANALYTIC tier. None of it touches the
        # gz hour, the ratchet, or the wasm leg — exactly the three clauses the
        # demotion named. Added 2026-10-07 with the promotion, because
        # promoting against steps that cover one tier is how a requirement gets
        # "verified on half of itself" (the error #499 caught on FAULT-005, and
        # the reason this requirement was demoted at all).
        #
        # Clause 1 — the gz hour is HORIZONTALLY judged, on PLANT TRUTH, peak
        # over the whole run. Without this bar the verdict reported horizontal
        # drift as zero by construction.
        - run: "grep -q 'final_horiz < 1.0 && peak_horiz < 2.0' examples/falcon-sitl-gz/src/main.rs"
        - run: "grep -q 'last_true\\[0\\] \\* last_true\\[0\\]' examples/falcon-sitl-gz/src/main.rs"
        # Clause 2 — the ratchet bites on BOTH legs, at the requirement's own
        # target. A floor below the measurement is the defect #497 and #523 each
        # caught at a different ratio (4.8x, then 30x).
        - run: "grep -q \"GZ_FLOOR_S: '3600'\" .github/workflows/soak.yml"
        - run: "grep -q \"WASM_FLOOR_S: '3600'\" .github/workflows/soak.yml"
        # Clause 3 — BOTH PATHS: the leg exists, climbs to the hour, and judges
        # the horizontal half rather than only altitude.
        - run: "grep -q '^  wasm-endurance:' .github/workflows/soak.yml"
        - run: "grep -q 'for D in 25 40 60 90 120 300 900 3600' .github/workflows/soak.yml"
        - run: "grep -q 'held altitude but DRIFTED' tests/cascade-sitl-wasm/src/main.rs"
        - run: "grep -q 'EXCURSIONED to' tests/cascade-sitl-wasm/src/main.rs"
        - run: "grep -q 'peak_horiz_all' tests/cascade-sitl-wasm/src/main.rs"
        # And the number must REACH THE LOG. It was computed, printed, and then
        # dropped by this very job's output allowlist — the fourth time an
        # allowlist ate a verdict in this repo. A judged quantity nobody can
        # read is not evidence.
        - run: "grep -q 'HOLD ERROR|horizontal' .github/workflows/soak.yml"
    links:
      - type: verifies
        target: SWREQ-FALCON-ENDURANCE-P01
