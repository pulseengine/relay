artifacts:
  - id: FV-FALCON-SPLIT-001
    type: sw-verification
    title: "SPLIT-P01 — the wac-composed cascade-split is bit-exact with the monolithic cascade, supervised on both sides, through every mode"
    status: implemented
    description: >
      Verification of SWREQ-FALCON-SPLIT-P01. Revised after a cold clean-room
      review (relay#585) found the first evidence weaker than claimed: keep_warm
      was never measured, the estimator-health forwards were masked, and no CI
      job exercised the production forwarding. Each gap is addressed below, and
      what still cannot be measured is stated with the reason.

      (1) THE PRODUCTION FORWARDING RUNS IN CI. `RemoteCore`'s logic now lives
      in falcon-core as `split::SplitCore<P: PartitionSeam>`; the partition
      components run `split::{estimator_tick, control_tick, ...}`; the three
      wasm crates are thin WIT adapters over them. The test
      crates/falcon-core/tests/supervised_core_split.rs drives THAT SplitCore,
      with real partitions through those same partition-side functions, under
      FlightSupervisor, against a fused FlightSupervisor — both sampled once per
      tick through the production `SeamFrame::read` and served from the frame.
      Bit-exact in motors, NavState, calibration, mode, failsafe word, failed rotor, and the
      DIRECTLY compared forwards (tilt-uncertainty, max-motor, nav-compromised,
      gnss-diverged), through: arm, an ARMED HOLD (estimate-only ticks, noisy
      gyro), takeoff, loiter, mission, RTL, land, touchdown disarm, ground
      ticks, a supervisor + partition rebuild, a second flight. Its negative
      controls are #[test]s that REQUIRE divergence:
        edge cut                           -> nav-state, tick 401
        estimate-only ticks write the flag -> nav-state, tick 52962
        keep_warm dropped                  -> motors, tick 690
        tilt-uncertainty stubbed to 0      -> tilt-uncertainty, tick 0
        rebuild without partition reset    -> motors, tick 53262
        calibration not sent to control    -> motors, tick 690
        calibration read-back stubbed      -> calibration, tick 0
      (The calibration there is non-identity in all six fields' sense:
      a gyro bias AND a positive-definite `mag_offdiag`.)

      (1b) THE HOST, ONE COPY (#609 single-source refactor). The orchestrator
      holds `falcon_core::host::SupervisorHost<SplitCore<WitSeam>>` — the SAME
      lifecycle code the published `cascade` runs as
      `SupervisorHost<FlightCore>`; the one per-core step is
      `HostCore for SplitCore`, which resets BOTH partitions with the validated
      tuning. The split's own copy of the rules (supcfg_valid, usable_supcfg,
      sup_params, the three UNSET constants, cal_params validation, the CALIB
      store, ROWS_FED_BY_STEP, ensure_supervisor, rebuild_permitted, sane) is
      DELETED: 0 rule definitions remain in wasm/cm/cascade-split/src/lib.rs.
      In CI, `split_host_runs_the_same_lifecycle_rules_bit_exactly` drives a
      fused and a split host through the same calls (configure before any
      build, an arm refused before the first step, arm on the measured table,
      takeoff, a configure REJECTED in flight, land, a ground rebuild with the
      calibration surviving it, an invalid calibration revoking on both):
      21288 ticks, motors / mode / failsafe / NavState / calibration bit-exact.
      Its negative control drops the tuning in the split's per-core hook ->
      nav-state, tick 1.
      Mutating the PRODUCTION SplitCore (not the test seam) was also run and is
      red: keep_warm call deleted -> motors tick 690; tilt forward stubbed ->
      tick 0; edge cut -> tick 401. (Measured on the #585 branch; the same
      forwards are mutated through the wasm split in (7).)

      (2) keep_warm, MEASURED. The reset-free estimate-only -> flight path is
      arm-then-hold: the twin holds flight 1 ARMED for 400 ticks with a noisy
      gyro before takeoff. It is decisive only at the 1000 Hz design rate
      (elsewhere `resync_loop_rate` rebuilds the gyro filter on the first
      control tick), so the twin runs at dt=0.0025 AND dt=0.001. Dropping
      keep_warm in the WIT adapter: twin@0.001 RED (motor m1, tick 803 — the
      first control tick after the hold).

      (3) THE CALIBRATION (#586), FORWARDED, NOT COPIED. `FlightSupervisor::
      set_calibration` is generic over the core; `SplitCore::set_calibration`
      writes BOTH partitions (`estimator.configure-calibration`,
      `flight-control.configure-calibration` — the control half de-biases its
      own gyro copy) with all 18 f32 of `types.calibration-params`, which
      carries `mag-offdiag` like `pilot.sensor-calibration`.
      `CalibrationPresent` is the supervisor's own "a VALID calibration was
      configured" flag (the identity included), exactly as in `cascade`;
      `SplitCore::calibration()` reads the estimator's applied value back
      (`estimator.read-calibration`) for `FlightSupervisor::calibration`. In CI
      (1) compares `calibration()` bit for bit every tick and two more negative
      controls must diverge: control half not forwarded -> motors, tick 690;
      read-back stubbed to identity -> calibration, tick 0.

      (4) ESTIMATOR HEALTH, NOW DECISIVE AT THE WASM SEAM. With the calibration
      crossing, `CalibrationPresent` no longer masks the estimator rows, so the
      `TWIN_PENDING_586` stage is gone and its intent runs always: the twin's
      termination segment starts with a DEAD ACCELEROMETER for 400 ticks with
      `arm` sent every tick, and every one must be refused (399 + the
      fresh-supervisor one). Stubbing the split's tilt forward to 0 goes RED
      there (failsafe word, DeadAccel tick 1). Measured, and the reason the
      stage exists: on a healthy sensor stubbing the tilt forward changed
      nothing (twin green), because the accepted-arm tick is not decided by
      that row. nav-compromised and gnss-diverged remain constant false
      through this seam BY CONSTRUCTION (fed only on the dual-GNSS path); the CI
      test pins that with an assertion that fails if either ever rises.

      (5) THE #609 SEAM LIFECYCLE, ON THE SPLIT. Every `wasm_*` seam test in
      tests/cascade-sitl-wasm/src/seam_tests.rs has a `split_*` twin run
      against the composed split (CASCADE_SPLIT_WASM): 24/24 `wasm_*` pass on
      `cascade` and 25/25 `split_*` on the split (the extra one is
      `split_partition_ticks_core_area_is_pinned`, below). Besides the
      lifecycle scenarios (reconfigure in flight, Terminated absorbing,
      isolated rotor and latched battery surviving configure, fresh and
      rebuilt supervisors refusing arm before the first step, invalid
      supervisor configs refusing arm and revoking a valid one, invalid
      vehicle configs refused / keeping the previous valid one / publishing
      arm-blocked, an invalid loop rate, the calibration rejected while not
      disarmed / applied in place / cleared by an invalid one / surviving a
      rebuild / never configured / the identity arming, the dead
      accelerometer, arming on the measured table), the split leg runs: the
      mag-offdiag crossing (split vs native mirror bit-identical, and the
      field live); a 10 000-call `configure-calibration` soak through the
      Component Model that must still arm and fly; and the CORE-LEVEL arena
      oracle on every core module that takes the 18 f32 indirectly — the
      orchestrator's `pilot#configure-calibration` and both partitions'
      `configure-calibration` (3 modules, 10 000 calls each, the 72 B area
      never moves and is never NULL).

      ARENA SOAK OF THE SPLIT (#574). Every export of the three split crates
      opens a `falcon_cm_rt::CallScope` first (20 exports, flight-control's
      `rearm-fdi` (#609 finding 16) included; the deprecated
      reset is gone). Besides the calibration soaks above,
      `split_partition_ticks_core_area_is_pinned` drives `estimator#tick`
      (100 B) and `flight-control#tick` (160 B) — spilled on every control tick
      — 10 000 core calls each: pinned, never NULL.

      (6) TWIN DIFFERENTIAL (bench-only, scripts/split-differential.sh).
      Published-shape `cascade` vs the wac-composed split, three segments on
      fresh instances (lifecycle; dead accelerometer + termination;
      rotor-out): 49929 ticks @ 400 Hz and 108206 @ 1000 Hz, motors + all 23
      flight-state fields bit-exact every tick, plus each segment's pre-tick
      read. The twin's tuning differs from falcon-core's built-in defaults in
      BOTH partitions' shares (pos_var 0.02, process floors 0.001, hover
      0.49), and its calibration carries a non-zero `mag-offdiag`. It ASSERTS
      modes armed, takeoff, loiter, mission, RTL, land, terminated; failsafe
      bits rtl-latched, batt-low, batt-critical, batt-silent, arm-blocked; a
      rotor isolation; the 400-tick armed hold; 4 fresh-supervisor and 2 other
      arm refusals; 399 dead-accelerometer refusals; and the three configures
      #609 must reject (latched battery, Terminated, isolated rotor), each
      checked on the state a rebuild would have erased. The native leg: each
      component against the native mirror (DIFFERENTIAL=1, 6250 ticks @ 4 ms:
      plain, IMU_NOISE=0.01, FAIL_ROTOR=0@12): worst |wasm - native| =
      0.000000000 for both, all three.

      (7) MUTATION TESTING of the wasm split (rebuilt and recomposed per
      mutant; twin @400 Hz + the 25 split_* seam tests; scripts abort if a
      mutant does not apply). The lifecycle RULES are no longer in the split:
      their mutants are falcon-core host:: unit-test mutants (#609
      single-source refactor), and the native host twin above runs them for
      both cores. What remains in the split is ABI and forwarding; each
      mutant is RED:
        partitions reset without the estimator tuning -> twin, tick 480
        calibration not sent to the control half      -> twin, motors tick 803
                                                         + split_mag_offdiag
        mag-offdiag zeroed on the partition seam      -> split_mag_offdiag
        mag-offdiag dropped from pilot.sensor-calib.  -> split_mag_offdiag
                                                         + split_bad_calibration
        controller.configure not forwarded            -> twin, tick 401
                                                         + 10 split_* tests
        estimator drops mag-offdiag on receipt        -> split_mag_offdiag
        keep_warm not forwarded (twin @1000 Hz)       -> twin, motors tick 803
        tilt forward stubbed to 0                     -> twin, DeadAccel tick 1
                                                         + split_dead_accelerometer
      The twin is blind to mag-offdiag (measured: three mag-offdiag mutants
      left it green), which is why the seam test compares the split against
      the native mirror and checks the field is live. The first mutant was
      GREEN in the twin while its tuning equalled the estimator defaults; the
      twin's tuning was changed so it is not.

      STILL NOT MEASURED: failsafe bits 4-6 (geofence, runaway, wind) are never
      raised, so `max_motor` (read only by the wind detector) is falsified only
      by the CI test's direct comparison, not by behaviour.

      DROP-IN CONFORMANCE. The composed split imports only `types`, exports
      controller/observer/pilot, and `wasm-tools component targets
      wit/falcon-cascade <composed> --world cascade` passes.

      MULTI-MODULE, NO-GROW. All three components build no_std (falcon-cm-rt
      arena, a CallScope opened by every export) with the deployment flags. Measured
      with FV-FALCON-OCI-002's method (`wasm-tools print | grep -c
      memory.grow`): 0 in each of cascade-estimator, cascade-control,
      cascade-split and in the composition; 0 wasi imports; each module carries
      relocation sections and exports `__heap_base`. The composition holds 5
      core modules: the three Rust code modules (estimator, control,
      orchestrator — three memories) plus wit-component's `shim` and `fixups`
      in the orchestrator.

      REFACTOR NEUTRALITY. Making `FlightSupervisor` generic (#585) and
      `SupervisorHost` generic over the core (this rebase) changes the
      monolith's bytes (68691 -> 68602 B against the #609 single-source
      refactor's build), not its behaviour: over the 6250-tick mock flight
      (plain, IMU_NOISE=0.01, FAIL_ROTOR=0@12) the per-tick motor bits, mode,
      failsafe word, position, qw and failed rotor of `cascade` are
      BYTE-IDENTICAL to that build's and to origin/main's, and so are the
      composed split's.
    tags: [verification, falcon, partition, split, supervisor, "575"]
    fields:
      method: automated-test
      steps:
        # In-crate, runs in CI: the PRODUCTION SplitCore over real partitions
        # is bit-exact with the fused core under the supervisor, and seven
        # negative controls each REQUIRE divergence.
        - run: "cargo test -p falcon-core --test supervised_core_split"
        - run: "grep -q 'fn negative_control_dropped_keep_warm_diverges' crates/falcon-core/tests/supervised_core_split.rs"
        - run: "grep -q 'fn negative_control_stubbed_tilt_uncertainty_diverges' crates/falcon-core/tests/supervised_core_split.rs"
        - run: "grep -q 'fn negative_control_flying_edge_cut_diverges' crates/falcon-core/tests/supervised_core_split.rs"
        - run: "grep -q 'fn negative_control_rebuild_without_partition_reset_diverges' crates/falcon-core/tests/supervised_core_split.rs"
        - run: "grep -q 'fn negative_control_calibration_not_forwarded_to_control_diverges' crates/falcon-core/tests/supervised_core_split.rs"
        - run: "grep -q 'fn negative_control_calibration_read_back_stubbed_diverges' crates/falcon-core/tests/supervised_core_split.rs"
        # The host twin: SupervisorHost over the split core runs the same
        # lifecycle rules as over the fused core, and dropping the tuning in
        # the per-core hook must diverge.
        - run: "grep -q 'fn split_host_runs_the_same_lifecycle_rules_bit_exactly' crates/falcon-core/tests/supervised_core_split.rs"
        - run: "grep -q 'fn negative_control_split_host_without_tuning_diverges' crates/falcon-core/tests/supervised_core_split.rs"
        # The calibration crosses to BOTH halves, all 18 f32, and is read back
        # from the estimator (#586).
        - run: "grep -q 'self.0.estimator_calibration()' crates/falcon-core/plain/src/split.rs"
        - run: "grep -q 'self.0.control_set_calibration(calib);' crates/falcon-core/plain/src/split.rs"
        - run: "grep -q 'read-calibration: func() -> calibration-params;' wit/falcon-cascade/cascade.wit"
        - run: "awk '/record calibration-params/,/}/' wit/falcon-cascade/cascade.wit | grep -q 'mag-offdiag: vec3,'"
        # The split runs falcon-core's SupervisorHost and carries NO copy of
        # the lifecycle rules (#609 single-source refactor).
        - run: "grep -q 'static HOST: SingleThreaded<SupervisorHost<RemoteCore>>' wasm/cm/cascade-split/src/lib.rs"
        - run: "grep -q 'impl<P: PartitionSeam + Default> HostCore for SplitCore<P>' crates/falcon-core/plain/src/split.rs"
        - run: "! grep -qE 'fn (rebuild_permitted|supcfg_valid|usable_supcfg|sup_params|ensure_supervisor|sane)[(<]|ROWS_FED_BY_STEP|static (CALIB|SUPCFG|CONFIG)' wasm/cm/cascade-split/src/lib.rs"
        - run: "grep -q 'fn configure_calibration(cal: SensorCalibration)' wasm/cm/cascade-split/src/lib.rs"
        # The seam lifecycle tests have a split_* leg (bench: run with
        # CASCADE_SPLIT_WASM by scripts/split-differential.sh, which needs
        # cargo-component and wac).
        - run: "grep -q 'fn load_split' tests/cascade-sitl-wasm/src/seam_tests.rs"
        - run: "test \"$(grep -c 'fn split_' tests/cascade-sitl-wasm/src/seam_tests.rs)\" -ge \"$(grep -c 'fn wasm_' tests/cascade-sitl-wasm/src/seam_tests.rs)\""
        - run: "test \"$(grep -c '^    split_' tests/cascade-sitl-wasm/src/seam_tests.rs)\" -eq \"$(grep -c '^    wasm_' tests/cascade-sitl-wasm/src/seam_tests.rs)\""
        - run: "grep -q 'fn split_partition_ticks_core_area_is_pinned' tests/cascade-sitl-wasm/src/seam_tests.rs"
        # Every split export opens a CallScope (#574).
        - run: "test \"$(cat wasm/cm/cascade-estimator/src/lib.rs wasm/cm/cascade-control/src/lib.rs wasm/cm/cascade-split/src/lib.rs | grep -c 'let _call = falcon_cm_rt::CallScope::enter();')\" -eq 20"
        # The orchestrator's core IS the tested SplitCore.
        - run: "grep -q 'type RemoteCore = SplitCore<WitSeam>;' wasm/cm/cascade-split/src/lib.rs"
        # The trait the split depends on, and the partition equivalence it
        # builds on (PART-P01), stay green.
        - run: "cargo test -p falcon-core --release partitioned"
        # The feedback edge is an option, None on estimate-only ticks.
        - run: "grep -q 'tick: func(sensors: sensor-frame, in-flight: option<bool>) -> nav-state;' wit/falcon-cascade/cascade.wit"
        - run: "grep -q 'let nav = self.0.estimator_tick(&f, Some(flying));' crates/falcon-core/plain/src/split.rs"
        - run: "grep -q 'let _ = self.0.estimator_tick(&f, None);' crates/falcon-core/plain/src/split.rs"
        # The split world exports what cascade exports.
        - run: "grep -qE '^world cascade-split' wit/falcon-cascade/cascade.wit"
        # The twin differential itself (bench-only).
        - run: "scripts/split-differential.sh"
    links:
      - type: verifies
        target: SWREQ-FALCON-SPLIT-P01
