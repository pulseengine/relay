artifacts:
  - id: FV-FALCON-TRACE-001
    type: sw-verification
    title: "TRACE-P01 — every shipped sw-req carries a release: (rivet query, 19 -> 0)"
    status: implemented
    release: falcon-v1.143.0
    description: >
      Verifies SWREQ-FALCON-TRACE-P01 under its restated criterion (owner
      decision 2026-11-25, shipped-only): every sw-req whose status is
      implemented or verified carries a `release:` field.

      Step 1 is the check: a rivet query for shipped sw-reqs WITHOUT a release
      must return zero artifacts. Measured as a control: on main d98818f the
      same query returns 19 (the 19 this change backfills), and on this branch
      0, so the step can fail.

      Step 2 guards against a vacuous query: if `has-field "release"` ever
      stopped matching anything, step 1 would pass on an empty set. It requires
      the complementary query (shipped sw-reqs WITH a release) to be non-empty.

      Not checked here: that each value is the mechanically derived one. The
      derivation (first falcon-v* tag containing the commit that added the
      id) is recorded inline on each of the 19 lines.
    tags: [verification, falcon, rivet, traceability, release-planning]
    fields:
      method: automated-test
      steps:
        - run: >-
            test "$(rivet list --filter '(and (= type "sw-req") (or (= status "implemented") (= status "verified")) (not (has-field "release")))' | tail -1)" = "0 artifacts"
        - run: >-
            test "$(rivet list --filter '(and (= type "sw-req") (or (= status "implemented") (= status "verified")) (has-field "release"))' | tail -1)" != "0 artifacts"
    links:
      - type: verifies
        target: SWREQ-FALCON-TRACE-P01
