artifacts:
  - id: FV-FALCON-PIPELINE-001
    type: sw-verification
    title: "WASM pipeline — Component Model cascade under Bazel (v0.7)"
    status: approved
    description: >
      Verification of the falcon WASM pipeline. v0.6 built the control
      layer as raw `#[export_name]` scalar modules fused by meld; v0.7
      reworked it into real Component Model components composed by wac
      under Bazel. This artifact tracks the current (v0.7) pipeline.

      Evidence layers:

      1. Control-crate property tests (`cargo test`) — relay-mix-quad
         and relay-rate carry the MIX-P0* / RATE-P0* property + proptest
         suites. The v0.7 CM components (wasm/cm/*) are thin wrappers
         over these crates, so the crate tests prove the exported
         behaviour faithful.

      2. Cascade SITL (`cargo test -p falcon-sitl-hover`) — the full
         POS → ATT → RATE → MIX cascade closes in the pure-Rust SITL,
         exercising the same control logic the CM components export.

      3. Bazel Component Model build — `bazel build
         //:falcon-cascade-composed` builds the six CM components
         (wit_library + rust_wasm_component_bindgen) and composes them
         with wac_plug into falcon-cascade-composed.wasm.

      The meld → wasm-opt → synth → ARM Cortex-M ELF lowering of the
      composed cascade is tracked separately.
    tags: [verification, falcon, wasm-pipeline, component-model, bazel, v0.7]
    fields:
      method: automated-test
      bazel-target: "//:falcon-cascade-composed"
      steps:
        - run: cargo test -p relay-mix-quad
        - run: cargo test -p relay-rate
        - run: cargo test -p falcon-sitl-hover
    links:
      - type: verifies
        target: SWREQ-FALCON-MIX-P01
      - type: verifies
        target: SWREQ-FALCON-RATE-P01
