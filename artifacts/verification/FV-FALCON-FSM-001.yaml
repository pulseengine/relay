artifacts:
  - id: FV-FALCON-FSM-001
    type: sw-verification
    title: "Flight-mode FSM — Kani disarm-safety + failsafe-recovery + lifecycle tests (v1.7.0)"
    status: approved
    description: >
      Verification of the v1.7.0 flight-mode state machine (relay-fsm):

      1. Kani verify_never_disarm_airborne: VERIFICATION SUCCESSFUL — for ANY
         start state, event, and gates, if FlightFsm::on returns Disarmed then
         the prior state was Disarmed, Armed, or Land (never an airborne flight
         state). Motors can never be cut in flight by a disarm request.
      2. Kani verify_failsafe_recovers: VERIFICATION SUCCESSFUL — a Failsafe
         event from any flying state (Takeoff/Loiter/Mission/Rtl) commands a
         recovery mode (Rtl or Land), never Disarmed and never a no-op.

      3. Kani verify_arm_requires_preconditions (FSM-K03, the v1.97 ENTRY GATE):
         VERIFICATION SUCCESSFUL — for ANY start state / event / gates, if the FSM
         enters Armed it MUST have been an Arm event from Disarmed with level AND
         throttle_low AND prearm_ok all true. Motors can never spin up with a
         failed pre-arm check — the architectural complement of invariant 1.

      4. Unit (5 tests, clippy clean): the nominal arm→takeoff→loiter→mission→
         land→disarm lifecycle; arming refused while tilted or throttle-up;
         arming refused when the pre-arm checks fail; disarm no-ops in each
         airborne state; failsafe → Rtl with a position fix, Land without.

      v1.97 ENFORCEMENT: relay-fsm was added to the Kani CI matrix
      (.github/workflows/kani.yml) — all three harnesses now run on every PR as
      the dedicated Kani gate (belt-and-suspenders with this artifact's steps,
      which the rivet verification gate executes).
    tags: [verification, falcon, fsm, autonomy, safety, kani, v1.7, v1.97]
    fields:
      method: formal-verification
      steps:
        - run: "cargo test -p relay-fsm"
        - run: "cargo kani -p relay-fsm --harness verify_never_disarm_airborne"
        - run: "cargo kani -p relay-fsm --harness verify_failsafe_recovers"
        - run: "cargo kani -p relay-fsm --harness verify_arm_requires_preconditions"
    links:
      - type: verifies
        target: SWREQ-FALCON-FSM-P01
