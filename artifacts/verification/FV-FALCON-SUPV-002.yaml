artifacts:
  - id: FV-FALCON-SUPV-002
    type: sw-verification
    title: "SUPV-P02 — the failsafe latch clears on disarm, and re-arming is gated by LIVE hazards only, in both directions (v1.141)"
    status: verified
    release: falcon-v1.141.0
    description: >
      Verification of SWREQ-FALCON-SUPV-P02, run independently of the
      implementation PR (#565) per the two-commit rule, originally on main
      985114b (directions 1 and 2; the 2026-11-04 re-run of all three, on
      5cdb766, is recorded below). The requirement names two directions; each is checked and each is
      falsified by the mutation the requirement itself prescribes.

      (1) RECOVERY. A geofence breach latches the failsafe; the vehicle flies
      home, lands and disarms; with the hazard provably clear the next
      command(Arm) reaches Mode::Armed and rtl_latched reads false
      (falcon-core tests::re_arming_is_allowed_once_the_failsafe_condition_has_cleared).
      Before the fix the airframe could never be re-armed for the life of the
      process (relay#564).

      (2) RETAINED PROTECTION. A rotor isolated while AIRBORNE — so the latch
      IS set, unlike the Mode::Land case PREARM-P04 covers — lands and
      disarms; rtl_latched then reads FALSE, and command(Arm) is still REFUSED
      naming CheckId::MotorsHealthy
      (tests::a_rotor_that_failed_in_flight_still_blocks_re_arming_after_the_latch_clears).

      INDEPENDENT RE-RUN 2026-10-21 (separate verifier agent, clean worktree,
      each filter confirmed to execute exactly 1 test):
        re_arming_is_allowed_once_the_failsafe_condition_has_cleared              1 passed
        a_rotor_that_failed_in_flight_still_blocks_re_arming_after_the_latch_clears 1 passed

      FALSIFIED, each direction by its prescribed mutation:
        (1) replacing the single `self.rtl_latched = false;` — confirmed to be
            the only occurrence, inside `if self.fsm.mode() == Mode::Disarmed` —
            makes the recovery test FAIL at its `!sup.rtl_latched` assertion
            ("the latch must CLEAR on disarm: it is an in-flight device, not an
            arming interlock"). Stated precisely: this shows the clear is
            required; the test fails on the latch assertion before it reaches
            the arm, so it does not separately exhibit the old
            "PREARM: failsafe latched" refusal text.
        (2) deleting the MotorsHealthy row WITH THE CLEAR LEFT IN PLACE — not by
            removing the clear, which would only prove the latch still blocks —
            makes the airborne test FAIL with arm_blocked_check=None while
            failed_motor=Some(1): the vehicle arms with a dead motor.

      (3) GEOFENCE, LIVE (#609 finding 5, falcon-v1.141.0). The requirement now names the
      geofence as a live hazard: CheckId::InsideGeofence, the complement of
      the in-flight breach term. tests/geofence_prearm.rs: a first arm
      outside the fence is refused by it; after a breach, RTL, landing and
      disarm, a vehicle outside the fence again is refused with it as the
      ONLY failing row (forcing it true leaves arm_blocked_check()=None), and
      arms once back inside. The recovery test above now ARMS INSIDE the
      fence and is carried out of it in flight, because the row refuses the
      out-of-fence first arm it used to provoke the breach with; it still
      fails when the disarm clear is removed.

      STATUS DEMOTED verified -> implemented by the #609 finding-5 change
      (#633): the requirement text and its evidence changed.

      INDEPENDENT RE-RUN 2026-11-04, code-free verify PR (two-commit rule),
      on 5cdb766 (the head of #634, which carries #633): every declared step
      from a file under /bin/sh with stdin closed, and again through
      scripts/run-falcon-verification.py. Tests executed:
        re_arming_is_allowed_once_the_failsafe_condition_has_cleared              1 passed
        a_rotor_that_failed_in_flight_still_blocks_re_arming_after_the_latch_clears 1 passed
        --test geofence_prearm                                                     3 passed
        --test battery_failsafe_terminal                                           2 passed
      FALSIFIED AGAIN on that commit, each mutation applied by a script that
      asserted its target text occurs exactly once, then reverted:
        (1) the single `self.rtl_latched = false;` removed: the recovery test
            FAILS ("the latch must CLEAR on disarm ..."), so the re-written
            test (arm inside, carried out in flight) still needs the clear.
        (2) the MotorsHealthy row forced true, the clear left in place: the
            airborne test FAILS, the vehicle ARMS with arm_blocked_check=None
            and failed_motor=Some(1).
        (3) the InsideGeofence row forced true, as the requirement
            prescribes: a_first_arm_outside_the_fence_is_refused_by_the_fence_row
            and re_arming_outside_the_fence_after_a_breach_is_refused_by_the_fence_row
            both FAIL (arm_blocked_check None, not Some(InsideGeofence));
            inside_the_fence_arms still passes. Both refusals disappear.
      The battery-terminal tests pin existing behaviour and were not
      mutation-tested here. Promoted implemented -> verified.

      High wind is deliberately outside the live-hazard set (maintainer
      decision, relay#564: re-arm after a wind RTL is permitted and
      self-limiting — CORRECTED in the requirement, #609 finding 5: the wind
      failsafe commands RTL only, never a landing in place); not exercised
      here because the requirement excludes it. BATTERY IS TERMINAL until a
      process restart (requirement, #609 finding 5): pinned by
      tests/battery_failsafe_terminal.rs, documentation of the existing
      behaviour, not a change to it.

      FALSIFICATION: wrong if a disarmed vehicle with no live hazard is
      refused, or a disarmed vehicle with an isolated rotor is accepted.
    tags: [verification, falcon, supervisor, failsafe, latch, arming, safety, v1.141]
    fields:
      method: automated-test
      steps:
        - run: cargo test -p falcon-core --lib re_arming_is_allowed_once_the_failsafe_condition_has_cleared
        - run: cargo test -p falcon-core --lib a_rotor_that_failed_in_flight_still_blocks_re_arming_after_the_latch_clears
        - run: cargo test -p falcon-core --test geofence_prearm
        - run: cargo test -p falcon-core --test battery_failsafe_terminal
    links:
      - type: verifies
        target: SWREQ-FALCON-SUPV-P02
