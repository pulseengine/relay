artifacts:
  - id: FV-FALCON-OCI-006
    type: sw-verification
    title: "OCI-P08 — CallScope arena reclamation: Kani P1–P4, unit tests, 10 000-call soak, bit-identity (#574)"
    status: implemented
    release: falcon-v1.142.0
    description: >
      Verification of SWREQ-FALCON-OCI-P08.

      (a) KANI, enforced by the kani.yml matrix (falcon-cm-rt added; the crate
      had zero harnesses before). Seven harnesses in
      crates/falcon-cm-rt/src/kani_proofs.rs drive the SAME ArenaState the
      allocator, cabi_realloc and CallScope delegate to, from any
      invariant-satisfying state with symbolic sizes and alignments:
        P1  p1_no_overlap_with_live_allocations_of_the_same_call (bounded
            call: 0-2 host arg areas, enter, 3 mixed host/guest allocations,
            drop, one post-return guest allocation — all pairwise disjoint),
            p1_nested_scope_keeps_outer_call_live,
            p1_step_only_a_returned_call_is_reclaimed (one-step inductive
            lemma, so P1 holds for unbounded sequences)
        P2  p2_exhaustion_is_none_and_cursor_never_wraps
        P3  p3_enter_reclaims_iff_previous_call_returned,
            p3_drop_then_host_alloc_then_enter
        P4  p4_alignment_honoured
      Locally on kani 0.67.0: 7/7 verified, every cover property satisfied,
      ~98 s wall for the crate (the bounded P1 sequence ~80 s, the rest under
      6 s each).

      MUTATION-TESTED: each property broken once in lib.rs, the matching
      harness FAILS — enter always rewinds (the original reset-at-entry flaw:
      P1 sequence, P1 step, P3 fail); a guest allocation reclaims a returned
      arena (P1 sequence, P1 step fail); bounds check removed and checked_add
      replaced by wrapping_add (P2 fails, each); enter never reclaims (P3
      fails); alignment rounding removed (P4 fails).

      (b) UNIT TESTS, crates/falcon-cm-rt/src/tests.rs: the four behaviours
      the issue names (entry keeps caller-allocated args, reclaimed after a
      return, flat call reclaims at entry, exhaustion within a call is None),
      plus post-return allocation, nesting, alignment refusal, the measured
      main baseline (113 spilled calls fit without a scope), and one test of
      the real static path (10 000 cabi_realloc + CallScope cycles at one
      address, reset() refusing to free live args, exhaustion trapping).

      (c) BENCH (needs cargo-component + built components): the #[ignore]
      tests in tests/cascade-sitl-wasm/src/arena_soak.rs. Core level, the
      host emulated exactly as the canonical ABI does a spilled call, 10 000
      calls: on components built from main, position FAILS (area moves at
      call 2, cabi_realloc NULL at call 114) and attitude FAILS (call 2, NULL
      at 108); after #574 position, attitude and rate pass with the argument
      area pinned at one address. Component level, 10 000 calls each:
      position, attitude, iekf, falcon-mixer (and the unpublished ekf)
      outputs BIT-IDENTICAL to the main build. Removing
      the scope from position alone fails both position tests at call 114.
      Cascade: mock SITL DIFFERENTIAL=1, 4000 ticks, BIT-IDENTICAL, hold error
      0.38 m, as before. Flight demo: 0.033705384 rad / 0.2090846 m, as
      before. All eight components: zero `memory.grow`, zero `wasi:*`.

      STATUS: implemented. Promotion to verified is a separate code-free PR
      once the Kani matrix leg is green in the merge queue.
    tags: [verification, falcon, oci, wasm, component-model, arena, kani]
    fields:
      method: formal-verification
      steps:
        # every export is scoped, and the old entry reset is gone
        - run: "test \"$(cat wasm/cm/*/src/lib.rs | grep -c 'let _call = falcon_cm_rt::CallScope::enter();')\" -eq 14"
        - run: "test \"$(cat wasm/cm/*/src/lib.rs | grep -c 'BumpArena::reset')\" -eq 0"
        - run: "test \"$(cat wasm/cm/*/src/lib.rs | grep -c 'let _ = falcon_cm_rt::CallScope')\" -eq 0"
        # the harnesses exist (the step below is enforced by the Kani gate)
        - run: "test \"$(grep -c '#\\[kani::proof\\]' crates/falcon-cm-rt/src/kani_proofs.rs)\" -eq 7"
        - run: "cargo kani -p falcon-cm-rt"
        # the four behaviours the issue names, then the design decisions
        - run: "cargo test -p falcon-cm-rt enter_preserves_caller_allocated_args"
        - run: "cargo test -p falcon-cm-rt reclaimed_after_return_not_at_drop"
        - run: "cargo test -p falcon-cm-rt flat_call_reclaims_at_entry"
        - run: "cargo test -p falcon-cm-rt exhaustion_in_one_call_is_none_never_wraps"
        - run: "cargo test -p falcon-cm-rt post_return_guest_alloc_does_not_reclaim"
        - run: "cargo test -p falcon-cm-rt nested_scope_does_not_mark_outer_returned"
        - run: "cargo test -p falcon-cm-rt ten_thousand_spilled_calls_never_exhaust"
        - run: "cargo test -p falcon-cm-rt static_path"
        # bench: build the components, then soak them
        - run: "bash scripts/build-components.sh 0.0 && cd tests/cascade-sitl-wasm && FALCON_POSITION_WASM=../../dist/falcon-components-v0.0/falcon-position-v0.0.wasm FALCON_ATTITUDE_WASM=../../dist/falcon-components-v0.0/falcon-attitude-v0.0.wasm FALCON_RATE_WASM=../../dist/falcon-components-v0.0/falcon-rate-v0.0.wasm FALCON_IEKF_WASM=../../dist/falcon-components-v0.0/falcon-iekf-v0.0.wasm FALCON_MIXER_WASM=../../dist/falcon-components-v0.0/falcon-mixer-v0.0.wasm cargo test --release -- --ignored arena_soak"
    links:
      - type: verifies
        target: SWREQ-FALCON-OCI-P08
