artifacts:
  - id: FV-FALCON-FAULT-004
    type: sw-verification
    title: "Single-rotor-out FDI noise-robustness — lag-modelled, command-aligned residual + roll/pitch gate + 0.3 s spin-up guard + spin-up stall check (v1.115, #609 f17/f18)"
    status: implemented
    release: falcon-v1.115.0
    description: >
      Verifies FAULT-P03. The v1.114 dispersed full-loop campaign surfaced that
      the single-rotor-out FDI, under heavier sensor noise, FALSE-ISOLATED a
      healthy rotor and sometimes never isolated the dead one. Root cause (found
      by instrumenting a failing trace, not guessed): the effectiveness residual
      compared the CURRENT-tick motor command against the PREVIOUS-tick achieved
      ESC RPM — a one-tick telemetry lag — so an abrupt collective step spiked
      ALL FOUR rotors' residuals at once and the CUSUM tripped on whichever was
      checked first. Measured baseline at gps σ ≤ 0.3 m / gyro ≤ 0.02:
      43/300 false isolations, 26 misses.

      FIX (falcon-core CascadePartition::step; residual definition as flown
      since #609 finding 18: resid[i] = |lag_model[i] - achieved[i]|, where
      lag_model is last_motor_cmd passed through a first-order 50 ms lag,
      then minus the per-tick minimum of the four):
        1. Command-ALIGNED residual — compare achieved against the PREVIOUS
           command that produced it (stored last_motor_cmd), so a healthy
           rotor's residual is ~0 even through abrupt command changes and only a
           genuinely dead rotor accumulates. This is the safety fix: false
           isolations 43 → 0.
        2. Detection gate on ROLL/PITCH rate only, not yaw — a single-rotor-out
           RELINQUISHES yaw and spins freely about its near-vertical axis
           (Mueller & D'Andrea); gating on total rate slammed the gate shut for
           the rest of the flight once the spin built, starving re-detection.
           Roll/pitch rate is the tumble indicator the gate actually wants.
        3. COMMON-MODE REJECTION (#609 finding 17, falcon-v1.141.0) — the
           per-tick MINIMUM of the four aligned residuals is subtracted from
           each before the CUSUM. The one-tick alignment above assumes the
           telemetry lags by a tick; a real ESC/rotor lags by a first-order
           time constant of tens of ms, so an abrupt COLLECTIVE step leaves
           all four rotors equally behind. The supervised landing makes that
           step when the velocity law engages: at tau >= 40 ms every healthy
           landing isolated rotor 0 (the four residuals equal to 1e-6, rotor 0
           only because it is checked first), flew the rest of the landing on
           the 3-rotor law and was refused re-arm by MotorsHealthy. A single
           rotor out is DIFFERENTIAL, so the subtraction leaves it intact.
           Measured (falcon-core tests/fdi_common_mode.rs, 6 lags 0-80 ms x 4
           rotors): no phantom on any healthy landing (before: 3 of 6 lags);
           a rotor killed in Loiter isolated in 3 ticks (unchanged); killed at
           the landing step, 8-12 ticks (was 4), always the correct rotor; a
           rotor whose thrust decays with a 100 ms time constant, 39 ticks
           (unchanged). Motors are byte-identical in every phantom-free run.
        4. LAG-MODELLED REFERENCE + 0.3 s SPIN-UP GUARD (#609 finding 18,
           maintainer decision 2026-11-04 "T300+M50", falcon-v1.141.0). The
           residual's reference is no longer the raw previous command but
           that command through a first-order lag model,
           y += (u - y) * dt / FDI_ROTOR_LAG_TAU_S (forward Euler, gain
           capped at 1, re-derived at the resynced rate, zeroed by
           rearm_fdi), FDI_ROTOR_LAG_TAU_S = 0.05 s. And the spin-up guard is
           its own fixed TIME, FDI_SPINUP_GUARD_S = 0.3 s, rounded to ticks
           of the resynced rate (75 at 250 Hz, 300 at 1 kHz); it was the
           shared 0.2 s warm-up, which still times the estimator gate and
           the yaw capture. The case: ONE ESC soft-starting more slowly than
           the other three leaves a DIFFERENTIAL residual that the
           common-mode subtraction (3) cannot remove; the 0.2 s guard
           released while it was still large and the slow, HEALTHY rotor was
           isolated (rotor 2 ramping 100 ms at 50 ms lag: ~0.25 s into the
           first takeoff at 1 kHz, then a flip). The common-mode subtraction
           is KEPT: the model is one assumed time constant, and a plant
           lagging differently (all four alike) still needs it (mutation:
           removing it phantom-isolates a healthy landing at 0 ms lag).
           Measured, SimBackend only (falcon-core tests/fdi_spinup_guard.rs;
           the ramp 0-300 ms x lag 0-80 ms x 4 rotors grid is its ignored
           bench spinup_sweep_bench): false isolations 48/60/76 of 192 ->
           4/8/12 at 250/500/1000 Hz, the production code reproducing the
           prototype's 576 cells exactly; a rotor dead from the first
           flying tick isolated on the guard's own tick (0.300 s), correct
           rotor, tilt <= 0.327 rad (was caught at 0.2 s; with the guard alone,
           superseded by item 5); Loiter isolation
           3 ticks (unchanged); land-entry isolation at 20-80 ms lag 8-12 ->
           3 ticks; 100 ms gradual decay 39 -> 43 ticks; the noise campaign
           still 0 false / 0 missed, worst latency 2 steps (as on the base).
           ASSUMPTION: 50 ms is the sweep's lag, not a measured ESC; see the
           constant's doc for the data that must replace it.
           KNOWN LIMITS: (a) a 300 ms ESC soft-start is STILL isolated as a
           rotor-out and flips (the 4/8/12 cells, all ramp 300 ms; named
           test known_limit_a_300_ms_esc_soft_start_is_still_isolated);
           (b) for a rotor that is WEAK but not stalled, the guard is still
           the detection latency, and its ceiling is close: with the guard
           alone a 0.4 s guard was never isolated and flipped (mutation
           measured); SimBackend's ground contact holds the airframe for
           those 0.3 s, not checked on gz or hardware. (c) the airborne
           regression the 0.3 s guard introduced (rate gate shut at 0.264 s
           / 0.261 s, rotor never isolated, tumble) is closed for a FULLY
           stalled rotor by item 5; for a weak rotor from an airborne start
           it is not.
        5. SPIN-UP STALL CHECK (#609 finding 18, maintainer decision
           2026-11-04 "(c)", falcon-v1.141.0). Inside the guard only, and not
           behind the attitude/rate gate: a rotor whose achieved
           effectiveness (RPM / ESC_RPM_FULL) is below FDI_STALL_RPM_FRAC =
           0.05 while its previous command is above FDI_STALL_CMD_MIN = 0.20,
           for FDI_STALL_WINDOW_S = 0.1 s unbroken (rounded at the resynced
           rate: 25 ticks at 250 Hz, 100 at 1 kHz), is isolated at once. A
           tick with NO RPM telemetry (motor-rpm: none) resets every run: it
           is not evidence of a stall, so a backend without RPM never trips
           it and a lossy feed falls back to the residual at the guard.
           Chosen from the sweep: the longest run any healthy rotor spent
           below 5 % with its command above 20 % was 68 ms (300 ms soft-start
           behind 80 ms lag). Measured (SimBackend): production reproduces
           the prototype's 576 cells and kill rows exactly; the sweep is
           unchanged (4/8/12, the stall check never fires on a healthy
           cell); a rotor dead from the first flying tick is isolated at
           0.104 s (250 Hz) / 0.101 s (1 kHz), tilt <= 0.046 rad on the
           ground (was 0.300 s, 0.327 rad), and AIRBORNE at tick 26 / 101,
           tilt ~0.04 rad (was never). Kills at 0.1 s after spin-up: 100 ms
           (was 196-199). Mutations killed: threshold 0, window 0, check
           removed. ASSUMPTIONS pending BOM ESC startup data, and THE RISK:
           a sensorless ESC can read zero RPM, or none, while it aligns and
           starts commutating; one doing so for > 100 ms with its command
           above 20 % would be isolated as dead on a healthy spin-up. Only a
           FULLY stalled rotor is caught early.

      STATUS DEMOTED verified -> implemented by the #609 finding-17 change:
      the residual this artifact verified is no longer the one flown. It
      returns to verified in a separate code-free verify PR (two-commit rule).

      EVIDENCE:
        - falcon-sitl-gz fdi_noise_robustness_monte_carlo_campaign: 200 dispersed
          trials at the heavier envelope (gps σ ≤ 0.18 m, gyro ≤ 0.010) — 0
          false isolations (the safety invariant), 0 misses, worst detect
          latency 17 steps (< 25 = 100 ms). A regression that reintroduces the
          skew drives false isolations > 0 and trips this guard.
        - falcon-core fdi_isolates_dead_rotor_and_reconfigures: the clean-signal
          isolation contract still holds under the aligned residual.
        - falcon-core survives_single_rotor_failure_without_flipping: the
          recovery (FAULT-P02) is unaffected — still no flip.

      FDI observability: FlightCore::fdi_diag() exposes the gate inputs +
      residual so the campaign (and future FDI work) can see WHY detection
      stalls, not just that it did.

      Envelope note: at extreme gps σ ≥ 0.3 m the estimator/altitude loop itself
      destabilises and the vehicle does not fly (a dead rotor is then moot and
      produces no residual) — an ESTIMATOR envelope limit, not an FDI defect;
      the aligned residual correctly stays 0 there (no false trip). Estimator
      robustness at that envelope is out of scope for FAULT-P03.

      FALSIFICATION: the FDI is wrong if, within the flying envelope
      (gps σ ≤ 0.18 m), it isolates a HEALTHY rotor, or fails to isolate the
      dead one within ~100 ms.
    tags: [verification, falcon, fault-tolerance, rotor-loss, fdi, robustness, v1.115]
    fields:
      method: automated-test
      steps:
        - run: cargo test -p falcon-sitl-gz fdi_noise_robustness_monte_carlo_campaign
        - run: cargo test -p falcon-core fdi_isolates_dead_rotor_and_reconfigures
        - run: cargo test -p falcon-core survives_single_rotor_failure_without_flipping
        - run: cargo test -p falcon-core --test fdi_common_mode
        - run: cargo test -p falcon-core --test fdi_second_flight
        - run: cargo test -p falcon-core --test fdi_spinup_guard
        - run: cargo test -p falcon-core --lib the_fdi_guard_is_0_3_s_at_the_resynced_rate
        - run: cargo test -p falcon-core --lib the_stall_window_is_0_1_s_at_the_resynced_rate
        - run: cargo test -p falcon-core --lib an_airborne_rotor_dead_from_the_first_tick_is_caught_by_the_stall_check
        - run: "grep -q 'pub const FDI_STALL_RPM_FRAC: f32 = 0.05;' crates/falcon-core/plain/src/lib.rs"
        - run: "grep -q 'pub const FDI_STALL_CMD_MIN: f32 = 0.20;' crates/falcon-core/plain/src/lib.rs"
        - run: "grep -q 'pub const FDI_STALL_WINDOW_S: f32 = 0.1;' crates/falcon-core/plain/src/lib.rs"
        - run: "grep -q 'pub const FDI_SPINUP_GUARD_S: f32 = 0.3;' crates/falcon-core/plain/src/lib.rs"
        - run: "grep -q 'pub const FDI_ROTOR_LAG_TAU_S: f32 = 0.05;' crates/falcon-core/plain/src/lib.rs"
        - run: "grep -q 'resid\\[i\\] = (self.fdi_lag_model\\[i\\] - achieved).abs();' crates/falcon-core/plain/src/lib.rs"
        - run: "grep -q 'let common = resid\\[0\\].min(resid\\[1\\]).min(resid\\[2\\]).min(resid\\[3\\]);' crates/falcon-core/plain/src/lib.rs"
    links:
      - type: verifies
        target: SWREQ-FALCON-FAULT-P03
