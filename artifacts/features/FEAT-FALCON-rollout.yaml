  - id: FEAT-FALCON-v1.44
    type: feature
    title: "v1.44 — collision prevention + precision landing (PX4 parity, vision/rangefinder)"
    status: approved
    description: >
      LANDED. falcon has reactive keep-out zones (v1.31, path deflection around
      mapped no-fly zones); PX4 adds sensor-driven collision prevention
      (rangefinder braking) and precision landing (vision/IR marker). This lands
      both, with the safety-critical capping logic formally verified.

      Ships: crates/relay-avoid (new, no_std/no_alloc/forbid-unsafe) —
      limit_approach_speed caps the commanded approach speed to the
      braking-limited sqrt(2*a_max*(dist-margin)) so the vehicle always stops
      before the margin of a sensed obstacle (inside the margin ⇒ stop);
      precision_velocity drives a clamped horizontal correction toward a vision
      marker, with a within_radius convergence check.

      Oracle: stop-inside-margin, far-clear full command, close-in braking cap,
      result always in [0,v_cmd], correction-toward-marker + v_max clamp,
      within-radius, NaN fail-safe (6 unit + 2 proptests). Kani AVOID-K01
      cap_approach safe (result ≤ both inputs, ≥ 0); AVOID-K02 within_radius
      total. The f32 sqrt invariants are proptest-gated (Kani on libm sqrt is
      intractable), with guarded ≥0/finite outputs so the Kani bounds hold.
    tags: [falcon, collision-prevention, precision-landing, vision, rangefinder, px4-parity, milestone, v1.44, landed]
    fields:
      release-target: "relay-avoid: approach speed capped to braking-limited (stops before margin); precision correction clamped to v_max; Kani-safe"
      px4-equivalent: "Collision Prevention + Precision Landing — falcon's limiter/clamp is Kani-proven safe"
      crate: crates/relay-avoid (new)
      video: >
        SITL: the drone flies at a wall and visibly stops short, the safety
        margin drawn on screen; then it descends onto a landing marker and the
        touchdown-error circle shows it inside the precision radius. Real sim
        telemetry.
    links:
      - type: depends-on
        target: FEAT-FALCON-v1.43
      - type: depends-on
        target: SWREQ-FALCON-CPREV-P01
      - type: verified-by
        target: FV-FALCON-CPREV-001

