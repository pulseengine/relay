  - id: FEAT-FALCON-v0.18.2
    type: feature
    title: "v0.18.2 — first live PX4-SITL bench evidence (4 root-cause fixes)"
    status: approved
    description: >
      LANDED. The first observational end-to-end evidence of the
      verified safety chain commanding a real flight controller.
      Closes the v0.14.2 round-trip with actual flight-data logs.

      Ships:
        - 4 fixes in `examples/falcon-hitl-rfspoof` enabling the
          bench loop to actually close:
            1. `UdpFrameSource::new_with_registration` — sends an
               initial HEARTBEAT so PX4 registers us as a peer and
               starts streaming `GLOBAL_POSITION_INT` back. Without
               this PX4 sits silent: it only emits to peers it has
               heard from.
            2. HEARTBEAT cadence bumped from 1 Hz to 2 Hz
               (`HEARTBEAT_INTERVAL = 500 ms`). 1 Hz lived right at
               PX4 commander's 1000 ms timeout, producing the
               `Connection lost / regained` flap once per second.
            3. `--preset=px4-sitl` peer switched from 14580
               (offboard) to 18570 (PX4's GCS receive port) so the
               GCS stream flows over the right socket.
            4. Real-time pacing in `run_scenario` — sleeps
               `tick_period - elapsed` per tick when
               `HitlBench::real_time()` is true. The unpaced loop
               completed 6000 ticks in microseconds; UDP delivered
               nothing because the OS had no wall-clock time to
               deliver between polls. New `is_realtime` trait
               method on `FrameSource`; `UdpFrameSource` overrides
               true. In-memory unit tests stay synchronous.
        - `bench-evidence/px4-sitl/20260525-134251-*.log` — first
          captured run: harness verdict (PASS, latched at 0.27 s,
          RTL dispatched + COMMAND_LONG frame sent), pymavlink
          command sequence (arm → takeoff → reposition to 1.4 km),
          PX4 events log (Armed, Takeoff, Returning to launch,
          RTL: land, Disarmed).
        - `sim/px4-sitl/README.md` — JDK pitfall section
          (`UnsupportedClassVersionError`: jmavsim_run.jar built
          with Java 25 = class 69; openjdk@17 was first on PATH at
          class 61). Fix: `JAVA_HOME=$(/usr/libexec/java_home -v 26)`.
          Headless `make px4_sitl none_iris` + `gz_x500`
          alternatives documented.
        - Diagnostic counters in `MavlinkBench`: `frames_recv` +
          `gpi_recv`. Distinguish "PX4 not sending at all" from
          "PX4 sending but no GPI yet" from "CRC failed". After
          the fix: `frames_recv=5012, gpi_recv=671` in 20 s.

      Honestly NOT claimed:
        - That the bench evidence is multi-vehicle or production-
          grade. It's one PX4 + jMAVSim run on Ralf's machine. The
          methodology + counters + recipe + logs are the
          reproducible artifact; running it on a fleet is the
          v1.0 dossier work.

      Verification chain delta:
        - Run from a clean checkout against PX4 v1.18.0-alpha1-118:
          PASS, latched at 0.27 s, RTL frame sent, PX4 events log
          confirms physical RTL + land + disarm.
        - cargo test --workspace → 404 passing (added counter
          tests + real-time-pacing branch).
        - rivet validate → PASS.

      Together with v0.14.0 (PX4-SITL preset), v0.14.2 (round-trip
      COMMAND_LONG), this is the *evidence* milestone:
      the verified safety chain commands a real flight controller
      home through the verified-engine pair (relay-lc::Geofence +
      relay-sc::CommandStore) and we have the logs.
    tags: [falcon, milestone, v0.18.2, px4-sitl, bench-evidence, landed]
    fields:
      release-target: "first live PX4-SITL bench evidence"
      bench-evidence-dir: bench-evidence/px4-sitl/
      counters: ["frames_recv", "gpi_recv"]
      px4-version: "v1.18.0-alpha1-118"
    links:
      - type: depends-on
        target: FEAT-FALCON-v0.18.1

