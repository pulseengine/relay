        target: FEAT-FALCON-v0.4

  - id: FEAT-FALCON-v0.4
    type: feature
    title: "v0.4 — full inner cascade: attitude + rate + mixer in SITL"
    status: approved
    description: >
      LANDED. Full inner control cascade closes in pure-Rust SITL:
      attitude controller produces rate setpoints, rate PID produces
      torque, mixer maps torque to per-motor PWM, plant integrates,
      EKF feeds back.

      Ships:
        - crates/relay-att — quaternion-error proportional control.
          Outer loop at 250 Hz. Shortest-arc selection. Small-angle
          linearisation within ~1.5 % of exact for |θ| < 30°.
          NaN-safe sanitisation. 10 unit + proptest cases.
        - crates/relay-mix-quad — X-config 4-motor mixer. Body-frame
          (τ, T) → m1..m4 in [0, 1]. Priority-preserving saturation
          (thrust first, yaw sacrificed last). 10 unit + proptest
          cases including a single-axis sign-preservation proptest.
        - examples/falcon-sitl-hover extends with new `attitude`
          scenario: ATT → RATE → MIX → plant cascade. Achieved:
            * setpoint:     20° tilt about body-x
            * convergence:  0.352 s (budget 1.5 s)
            * RMS steady:   0.029° (budget 2.0°)
            * peak error:   19.989° (the initial tilt)
            * loop wall:    545 µs for 5000 samples

      Verification posture:
        - cargo test --workspace: 57 test suites green (was 55 in v0.3)
        - python3 scripts/run-falcon-verification.py: ✅ 7/7 FV
          artifacts green, 26/26 steps PASS
        - rivet validate: 0 broken cross-references

      Honestly deferred:
        - Drake-derived MultibodyPlant export → v0.5
        - Rocq formal proof of ATT-P01 → v0.5 with rules_rocq_rust
        - Verus SMT contracts on mixer arithmetic → v0.5
        - Gazebo Harmonic SITL → v0.5 with position controller
        - rerun.io .rrd evidence recording → v0.5
        - Differential test vs PX4 mc_att_control → v0.5
    tags: [falcon, milestone, v0.4, attitude-control, mixer, cascade, landed]
    fields:
      release-target: "ATT + MIX cascade landing 20° tilt in SITL"
      example: examples/falcon-sitl-hover
      test-count: 22
      maps-to-overdo-layer: "cargo tests + proptest 4k fuzz + cascade bench"
    links:
      - type: implements
        target: SYSREQ-FALCON-003
      - type: implements
        target: SYSREQ-FALCON-005
      - type: depends-on
        target: SWREQ-FALCON-ATT-P01
      - type: depends-on
