        - falcon-sitl-hover binary: PASS on all 3 scenarios
        - python3 scripts/run-falcon-verification.py: 5/5 FV
          artifacts green, 18/18 steps PASS
        - rivet validate: 0 broken cross-references

      Honestly deferred:
