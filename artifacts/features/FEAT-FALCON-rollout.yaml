  - id: FEAT-FALCON-v0.3
    type: feature
    title: "v0.3 — falcon-sitl-hover: rate PID in deterministic closed-loop SITL"
    status: approved
    description: >
      LANDED. Body-rate stabilizer cascaded with the v0.2 EKF,
      validated in a pure-Rust closed-loop SITL that runs in CI.

      Ships:
        - crates/relay-rate — body-rate PID with anti-windup, no_std
          + no_alloc, 3-axis. Defaults Kp=[0.15,0.15,0.10],
          Ki=[0.05,0.05,0.05], Kd=[0.003,0.003,0.002] tuned for a
          500 g, 10-inch quad. 13 unit + proptest cases.
        - examples/falcon-sitl-hover — pure-Rust rigid-body plant
          (rotational dynamics + quaternion integration) driving
          the EKF + rate PID closed-loop. Three scenarios:
            * step:        setpoint [0.5,-0.3,0.4] rad/s
            * disturbance: 1 rad/s impulse recovery
            * hover:       initial rates [0.7,-0.5,0.3] → 0
          Achieved on this release:
            * step  0.139 s convergence, 1.2 % overshoot,
                    0.0012 rad/s RMS-steady
            * disturbance 0.141 s recovery
            * hover 0.175 s convergence
          5 unit + integration tests; deterministic given seed.

      Note: Gazebo Harmonic SITL integration was originally scoped
      for v0.3 but slipped to v0.4 in favour of pure-Rust SITL
      that runs in CI without Gazebo installation. Gazebo lockstep
      lands when the full attitude cascade ships (v0.4 with
      relay-att).

      Verification posture:
        - cargo test --workspace: 55 test suites green
        - falcon-sitl-hover binary: PASS on all 3 scenarios
        - python3 scripts/run-falcon-verification.py: 5/5 FV
          artifacts green, 18/18 steps PASS
        - rivet validate: 0 broken cross-references

      Honestly deferred:
        - Gazebo Harmonic SITL → v0.4 with full attitude cascade
        - Lean Lyapunov formal proof → v0.4 with rules_lean
        - Kani bounded-overflow proof on PID arithmetic → v0.4
        - tokio-rs/loom on host bridge → v0.5 when bridge exists
        - rerun.io .rrd evidence → v0.4 SITL hookup
    tags: [falcon, milestone, v0.3, rate-control, sitl, landed]
    fields:
      release-target: "rate PID + closed-loop SITL bench passing"
      example: examples/falcon-sitl-hover
      test-count: 18
      maps-to-overdo-layer: "cargo tests + proptest 4k fuzz + closed-loop SITL"
      simulator: "pure-Rust rigid-body (deterministic, in-process)"
    links:
      - type: implements
        target: SYSREQ-FALCON-002
      - type: implements
        target: SYSREQ-FALCON-009
      - type: depends-on
        target: SWREQ-FALCON-RATE-P01
      - type: depends-on
        target: SWREQ-FALCON-RATE-P02
      - type: depends-on
        target: SWREQ-FALCON-RATE-P03
