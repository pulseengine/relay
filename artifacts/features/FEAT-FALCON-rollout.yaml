  - id: FEAT-FALCON-v0.3
    type: feature
    title: "v0.3 — falcon-sitl-hover: rate PID in deterministic closed-loop SITL"
    status: approved
    description: >
      LANDED. Body-rate stabilizer cascaded with the v0.2 EKF,
      validated in a pure-Rust closed-loop SITL that runs in CI.

      Ships:
        - crates/relay-rate — body-rate PID with anti-windup, no_std
          + no_alloc, 3-axis. Defaults Kp=[0.15,0.15,0.10],
          Ki=[0.05,0.05,0.05], Kd=[0.003,0.003,0.002] tuned for a
          500 g, 10-inch quad. 13 unit + proptest cases.
        - examples/falcon-sitl-hover — pure-Rust rigid-body plant
          (rotational dynamics + quaternion integration) driving
          the EKF + rate PID closed-loop. Three scenarios:
            * step:        setpoint [0.5,-0.3,0.4] rad/s
            * disturbance: 1 rad/s impulse recovery
            * hover:       initial rates [0.7,-0.5,0.3] → 0
          Achieved on this release:
            * step  0.139 s convergence, 1.2 % overshoot,
                    0.0012 rad/s RMS-steady
            * disturbance 0.141 s recovery
            * hover 0.175 s convergence
          5 unit + integration tests; deterministic given seed.

      Note: Gazebo Harmonic SITL integration was originally scoped
      for v0.3 but slipped to v0.4 in favour of pure-Rust SITL
      that runs in CI without Gazebo installation. Gazebo lockstep
      lands when the full attitude cascade ships (v0.4 with
      relay-att).

