  - id: FEAT-FALCON-v0.19.1
    type: feature
    title: "v0.19.1 — first gz-sim bench evidence (FAIL with diagnostic-clear counters)"
    status: approved
    description: >
      LANDED. First observational evidence of the gz-transport bridge
      running against a real `gz sim` instance. Companion to v0.18.2's
      `bench-evidence/px4-sitl/` — the gz-direction first-light run.
      Verdict is FAIL — that is exactly what makes this a successful
      release: the diagnostic counters from v0.19.0 produced
      **falsifiable evidence**, not silent failure.

      Setup (macOS arm64, gz Sim 8.11.0 from osrf/simulation tap):
        - `brew install osrf/simulation/gz-harmonic` landed cleanly.
        - SDF Fuel-includes patch: `Sun` + `Ground Plane` were fetched
          from Fuel.gazebosim.org which needs network + cache.
          Replaced with inline `<light>` + `ground_plane` model. SDF
          now `gz sdf -k` validates clean.
        - `gz sim -s -r -v3 worlds/falcon-quad.sdf` (headless server).
        - Bridge: `target/debug/falcon-sitl-gz --backend=gazebo
          --world=falcon --model=quad --home=47.3977,8.5456,488
          --scenario=hover --duration=10
          --evidence-dir=bench-evidence/gz-sim`.

      Captured under `bench-evidence/gz-sim/`:
        - `1779822750-gazebo-hover-harness.log` — verdict + counters.
        - `1779822750-gazebo-hover-ticks.csv` — 1000 rows of IMU +
          motor PWM + counter history.
        - `2026-05-26-first-bench-findings.md` — root-cause writeup
          of the two next-fix items.

      Verdict + counters:
        verdict: FAIL  (no climb)
        imu_recv=51  navsat_recv=0  motor_send=1000

      What worked end-to-end:
        - gz sim loaded the world; topics came up.
        - Bridge connected (tokio + gz-transport-rs + Node).
        - IMU subscription delivers (>0).
        - Motor publish rate matches harness tick (1000:1000).
        - --evidence-dir produces schema-correct artefacts.

      Two finds, both with concrete fix shapes:
        1. Harmonic MulticopterMotorModel plugins subscribe to a
           single model-level `/quad/cmd_vel` topic expecting
           `gz.msgs.Actuators`, not 4 separate `gz.msgs.Double`
           per-rotor topics. Hence motor_send=1000 but climb=0.
           v0.19.2 fix: single Actuators publish + drop per-rotor
           mpsc fanout.
        2. NavSat publisher registered, 0 frames delivered. IMU
           also under-rates (4 Hz observed vs 200 Hz configured).
           Same root cause likely: sensor-body content or gz-
           transport buffering. v0.19.3 diagnosis.

      Ships:
        - SDF patch (Fuel includes → inline sun + ground plane).
        - bench-evidence/gz-sim/{1779822750-*,2026-05-26-*.md}.
        - FV-FALCON-SIM-007 records the bench evidence + findings.

      Verification:
        - rivet validate → PASS.
        - cargo build --features gazebo → green (preserved).
        - SDF `gz sdf -k` validate → exit 0.

      Honestly NOT claimed:
        - That the gz bridge flies anything yet. Verdict is FAIL.
        - That IMU under-rating is fully diagnosed.
        - That the evidence is reproducible beyond Ralf's macOS
          arm64 box. Ubuntu confirmation comes after v0.19.2.

      The trait + CLI + SDF + counter pattern from v0.19.0 is now
      **demonstrated** to be the right shape. The remaining work to
      "completely flying" is wire-format detail, not architecture.
    tags: [falcon, milestone, v0.19.1, gazebo, bench-evidence, first-light, landed]
    fields:
      release-target: "first gz-sim bench evidence (FAIL with diagnostic-clear counters)"
      bench-date: "2026-05-26"
      gz-version: "8.11.0"
      counters-observed: "imu_recv=51 navsat_recv=0 motor_send=1000"
      next-fix-items: 2
    links:
      - type: depends-on
        target: FEAT-FALCON-v0.19.0

  - id: FEAT-FALCON-v0.19.2
    type: feature
    title: "v0.19.2 — Actuators message + multi_thread runtime (Finding 2 closed)"
    status: approved
    description: >
      LANDED. Targets v0.19.1's two findings. **Finding 2** (IMU + NavSat
      under-rate) is fully closed by a tokio runtime model fix.
      **Finding 1** (per-rotor Double vs single-topic Actuators) lands
      architecturally and surfaces two sub-issues that v0.19.3 picks up.

      Ships:
        - `gz.msgs.Actuators` defined locally (gz-transport-rs 0.1.0
          doesn't ship `actuators.proto`); prost::Message derive,
          wire-compatible with Harmonic MulticopterMotorModel.
          Single publish to `/<model>/cmd_vel`; per-rotor mpsc fanout
          collapsed to one channel carrying `[4×f32]`.
        - tokio runtime switched from `new_current_thread` to
          `new_multi_thread(2 workers)`. Spawned subscriber + publisher
          tasks now actually run after the setup `block_on` returns
          (current_thread only drives during explicit block_on; the
          51 / 4 Hz IMU rate observed at v0.19.1 was stragglers from
          the setup window). Closes Finding 2.
        - `prost = { version = "0.13", features = ["derive"] }` as a
          gazebo-feature dep.
        - bench-evidence/gz-sim/<ts>-gazebo-hover-{harness.log,ticks.csv}
          and `2026-05-27-v0.19.2-actuators-and-multi-thread-findings.md`.
        - FV-FALCON-SIM-008.

      v0.19.2 bench (15 s hover):
        verdict: backend=gazebo steps=1500 climb=0.00 m
        counters: imu_recv=3572 navsat_recv=178 motor_send=1500
        IMU rate observed 203 Hz / configured 200 Hz   ✓
        NavSat   observed 10.1 Hz / configured 10 Hz   ✓
        motor    observed 100 Hz exact                 ✓
        climb    0.00 m                                ✗

      Two sub-issues found, both v0.19.3 targets:
        1a. gz-transport-rs 0.1.0's advertise-direction discovery
            isn't reaching gz Sim 8's registry (subscribe direction
            works; gz CLI publish on same topic does register).
            Upstream wire-format or partition mismatch.
        1b. Even native `gz topic -p` publishing full-rpm Actuators
            to `/quad/cmd_vel` doesn't lift the body. SDF model
            tuning issue (motorConstant or plugin namespace).

      Verification:
        - cargo test --workspace → 405 passing (preserved).
        - cargo test -p falcon-sitl-gz --features gazebo → 11/11.
        - cargo build --features gazebo → green.
        - rivet validate → PASS.

      Honestly NOT claimed:
        - That the cascade flies in gz physics yet. Verdict FAIL.
        - That gz-transport-rs 0.1.0's discovery is broken in
          general — only that gz Sim 8 doesn't see our advertise.

      The headline: IMU + NavSat now stream at configured rates,
      the counters work, and the bridge survives heavy load
      (3572+178+1500 events in 17 s, zero errors).
