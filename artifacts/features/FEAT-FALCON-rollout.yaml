  - id: FEAT-FALCON-v1.36
    type: feature
    title: "v1.36 — relay-sec confidentiality upgrade: per-SA AEAD mode, no silent downgrade"
    status: approved
    description: >
      LANDED. Adds payload confidentiality on top of the v1.35 authenticated
      floor, reusing the same Ascon-AEAD128 primitive.

      Ships (PR #120):
        - ascon::open — the decrypt+verify inverse of seal; constant-time,
          rejects tampered tag/AD. Byte-exact vs the official NIST genkat
          decrypt vectors (Count 34 / Count 35 → PT 0x20).
        - Confidentiality{MacOnly, Aead} per-channel mode; wrap dispatches on
          mode; verify_into is the mode-aware, total verify (same
          authenticate-then-replay ordering). AEAD wrap encrypts the payload
          (ciphertext ≠ plaintext on the wire); verify_into recovers it exactly.

      No silent downgrade (STPA-Sec SSC-NODOWNGRADE): NO mode byte on the wire.
      The Ascon AD/PT split binds the mode into the tag, so a MAC-only frame on
      an AEAD channel — and an AEAD frame on a MAC-only channel — both fail
      authentication. Also discharges SSC-CONF (encrypt adversary-exposed
      payloads, e.g. wohl sensor/occupancy data).

      Verification: cargo test -p relay-sec 37 green; Kani SEC-K12
      verify_into_aead_total SUCCESSFUL; independent clean-room reproduced all
      KAT tags from a from-scratch SP 800-232 impl; rivet trace SYSREQ-CI-001 →
      SWREQ-SEC-P05 → FV-RELAY-SEC-004.

      Deferred to v1.37: session establishment / forward secrecy.
    tags: [falcon, wohl, relay-sec, security, ascon, aead, confidentiality, downgrade, milestone, v1.36, landed]
