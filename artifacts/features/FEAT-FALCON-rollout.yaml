  - id: FEAT-FALCON-v1.41
    type: feature
    title: "v1.41 — unified failsafe arbiter: prioritized, latched, no-blind-RTL (PX4 Commander parity)"
    status: approved
    description: >
      LANDED. falcon had a low-battery failsafe (v1.21) and a geofence+RTL path
      (v0.10/v1.8 FlightSupervisor); PX4 has a unified failsafe state machine.
      This lands the single verified arbiter that resolves ALL triggers
      (RC-loss, datalink-loss, geofence-breach, position-loss, low/critical
      battery, stale offboard stream) to ONE prioritized action.

      Ships: crates/relay-fsafe (new, no_std/no_alloc/forbid-unsafe) —
      FailsafeArbiter over FailsafeAction{None,Hold,Rtl,Land,Terminate}. It
      selects the most-severe active action, latches it monotonically (a
      momentary trigger is never silently downgraded), and enforces the key
      safety property NO BLIND RTL: when position is lost the action is at least
      Land, never Rtl — you cannot return to launch with no fix to navigate home.

      Verified hardest (it is the highest-safety-value state machine): 7 unit
