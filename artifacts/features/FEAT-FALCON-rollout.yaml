      gap — the Invariant EKF (relay-iekf, SE_2(3): attitude, velocity,
      position, gyro/accel biases) was already built and verified across
      v0.21–v0.35, and RC#3 (the attitude-only Mahony filter with no position)
      was already closed (adaptive-Q consistency, FV-FALCON-EKF-002 against gz
      ground truth). Re-scoped accordingly: this release adds the missing piece
      — a standalone SITL accuracy bench that exercises the existing estimator
      end-to-end, the role PX4 fills with EKF2 but here formally verified.

      Ships: examples/falcon-iekf-bench — runs relay-iekf over a 30 s synthetic
      IMU+GNSS trajectory (~66 m translational leg) and asserts position RMS
      ≤ 2.0 m / velocity RMS ≤ 1.5 m/s over the final 5 s, finite throughout.

      Honest limits published: position-only GNSS aiding (the IEKF exposes no
