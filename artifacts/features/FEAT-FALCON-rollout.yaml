  - id: FEAT-FALCON-v1.37
    type: feature
    title: "v1.37 — relay-sec session establishment: ephemeral X25519 key agreement + rekey-on-reboot (PFS)"
    status: approved
    description: >
      LANDED. Replaces static per-channel keys with a negotiated session key
      carrying forward secrecy — the highest-stakes relay-sec slice, taken
      through a reviewer design pass before any code (roadmap feature F4).

      Ships:
        - X25519 (RFC 7748) from scratch in no_std safe Rust (TweetNaCl-ported
          field arithmetic), KAT-exact vs the official RFC vectors, with
          low-order / contributory-zero rejection (RFC 7748 §6.1).
        - A 3-flight NNpsk2-style PSK-authenticated ephemeral-ephemeral DH
          handshake (Initiator/Responder state machines + Hello/Response/Confirm
          messages), deriving domain-separated SK_enc / SK_mac.

      Forward secrecy: the session key comes only from ephemeral shares, so a
      later compromise of the long-term k_id does not expose past sessions.

      Rekey-on-reboot invariant: a reboot-persistent monotonic epoch binds into
      BOTH the handshake MAC nonce (no Ascon nonce reuse across reboots) and the
      KDF transcript (post-reboot key unconditionally distinct from pre-reboot,
      even if the RNG repeats an ephemeral). A data key is released only after
      key confirmation, so no authenticated frame is accepted before a fresh
      session exists.

      Front-end: an adversarial cryptographic reviewer pass returned
      GO-WITH-FIXES; all blocking must-fixes (responder freshness,
      reboot-persistent nonce, low-order reject, epoch-bound KDF, self-share
      reject, domain-separated keys) are realised. Honest boundary documented:
      symmetric-PSK gives no KCI resistance; per-channel k_id contains a leak.

      Oracle: RFC 7748 KATs + handshake round-trip + rekey-on-reboot invariant
      test + negative paths (tamper/wrong-key/low-order/self-share/replay) +
      Kani SEC-K13 (nonce injective) / SEC-K14 (transcript total). 50 tests.
    tags: [falcon, wohl, relay-sec, security, x25519, pfs, handshake, rekey, milestone, v1.37, landed, f4]
    fields:
      release-target: "X25519 RFC-7748 KAT-exact + handshake round-trip + rekey-on-reboot invariant test green"
      crate: crates/relay-sec
      video: >
        Split screen: two endpoints run the handshake; the shared session key is
        derived independently and matches (shown live). Then reboot one endpoint
        and replay a captured pre-reboot frame — it is REJECTED on screen
        (rekey-on-reboot). Beyond PX4: a verified, replay-proof C2 link PX4 has
        no built-in equivalent for. Driven by the real handshake test output.
    links:
      - type: depends-on
        target: FEAT-FALCON-v1.36
      - type: implements
        target: SYSREQ-CI-001
      - type: depends-on
        target: SWREQ-SEC-P06
      - type: verified-by
        target: FV-RELAY-SEC-005

  # ===========================================================================
  # The road to PX4 feature-parity — and past it. v1.38–v1.46.
  #
  # Frame: falcon already has the realism arc (GNSS/baro/battery/turbulence),
  # MAVLink bridge + missions + keep-out zones, a wasmtime-runnable verified
  # flight core, AND (corrected on first scoping) a full-state IEKF estimator +
  # geometric SE(3) control + flight-mode state machine + a failsafe supervisor —
  # all built v0.21–v1.34. The GENUINE remaining gaps vs PX4 are the readiness
  # dossier's hardware register: NO real driver suite on silicon (F6/F7 — only
  # the IMU exists), offboard wiring, a unified failsafe arbiter, and
  # collision/precision-landing. v1.38/v1.39 therefore land BENCHES/wiring for
  # already-built capability; v1.40–v1.44 build the real gaps. The through-line
  # differentiator — formal verification + a verified authenticated C2 link
  # (v1.35–v1.37) PX4 lacks — is what makes "parity" actually "parity, but
  # provable."
  #
  # Every entry ships a release VIDEO that VISUALLY shows the feature working,
  # driven by real output (gz VideoRecorder / SITL capture → YouTube), never a
  # text card over generic footage. The video is part of done-ness, not a
  # marketing afterthought.
  # ===========================================================================
