artifacts:
  - id: FEAT-FALCON-v0.1
    type: feature
    title: "v0.1 — falcon-hello: boots and waves at QGroundControl"
    status: approved
    description: >
      LANDED. Minimum viable flight stack:

      Ships:
        - wit/interfaces/relay-mavlink/protocol.wit
        - wit/interfaces/relay-control/dynamics.wit
        - wit/worlds/relay-falcon.wit (falcon-quad, falcon-hex,
          falcon-coax world specs)
        - crates/relay-mavlink (no_std v2 codec — CRC, heartbeat,
          frame envelope) — 33 unit + proptest cases green
        - crates/relay-ekf-stub (no_std stub state-estimator) —
          9 unit + proptest cases green
        - examples/falcon-hello (runnable bidirectional UDP
          heartbeat demo with --mode vehicle and --mode gcs) —
          9 integration tests including end-to-end UDP exchange

      Verification (overdo chain at v0.1 layer):
        - cargo test --workspace: 49 test suites green, 0 failures
        - rivet trace from FEAT-FALCON-v0.1 -> SWREQ-FALCON-* ->
          SWDD-FALCON-* -> FV-FALCON-* validated, 0 broken xrefs

      Acceptance test passing:
        examples/falcon-hello/src/main.rs: tests::vehicle_and_gcs_
        exchange_heartbeats_over_udp — vehicle and GCS exchange
        real MAVLink frames over UDP loopback, payload decoded
        byte-for-byte equals encoded original.

      Manual verification:
        cargo run -p falcon-hello -- --mode gcs --duration 3
        cargo run -p falcon-hello -- --mode vehicle --duration 3
        => 10 heartbeats sent, 10 received, clean exit.

      Deferred to v0.2: Verus SMT proofs, witness MC/DC coverage,
      sigil signing, kiln WASM runtime, synth AOT.
    tags: [falcon, milestone, v0.1, hello, landed]
    fields:
      release-target: "first tagged release — landed"
      example: examples/falcon-hello
      test-count: 51
      maps-to-overdo-layer: "cargo tests + proptest + rivet traceability"
    links:
      - type: implements
        target: SYSREQ-FALCON-006
      - type: implements
        target: SYSREQ-FALCON-007
      - type: depends-on
        target: SWREQ-FALCON-WORLD-P01
      - type: depends-on
        target: SWREQ-FALCON-MAVLINK-P02
      - type: verified-by
        target: FV-FALCON-MAVLINK-001
      - type: verified-by
        target: FV-FALCON-EKF-STUB-001
      - type: verified-by
        target: FV-FALCON-WORLD-001

  - id: FEAT-FALCON-v0.2
    type: feature
    title: "v0.2 — falcon-ekf-bench: verified complementary filter"
    status: pending
    description: >
      Real relay-ekf (complementary filter for attitude only).
      No GPS or baro fusion yet. Runs against synthetic IMU log.

      Ships:
        - crates/relay-ekf (complementary filter implementation)
        - examples/falcon-ekf-bench (verifiable, no hardware needed)
        - proofs/verus/falcon-ekf/
        - proofs/lean/falcon-ekf/wcet.lean

      Verification chain delta:
        - Verus contracts on quaternion algebra (EKF-P01)
        - Verus contracts on numerical state bounds (EKF-P02)
        - Lean WCET bound (EKF-P04)
        - proptest on random sensor distributions
        - witness MC/DC on post-codegen WASM
        - cargo-mutants on EKF tests

      Acceptance test: replay synthetic log of a 10-second flight
      profile, complementary filter tracks ground-truth attitude
      within 2 degrees RMS.
    tags: [falcon, milestone, v0.2, ekf, verified]
    fields:
      release-target: "verus + lean + witness chain demonstrated"
      example: examples/falcon-ekf-bench
      maps-to-overdo-layer: "Verus + Lean + witness MC/DC + proptest"
