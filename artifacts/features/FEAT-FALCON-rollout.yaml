  - id: FEAT-FALCON-v0.3
    type: feature
    title: "v0.3 — falcon-sitl-hover: rate stabilizer in deterministic SITL"
    status: pending
    description: >
      First SITL example. relay-rate (1 kHz PID) wired with
      relay-ekf, stabilizes attitude in Gazebo Harmonic SITL.
      Quadcopter does not yet hover autonomously (no att/pos
      control yet) but maintains commanded attitude.

      Ships:
        - crates/relay-rate (PID + anti-windup)
        - Gazebo Harmonic integration via PX4 SITL conventions
        - rerun.io .rrd evidence recording
        - examples/falcon-sitl-hover (seeded, headless, reproducible)

      Verification chain delta:
        - Lean Lyapunov proof of rate loop (RATE-P03)
        - Kani for integer overflow on rate setpoint paths
        - tokio-rs/loom on host-side bridge code
        - byte-identical SITL output given seed (SYSREQ-FALCON-009)

      Acceptance test: 30-second SITL run with seed 42 produces
      SHA-256-identical .rrd file across 10 repeated runs.
    tags: [falcon, milestone, v0.3, sitl, rate-control]
    fields:
      release-target: "first SITL + deterministic evidence"
      example: examples/falcon-sitl-hover
      maps-to-overdo-layer: "+ Lean Lyapunov + Kani + loom + deterministic SITL"
      simulator: "Gazebo Harmonic (primary) via PX4 SITL"
    links:
      - type: implements
        target: SYSREQ-FALCON-002
      - type: implements
        target: SYSREQ-FALCON-009
      - type: depends-on
        target: SWREQ-FALCON-RATE-P01
      - type: depends-on
        target: SWREQ-FALCON-RATE-P03
      - type: depends-on
        target: FEAT-FALCON-v0.2

  - id: FEAT-FALCON-v0.4
    type: feature
    title: "v0.4 — full inner cascade: attitude + rate + mixer SITL hover"
    status: pending
    description: >
      relay-att (250 Hz quaternion error) + relay-mix (1 kHz
      static matrix mixer) join the cascade. falcon-quad hovers
      autonomously in SITL.

      Ships:
        - crates/relay-att (quaternion-error proportional control)
        - crates/relay-mix-quad (4x4 mixer for X-configuration)
        - Drake-derived mixer matrix from quad MultibodyPlant
        - extends examples/falcon-sitl-hover to autonomous hover

      Verification chain delta:
        - Rocq theorems for quaternion-error invariants (ATT-P01)
        - Verus contracts on mixer matrix arithmetic (MIX-P01..P04)
        - differential test vs PX4 mc_att_control + mc_mixer reference

      Acceptance test: SITL hover for 60 seconds with position
      drift < 2 m RMS under simulated wind disturbance.
    tags: [falcon, milestone, v0.4, attitude-control, mixer, hover]
    fields:
      release-target: "autonomous hover; PX4-differential test green"
      example: examples/falcon-sitl-hover (extended)
      maps-to-overdo-layer: "+ Rocq + Verus matrix + differential test"
    links:
