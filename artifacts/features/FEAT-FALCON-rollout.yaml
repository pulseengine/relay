  - id: FEAT-FALCON-v0.5
    type: feature
    title: "v0.5 — outer position loop: vehicle flies to a 10 m waypoint in SITL"
    status: approved
    description: >
      LANDED. Full outer-loop cascade closes. POS → ATT → RATE → MIX
      → plant (now with translational dynamics) drives the vehicle
      from origin to a 10 m north waypoint in pure-Rust SITL.

      Ships:
        - crates/relay-pos — cascaded P-PI position controller.
          50 Hz outer loop, NED frame, anti-windup, NaN-safe input
          sanitisation. Position error → velocity setpoint (P,
          clamped); velocity error → acceleration command (PI,
          integral-bounded); acceleration → tilt + thrust via the
          small-angle map; yaw held or followed. 13 unit + proptest
          cases.
        - examples/falcon-sitl-hover extends with `mission` scenario
          + translational plant dynamics. Vehicle starts at NED
          origin, commanded to (10, 0, 0) m. Achieved:
            * convergence to <0.5 m:  4.045 s   (budget 10 s)
            * final distance:          0.010 m   (budget 0.5 m)
            * RMS-steady (last 2 s):   0.015 m   (budget 1.0 m)
            * peak distance error:    10.000 m   (initial)
            * loop wall time:           1.3 ms for 12000 samples
        - Plant gains translational state (NED position + velocity)
          + thrust + drag + gravity integration. Used only by the
          mission scenario; the v0.3 and v0.4 scenarios continue to
          use the rotational-only `step` path.

      Verification posture:
        - cargo test --workspace: 60 test suites green (was 59 in v0.4)
        - python3 scripts/run-falcon-verification.py: ✅ 8/8 FV
          artifacts green, 31/31 steps PASS
        - rivet validate: 0 broken cross-references

