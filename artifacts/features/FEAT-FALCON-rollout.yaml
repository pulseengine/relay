  - id: FEAT-FALCON-v0.1
    type: feature
    title: "v0.1 — falcon-hello: boots and waves at QGroundControl"
    status: approved
    description: >
      LANDED. Minimum viable flight stack:

      Ships:
        - wit/interfaces/relay-mavlink/protocol.wit
        - wit/interfaces/relay-control/dynamics.wit
        - wit/worlds/relay-falcon.wit (falcon-quad, falcon-hex,
          falcon-coax world specs)
        - crates/relay-mavlink (no_std v2 codec — CRC, heartbeat,
          frame envelope) — 33 unit + proptest cases green
        - crates/relay-ekf-stub (no_std stub state-estimator) —
          9 unit + proptest cases green
        - examples/falcon-hello (runnable bidirectional UDP
          heartbeat demo with --mode vehicle and --mode gcs) —
          9 integration tests including end-to-end UDP exchange

      Verification (overdo chain at v0.1 layer):
        - cargo test --workspace: 49 test suites green, 0 failures
        - rivet trace from FEAT-FALCON-v0.1 -> SWREQ-FALCON-* ->
          SWDD-FALCON-* -> FV-FALCON-* validated, 0 broken xrefs

      Acceptance test passing:
        examples/falcon-hello/src/main.rs: tests::vehicle_and_gcs_
        exchange_heartbeats_over_udp — vehicle and GCS exchange
        real MAVLink frames over UDP loopback, payload decoded
        byte-for-byte equals encoded original.

      Manual verification:
        cargo run -p falcon-hello -- --mode gcs --duration 3
        cargo run -p falcon-hello -- --mode vehicle --duration 3
        => 10 heartbeats sent, 10 received, clean exit.

      Deferred to v0.2: Verus SMT proofs, witness MC/DC coverage,
      sigil signing, kiln WASM runtime, synth AOT.
