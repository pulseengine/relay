  - id: FEAT-FALCON-v1.35
    type: feature
    title: "v1.35 — relay-sec authenticated comms floor: replay-safe, MAC-authenticated frames"
    status: approved
    description: >
      LANDED. The safety-protected comms floor in relay-sec — the shared
      command-authentication layer (falcon drone C2 AND wohl home-automation),
      built on relay's OWN CCSDS stack, NOT DDS/ROS2.

      Ships (PRs #112, #113, #116):
        - anti-replay freshness window (ReplayWindow + ReplayVerdict
          Fresh/Reordered/Replay/TooOld) — the verified base.
        - Ascon-AEAD128 (NIST SP 800-232): one table-free, constant-time
          primitive for the MAC-floor (tag over the frame as AD, empty
          plaintext). KAT-exact vs the official NIST genkat.
        - total pre-auth Security-Header parser (SPI ∥ channel_id ∥ counter)
          + injective nonce = f(SPI, channel_id, counter).
        - authenticated frame wrap/verify with authenticate-BEFORE-parse
          ordering: parse header → check SPI → verify Ascon MAC (constant
          time) → THEN check the replay window on the AUTHENTICATED counter.
          Per-channel keys defeat cross-link replay.

      Verification (overdo chain): cargo test -p relay-sec green; Kani BMC
      (no-double-accept, frontier-monotone, accept-total, too-old-unchanged,
      ct_eq_tag-correct, mac-total, header-parse-total, header-roundtrip,
      nonce-injective, frame-total); rivet trace SYSREQ-CI-001 → SWREQ-SEC-
      P01..P04 → FV-RELAY-SEC-001/002/003.

      Deferred to v1.36: payload confidentiality (AEAD).
