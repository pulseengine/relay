artifacts:
  - id: SWREQ-FALCON-EKF-P01
    type: sw-req
    title: "EKF-P01: Quaternion normalization invariant"
    status: implemented
    release: falcon-v0.1.0
    description: >
      The estimator's output quaternion shall satisfy
      ||q|| in [1.0 - eps, 1.0 + eps] for eps = 1e-6 at every
      tick. Property tests enforce this on every tick output.
    tags: [falcon, ekf, quaternion, invariant, proptest]
    fields:
      req-type: functional
      priority: must
      verification-criteria: >
        Property test (relay-ekf): tick() output quaternion satisfies
        is_unit_quaternion within tolerance, both per-tick
        (ekf_p01_tick_preserves_unit_quaternion) and over randomized
        sequences (proptest, >=4096 cases). A Verus SMT proof of the
        quaternion algebra is roadmapped for v0.4 (see FV-FALCON-EKF-001).
    links:
      - type: derives-from
        target: SYSREQ-FALCON-001

  - id: SWREQ-FALCON-EKF-P02
    type: sw-req
    title: "EKF-P02: Numerical state bounds preserved"
    status: approved
    description: >
      The estimator's state vector components shall remain
      within physically plausible ranges: position |x| < 1e6 m,
      velocity |v| < 1000 m/s, attitude error < 1 rad.
    tags: [falcon, ekf, numerical-bounds, proptest]
    fields:
      req-type: functional
      priority: must
      verification-criteria: >
        Property test (relay-ekf): state stays finite and within
        bounds under adversarial accel (zero / extreme / NaN) — no
        NaN/inf reachable (see FV-FALCON-EKF-001). A Verus state-bound
        proof is roadmapped for v0.4.
    links:
      - type: derives-from
        target: SYSREQ-FALCON-001

  - id: SWREQ-FALCON-EKF-P03
    type: sw-req
    title: "EKF-P03: Innovation health metric monotonically reflects sensor disagreement"
    status: approved
    description: >
      The ekf-innovation scalar output shall increase monotonically
      with the magnitude of sensor disagreement (residual between
      predicted and measured sensor values). Used by limit-checker
      as health signal for failover.
    tags: [falcon, ekf, innovation, monitoring, test]
    fields:
      req-type: functional
      priority: must
      verification-criteria: >
        Test ekf_p03_innovation_monotone_with_tilt_disagreement
        (relay-ekf): the innovation scalar increases monotonically with
        tilt-disagreement magnitude. A Verus monotonicity proof is
        roadmapped for v0.4.
    links:
      - type: derives-from
        target: SYSREQ-FALCON-001

  - id: SWREQ-FALCON-EKF-P04
    type: sw-req
    title: "EKF-P04: WCET bounded by IMU sample interval"
    status: approved
    description: >
      The estimator's tick() function shall complete within the IMU
      sample interval (1 ms at 1 kHz) on the target Cortex-M7
      (480 MHz). Bounded by construction and the Lean cascade WCET proof.
    tags: [falcon, ekf, wcet, real-time, lean]
    fields:
      req-type: non-functional
      priority: must
      verification-criteria: >
        WCET bounded by construction (straight-line tick(), fixed-size
        state, no dynamic allocation). The in-loop estimator cascade
        WCET is proven in CompositionalWcet.lean (FV-FALCON-WCET-001:
        11507 cycles << the 480000-cycle 1 ms budget). A relay-ekf
        tick()-specific Lean WCET proof and a Cortex-M7 criterion
        bench are roadmapped.
    links:
      - type: derives-from
        target: SYSREQ-FALCON-001
