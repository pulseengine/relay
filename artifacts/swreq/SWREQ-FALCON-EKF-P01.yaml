artifacts:
  - id: SWREQ-FALCON-EKF-P01
    type: sw-req
    title: "EKF-P01: Quaternion normalization invariant"
    status: approved
    description: >
      The estimator's output quaternion shall satisfy
      ||q|| in [1.0 - eps, 1.0 + eps] for eps = 1e-6 at every
      tick. Verus contract enforces this on the state update.
    tags: [falcon, ekf, quaternion, invariant, verus]
    fields:
      req-type: functional
      priority: must
      verification-criteria: >
        Verus proof: update_state ensures self.q is unit-quaternion
        within numerical tolerance.
    links:
      - type: derives-from
        target: SYSREQ-FALCON-001

  - id: SWREQ-FALCON-EKF-P02
    type: sw-req
    title: "EKF-P02: Numerical state bounds preserved"
    status: approved
    description: >
      The estimator's state vector components shall remain
      within physically plausible ranges: position |x| < 1e6 m,
      velocity |v| < 1000 m/s, attitude error < 1 rad.
    tags: [falcon, ekf, numerical-bounds, verus]
    fields:
      req-type: functional
      priority: must
      verification-criteria: >
        Verus proof: state update preserves the state-bound
        invariant on all admissible sensor inputs.
    links:
      - type: derives-from
        target: SYSREQ-FALCON-001

  - id: SWREQ-FALCON-EKF-P03
    type: sw-req
    title: "EKF-P03: Innovation health metric monotonically reflects sensor disagreement"
    status: approved
    description: >
      The ekf-innovation scalar output shall increase monotonically
      with the magnitude of sensor disagreement (residual between
      predicted and measured sensor values). Used by limit-checker
      as health signal for failover.
    tags: [falcon, ekf, innovation, monitoring, verus]
    fields:
      req-type: functional
      priority: must
      verification-criteria: >
        Verus proof: innovation(measurement_residual_a) >=
        innovation(measurement_residual_b) when |a| >= |b|.
    links:
      - type: derives-from
        target: SYSREQ-FALCON-001

  - id: SWREQ-FALCON-EKF-P04
    type: sw-req
    title: "EKF-P04: WCET bounded by IMU sample interval"
    status: approved
    description: >
      The estimator's process_sample function shall complete
      within the IMU sample interval (1 ms at 1 kHz) on the
      target Cortex-M7 (480 MHz). Bounded by Lean WCET proof.
    tags: [falcon, ekf, wcet, real-time, lean]
    fields:
      req-type: non-functional
      priority: must
      verification-criteria: >
        Lean WCET proof: process_sample has bounded execution time
        in instruction count, validated by criterion benchmark on
        Cortex-M7 hardware.
    links:
      - type: derives-from
        target: SYSREQ-FALCON-001
