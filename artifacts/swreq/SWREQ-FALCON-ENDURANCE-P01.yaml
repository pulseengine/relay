artifacts:
  - id: SWREQ-FALCON-ENDURANCE-P01
    type: sw-req
    title: "ENDURANCE-P01 — a position hold shall stay bounded for HOURS, not seconds, and be watched nightly"
    status: implemented
    release: falcon-v1.140.0
    description: >
      DEMOTED verified -> implemented 2026-10-01 by independent review (#497).
      THREE OF THIS REQUIREMENT'S OWN "shall" CLAUSES ARE UNMET:

      (1) "at least ONE HOUR on the reference Gazebo plant" HAS NEVER RUN. On a
      `schedule` event `github.event.inputs` is empty, so soak.yml's
      `MAX="${GZ_MAX_S:-120}"` fell back to 120 s. The job printed
      "::warning::gz hold is 120s, short of the 1 h ENDURANCE-P01 target" and
      SUCCEEDED, every night. Introduced when GZ_MAX_S was bound through `env:`
      to close a `${{ }}` injection -- the injection fix was right, the default
      was not. Now climbs to 3600 s on a schedule; NOT YET OBSERVED to pass.

      (2) THE RATCHET COULD NOT CATCH A REGRESSION. `GZ_FLOOR_S` sat at 25 s
      against a measured 120 s, so a 4.8x regression would have passed. Now 120.

      (3) "BOTH PATHS. The soak shall run the wasm component as well as the
      native binary" -- there is NO such step. `grep -in wasm soak.yml` exits 1.

      This artifact's own text says "Only the gz number satisfies this
      requirement; the analytic soak exists to keep the math half honest". The
      analytic 12 h tier IS sound and nightly-green with the noise
      (FV-FALCON-ENDURANCE-001) -- it just is not what this requirement asks
      for. Re-promotion needs a gz hour actually observed, and the wasm path
      built, in a code-free PR.

      Commanded to hold a fixed NED position, the vehicle shall remain within
      1.0 m horizontally and 0.5 m vertically of the setpoint for at least ONE
      HOUR on the reference Gazebo plant, and shall be exercised nightly at
      multi-hour durations on the analytic plant.

      WHY IT EXISTS. The current ceiling is about 26 seconds (#403). A flight
      stack whose hold is measured in seconds cannot do the job the vehicle
      exists for; every mission length of interest is minutes to hours.

      WHAT IS ALREADY TRUE, MEASURED. The control law and every integrator are
      numerically stable over hours. On the analytic plant, flightcore scenario,
      250 Hz:

        duration     final_dist   rms_steady   est_z     wall
        1 h          0.01 m       0.01 m       -1.99 m   1.32 s
        4 h          0.01 m       0.01 m       -1.99 m   5.36 s
        12 h         0.01 m       0.01 m       -1.99 m   16.01 s

      Twelve hours is ~10^7 ticks with no drift in the hold, no growth in any
      integrator, and no f32 degradation. So the hours problem is NOT windup,
      NOT numeric drift, and NOT the controller. Whatever breaks at 26 s is in
      the gz sensor path — 5 Hz aiding, real noise, the estimator's response to
      them — which is where #403 must be diagnosed.

      HOW MUCH THAT EVIDENCE IS WORTH, honestly. The analytic plant is close to
      the mixer's own inverse, so it cannot reveal an allocation error and it
      does not model sensor noise, latency or the aiding cadence. A 12 h PASS
      there establishes that the MATH does not degrade. It does not establish
      that a vehicle flies. Only the gz number satisfies this requirement; the
      analytic soak exists to keep the math half honest cheaply, and to localise
      any future regression to one side of that line.

      COST, which is why this is affordable nightly. 12 h of analytic flight
      costs 16 s of wall clock (~2700x real time), so the whole multi-hour tier
      is seconds of compute. The gz tier runs near real time (RTF ~0.85-0.98),
      so an hour of gz flight costs about an hour — nightly, not per-PR.

      THE RATCHET. Until the gz hold reaches an hour, the nightly job shall
      record the longest duration that holds and FAIL if it regresses below the
      established floor. A number that is published every night and may not get
      worse is worth more than a target nobody measures.

      BOTH PATHS. The soak shall run the wasm component as well as the native
      binary, per SWREQ-FALCON-WASMEQ-P01 — an endurance property that holds for
      only one of the two is a seam defect, and a divergence that takes an hour
      to appear is exactly what a per-PR differential cannot see.

      DEPENDS ON: #403 (horizontal divergence at ~26 s) is the blocking defect.
      #413 (battery defaults to a healthy 16.0 V) also matters here: a real
      endurance flight must eventually trip a battery failsafe, and today it
      never can.

      FALSIFICATION: wrong if a 1 h stationary 2 m gz hold leaves the vehicle
      more than 1.0 m horizontally or 0.5 m vertically from the setpoint, or if
      the analytic 12 h soak shows any unbounded integrator.

      RELEASE PLAN (2026-09-17). Moved from v1.139 to v1.140, alongside HOLD-P01. An hours-long hold is meaningless while a 60 s hold diverges, so the two land together and HOLD-P01 comes first.

      CORRECTION (2026-09-17, #435), kept rather than rewritten above. The analytic plant this requirement cites (`MockPhysics`) applies NO torque: the vehicle cannot tilt, so its 12 h PASS is a one-dimensional altitude hold. It does support "no altitude-loop windup and no f32 drift over ~10^7 ticks". It does NOT support "the hours problem is NOT the controller": a plant that cannot tilt never exercises the attitude or horizontal-position loops, which is exactly where #403 fails, and #434 then showed that loop is unstable under sparse aiding. The Tier-1 soak must move to a plant that can tilt (SimBackend) and check horizontal hold.

      THE ANALYTIC TIER WAS VACUOUS FOR TWO REASONS (#435, measured
      2026-09-18), not the one the issue names:

        1. NO TORQUE. `MockPhysics::step` summed the motor commands into a
           collective and applied no moment at all ("the mixer's torque is
           approximated as zero in this scaffold"), so the vehicle could not
           tilt whatever the attitude loop commanded. It now applies the
           verified mixer's own allocation (`motors_to_torque_signs` scaled by
           0.25, matching `SimBackend`, so the two analytic plants respond to a
           motor command alike).

        2. NOTHING DISTURBED IT. Even with torque, the scenario starts level at
           the setpoint on a perfectly symmetric plant, so the horizontal loop
           is never excited and the hold is 0.000 m by construction at any
           duration. The bench gained an `IMU_NOISE` knob (the one #435 used
           locally and never committed); gz bakes noise into its own sensors so
           it is a no-op there, and the default 0.0 leaves every existing
           scenario byte-identical.

      WHAT THE TIER MEASURES NOW (mock, gyro sigma 0.01, 250 Hz, 5 Hz aiding):

        | flight | horizontal peak | horizontal final | altitude |
        |---|---|---|---|
        | 120 s | 0.24 m | 0.11 m | 0.01 m |
        | 1 h | 0.37 m | 0.13 m | 0.01 m |
        | 12 h | 0.46 m | 0.16 m | 0.01 m |

      Before the change every one of those rows was 0.000 m horizontal.

      THE NIGHTLY JOB MEASURES THE SAME THING. `soak.yml`'s analytic tier runs
      with `IMU_NOISE: '0.01'`, the sigma this table is measured at. Without it
      the job would keep reporting a 12 h PASS at 0.000 m — the guardrail
      passing vacuously while the requirement claims a measured hold (caught in
      review of #456, 2026-09-18).

      AND IT CATCHES THE DEFECT IT USED TO HIDE. The same torque-capable,
      disturbed plant run against the PRE-#452 estimator diverges: 1 746 m
      horizontal at 120 s, and 124 km at 1 h with the altitude estimate at
      5e22 m. The vacuous plant concealed exactly the fault the gz plant
      showed as a 40 s ceiling (#403/#434) — which is why a 12 h PASS on it
      was worth nothing.


      ======================================================================
      CLAUSE (1) IS NOW SATISFIED BY MEASUREMENT (2026-10-07). The hour has
      run, on the reference Gazebo plant, FOUR NIGHTS RUNNING:

        2026-10-03  longest holding duration 3600s
        2026-10-04  longest holding duration 3600s
        2026-10-05  longest holding duration 3600s
        2026-10-06  longest holding duration 3600s

      and every rung passed on the way up — 25 / 40 / 60 / 90 / 120 / 300 /
      900 / 3600 s, each one PASS, read from the nightly `gz endurance watch`
      job's own ladder output. #497 was right that it "HAS NEVER RUN": a
      `schedule` event left `github.event.inputs` empty so
      `MAX="${GZ_MAX_S:-120}"` capped every nightly at 120 s. #507 fixed that
      default, and the ladder has climbed the whole way ever since.

      CLAUSE (2) IS FIXED IN THE SAME CHANGE. `GZ_FLOOR_S` sat at 120 against a
      measured 3600 — the SAME defect #497 caught at 25-vs-120, at a worse
      ratio: the floor trailed the measurement by 30x, so a 30x endurance
      regression would have passed silently. Ratcheted to 3600, which is also
      the requirement's target, so from here any regression below an hour fails
      the nightly.

      CLAUSE (3) REMAINS UNMET, AND IT IS WHY THIS STAYS `implemented`.
      "BOTH PATHS. The soak shall run the wasm component as well as the native
      binary" — `grep -in wasm .github/workflows/soak.yml` still exits 1. There
      is no wasm leg. An endurance property that holds for only one of the two
      paths is not the property this requirement states, and the wasm harness
      exists (tests/cascade-sitl-wasm, which already holds 2.00 m on gz and
      carries the rotor-out verdict), so this is wiring rather than new work.

      ALSO CORRECTED, because I recorded the opposite: I had written that the
      nightly schedule was "unproven" and that the 03:17 slot "did not fire".
      Both wrong — five consecutive successful nightlies exist, and the run I
      called absent fired at 09:43 the same morning. My claim came from
      `gh run list --limit 4`, where 34 broken push-event runs from the #498
      outage had crowded every scheduled run out of the window. The real
      schedule finding is duller: GitHub throttles this cron by ~6-7 h
      (03:17 -> ~09:00-10:20). It fires daily and succeeds, so the "watched
      nightly" clause is met. `scripts/soak-freshness.rs` now measures that
      directly instead of by eye.

      ======================================================================
      CLAUSE (3) IS NOW BUILT AND MEASURED (2026-10-07) — the last of the three.
      Status stays `implemented`: the leg is not on main yet, and promotion is a
      separate code-free PR.

      `wasm-endurance` ("wasm endurance watch (BOTH PATHS)") runs the published
      Component Model artifact against the same gz plant on the same ladder, so
      `grep -in wasm .github/workflows/soak.yml` no longer exits 1. Run
      37621040540, 92 min 40 s, EVERY RUNG PASS to the 1 h target:

        25s   |err| 0.12 m      300s   |err| 0.00 m
        40s   |err| 0.02 m      900s   |err| 0.00 m
        60s   |err| 0.00 m     3600s   |err| 0.00 m
        90s   |err| 0.00 m
        120s  |err| 0.00 m     -> "longest holding duration 3600s"

      The error SHRINKS down the ladder. That is a settling transient, not
      drift — the opposite shape from #403, where the excursion grew with time.
      A longer flight is a cleaner flight on this path, which is the result the
      requirement wanted and did not have. Both paths now reach 3600 s.

      CLAUSE (2) NOW APPLIES TO BOTH LEGS. `WASM_FLOOR_S` was 25 in the first
      cut of this job — correct then, because 25 s was the only duration the
      component had ever been run to, and inheriting the native 3600 would have
      asserted an endurance it had never shown. The ladder has since earned it,
      so the floor is ratcheted to 3600. Leaving it at 25 against a measured
      3600 would have reproduced THIS REQUIREMENT'S OWN clause (2) — the defect
      it was demoted for — on the very leg added to close clause (3), at a worse
      ratio than either prior instance: 144x versus 4.8x and 30x.

      THAT FLOOR RESTS ON ONE DISPATCHED OBSERVATION, which the job's comment
      says out loud. `BEST < 3600` iff ANY of the 8 sequential rungs fails, each
      with its own fresh gz server on a hosted runner, so a first-night red is
      as likely to be a flaky rung as a regression. It is readable rather than
      ambiguous: the step prints the breaking rung and which of three things
      happened — TIMED OUT, verdict FAIL, or exited without a verdict
      (infrastructure). The word REGRESSED is not to be believed without the
      break reason, and the floor is not to be lowered without quoting it.

      THE NIGHT COUNT ABOVE IS SIX, NOT FOUR. The block above lists 10-03..10-06
      because that is what the window held when it was written; 36991404659
      (10-02) and 37605915444 (10-07) each also published 3600s, so the gz hour
      now has six consecutive scheduled observations.

      THIS LEG CANNOT REPEAT CLAUSE (1)'s BUG, BY CONSTRUCTION. Its ladder is
      hardcoded (`for D in 25 40 60 90 120 300 900 3600`) with no
      `github.event.inputs` dependency, so there is no input to fall back from
      when `schedule` leaves it empty — the exact mechanism that capped the
      native tier at 120 s for weeks. The cost of that choice, stated now rather
      than discovered later: the job cannot be shortened for a smoke test and
      spends ~92 min per run. Both gz tiers are `ubuntu-latest` (the analytic
      tier is the self-hosted one), so this is hosted time, not fleet time.

      WHAT REMAINS BEFORE PROMOTION, and it is one night: #524 merges, and ONE
      `schedule` run exercises the rung. The dispatch above proves the job works
      end to end; a scheduled run proves it FIRES on the trigger that matters,
      and clause (1) is the standing proof that "the job exists" and "the job
      does the work nightly" are different claims. The job has no `if:` gate, so
      this is a confirmation rather than a risk.

      THE NATIVE TIER'S RED IN RUN 37621040540 IS NOT THE CEILING RETURNING. It
      logged "longest holding duration 25s (floor 120s)" -> REGRESSED, because I
      dispatched `gz_max_s=25` from a branch cut before the floor was ratcheted:
      the job honoured the input, climbed to 25 s, and the ratchet correctly
      rejected it. The wasm leg ignored the same dispatch (hardcoded ladder) and
      flew the real hour. Recorded because a red endurance gate is precisely
      what a later reader would misread as a regression.
    tags: [requirement, falcon, endurance, soak, gazebo, nightly, v1.140]
    links:
      - type: derives-from
        target: SYSREQ-FALCON-010
