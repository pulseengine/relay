artifacts:
  - id: SWREQ-MM-P01
    type: sw-req
    title: "MM-P01: Valid only when address in range, size > 0, alignment ok"
    status: implemented
    release: falcon-v1.144.0  # moved from v1.143 (owner 2026-11-25): cFS port: FV-RELAY-KANICI-001 is not falcon-tagged, so the gate never runs it; SV-RELAY-013 has no runnable steps
    description: >
      validate_request shall return Valid only when all of the following
      hold: 0 < size <= max_operation_size; ram_start <= address < ram_end;
      address + size <= ram_end, so the whole access lies in RAM; and, for
      Peek and Poke only, address is a multiple of size (sizes 0 and 1 are
      always aligned). LoadFromFile, DumpToFile and Fill have no alignment
      check.
    tags: [memory-manager, validation, safety, verus]
    fields:
      req-type: safety
      priority: must
      verification-criteria: >
        Unit test boundaries_pinned_by_mm_p01 (relay-mm) pins every edge:
        ram_start in, ram_start - 4 out, ram_end out; address + size ==
        ram_end in and one byte past out; size 1 and max in, max + 1
        SizeTooLarge, 0 SizeZero; a misaligned Poke refused and a misaligned
        LoadFromFile, DumpToFile and Fill accepted. Mutants `end_addr >
        ram_end + 1` and `size >= max` each fail it. The Verus contract on
        validate_request proves only the SizeZero case (MM-P03).
    links:
      - type: derives-from
        target: SYSREQ-MM-001

  - id: SWREQ-MM-P02
    type: sw-req
    title: "MM-P02: AddressOutOfRange when address outside [ram_start, ram_end)"
    status: approved
    description: >
      The validate function shall return AddressOutOfRange when the
      requested address is outside the configured RAM region.
    tags: [memory-manager, validation, bounds, verus]
    fields:
      req-type: safety
      priority: must
      verification-criteria: >
        Verus proof: validate returns AddressOutOfRange when address < ram_start
        or address >= ram_end.
    links:
      - type: derives-from
        target: SYSREQ-MM-001

  - id: SWREQ-MM-P03
    type: sw-req
    title: "MM-P03: SizeZero when size == 0"
    status: approved
    description: >
      The validate function shall return SizeZero when the requested
      operation size is zero.
    tags: [memory-manager, validation, safety, verus]
    fields:
      req-type: safety
      priority: must
      verification-criteria: >
        Verus proof: validate returns SizeZero when size == 0.
    links:
      - type: derives-from
        target: SYSREQ-MM-001

  - id: SWREQ-MM-P04
    type: sw-req
    title: "MM-P04: is_aligned correct"
    status: approved
    description: >
      The is_aligned function shall return true if and only if
      address % size == 0.
    tags: [memory-manager, alignment, correctness, verus]
    fields:
      req-type: functional
      priority: must
      verification-criteria: >
        Verus proof: is_aligned ensures result == (address % size == 0).
    links:
      - type: derives-from
        target: SYSREQ-MM-001
