      representative stream engine) under witness MC/DC: inspect the truth table
      for unique-cause / masking vectors on each decision, zero unresolved gap
      rows. Shares the spirit of #145 (witness MC/DC on the real flight
      component); may surface the same component-format parse gap #145 notes,
      which is itself a valuable confirm/triage.
    tags: [relay, stream, p3, witness, mcdc, verification, "v1.75"]
