artifacts:
  - id: SWREQ-CI-P01
    type: sw-req
    title: "CI-P01: validate_header returns Valid only when all checks pass"
    status: implemented
    release: falcon-v1.143.0
    description: >
      The validate_header function shall return Valid only when all of the
      following hold: stream_id equals one of the first stream_id_count
      entries of valid_stream_ids; the header's checksum field is 0 (the
      caller stores the cFS-style XOR over the whole packet there, see
      compute_checksum, and a packet whose bytes XOR to 0 is intact);
      function_code <= max_cmd_code; and min_length <= length <= max_length,
      both bounds inclusive.
    tags: [command-ingest, validation, safety, verus]
    fields:
      req-type: safety
      priority: must
      verification-criteria: >
        Kani verify_valid_header_accepted and the relay-ci unit tests. The
        Verus contract on validate_header is `ensures true` and proves
        nothing about the result, so it is not cited as evidence here.
    links:
      - type: derives-from
        target: SYSREQ-CI-001

  - id: SWREQ-CI-P02
    type: sw-req
    title: "CI-P02: compute_checksum is deterministic"
    status: approved
    description: >
      The compute_checksum function shall be deterministic: same input
      bytes always produce the same checksum output.
    tags: [command-ingest, deterministic, checksum, verus]
    fields:
      req-type: safety
      priority: must
      verification-criteria: >
        Verus proof: compute_checksum is a pure function with deterministic output.
    links:
      - type: derives-from
        target: SYSREQ-CI-001

  - id: SWREQ-CI-P03
    type: sw-req
    title: "CI-P03: is_valid_stream_id returns true only for configured IDs"
    status: approved
    description: >
      The is_valid_stream_id function shall return true only for stream
      IDs present in the configured valid stream ID list.
    tags: [command-ingest, validation, stream-id, verus]
    fields:
      req-type: safety
      priority: must
      verification-criteria: >
        Verus proof: is_valid_stream_id matches only configured stream IDs.
    links:
      - type: derives-from
        target: SYSREQ-CI-001

  - id: SWREQ-CI-P04
    type: sw-req
    title: "CI-P04: stream_id_count bounded by array size"
    status: approved
    description: >
      The valid stream ID list shall never exceed MAX_STREAM_IDS (16)
      entries.
    tags: [command-ingest, bounded, invariant, verus]
    fields:
      req-type: safety
      priority: must
      verification-criteria: >
        Verus proof: stream_id_count <= MAX_STREAM_IDS.
    links:
      - type: derives-from
        target: SYSREQ-CI-001
