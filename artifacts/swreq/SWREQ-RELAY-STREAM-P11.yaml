artifacts:
  - id: SWREQ-RELAY-STREAM-P11
    type: sw-req
    title: "STREAM-P11 (v1.73) — composed control-cascade stream pipeline (wac_plug)"
    status: implemented
    release: falcon-v1.72.0
    description: >
      PLANNED v1.73. With shared stream types in place (STREAM-P10), wire the
      five cascade stream components into ONE composed P3 flight-control stream
      component via wac_plug: a `cascade-stream` socket world imports the five
      stream interfaces and exports the pipeline (stream<imu-sample> ->
      stream<motor-pwm>); the five stream components are the plugs. This is the
      streaming counterpart of the existing sync falcon-cascade-composed, and the
      concrete demonstration of relay's "composition is stream wiring" thesis:
      iekf -> pos -> att -> rate -> mixer as one composed async stream graph.
    tags: [relay, cascade, stream, p3, composition, wac, "v1.73"]
    fields:
      req-type: functional
      priority: should
      verification-criteria: >
        A wac_plug target //:falcon-cascade-stream-composed builds the five
        cascade stream plugs into one P3 component exporting the imu->pwm
        pipeline; CI builds it (the Component Model cascade job). Depends on
        STREAM-P10.
    links:
      - type: derives-from
        target: SYSREQ-FALCON-008
