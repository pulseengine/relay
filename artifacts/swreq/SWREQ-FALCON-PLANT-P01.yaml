artifacts:
  - id: SWREQ-FALCON-PLANT-P01
    type: sw-req
    title: "PLANT-P01 — The SITL plant is a library an external lockstep harness can step tick by tick (input to North Star O1)"
    status: draft
    release: falcon-v1.144.0
    description: >
      An input to North Star O1, not a score (bet B3, relay#705, jess#317 B4). It
      feeds the HIL rung of jess's ladder, and only jess's rung result counts
      toward O1. Physics and MockPhysics (examples/falcon-sitl-gz/src/physics.rs)
      and pace.rs move into a library crate that falcon-sitl-gz and
      tests/cascade-sitl-wasm depend on, replacing the #[path] includes. The
      library exposes reset(seed) and step(motor_words, dt) -> sensor frame on the
      falcon-hitl wire encoding (VERSION 3). The gz backend ignores dt and is out of
      scope. A WASI component build follows in a later release.
    tags: [falcon, relay, sitl, plant, lockstep, hil, jess, north-star-o1-input, issue-705]
    fields:
      req-type: functional
      priority: should
      verification-criteria: >
        Method: test with negative controls. (1) No behaviour change: the
        supervised-hover mock trace is byte-identical before and after the move.
        (2) Two runs with the same seed and the same motor stream give identical
        sensor bytes over 2000 ticks x 3 seeds. (3) A mutated plant parameter
        (mass +1 ULP) and a mutated dt each change the bytes. The control must go
        red, proving the comparison sees the plant. Counted as met only when jess's
        harness steps it (jess#317), not relay's own test crate.
    links:
      - type: derives-from
        target: SYSREQ-FALCON-020
