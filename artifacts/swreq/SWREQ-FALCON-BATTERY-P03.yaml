artifacts:
  - id: SWREQ-FALCON-BATTERY-P03
    type: sw-req
    title: "BATTERY-P03 — a pack that stops REPORTING in flight shall raise the battery failsafe, not fly on"
    status: verified
    release: falcon-v1.140.0
    description: >
      While airborne, if no battery reading arrives for longer than one
      second, the vehicle shall raise the battery failsafe -- BUT ONLY IF IT HAS
      EVER HAD A BATTERY READING (declare-on-first-sight, #475/#476). A vehicle
      that never reported a pack is not failsafed in flight: the first version of
      this rule grounded every backend returning `None` one second after
      takeoff, which in the supervised rotor-out scenario commanded Land at 1.0 s
      and Disarmed at 1.6 s on a flight whose fault was not injected until 8.0 s.
      THIS TEXT DID NOT GET THAT CORRECTION WHEN THE CODE DID -- independent
      review found the requirement's falsification clause was satisfied by a
      PASSING cited test, `a_vehicle_that_never_had_a_battery_sense_is_not_
      failsafed_in_flight`, which asserts 16 s airborne with `None` throughout
      (#497). Corrected here. The code is
      `batt_lost = self.batt_seen && self.batt_missing_s > BATT_SILENCE_S`
      (the same path a
      low or critical pack takes), rather than continue on the last reading it
      happened to see.

      WHY IT EXISTS. #413 established that absence is not health and narrowed
      the reader to `Option<f32>`, so a backend with no battery sense returns
      `None` instead of a fabricated voltage. That closed the PRE-ARM half: the
      pre-arm gate refuses to arm without a pack. The IN-FLIGHT half stayed
      open, and the v1.139 candidate review (#458/#459) found it: on `None` the
      supervisor recorded `batt_present = false` and did nothing else.
      `batt_present` is read only by `update_preflight`, which is long past by
      then, and the failsafe evaluates `batt_state.low || batt_state.critical`
      — latches that only advance when the estimator is UPDATED. So a vehicle
      that armed with a healthy pack and then lost its ADC, harness or driver
      mid-flight kept a frozen last-known-healthy snapshot and no failsafe
      could ever fire while the pack drained to depletion.

      REPRODUCED before it was fixed: armed, took off, reached Loiter, then the
      voltage sense stopped reporting. After 4 s the mode was still `Loiter`
      (`losing_the_battery_sense_in_flight_actuates_failsafe`).

      THE THRESHOLD. One second of silence — far longer than any sane sense
      interval (a dropped sample must not trip it) and far shorter than the
      reserve an RTL needs. The pre-existing low/critical debounce is
      unchanged; this is an additional term, not a replacement.

      FALSIFICATION: wrong if an airborne vehicle THAT HAS REPORTED A PACK and whose `read_battery_v`
      returns `None` for more than a second stays in a flying mode, or if a
      single dropped reading raises the failsafe.
    tags: [requirement, falcon, battery, failsafe, fail-safe, v1.140]
    links:
      - type: derives-from
        target: SYSREQ-FALCON-010
