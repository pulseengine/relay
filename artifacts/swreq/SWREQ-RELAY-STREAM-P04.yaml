artifacts:
  - id: SWREQ-RELAY-STREAM-P04
    type: sw-req
    title: "STREAM-P04 — relay-sc exposes a Component-Model Preview 3 async stream interface (completes the cFS set)"
    status: implemented
    description: >
      The fourth and final cFS engine to follow the streamification TEMPLATE
      (after LC P01, SCH P02, HK P03): relay-sc shall expose a WASM
      Component-Model Preview 3 (P3) async interface
        monitor: func(ticks: stream<time-tick>) -> stream<dispatched-command>
      implemented as a genuine async stream transformer (async fn over a
      StreamReader, .next().await on the input ticks, .write().await on the
      output dispatched commands), built as a P3 component (wasi_version = "p3").
      This completes the cFS engine set (LC/SCH/HK/SC) as P3 async streams.

      It RUNS THE VERIFIED ENGINE, not an inline copy: the component does
      `use relay_sc::engine;` and the //:relay-sc-stream bindgen target `deps`
      on the relay-sc-engine rust_library over the verified plain/ tree — so the
      streaming monitor() invokes the ACTUAL Verus-verified
      CommandStore::process_tick, the same engine the sync relay-sc component
      runs (#168).

      As with P01..P03, the async RUNTIME that executes these streams is kiln's
      fuel-metered, ASIL-graded async scheduler (shipped but dormant); this
      requirement's scope is AUTHORING + BUILDING a valid P3 async component,
      NOT end-to-end execution on kiln.
    tags: [relay, relay-sc, stream, async, p3, component-model, streamification, template]
    fields:
      req-type: functional
      priority: must
      verification-criteria: >
        crates/relay-sc/wit/stored_command_stream.wit declares
        `monitor: func(stream<time-tick>) -> stream<dispatched-command>`; the
        Rust implementation (wasm_stream_component.rs) is a real async stream
        transformer over StreamReader with .next().await / writer.write().await,
        running relay_sc::engine::CommandStore::process_tick; the
        //:relay-sc-stream bazel target builds it as a wasi_version="p3"
        component, exercised in CI (.github/workflows/bazel.yml builds it
        alongside the other three stream components).
    links:
      - type: derives-from
        target: SYSREQ-FALCON-008
