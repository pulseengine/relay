artifacts:
  - id: SWREQ-RELAY-STREAM-P03
    type: sw-req
    title: "STREAM-P03 — relay-hk exposes a Component-Model Preview 3 async stream interface"
    status: implemented
    release: falcon-v1.64.0
    description: >
      The third cFS engine to follow the streamification TEMPLATE (after the
      Limit Checker P01 and the Scheduler P02): relay-hk shall expose a WASM
      Component-Model Preview 3 (P3) async interface
        monitor: func(batches: stream<source-batch>) -> stream<hk-packet>
      implemented as a genuine async stream transformer (async fn over a
      StreamReader, .next().await on the input batches, .write().await on the
      output packets), built as a P3 component (wasi_version = "p3").

      It RUNS THE VERIFIED ENGINE, not an inline copy: the component does
      `use relay_hk::engine;` and the //:relay-hk-stream bindgen target `deps`
      on the relay-hk-engine rust_library over the verified plain/ tree — so the
      streaming monitor() invokes the ACTUAL Verus-verified CopyTable::collect
      (properties HK-P02 no-overflow, HK-P04 entry-count bounded), the same
      engine the sync relay-hk component runs (#168).

      As with P01/P02, the async RUNTIME that executes these streams is kiln's
      fuel-metered, ASIL-graded async scheduler (shipped but dormant); this
      requirement's scope is AUTHORING + BUILDING a valid P3 async component,
      NOT end-to-end execution on kiln.
    tags: [relay, relay-hk, stream, async, p3, component-model, streamification, template]
    fields:
      req-type: functional
      priority: must
      verification-criteria: >
        crates/relay-hk/wit/housekeeping_stream.wit declares
        `monitor: func(stream<source-batch>) -> stream<hk-packet>`; the Rust
        implementation (wasm_stream_component.rs) is a real async stream
        transformer over StreamReader with .next().await / writer.write().await,
        running relay_hk::engine::CopyTable::collect; the //:relay-hk-stream
        bazel target builds it as a wasi_version="p3" component, exercised in CI
        (.github/workflows/bazel.yml builds it alongside the other stream
        components).
    links:
      - type: derives-from
        target: SYSREQ-FALCON-008
