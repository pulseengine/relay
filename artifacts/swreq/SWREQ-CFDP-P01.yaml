artifacts:
  - id: SWREQ-CFDP-P01
    type: sw-req
    title: "CFDP-P01: State transitions are valid (no skipping states)"
    status: implemented
    release: falcon-v1.144.0  # moved from v1.143 (owner 2026-11-25): cFS port: FV-RELAY-KANICI-001 is not falcon-tagged, so the gate never runs it; SV-RELAY-016 has no runnable steps; FV-RELAY-VCHAIN-001 is not falcon-tagged, so the gate never runs it
    description: >
      Each process_ack, tick or process_nak call shall leave a CFDP
      transaction's state unchanged or move it exactly one step along
      Idle -> MetadataSent -> DataSending -> EofSent -> Finished, with one
      exception: process_nak moves a transaction in DataSending or EofSent
      to Cancelled once its retransmit count has reached max_retransmit.
      Finished and Cancelled are terminal.
    tags: [cfdp, state-machine, correctness, verus]
    fields:
      req-type: functional
      priority: must
      verification-criteria: >
        Unit test transitions_never_skip_a_state (relay-cfdp): every sequence
        of up to six ACK / tick / NAK events, for file sizes 0, 1 and 1024
        and retransmit limits 0, 1 and 3 (39,366 transitions), obeys the rule
        above; a mutant whose ACK moves Idle to DataSending fails it. Kani
        verify_state_valid only shows the state stays a declared variant and
        is not evidence for this requirement.
    links:
      - type: derives-from
        target: SYSREQ-CFDP-001

  - id: SWREQ-CFDP-P02
    type: sw-req
    title: "CFDP-P02: Retransmit count bounded by max_retransmit"
    status: approved
    description: >
      The retransmission counter for any transaction shall never exceed
      the configured max_retransmit limit.
    tags: [cfdp, bounded, retransmit, verus]
    fields:
      req-type: functional
      priority: must
      verification-criteria: >
        Verus proof: retransmit_count <= max_retransmit.
    links:
      - type: derives-from
        target: SYSREQ-CFDP-001

  - id: SWREQ-CFDP-P03
    type: sw-req
    title: "CFDP-P03: bytes_sent <= file_size"
    status: approved
    description: >
      The bytes_sent counter for any transaction shall never exceed
      the file_size. No data is sent beyond the file boundary.
    tags: [cfdp, bounded, data-integrity, verus]
    fields:
      req-type: safety
      priority: must
      verification-criteria: >
        Verus proof: bytes_sent <= file_size after every send operation.
    links:
      - type: derives-from
        target: SYSREQ-CFDP-001

  - id: SWREQ-CFDP-P04
    type: sw-req
    title: "CFDP-P04: Transaction count bounded by MAX_TRANSACTIONS"
    status: approved
    description: >
      The number of concurrent CFDP transactions shall never exceed
      MAX_TRANSACTIONS.
    tags: [cfdp, bounded, invariant, verus]
    fields:
      req-type: functional
      priority: must
      verification-criteria: >
        Verus proof: transaction_count <= MAX_TRANSACTIONS.
    links:
      - type: derives-from
        target: SYSREQ-CFDP-001
