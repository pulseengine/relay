artifacts:
  - id: SWREQ-MD-P01
    type: sw-req
    title: "MD-P01: Invariant holds after init"
    status: implemented
    release: falcon-v1.144.0  # moved from v1.143 (owner 2026-11-25): cFS port: FV-RELAY-KANICI-001 is not falcon-tagged, so the gate never runs it; SV-RELAY-012 has no runnable steps
    description: >
      After initialization, the dwell table shall be empty with
      entry_count at zero.
    tags: [memory-dwell, invariant, verus]
    fields:
      req-type: functional
      priority: must
      verification-criteria: >
        Unit test new_table_is_empty_md_p01 (relay-md) asserts the table count is 0
        right after new(). In the Verus source new() is
        #[verifier::external_body], so Verus trusts its postcondition (inv()
        and a zero count) and does not prove it; the Verus contract is not
        cited as evidence here.
    links:
      - type: derives-from
        target: SYSREQ-MD-001

  - id: SWREQ-MD-P02
    type: sw-req
    title: "MD-P02: add_entry succeeds iff table not full"
    status: approved
    description: >
      The add_entry function shall succeed if and only if the table is
      not at maximum capacity. On success, count increases by 1.
    tags: [memory-dwell, bounded, api, verus]
    fields:
      req-type: functional
      priority: must
      verification-criteria: >
        Verus proof: add_entry ensures result == !old(self).is_full_spec()
        and count increments on success.
    links:
      - type: derives-from
        target: SYSREQ-MD-001

  - id: SWREQ-MD-P03
    type: sw-req
    title: "MD-P03: get_samples output bounded by MAX_SAMPLES_PER_CYCLE"
    status: approved
    description: >
      The get_samples operation shall produce at most MAX_SAMPLES_PER_CYCLE
      sample requests per call.
    tags: [memory-dwell, bounded, output, verus]
    fields:
      req-type: functional
      priority: must
      verification-criteria: >
        Verus proof: get_samples ensures request_count <= MAX_SAMPLES_PER_CYCLE.
    links:
      - type: derives-from
        target: SYSREQ-MD-001

  - id: SWREQ-MD-P04
    type: sw-req
    title: "MD-P04: get_samples output bounded by entry_count"
    status: approved
    description: >
      The get_samples operation shall produce at most entry_count
      sample requests.
    tags: [memory-dwell, bounded, output, verus]
    fields:
      req-type: functional
      priority: must
      verification-criteria: >
        Verus proof: get_samples ensures request_count <= entry_count.
    links:
      - type: derives-from
        target: SYSREQ-MD-001
