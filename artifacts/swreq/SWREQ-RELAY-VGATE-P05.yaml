artifacts:
  - id: SWREQ-RELAY-VGATE-P05
    type: sw-req
    title: "VGATE-P05 — every verification track the release cites shall actually RUN, on main and on the PRs that change what it verifies"
    status: proposed
    release: falcon-v1.142.0
    description: >
      Every verification track cited as evidence (Verus, Kani, Rocq, Lean,
      witness coverage, the verification gate) shall execute on `main` and on
      every PR that changes what it verifies, and shall be able to fail.

      WHY IT EXISTS, AND WHY IT IS SEPARATE FROM VGATE-P04. VGATE-P04 (v1.139)
      makes a dark track VISIBLE in the release. This requirement makes it
      RUN. Known instances, each an issue:
        #405 — Verus has verified nothing since 2026-09-11: the toolchain
               cannot find core/std.
        #418 — verus.yml's PR trigger is path-filtered on LEAN paths, so the
               Verus gate never runs on the PRs that change Verus code.
        #410 — the required verification gate has no main backstop, and its
               scope filter can exclude what a PR changed.
        #407 — //:falcon-cascade-coverage fails to fuse (duplicate
               cabi_realloc export); CI has never produced the coverage.
        #417 — all three required gates can pass vacuously for a PR that
               touches only the shipped wasm components.

      FALSIFICATION: wrong if any cited verification track fails to execute
      on the last main commit of a release, or a PR changing verified code
      merges with that track skipped or vacuous.

      ======================================================================
      ALL FIVE INSTANCES MEASURED (2026-10-08). Status stays `proposed`: one is
      FIXED, one is made AUDITABLE, two are CONFIRMED STILL TRUE but their
      fixes carry a capacity cost that is not mine to spend, and one is
      PARTLY MEASURED. Recorded per-instance because "this requirement is open"
      is useless to whoever picks it up.

      #418 - FIXED. verus.yml's `pull_request` trigger was path-filtered on
      `proofs/lean/**` and `.github/workflows/lean.yml` - LEAN'S PATHS, in the
      VERUS workflow. The file is a copy of lean.yml and the filter came with
      it, so the Verus gate never ran on a PR that changed Verus code; it ran
      only when someone touched Lean. A path filter that excludes the very
      thing it gates is worse than no filter, because the check reports success
      for a PR it never examined. The same copy-paste had also left a Lean
      comment ("//proofs/lean:all is bazel's implicit all-rules target") inside
      the Verus step. Now filtered on `crates/**` + the bazel files that declare
      the `verus_test` targets + the workflow itself. Verus's `push: main` was
      already unfiltered, so the backstop existed; it was the PR path that was
      blind.

      #405 - NOT SETTLED, AND NOW AUDITABLE, which is the actual prerequisite.
      The claim is that Verus "has verified nothing since 2026-09-11: the
      toolchain cannot find core/std". The track LOOKS healthy - it has run on
      every main push and every run is green. Measured on run 37717381938
      (main, 2026-10-08):

        19 verus_test targets, discovered by bazel query (not enumerated)
        "Executed 19 out of 19 tests: 19 tests pass", not cached
        0.5-0.8 s per target, 12.4 s total
        ZERO occurrences of any verification summary in the 107 KB log

      12.4 s for nineteen SMT verification targets is implausibly fast - this
      repo's CBMC legs run minutes, and the Kani-0.68 breakage was caught
      because "every leg failed in ~11 s, which is far too fast for model
      checking". But the log CANNOT decide it, because `--test_output=errors`
      prints a target's output only when it FAILS. So on a green run the
      verification counts never reach the log at all, and the two hypotheses -
      verifies everything, verifies nothing - look identical from outside.
      THAT is the defect this requirement names, and it is fixed here: the
      workflow now prints the per-target test logs on success too.

      NO ASSERTION ON THE COUNT YET, deliberately. The exact wording
      rules_verus emits is not established from here, and a guessed pattern is
      either a spurious failure or a `|| true` that passes vacuously - the
      shape this requirement exists to abolish. Visible evidence is the
      precondition for asserting on it; the assertion lands once the format is
      read off a real run.

      #410 - CONFIRMED STILL TRUE. `.github/workflows/verification-gate.yml`
      declares `pull_request` + `workflow_dispatch` and NO `push: branches:
      [main]`, so the required verification gate has no main backstop: nothing
      re-runs it on the merge result.

      AND ITS FIX IS NOT FREE, which is why it is recorded rather than done.
      That gate is a ~45 min job on the `rust-cpu` pool, and the pool is
      measured at 7/7 busy with a 47-leg Kani matrix on it (#514: a `crates/**`
      PR took 9.6 h open-to-merge on 2026-10-07/08). Adding `push: main` buys a
      backstop at the cost of a full sweep per merge, and the gate's scope
      fast-path reads `pull_request.base.sha`, which is null on a push event -
      so it would likely take the FULL sweep every time rather than the scoped
      one. A scheduled or pre-tag backstop would satisfy this requirement's own
      falsification wording ("fails to execute on the LAST MAIN COMMIT of a
      release") at a fraction of the cost. Choosing between them is a capacity
      decision for the maintainer, not a mechanical fix.

      #417 - CONFIRMED STILL TRUE, mechanically. kani.yml's change-detection
      filter is `^(crates/|Cargo\.toml|Cargo\.lock|\.github/workflows/kani\.yml)`
      and `grep -c 'wasm/' .github/workflows/kani.yml` is 0. So a PR touching
      ONLY `wasm/` - the shipped components - skips the entire matrix and the
      roll-up `Kani gate` reports pass. Same capacity caveat as #410: adding
      `wasm/` makes every component change pay the 47-leg matrix. Worth noting
      the opposite argument too, so the fix is not applied reflexively: the
      Kani harnesses verify the ENGINES the components wrap, not the component
      artifacts, so the matrix may be the wrong gate for a wasm-only change -
      gazebo.yml already runs on every PR with NO path filter, deliberately, and
      is the differential oracle for exactly that case.

      #407 - PARTLY MEASURED, NOT CLAIMED EITHER WAY. coverage.yml runs on
      pushes and PRs and its recent runs are green. Whether it produces the
      `//:falcon-cascade-coverage` artifact specifically, or passes while
      skipping the target that #407 says fails to fuse, was NOT measured. A
      green workflow is not evidence the cited artifact exists - the same
      distinction #405 above turns on.

      ======================================================================
      #405 IS SETTLED, AND THE ANSWER IS THE GOOD ONE (2026-10-08). The
      assertion this requirement asks for now exists, with the format READ OFF
      A REAL RUN rather than guessed.

      #531 made the passing output visible. Run 37782958781 (main, after that
      landed) shows each target emitting

        verification results:: N verified, 0 errors

      Per target, read from the printed logs:

        ccsds 29  cfdp 15  ci 11  cs 14  ds 12  fm 11  hk 14  hs 16
        lc 22  mavlink 26  md 9  mm 7  nid 11  primitives 23  sc 20
        sca 8  sch 11  to 11                       tbl: see below
        ------------------------------------------------------------------
        270 FUNCTIONS VERIFIED, 0 ERRORS, and no `cannot find core/std`
        anywhere in the log.

      So "Verus has verified nothing since 2026-09-11" is REFUTED as of
      2026-10-06, when the track recovered. Measured over the last 40 runs: 22
      consecutive failures 09-23..10-02, then 15 consecutive successes from
      10-06. NO COMMIT IN THIS REPOSITORY touched verus.yml, MODULE.bazel or
      BUILD.bazel in that window, so the fix came from upstream - rules_verus is
      a checked-out sibling - and nobody here chose it, reviewed it, or verified
      what it changed. The track being green was never evidence; the counts are.

      THE 19TH TARGET IS THE INTERESTING ONE, AND THE DEFECT WAS MINE.
      relay_tbl showed NO verification line, which looked exactly like a
      vacuous pass. It was not: relay_tbl prints ~80 lines of Verus
      trigger-selection notes before its summary, and #531's `sed -n '1,80p'`
      window CUT THE SUMMARY OFF. A fixed head window can hide the very line
      the step exists to show. The step now greps the whole log for the summary
      and keeps the excerpt as context only.

      WHAT THE GATE NOW DOES, which is the "shall be able to fail" half of this
      requirement: it fails if ANY target reports 0 verified (a vacuous pass),
      if ANY target emits no summary at all, if ANY reports errors, or if the
      TOTAL falls below a floor of 200. Before this, the track could only fail
      by erroring - it could not fail by proving nothing.

      PROVEN TO FAIL, not assumed. The step body was extracted and run against
      a fixture built from run 37782958781's own 19 printed logs:

        healthy fixture                  283 verified, 19 targets   exit 0
        one target forced to 0 verified  "passed VACUOUSLY"         exit 1
        one target's summary removed     "proved nothing"           exit 1
        totals collapsed to 102          below the 200 floor        exit 1

      THE FLOOR IS 200 AGAINST A MEASURED 270, deliberately not 270. This is a
      ratchet against COLLAPSE, not a pin against the ordinary drift of adding
      and removing proofs; pinning at the measurement would turn every proof
      deletion into a red gate and the floor would be lowered casually. Raise it
      when a longer run establishes a higher stable floor.

      AND IT MOVES 61 OTHER REQUIREMENTS. SWREQ-RELAY-BOARD-P01 justifies not
      promoting 61 sw-reqs partly on their Verus evidence not running. It runs,
      and now provably verifies 270 functions. Their remaining blocker is
      therefore ONLY the SV-RELAY-* layer being `approved` with SV-RELAY-015
      carrying no `steps:` - a chain incomplete two levels up, unrelated to
      Verus.

      STILL OPEN IN THIS REQUIREMENT: #410 (a NIGHTLY main backstop for the
      verification gate - decided, not yet built), #417 (kani.yml's filter
      excludes wasm/; decided to LEAVE it and record gazebo.yml as the
      unfiltered differential oracle), #407 (coverage.yml is green but whether
      it produces //:falcon-cascade-coverage is still unmeasured).

    tags: [requirement, relay, verification-gate, verus, coverage, v1.142]
    links:
      - type: derives-from
        target: SYSREQ-FALCON-010
