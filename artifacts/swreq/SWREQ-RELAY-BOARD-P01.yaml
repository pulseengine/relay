artifacts:
  - id: SWREQ-RELAY-BOARD-P01
    type: sw-req
    title: "BOARD-P01 — every open issue AND every requirement shall carry a disposition that matches reality, measured rather than felt"
    status: proposed
    release: falcon-v1.143.0
    description: >
      Every open issue shall have exactly one recorded disposition — CLOSED
      with a tagged-release reference, CLOSED with a rationale, or OPEN with a
      named "remaining:" note — and the board's decay shall be visible as a
      number in CI rather than noticed by a human reading a long list.

      WIDENED 2026-10-01 (maintainer decision) TO COVER THE REQUIREMENT TRACE
      AS WELL AS THE ISSUE BOARD. Same mechanism, and the trace side is worse.

      A stale issue is visible on a list someone reads. A requirement whose
      status contradicts its own trace silently corrupts every readiness number
      we compute from it — and readiness is what gates a tag.

      MEASURED 2026-10-01, 275 sw-reqs. THE FIRST VERSION OF THIS COUNT WAS
      TOO WEAK and is corrected here: asking only "does something point a
      `verifies` link at it" gave 79 and called every one a status
      contradiction. Grading the chain by how far it actually reaches gives a
      very different, and actionable, picture:

        status says NOT STARTED (draft/proposed/approved)      90
          verifier is VERIFIED and has `steps:`               18   <- status lag
          verifier itself NOT verified (chain incomplete)      61
          no verifier at all (genuinely un-started)            11
        carrying no `release:` field                           77

      THE 61 ARE NOT STATUS-LAGGED. They are verified-by an `SV-RELAY-*`
      artifact that is ITSELF `approved` — and SV-RELAY-015, checked directly,
      carries NO `steps:` at all, only `method: automated-test`, while claiming
      to "combine unit test evidence (UV-CCSDS-001) and formal verification
      evidence (FV-CCSDS-001)". Their chain is incomplete two levels up.
      Promoting them would be wrong, and the real blocker is the SV-RELAY-*
      layer, not the requirements.

      Worse for that 61: every one cites a VERUS proof as its criterion, and the
      Verus track has verified NOTHING since 2026-09-11 (#405 — the toolchain
      cannot find core/std and all 19 proofs fail in 0.1 s). So their evidence
      does not merely lack promotion; it does not currently run.

      SO THE RE-VERIFICATION IS 18 REQUIREMENTS, NOT 79. The decision below
      stands and its cost is far smaller than first estimated.

      So 79 requirements are invisible to the plan TWICE: their status says
      un-started while a verification artifact points at them, and no release
      claims them. Spot-checked one — SWREQ-FALCON-MIX-P05 reads `approved`
      while `mix_thrust_floor` is implemented, FLOWN in the production loop
      (falcon-core:942) and verified by FV-FALCON-MIX-002. Two lifecycle stages
      behind reality. The pattern is systematic: every cFS-DNA engine (CCSDS,
      CFDP, CI, CS, DS, FM, HK, HS, LC, MD, MM, SC, SCA, SCH, TBL, TO) plus
      falcon's ATT/EKF/MIX/POS/RATE/MAVLINK got a full -P02..P0n property set
      authored, verified, and never status-updated.

      HOW THEY GET FIXED — maintainer decision 2026-10-01: RE-VERIFIED
      INDIVIDUALLY, not bulk-promoted with `rivet verify`. The reason is
      measured, not cautious: in one week this repo produced THREE artifacts
      whose cited evidence did not establish what they claimed — HOLD-001's
      outage test could not fail for the branch it named (#483, and that branch
      turned out to be actively harmful), the high-wind test passed only
      BECAUSE of a bug, and FAULT-005 claimed `steps:` while having none. Bulk
      promotion would stamp 79 requirements on citations nobody re-checked, in a
      repo with a demonstrated rate of bad citations.

      THE COST, RE-ESTIMATED after grading the chain: 18 x (read the artifact,
      run its evidence, judge whether it establishes the claim) -- tractable in
      a few passes, not weeks. The other 61 are a SEPARATE and larger problem:
      promote the SV-RELAY-* layer, which needs the Verus track alive first
      (#405). They are not in this release's scope and must not be promoted
      alongside the 18.

      MEASURED BASELINE, 2026-09-24 (57 open):

        age of the oldest issue                       163 d (#4)
        older than 6 months                             0
        3-6 months                                     11
        1-3 months                                     15
        under 1 month                                  31
        UNTOUCHED 30+ days                             24  (42%)
        untouched 100+ days                             6  (#4 #7 #8 #145 #153 #177)
        named in docs/RELEASE-PLAN.md                  46
        INVISIBLE to the plan                          11  (5 of them filed today)

      WHAT THE NUMBERS ACTUALLY SAY, because the instinct "57 open and old ones
      means rot" is only partly right here:

      (1) NOTHING IS ANCIENT. No issue predates 6 months; the repo is ~6 months
      old at this cadence. The oldest three (#4, #7, #8) are relay-FRAMEWORK
      items that predate the falcon flight arc, not forgotten flight bugs.

      (2) THE PLAN IS MOSTLY DOING ITS JOB. 46 of 57 are named in
      docs/RELEASE-PLAN.md, so most "stale" issues are PARKED BY DESIGN with a
      phase that owns them — not lost. Staleness measured by last-comment date
      therefore OVERSTATES the problem.

      (3) BUT THE PARKED SET HAS NO EXPIRY. An issue can sit in a plan section
      indefinitely with no re-examination, and nothing distinguishes "parked
      deliberately" from "quietly abandoned". Six have gone 100+ days untouched.

      (4) AND SOME ARE PROBABLY ALREADY FIXED. Heavy cross-reference traffic
      without closure is the tell: #262 (16 cross-refs), #153 (11), #8 (9),
      #350 (8). Work happened around them and nobody closed the loop. Per
      repo-hygiene this must be re-verified against the CURRENT artifact, not
      inferred — "probably covered by #NNN" is the anti-pattern, and a task
      list can say done while the shipped binary disagrees.

      SCOPE OF THE RELEASE:

      a. EVERY open issue gets exactly one disposition. Closure as FIXED cites
      a TAGGED RELEASE, never a merge commit — merged is not released, and the
      tag is the evidence an outsider can check. Closure as obsolete/superseded
      names what replaced it. Anything staying open gets a "remaining:" note
      naming precisely what is left.

      b. THE INVISIBLE SET GOES TO ZERO. Every open issue is either named in
      the plan or explicitly labelled out of scope. An issue invisible to the
      plan is invisible to every planning decision made after it.

      c. RE-VERIFY BEFORE CLOSING. For each candidate-fixed issue, reproduce
      against the current tree or tag and record the command and its output in
      the closing comment.

      d. AUDIT THE AUTO-CLOSE CASCADE. `closes #N` in merged PR prose has
      already falsely closed a live bug here (#421 closed #413 fifteen hours
      before its fix). Re-check umbrella issues closed during merge waves and
      reopen what was not actually done.

      THE DURABLE PART, without which this is a one-off sweep that decays
      immediately: a `scripts/board-health.rs` that prints the baseline table
      above and is run on a schedule, so "24 untouched, 11 invisible" is a
      number someone sees rather than a feeling someone eventually has. The
      sweep is the easy half; the measurement is what keeps it true.

      NOT IN SCOPE: closing issues to make the count smaller. The count is not
      the target — an issue closed without evidence costs a re-report and
      teaches the board to lie. A board of 57 issues each with a live
      disposition is healthy; a board of 20 where nobody trusts the closures is
      not.

      FALSIFICATION: wrong if, after this release, an open issue exists with no
      disposition, or a requirement's status contradicts its own trace, or an issue was closed as fixed citing only a merge commit,
      or the invisible-to-plan count is non-zero, or `board-health.rs` reports
      numbers a reader can show to be wrong.
      ======================================================================
      A THIRD CLAUSE (2026-10-08, maintainer decision): WHEN AN ARTIFACT'S
      DESCRIPTION NAMES A CODE SYMBOL, IT SHALL CARRY A `steps:` ENTRY GREPING
      THAT SYMBOL.

      The two clauses above cover a disposition that is STALE. This one covers a
      disposition that is UNCHECKABLE, which the project has now found twice and
      which neither existing gate catches:

        VGATE-P01  an artifact CITES a proof that CI never runs   (orphaned)
        VGATE-P02  CI runs a proof NO artifact cites              (untraced)
        this       an artifact DESCRIBES a mechanism it never cites at all

      THE WORKED SPECIMEN IS #529. `SWREQ-FALCON-RATE-P05` and
      `FV-FALCON-RATE-002` were both `verified` while naming
      `last_torque_scale`, `set_delivered_fraction` and `u_delivered_frac` as
      the mechanism by which the ESO learns what the MIXER delivered. `git grep`
      over `origin/main -- 'crates/**' 'examples/**'` returns NOTHING for all
      three; they exist only on an unmerged branch. And FV-FALCON-RATE-002's
      ELEVEN STEPS ALL PASS - they grep `fn resync_loop_rate`, the GyroLpf
      construction, `"RING "` in scripts/gz-trial.rs, every one genuinely
      present. The steps verify real things; they simply do not cover the
      mechanism the description leads with. An artifact can be step-green AND
      describing absent code.

      THIS CLAUSE IS NOT CHEAP, AND THE FIRST DRAFT OF IT CLAIMED OTHERWISE.
      I wrote "most artifacts here already comply" and then measured it, which
      refuted it. Counting snake_case identifiers in each description against
      the symbols its own steps grep:

        artifact                     steps   named   covered
        FV-FALCON-TRANSPORT-002       16       7        4
        FV-FALCON-HOLD-001            11      16        7
        FV-FALCON-FAULT-005           18      18        4
        FV-FALCON-RATE-002            11      10        3

      Not one of the artifacts I had picked as exemplars covers everything it
      names. So a literal "every named symbol gets a step" rule is a LARGE new
      obligation across the trace, not a formality - and adopting it on the
      cheapness claim would have been the same unsourced-assertion mistake this
      requirement exists to catch.

      THE PREDICATE THEREFORE NEEDS NARROWING, and the exact wording is a
      decision rather than something to infer. The uncovered names fall into
      three kinds that do not deserve equal treatment:

        (a) THE MECHANISM the artifact's claim depends on - `u_delivered_frac`,
            `set_delivered_fraction`. These are the #529 class: if the symbol is
            absent the claim is false. A step here is mandatory.
        (b) NAMED TESTS - `optimistic_variance_diverges_under_noisy_gps`,
            `attitude_runaway_terminates_in_flight`. A step is cheap and catches
            a renamed or deleted test, which this project has also hit.
        (c) MEASUREMENT AND LOG LABELS - `final_dist`, `est_z`, `p_ned`,
            `a_xy`, `rp_rate2`. These name numbers in a verdict line, not code
            the claim rests on. Requiring steps for these is noise, and noise
            is how a rule gets suppressed with `|| true`.

      So the clause should bind (a) and (b) and exempt (c). Drawing that line
      mechanically is the open part: "appears in a code path" is checkable,
      "is the mechanism" is a judgement. One workable approximation is to
      require a step for any named identifier that EXISTS in the tree as a
      definition (`fn `, `let `, a struct field) and exempt those that appear
      only inside quoted output - but that is a proposal, measured at nothing
      yet, and should be tried against these four artifacts before it is
      written into a requirement.

      ======================================================================
      A PREMISE IN THIS REQUIREMENT HAS EXPIRED, and it is load-bearing for 61
      other requirements, so it is corrected here rather than left to rot.

      The analysis above says of the 61: "every one cites a VERUS proof as its
      criterion, and the Verus track has verified NOTHING since 2026-09-11
      (#405 - the toolchain cannot find core/std and all 19 proofs fail in
      0.1 s). So their evidence does not merely lack promotion; it does not
      currently run."

      THAT WAS TRUE WHEN WRITTEN AND IS NOT TRUE NOW. Measured 2026-10-08 over
      the last 40 verus.yml runs, grouped by day:

        2026-09-23 .. 2026-10-02    22 runs, EVERY ONE failure
        2026-10-06 .. 2026-10-08    15 runs, EVERY ONE success

      The track recovered on 2026-10-06. NO COMMIT IN THIS REPOSITORY touched
      verus.yml, MODULE.bazel or BUILD.bazel in that window, so the fix came
      from upstream - the workflow checks out `rules_verus` as a sibling - which
      means nobody here chose it, reviewed it, or verified what it changed.

      WHAT THIS DOES AND DOES NOT CHANGE. It retires the sentence "it does not
      currently run": it runs, and it passes. It does NOT yet establish that it
      verifies anything SUBSTANTIVE - 19 SMT targets completed in 12.4 s total
      with zero verification summary anywhere in a 107 KB log, because
      `--test_output=errors` hides passing output (#405, and #531 makes it
      visible). So the 61's evidence has moved from "does not run" to "runs,
      substance unconfirmed", which is a different disposition and a much
      shorter distance to close.

      THE OTHER BLOCKER FOR THE 61 STANDS UNCHANGED and is now the only one:
      they are verified-by `SV-RELAY-*` artifacts that are themselves
      `approved`, with SV-RELAY-015 carrying no `steps:` at all. That is a chain
      incomplete two levels up and has nothing to do with Verus.

    tags: [requirement, relay, hygiene, issue-board, process, v1.143]
    fields:
      priority: should
      req-type: process
      verification-criteria: >
        `scripts/board-health.rs` reports: every open issue carries a
        disposition label or a "remaining:" comment; invisible-to-plan count is
        0; no issue closed as fixed in this release cites a merge commit
        without a tag. Spot-check 5 closures by reproducing the original report
        against the tagged artifact.
    links:
      - type: derives-from
        target: SYSREQ-FALCON-022
