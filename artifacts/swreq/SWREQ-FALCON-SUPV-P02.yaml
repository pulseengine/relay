artifacts:
  - id: SWREQ-FALCON-SUPV-P02
    type: sw-req
    title: "SUPV-P02 — a failsafe latch is an IN-FLIGHT device: it clears on disarm, and re-arming is gated by LIVE hazards only"
    status: verified
    release: falcon-v1.141.0
    description: >
      The RTL latch the supervisor raises when it actuates a failsafe
      ([[SWREQ-FALCON-SUPV-P01]]) shall be an IN-FLIGHT monotonicity device
      only — it exists so that a level-triggered condition cannot re-fire
      Failsafe and demote the Rtl it just commanded — and it shall CLEAR when
      the vehicle is disarmed. It shall NOT serve as an arming interlock.

      What blocks a subsequent arm shall instead be the LIVE hazard, re-derived
      every control cycle from real vehicle state (the [[SWREQ-FALCON-PREARM-P02]]
      discipline): the isolated-rotor row [[SWREQ-FALCON-PREARM-P04]], the
      battery terms (see BATTERY IS TERMINAL below), and the live geofence row
      (CheckId::InsideGeofence, #609 finding 5): a vehicle whose estimated
      position is outside its fence shall not arm, whether or not a failsafe
      ever fired (a FIRST arm outside the fence is refused too). Until #609
      no row checked the fence, so a vehicle disarmed outside it re-armed. A
      hazard that is no longer present shall not block arming, and a hazard
      that IS still present shall block it on its own merit and name its own
      reason, WITH ONE STATED EXCEPTION:

      BATTERY IS TERMINAL UNTIL A PROCESS RESTART (#609 finding 5, maintainer
      decision 2026-11-04, falcon-v1.141.0). relay-batt's low/critical flags
      latch until BatteryEstimator::reset(), which the supervisor never
      calls, and the seam refuses a rebuild over a latched pack
      (SupervisorHost::rebuild_permitted). So after a battery failsafe the
      vehicle cannot be re-armed in the same process even with a fresh pack:
      BatteryOk refuses it (measured: a 16.8 V pack, soc 1.00, still refused
      after 30 s). The latch is deliberate: an at-rest spent pack rebounds
      and cannot be told from a fresh one without an explicit signal. An
      explicit, Disarmed-only "pack replaced" reset is planned for
      falcon-v1.142.0; until then the hazard here is "a pack that has
      failsafed this process", and it does not clear.

      MEASURED defect this replaces (relay#564): the latch was never cleared
      anywhere, so after ANY failsafe the airframe could never be re-armed for
      the life of the process — the pre-arm table reported
      "PREARM: failsafe latched" forever, even after the vehicle had flown home,
      landed, disarmed, and the triggering condition had completely gone.

      High wind is deliberately EXCLUDED from the live-hazard set: its detector
      is an in-flight signature (control allocation saturated while leaning) and
      its counter is zeroed whenever the vehicle is not airborne, so no
      ground-observable wind signal exists. Permitting re-arm after a wind RTL
      is a recorded maintainer decision (relay#564): a permanent block would
      brick the airframe after a transient gust, which is the common case.
      CORRECTED (#609 finding 5): this said the vehicle "is landed again by
      the same failsafe — self-limiting". The wind failsafe only ever commands
      RTL (Failsafe at rank 2); it never commands a landing in place. If the
      wind is still beyond the rate loop's authority the re-armed vehicle
      saturates and is sent home again, landing only if it reaches home;
      what bounds a flight that cannot get home is the battery failsafe
      (above) and the attitude-runaway termination, not the wind detector.
    tags: [falcon, supervisor, failsafe, latch, arming, safety, v1.141]
    fields:
      req-type: safety
      priority: must
      verification-criteria: >
        falcon-core, two directions, each falsified. (1) RECOVERY: a geofence
        breach latches the failsafe, the vehicle flies home, lands and disarms,
        and with the hazard provably clear (within the fence, battery neither
        low nor critical, no isolated rotor) the next command(Arm) REACHES
        Mode::Armed, and rtl_latched reads false after disarm
        (tests::re_arming_is_allowed_once_the_failsafe_condition_has_cleared —
        fails without the clear, with reason "PREARM: failsafe latched").
        (2) RETAINED PROTECTION: a rotor fault isolated while AIRBORNE (so the
        latch IS set, unlike the Mode::Land case PREARM-P04 covers) lands and
        disarms; rtl_latched then reads FALSE, and the next command(Arm) is
        still REFUSED naming CheckId::MotorsHealthy
        (tests::a_rotor_that_failed_in_flight_still_blocks_re_arming_after_the_latch_clears).
        Direction (2) MUST be falsified by deleting PREARM-P04's MotorsHealthy
        row while the disarm-clear stays in place — NOT by removing the clear,
        which would prove only that the latch still blocks. (3) GEOFENCE:
        armed inside the fence, carried out of it in flight (RTL latched),
        home, landed, disarmed; on the ground outside the fence again the next
        command(Arm) is REFUSED with CheckId::InsideGeofence the ONLY failing
        row, and it arms once back inside; a first arm outside the fence is
        refused by the same row (falcon-core tests/geofence_prearm.rs).
        Falsified by forcing the row true: both refusals disappear.
    links:
      - type: derives-from
        target: SYSREQ-FALCON-011
      - type: derives-from
        target: SYSREQ-FALCON-014
