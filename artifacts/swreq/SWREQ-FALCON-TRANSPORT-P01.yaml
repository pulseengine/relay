artifacts:
  - id: SWREQ-FALCON-TRANSPORT-P01
    type: sw-req
    title: "TRANSPORT-P01 — the cascade seam shall have ONE supported transport binding, so an integrator does not invent a fifth"
    status: implemented
    release: falcon-v1.141.0
    description: >
      DEMOTED verified -> implemented 2026-10-01 (#499). IT WAS VERIFIED ON
      HALF OF ITSELF. Its only verifier, FV-FALCON-TRANSPORT-001, says in its
      own first line that it covers "the RETURN half". The requirement asks for
      ONE SUPPORTED TRANSPORT BINDING, and four of its five elements are
      unshipped: no `1c fa` framing anywhere in the tree, no binding document,
      and `falcon-hitl` still carries ACTUATOR_FRAME_LEN=16 / SENSOR_FRAME_LEN=54.

      Its FALSIFICATION CONDITION IS ALSO MET: the state carries no mode and no
      failsafe, because the component wraps FlightCore rather than
      FlightSupervisor (#414, open). A consumer sees the estimate and cannot see
      why the vehicle is doing anything.

      The RETURN direction itself is real and reproduces. Re-promotion needs the
      binding, or this requirement narrowed to the return direction alone and
      the binding split into its own requirement -- a scope decision, not a
      wording fix.

      Driving the shipped flight core from another process or another board
      shall require no invented framing: the project shall publish a transport
      binding for `pulseengine:falcon-cascade` — framing, sequence, the
      configuration handshake, and the behaviour when a tick is late, dropped
      or duplicated — with a reference host implementation.

      WHY IT EXISTS. An integrator drove the published component over UDP
      against Gazebo and had to invent the wire themselves, because we ship a
      component and no way to talk to it. Measured from their capture (4 000
      exchanges, 40.8 s): a 6-byte header — magic `1c fa`, version, message
      type (config / ack / sensor / motors), little-endian `u32` sequence —
      then the seam's own records. It is NOT MAVLink (0 of 8 002 payloads
      carry `0xFD`/`0xFE`), NOT CCSDS (0 of 8 002 have a plausible primary
      header), and NOT `falcon-hitl`'s frame (83/24-byte payloads against its
      54/16). It works: reply latency 0.48 ms median, 3.17 ms worst, no timing
      anomaly anywhere in the run.

      MEANWHILE WE HAVE FOUR WIRE PROTOCOLS AND THREE HAVE NO CONSUMER.
      `relay-ccsds` is wohl's. `relay-mavlink` reaches only falcon-hello.
      `relay-dronecan`, `falcon-mavlink` and `falcon-hitl` have none. They are
      not the same question: MAVLink is the ground-station boundary and
      DroneCAN the ESC bus — unwired capabilities awaiting a consumer. The
      HITL link is different: it is SUPERSEDED. Its 54-byte frame cannot carry
      heading, rotor RPM, or a battery that says ABSENT (#466), which are
      exactly the lessons the seam learned at v0.8 and v0.10 by being driven.
      Maintaining a second remote protocol means relearning them there.

      WHAT THE BINDING SHALL STATE, each because something measured says so:
        - FRAMING and versioning, so a host can detect a mismatched component.
        - The CONFIGURATION handshake. `vehicle-config` is load-bearing:
          measured on gz, a wrong hover thrust alone put the altitude estimate
          58.8 m out, and with default tuning the vehicle never left the ground.
        - The TICK CONTRACT: `dt-s` is the host's actual period (v0.8 exists
          because stages disagreed by up to 20x and the hold error went from
          0.00 m to 27.17 m with no error signal), and what a late, dropped or
          duplicated tick means.
        - The AIDING-RATE OBLIGATION. Position fixes at <= 10 Hz made the hold
          diverge (#434/#403); the integrator's rig ran 5 Hz and oscillated.
          v1.140 fixes the estimator, and the binding must still say what the
          host owes: which fields are optional, and what degrades when they
          are absent.
        - The REFERENCE HOST: `falcon-hitl`'s `SimServer`, re-pointed from its
          own frame to this binding, keeping the no_std/no-alloc framing that
          is the crate's genuinely reusable half.

      AND IT NEEDS A RETURN PATH, which is why MAVLink is not connected.
      `step: func(sensors: sensor-frame, target: waypoint) -> motor-pwm` gives
      a host MOTOR COMMANDS AND NOTHING ELSE. The estimate, the mode, the
      failsafe state and the battery view never leave the component. So a host
      driving the published flight core cannot show a vehicle in
      QGroundControl, cannot stream ATTITUDE or GLOBAL_POSITION_INT, and
      cannot report a failsafe as STATUSTEXT — not because the telemetry stack
      is missing (MAVLINK-P06 is `verified` at v1.119.0: rate budgeting to the
      SiK link, in-flight PARAM_SET, wire conformance) but because there is
      nothing for it to read. The integrator's capture shows the same shape:
      motor commands back, no state. This binding therefore covers the RETURN
      direction too, and the seam needs a state output for it — a version bump
      of `pulseengine:falcon-cascade`, not a host-side workaround.

      SPECIFIED FROM THE SEAM AND THE CAPTURE, deliberately: the maintainer
      chose on 2026-09-18 to write it without asking the integrator first. The
      risk is on record — the HITL frame went wrong exactly by being designed
      without a driver — and the mitigation is that the capture is real
      evidence of a working binding, not a guess.

      FALSIFICATION: wrong if an integrator can drive the published component
      over the documented binding only by writing framing of their own; if a
      host that satisfies the binding cannot tell a dropped tick from a late
      one; or if a host holding the binding still cannot stream the vehicle's
      attitude, position and failsafe state to a GCS with the verified
      MAVLink stack.
      ======================================================================
      RETURN DIRECTION IMPLEMENTED 2026-09-30. Seam bumped
      pulseengine:falcon-cascade@0.10.0 -> @0.11.0.

      SHAPE AS THE INTEGRATOR SPECIFIED IT (jess#167, answered 4m26s after we
      asked and then unread by us for 11.5 h — a separate defect, now fixed by
      giving the loop a watch on that repo):

        - A SECOND EXPORT (`observer.read-state`), NOT a return value on `step`.
          On the M4 you must read state WITHOUT running a control tick, or
          observing executes the controller and changes what it observes. It
          also keeps `step`'s lowered symbol byte-stable, which jess's
          byte-identity baselines depend on.
        - SEQLOCK: `tick-head` first field, `tick-tail` last. A reader takes
          tail, body, head and retries while they disagree.
        - FIXED LAYOUT, no `option<>`, no lists. Absence rides a `valid`
          BITMASK, because a discriminant whose position moves is exactly where
          tearing bites across a cache boundary.
        - MONOTONIC tick that never resets, so staleness is judged against the
          reader's own clock rather than trusting freshness.
        - CADENCE DELIBERATELY UNSPECIFIED. jess declined to invent one ("no
          falcon code has executed on an RT1176"); the observed rate is
          computed from the tick delta on the first shadow flight.

      Also corrected a premise WE held: there is no flattening cliff on returns.
      MAX_FLAT_RESULTS is 1, so every export already returns a pointer — state
      size costs return-area bytes, not a calling-convention change. We were
      designing around a constraint that does not exist.

      MECHANICALLY VERIFIED on the built artifact, not the source:
        wasm-tools component wit target/.../falcon_cascade_cm.wasm
          export pulseengine:falcon-cascade/controller@0.11.0
          export pulseengine:falcon-cascade/observer@0.11.0
            read-state: func() -> flight-state

      TWO DEVIATIONS, RECORDED RATHER THAN IMPLIED:

      (1) THE WIT WAS HAND-EDITED, which CLAUDE.md names as an anti-pattern
      ("spar generates them; if WIT changes, the AADL changed first"). It is
      enforced for three lesser seams and IMPOSSIBLE for this one: spar codegen
      on the cascade root emits 21 lines of `list<u8>` thread ports against the
      committed 246 lines of typed records — different abstraction levels, and
      regenerating would destroy the seam. Filed as #492 rather than worked
      around silently. Nothing gates this file's drift from the architecture.

      (2) NO MODE OR FAILSAFE IN THE STATE. The component wraps FlightCore, not
      FlightSupervisor, so there is no mode machine or failsafe latch to
      publish (#414). `flight-state` carries attitude, position, velocity,
      rates, gyro bias, innovation and the isolated rotor. A telemetry consumer
      gets the estimate but cannot see WHY the vehicle is doing something. That
      is a real gap in this binding and it closes with #414, not here.

      NOT YET DONE: announcing the bump to the integrator BEFORE anything
      publishes (the v1.133 path-move lesson — a namespace moved, nobody told
      jess, and they reported the publish "stalled"). No release may carry
      @0.11.0 until that announcement is out.
      ======================================================================
    tags: [requirement, falcon, transport, seam, hitl, v1.141]
    links:
      - type: derives-from
        target: SYSREQ-FALCON-010
