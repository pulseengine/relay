artifacts:
  - id: SWREQ-FALCON-LOG-P02
    type: sw-req
    title: "LOG-P02 — persistent flight blackbox (crash-surviving, full-rate estimator inputs)"
    status: verified
    release: falcon-v1.118.0
    description: >
      Every flight shall produce a PERSISTENT log (non-volatile, not the
      RAM ring of LOG-P01) containing at minimum: raw IMU samples at the
      control rate, GNSS fixes, baro/mag samples, motor commands + achieved
      RPM, estimator state + covariance diagonals, mode/failsafe events, and
      parameter snapshot at boot — enough to REPLAY the estimator (LOG-P03)
      and to reconstruct a crash post-hoc. Writes shall be power-loss-safe
      (a crash truncates, never corrupts, earlier records) and shall keep up
      at the control rate with bounded backpressure (drops are COUNTED and
      reported, never silent). SEAM (agreed with jess in jess#144, their
      REQ-PIX-022): a distinct BLOCK/APPEND seam (NorFlash or SD block
      device) — unlike the FRAM param seam, erase-block + power-loss
      semantics DO cross it, so the split is explicit: JESS owns the
      flush/commit ordering and torn-record DETECTABILITY at the media
      level; RELAY owns the record codec, rate budgeting, and the
      any-byte-offset truncation decode (verified against a mock block
      device with injected torn writes). This is the ulog/DataFlash
      equivalent — the single biggest observability gap vs PX4/ArduPilot.
    tags: [falcon, logging, blackbox, forensics, field-operations, v1.118]
    fields:
      req-type: functional
      priority: must
      verification-criteria: >
        Format: encode/decode lossless round-trip (Kani, extending LOG-P01's
        proof). Truncation safety: a log cut at ANY byte offset decodes all
        complete records before the cut (property test over cut points).
        Rate: a simulated full-rate flight logs with zero silent drops (drop
        counter matches injected backpressure). Completeness: the logged set
        is sufficient for LOG-P03's bit-exact replay (shared oracle).
    links:
      - type: derives-from
        target: SYSREQ-FALCON-021
