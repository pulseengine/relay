artifacts:
  - id: SWREQ-RELAY-STREAM-P07
    type: sw-req
    title: "STREAM-P07 — falcon attitude controller exposes a Component-Model Preview 3 async stream interface (third control-cascade engine)"
    status: implemented
    description: >
      Continues the control-cascade streamification (after rate P05 and position
      P06): the falcon attitude controller shall expose a WASM Component-Model
      Preview 3 (P3) async interface
        monitor: func(inputs: stream<att-input>) -> stream<rate-setpoint>
      implemented as a genuine async stream transformer (async fn over a
      StreamReader, .next().await on the inputs, .write().await on the rate
      outputs), built as a P3 component (wasi_version = "p3"). Third of five
      flight-control engines, toward a composed flight-control STREAM pipeline
      (iekf -> pos -> att -> rate -> mixer).

      It RUNS THE VERIFIED CONTROLLER, not an inline copy: the component does
      `use relay_att::{AttController, Timestamp};` and the
      //:falcon-attitude-stream bindgen target `deps` on the :relay-att Bazel
      library, so the streaming monitor() drives the ACTUAL relay-att
      AttController::tick. The WIT is SELF-CONTAINED (its own
      falcon:attitude-stream package) and does not modify the shared cascade.wit.

      Scope (as with prior STREAM reqs): AUTHORING + BUILDING a valid P3 async
      component; end-to-end execution on kiln's dormant scheduler is out of scope.
    tags: [relay, falcon-attitude, cascade, stream, async, p3, component-model, streamification]
    fields:
      req-type: functional
      priority: must
      verification-criteria: >
        wit/falcon-attitude-stream/attitude_stream.wit declares
        `monitor: func(stream<att-input>) -> stream<rate-setpoint>`; the Rust
        implementation (wasm/cm/attitude/src/stream.rs) is a real async stream
        transformer over StreamReader with .next().await / writer.write().await,
        driving relay_att::AttController::tick; the //:falcon-attitude-stream
        bazel target builds it as a wasi_version="p3" component, exercised in CI
        (.github/workflows/bazel.yml builds it alongside the rate + position
        streams and the cFS stream components).
    links:
      - type: derives-from
        target: SYSREQ-FALCON-008
