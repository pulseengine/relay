artifacts:
  - id: SWREQ-RELAY-VGATE-P04
    type: sw-req
    title: "VGATE-P04 — a verification track that CANNOT RUN shall block the release, not merely go red"
    status: proposed
    release: falcon-v1.139.0
    description: >
      A verification track whose toolchain fails to execute shall be treated as
      a release blocker, distinguishable in the release gate from a track that
      ran and passed.

      WHY IT EXISTS. At falcon-v1.138.0 two tracks were dark and the release
      went out anyway:

        Verus  — all 19 proof targets failed in 0.1 s each with
                 `error[E0463]: can't find crate for core/std`. They never ran.
                 Red on six consecutive main commits, 2026-09-11 to 2026-09-15
                 (#405).
        Bazel  — `//:falcon-cascade` has not built since #393; the target's
                 comment still said "No control-crate dep" long after the
                 component started wrapping falcon-core. Red on every main
                 commit from 2026-09-11, blocking nothing (#397). FIXED.

      Neither is in the required-contexts set, so neither blocked a merge, and
      the release-execution traceability gate did not surface them either: it
      audits artifact status and trace links, and both tracks' artifacts were
      already `verified` from when the tracks last ran.

      A CORRECTION TO THIS ARTIFACT'S OWN FIRST DRAFT, kept because it is the
      same error it is written to prevent. The draft said the Bazel breakage
      also stopped the cascade's witness MC/DC coverage. It did not:
      `//:falcon-cascade-coverage` is `tags = ["manual"]` and appears in no
      workflow, so CI has NEVER produced it — before #393 or after (#407). The
      breakage was narrower than claimed, and the coverage gap is older and
      separate. Attributing a long-standing absence to the most recent change
      is exactly how a gap gets "fixed" without being closed.

      THE DISTINCTION THIS REQUIREMENT ADDS. VGATE-P01 forbids orphaned proofs,
      P02 forbids untraced ones, P03 requires a cited enforcer to be OBSERVED to
      pass. All three assume the track executes. This is the fourth case: the
      track is wired correctly, is cited correctly, and cannot run at all. From
      the evidence's point of view that is indistinguishable from never having
      had the proofs — which is exactly the state #364 was created to end
      ("19 proofs were defined and NONE ever ran").

      A RED GATE IS NOT ENOUGH ON ITS OWN. Both tracks WERE red, visibly, for
      days. Redness that blocks nothing decays into background noise; what
      matters is that the release cannot be cut while a track is dark, or that
      cutting it records the darkness explicitly in the release notes. v1.138.0
      did the latter by hand — this requirement is to stop relying on the
      operator remembering.

      FALSIFICATION: wrong if a release can be tagged while any verification
      track fails to execute, without that fact being recorded in the release
      as a known gap.
    tags: [requirement, relay, verification-gate, release, v1.139]
    links:
      - type: derives-from
        target: SYSREQ-FALCON-010
