artifacts:
  - id: SWREQ-RELAY-BP-P02
    type: sw-req
    title: "BP-P02 — Conformance accept/reject: RFC 9171 sections 4.1 and 4.3 conformant bundles are accepted, listed non-conformant shapes are rejected"
    status: proposed
    release: falcon-v1.143.0
    description: >
      The decoder accepts RFC 9171 conformant bundles, including inner indefinite-
      length arrays up to a bounded depth. It rejects non-shortest-form arguments,
      indefinite byte strings in block data, more than one payload block, more
      than one Bundle Age block, a payload block that is not last, and a primary
      block whose item count is not in 8..11.
    tags: [falcon, relay, relay-bp, dtn, codec, conformance, issue-626]
    fields:
      req-type: functional
      priority: must
      verification-criteria: >
        Method: external reference vectors in a table carrying the expected verdict
        per vector, plus unit tests. Vectors are never generated by this crate.
    links:
      - type: derives-from
        target: SYSREQ-RELAY-BP-001
