artifacts:
  - id: SWREQ-CCSDS-P01
    type: sw-req
    title: "CCSDS-P01: Encode then decode equals identity (roundtrip)"
    status: implemented
    release: falcon-v1.144.0  # moved from v1.143 (owner 2026-11-25): cFS port: FV-RELAY-KANICI-001 is not falcon-tagged, so the gate never runs it; SV-RELAY-015 has no runnable steps
    description: >
      For every valid header, encoding it and then decoding the result shall
      produce the original header fields. A header is valid when version is
      0, apid <= 0x07FF, sequence_flags <= 3 and sequence_count <= 0x3FFF;
      packet_type, sec_header_flag and data_length take any value. Fields
      outside those ranges are masked to their bit width on encode.
    tags: [ccsds, roundtrip, correctness, verus]
    fields:
      req-type: functional
      priority: must
      verification-criteria: >
        Kani verify_encode_decode_roundtrip: for symbolic packet_type,
        sec_header_flag, apid, sequence_flags, sequence_count and data_length,
        decode(encode(h)) returns each field masked to its width, which equals
        the field for every valid header. The Verus contracts prove the
        version and APID bounds (CCSDS-P02/P03), not the roundtrip.
    links:
      - type: derives-from
        target: SYSREQ-CCSDS-001

  - id: SWREQ-CCSDS-P02
    type: sw-req
    title: "CCSDS-P02: Version field always 0"
    status: approved
    description: >
      The CCSDS Space Packet Protocol version field shall always be 0
      per CCSDS 133.0-B-2.
    tags: [ccsds, protocol, version, verus]
    fields:
      req-type: functional
      priority: must
      verification-criteria: >
        Verus proof: encode always sets version bits to 0.
    links:
      - type: derives-from
        target: SYSREQ-CCSDS-001

  - id: SWREQ-CCSDS-P03
    type: sw-req
    title: "CCSDS-P03: APID bounded to 11 bits"
    status: approved
    description: >
      The Application Process Identifier (APID) shall be bounded to
      11 bits (0..=0x7FF) per the CCSDS standard.
    tags: [ccsds, bounded, apid, verus]
    fields:
      req-type: functional
      priority: must
      verification-criteria: >
        Verus proof: APID value is always <= 0x7FF after encode/decode.
    links:
      - type: derives-from
        target: SYSREQ-CCSDS-001

  - id: SWREQ-CCSDS-P04
    type: sw-req
    title: "CCSDS-P04: Checksum is XOR of all bytes"
    status: approved
    description: >
      The packet checksum shall be computed as the XOR of all bytes
      in the packet data field.
    tags: [ccsds, checksum, integrity, verus]
    fields:
      req-type: functional
      priority: must
      verification-criteria: >
        Verus proof: checksum function computes XOR fold over all data bytes.
    links:
      - type: derives-from
        target: SYSREQ-CCSDS-001
