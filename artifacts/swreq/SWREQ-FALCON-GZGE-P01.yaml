artifacts:
  - id: SWREQ-FALCON-GZGE-P01
    type: sw-req
    title: "GZGE-P01 — custom gz ground-effect plugin matches the SimBackend model"
    status: implemented
    description: >
      A custom Gazebo Harmonic (gz-sim8) System plugin shall apply a near-surface
      thrust-augmentation cushion force to a configured link, matching the Rust
      SimBackend ground_effect model: F_z = gain · e^(−alt/decay) · reference_force,
      strongest at the surface and decaying with altitude. This brings the SAME,
      controlled realism model the verified SimBackend uses into the gz SITL
      (vs the stock gz WindEffects plugin, which over-authors disturbances and
      diverges the falcon mission). It is the first of the v1.32 gz-realism thread.

      The plugin shall be a model plugin (parameters: link_name, gain, decay,
      reference_force, verbose), buildable with gz-cmake3/gz-sim8, and emittable
      from the realism world generator as the `groundeffect` layer.
    tags: [falcon, gz, sitl, ground-effect, realism, plugin, v1.32]
    fields:
      req-type: functional
      priority: should
      verification-criteria: >
        Bench-only (gz is not in CI): a headless gz run loads the plugin and an
        A/B shows the cushion HOLDS a light free box aloft near the surface
        (gain=0.4 → settles ~0.10 m) where without it the box FALLS THROUGH
        (gain=0 → well below 0). The plugin also loads in the generated quad
        realism world.
    links:
      - type: derives-from
        target: SYSREQ-FALCON-007
