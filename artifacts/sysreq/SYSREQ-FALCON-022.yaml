artifacts:
  - id: SYSREQ-FALCON-022
    type: system-req
    title: "THESIS — best-in-class drone software, running on gale, with every flight capability a WebAssembly component"
    status: approved
    description: >
      The flight stack shall be composed entirely of WebAssembly components,
      fused and lowered onto gale on the target silicon, and shall fly at least
      as well as the best available alternative.

      Set by the maintainer on 2026-09-23 as the project's organising goal. It
      replaces "reach PX4 parity" (docs/PX4-PARITY-ASSESSMENT.md, stale by 82
      versions and wrong on the exact question it existed for — #422). Parity
      is a comparison; this is a product thesis, and it is falsifiable.

      FOUR CLAIMS, each wrong if its test fails.

      (1) EVERY FLIGHT CAPABILITY IS A COMPONENT. No monolith on the flight
      path. WRONG IF a flight capability ships that is not a component.
      Baseline 2026-09-23: crates/falcon-core is 6090 lines carrying the
      supervisor, every failsafe and the single-rotor-out FDI, with ZERO
      kani::proof harnesses and no entry in the kani.yml matrix. The 31
      flight-path harnesses are all on leaves (iekf, geo, adrc, mix-quad, fsm,
      preflight, calib, batt, notch). The proofs surround the defect rather
      than covering it. falcon-core must DISSOLVE into components, not grow.

      (2) COMPOSITION IS FREE. A wac-composed, meld-fused, synth-compiled
      cascade shall compute BIT-IDENTICAL motor outputs to the native core from
      the same per-tick frames, against a real physics engine (DIFFERENTIAL=1).
      WRONG IF any non-zero per-motor difference appears, or the fused artifact
      cannot be built. This property is held today across ONE seam; the thesis
      requires it to survive decomposition.

      (3) IT RUNS ON GALE ON REAL SILICON, and no oracle hides a fault that
      silicon would take. WRONG IF an emulator passes what a board faults on.
      That is not hypothetical: gale#398 records synth-dissolved objects
      addressing wasm linear memory as [r11 + off] at absolute addresses near
      1 MiB — unmapped on qemu (reads return 0, writes dropped, GATES PASS),
      a precise BusFault on silicon.

      (4) THE FLIGHT BEHAVIOUR IS GENUINELY GOOD. Best-in-class is not an
      architecture claim. WRONG IF a healthy hover carries a limit cycle that a
      position-only verdict conceals. Baseline 2026-09-23: the gz hover rings
      at 1.90-2.12 rad/s (115 deg/s) roll/pitch with motors thrashing
      saturation-to-saturation, while the position verdict reports 0.11 m and
      PASSES (#270, open since 2026-07-14 at ~1 rad/s — it has GROWN).

      THE CONSTRAINT THAT SHAPES THE WHOLE PLAN: decomposition and memory
      packing are the SAME problem. Each component carries its own data base;
      gale's fused.o holds two components whose data bases are 1.1 MiB apart
      through one r11 base — more RAM than any board on the bench has (largest
      192 KB), and gale states it is "not fixable in the embedder". Therefore
      `meld --pack-rebase` working on the flight object is a PRECONDITION for
      claim (1), not a later optimisation. It is already proven on the iso-core
      path and jess measured it at 5x on the M7.

      THE "LARGEST 192 KB" PREMISE IS NOW IN QUESTION (2026-10-01, jess#266).
      That figure is the STM32 bench — it matches the NUCLEO-WB55RG's 192 KB
      SRAM1 exactly, in jess's own measured part table. But a corrected bench
      inventory on jess#266 lists a THIRD host nobody here was reasoning over,
      and on it the vehicle itself. VERIFIED INDEPENDENTLY on 2026-10-01 over
      ssh, read-only (`lsusb` + sysfs; no probe attached, no console opened,
      because `with-device` is absent and a probe needs a claim):

        fourpi.local   3643:001d  PX4 FMU v6XRT.x     1-1.2  serial=0
                       1fc9:0143  MCU-LINK CMSIS-DAP  1-1.4  ARMCR0OKTRM5Q
                       0403:6015  FT231X USB UART     1-1.3  D30K1YZS
        gale.local     ST-LINK/V1 + STLINK-V3
        wohl.local     STLINK-V3 + two ST-LINK/V2.1 (1-1.5, 1-1.6) + a Nordic
                       board in Open DFU Bootloader mode

      TWO THINGS THE MEASUREMENT ADDED that jess's own corrected table did not
      list. `fourpi.local` carries THREE relevant devices, not one, and one of
      them is an NXP MCU-LINK CMSIS-DAP probe — the SWD path onto the RT1176's
      M7. So the programmer this arc needs is already attached, uncatalogued and
      under no interlock. And the FMU's USB serial is literally `0`, so it cannot
      be selected by serial at all and needs its port path as its only identity.

      The i.MX RT1176 on that FMU is the cascade's actual target (the M7 of the
      est->M4 / cascade->M7 / failsafe->F100 partition), and it is not a 192 KB
      part. So the sentence above may be comparing a 1.1 MiB data-base spread
      against the wrong board.

      WHAT IS NOT CLAIMED, deliberately: the RT1176's actual usable RAM. No
      figure for it exists anywhere in this repo, and quoting one from memory is
      how a requirement acquires an unsourced number — see #503, where exactly
      that is being untangled. It was NOT measured, and the blocker was chased
      to its actual cause rather than left as "no hardware":

        access          FIXED mid-pass; all three hosts reachable over ssh.
        the interlock    `with-device` was absent on every host. INSTALLED on
                         fourpi.local from the RELEASED, COSIGN-VERIFIED binary
                         (jess v0.7.2, with-device 0.2.2, aarch64) — signature
                         verified BEFORE the checksums, as its README requires —
                         and fourpi.local's missing per-host registry WRITTEN,
                         with the verified port paths and the `serial: 0` hazard.
        THE REAL BLOCKER `with-device` cannot take a claim there as user `r`:
                         /var/tmp/pulseengine-bench is `pi:pi drwxrwxr-x` and `r`
                         is not in group `pi`, so every device reads CLAIMED
                         forever and --self-test fails 3 of 5. Filed as jess#280.
                         The tool is SOUND — same binary, same registry, a
                         writable lockdir gives --self-test PASS and correct
                         claim/release. It mis-reports EACCES as "claimed".

      NOT WORKED AROUND. A private BENCH_LOCKDIR would let the measurement
      proceed and would exclude nobody, which is the vacuous lock the interlock
      exists to prevent; it was used once as a CONTROL to prove the tool sound
      and then deleted.

      AND OUR DESCRIPTION OF THAT BLOCKER WAS WRONG — corrected on jess#266. We
      reported `with-device` ABSENT on all three hosts. It is INSTALLED on
      fourpi.local at /home/pi/bench/with-device with a registry at
      /home/pi/.config/pulseengine/bench-devices.yaml, and `pixhawk-6xrt` is in
      jess's COMMITTED hardware-catalog.yaml. Every vehicle action jess has
      taken ran under a claim. Our search ran as user `r` and could not see
      /home/pi, so "absent for `r`" was reported as "absent on the host" — a
      search's scope stated as a property of the world. The REAL gap is narrower
      and still real: access is ACCOUNT-DEPENDENT, and under `r` (the standard
      account on all three hosts) the tool is not on PATH and there is no
      registry. jess#280 stands on its own evidence — the lockdir is `pi:pi` and
      `r` cannot write it, so EACCES still reports as CLAIMED.

      ======================================================================
      MEASURED, AND THE PREMISE IS REFUTED AS STATED (jess#266, 2026-10-01).
      jess read it over SWD on the actual i.MX RT1176, under a
      `with-device pixhawk-6xrt` claim:

        IOMUXC_GPR17 FLEXRAM_BANK_CFG = 0x0000ffaa -> 4 DTCM + 4 ITCM banks
        DTCM   clean 0x20000000..0x2003FFFC        -> 256 KB
        OCRAM  clean 0x20240000..0x203BFFFC        -> >= 1.5 MB
        ITCM                                      -> 256 KB (an 84,813 B
                                                     image loads and RUNS there)

      So the largest board on this bench carries ~2 MB on-chip with 1.5 MB of
      CONTIGUOUS OCRAM, not 192 KB, and the 1.1 MiB data-base spread FITS BY
      SIZE with room. The sentence above compares against a NUCLEO while the
      flight target sits on the same bench with eight times the memory.

      WHAT THE MEASUREMENT DOES NOT SETTLE, in jess's own words and kept because
      the temptation is to read it as an all-clear: that OCRAM is where PX4
      already lives (its MSP was 0x20241db0 when jess halted it), it is SLOWER
      than TCM, and NOTHING has been measured about cache behaviour or
      contention across a 1.1 MiB working set. Whether the spread is still fatal
      for those reasons is open. Only the BOARD-SIZE argument is dead.

      THIS IS JESS'S MEASUREMENT, NOT OURS. Relay did not read the part: see the
      account-dependent access note below. Cited, not reproduced here.

      NOR DOES THIS WEAKEN gale#398. The [r11 + off] absolute addressing is a
      lowering defect whatever the part's size; a bigger target might make it
      survivable rather than fatal, which is not the same as fixed, and the
      M4/F100 partitions are still 64-192 KB parts. `meld --pack-rebase`
      remains a precondition. What changes is only the ARGUMENT ABOVE, not the
      conclusion it supports.

      ALSO CORRECTED, because we wrote it down twice: we had recorded jess's
      constraint as "bench empty since 2026-09-25, nothing on silicon". The
      first half was contradicted by jess's own later measurement — the bench is
      three hosts and the vehicle is attached. We then said the second half
      STOOD. IT NO LONGER DOES, as of the same day:

      THE FALCON CASCADE HAS EXECUTED ON THE REAL i.MX RT1176 (jess#266,
      2026-10-01). `rate#tick` -> `mixer#mix`, loaded to RAM over SWD with no
      flash written, PX4 restored and verified disarmed afterwards, and
      BIT-EXACT against our SIL reference:

        in   tx=1  ty=0.472507507  tz=-0.147003502  thrust=0.5
        out  m3=0.348992109  m4=1

      with a perturbed-input control that moves and also matches emulation
      bit-for-bit. So any premise of the form "jess has no on-target evidence"
      has moved, and this is the FIRST on-silicon execution of verified relay
      components.

      WHAT IT IS NOT: not the whole cascade (two stages of five), not the
      estimator, not flight, not flash-resident, and not our measurement. The
      hardware register's remaining items are untouched by it. Recorded as the
      milestone it is and nothing larger.

      KNOWN FALSIFIER STANDING TODAY: the artifact that currently lowers to the
      M7 is the LEGACY PID cascade, not the flown law. The only existing
      proof-point for "our stack runs as components on silicon" is about code
      the vehicle does not use.

      NOT CLAIMED: feature parity with PX4. Manual/RC modes, ground-station and
      mission interop, driver breadth and per-airframe calibration are real
      gaps (see the phase plan); several are first-flight blockers. This
      requirement states what the stack IS, not that it already exceeds
      alternatives on every axis.
    tags: [system, falcon, thesis, gale, component-model, wasm, goal]
    fields:
      priority: must
      req-type: product
      verification-criteria: >
        (1) scripts/audit-component-deps.rs reports no flight capability
        outside a component, and falcon-core carries no flight logic that is
        not componentised. (2) DIFFERENTIAL=1 on the gz falcon-quad against a
        wac+meld+synth artifact shows zero per-motor difference. (3) A flown
        stage executes on the M7 under gale, with an object-to-embedder oracle
        that fails on an out-of-window data address rather than reading zero.
        (4) A healthy hover shows roll/pitch rate below the FDI steady gate for
        at least 95% of ticks, measured by FDI_TRACE, not inferred from a
        position verdict.
    links:
      - type: derives-from
        target: STKH-FALCON-001
