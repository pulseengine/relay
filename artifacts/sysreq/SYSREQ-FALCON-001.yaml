artifacts:
  - id: SYSREQ-FALCON-001
    type: system-req
    title: State estimation via Kalman / complementary filter
    status: approved
    description: >
      The system shall estimate vehicle attitude, position, and
      velocity by fusing IMU, GPS, magnetometer, and barometric
      sensor streams. Initial implementation (v0.2) uses a
      complementary filter for attitude only; full EKF lands in
      v0.4. Output is a stream<vehicle-state> with quaternion,
      NED position, NED velocity, and an EKF innovation health
      metric for downstream limit-checking. Replaces PX4 ekf2
      module, but expressed as a verified WASM component.
    tags: [falcon, ekf, state-estimation, sensor-fusion]
    fields:
      req-type: functional
      priority: must
      verification-criteria: >
        Verus proofs on quaternion normalization invariants,
        numerical bounds on f32 state; Lean WCET bound proves
        the estimator fits the IMU-rate budget; proptest for
        random sensor distributions; witness MC/DC for branch
        coverage on the post-codegen WASM.
    links:
      - type: derives-from
        target: STKH-FALCON-001

  - id: SYSREQ-FALCON-002
    type: system-req
    title: Body-rate control loop at 1 kHz
    status: approved
    description: >
      The system shall provide a body-rate control loop that runs
      at 1 kHz, accepting rate setpoints (body-frame angular
      velocity + thrust scalar) and producing torque setpoints.
      Implements PID with anti-windup. Replaces PX4 mc_rate_control,
      but expressed as a verified WASM component.
    tags: [falcon, rate-control, pid, real-time]
    fields:
      req-type: functional
      priority: must
      verification-criteria: >
        Verus proofs on PID coefficient bounds and anti-windup
        saturation; Lean Lyapunov proof of rate-loop stability;
        Kani for integer overflow paths; differential test
        against PX4 reference implementation.
    links:
      - type: derives-from
        target: STKH-FALCON-001

  - id: SYSREQ-FALCON-003
    type: system-req
    title: Attitude control loop at 250 Hz
    status: approved
    description: >
      The system shall provide an attitude control loop that runs
      at 250 Hz, accepting attitude setpoints (quaternion + thrust)
      and producing body-rate setpoints. Implements quaternion-error
      based control. Replaces PX4 mc_att_control, but expressed as
      a verified WASM component.
    tags: [falcon, attitude-control, quaternion]
    fields:
      req-type: functional
      priority: must
      verification-criteria: >
        Rocq theorems for quaternion-error invariants; Verus
        contracts on quaternion normalization; Lean cascade
        composition with rate loop; differential test against
        PX4 reference.
    links:
      - type: derives-from
        target: STKH-FALCON-001

  - id: SYSREQ-FALCON-004
    type: system-req
    title: Position control loop at 50 Hz
    status: approved
    description: >
      The system shall provide a position control loop that runs
      at 50 Hz, accepting NED position / velocity setpoints from
      the navigator and producing attitude setpoints + thrust.
      Replaces PX4 mc_pos_control, but expressed as a verified
      WASM component.
    tags: [falcon, position-control, navigation]
    fields:
      req-type: functional
      priority: must
      verification-criteria: >
        Verus contracts on setpoint bounds; Lean proof of
        cascade stability with attitude loop; cargo-mutants
        on the full cascade; differential test against PX4.
    links:
      - type: derives-from
        target: STKH-FALCON-001

  - id: SYSREQ-FALCON-005
    type: system-req
    title: Control allocation (motor mixing) per airframe variant
    status: approved
    description: >
      The system shall translate body-frame torque + thrust
      setpoints into per-motor PWM commands using a static mixer
      matrix derived from the airframe geometry. Mixer matrix
      derivation is Drake-symbolic; the WIT signature of the
      exported stream<motor-pwm> is airframe-specific. Replaces
      PX4 control_allocator, but expressed as a verified WASM
      component, with per-airframe variants (falcon-quad,
      falcon-hex, falcon-coax, falcon-vtol, falcon-fw).
    tags: [falcon, mixer, control-allocation, airframe]
    fields:
      req-type: functional
      priority: must
      verification-criteria: >
        Verus proofs on matrix arithmetic; Drake-derived
        MultibodyPlant ground truth for the mixer geometry;
        invariant that allocator never commands negative thrust
        or saturated negative roll/pitch/yaw simultaneously.
    links:
      - type: derives-from
        target: STKH-FALCON-001

  - id: SYSREQ-FALCON-006
    type: system-req
    title: MAVLink protocol interop for ground-station compatibility
    status: approved
    description: >
      The system shall implement the MAVLink v2 protocol for
      command, telemetry, and parameter exchange with industry-
      standard ground control stations (QGroundControl, Auterion
      Mission Control, MAVSDK). MAVLink messages translate to/from
      the relay-software-bus typed stream messages via a guest
      WASM codec component. This is the falcon-to-PX4-ecosystem
      bridge — the entire MAVLink ecosystem works against falcon
      without modification.
    tags: [falcon, mavlink, interop, ground-station]
    fields:
      req-type: functional
      priority: must
      verification-criteria: >
        Verus contracts on packet parsing bounds; proptest on
        random MAVLink message corpora; QGroundControl
        interop test demonstrating heartbeat, parameter, and
        command exchange.
    links:
      - type: derives-from
        target: STKH-FALCON-001

  - id: SYSREQ-FALCON-007
    type: system-req
    title: Airframe-variant world specifications
    status: approved
    description: >
      The system shall provide WIT world specifications for
      distinct airframe variants (falcon-quad, falcon-hex,
      falcon-coax, falcon-vtol, falcon-fw). Each world wires
      the same control-cascade components but exports a
      different stream<motor-pwm> shape (motor count) and
      imports a variant-specific mixer. Variants ship in
      separate releases per the falcon release plan.
    tags: [falcon, airframe, variants, world-spec]
    fields:
      req-type: functional
      priority: should
      verification-criteria: >
        meld static-fusion succeeds for each variant world;
        Verus proofs on each mixer-specific matrix; SITL
        flight tests for each variant.
    links:
      - type: derives-from
        target: STKH-FALCON-001

  - id: SYSREQ-FALCON-008
    type: system-req
    title: Dual-DNA composition with cFS mission layer
    status: approved
    description: >
      The system shall share its message bus, time service,
      event service, table service, executive service, and
      stored-command engine between the cFS-DNA mission layer
      (existing relay components) and the PX4-DNA control layer
      (new falcon components). PID gains arrive through table
      services. EKF innovation emits through event services.
      Geofence trips route through limit-checker. Stored
      missions execute through stored-command. This is the
      Leeloo property — not cFS+PX4 with a translation layer
      between them, but a single organism with shared
      cross-DNA services.
    tags: [falcon, dual-dna, leeloo, composition, integration]
    fields:
      req-type: architectural
      priority: must
      verification-criteria: >
        End-to-end SITL test exercising at minimum: TBL load
        triggers PID gain update, EVS event emitted from EKF
        when innovation exceeds threshold, LC violation
        triggers SC stored-command RTL sequence.
    links:
      - type: derives-from
        target: STKH-FALCON-001

  - id: SYSREQ-FALCON-009
    type: system-req
    title: Deterministic SITL with byte-identical evidence
    status: approved
    description: >
      The system shall provide a software-in-the-loop test
      framework that produces byte-identical output given a
      seed, headless mode, and a fixed simulation step. Primary
      backend is Gazebo Harmonic via PX4 SITL conventions;
      secondary backend is MuJoCo 3 for differential testing.
      All SITL runs produce rerun.io .rrd evidence files
      signed by sigil and indexed by rivet.
    tags: [falcon, sitl, determinism, evidence, simulation]
    fields:
      req-type: non-functional
      priority: must
      verification-criteria: >
        CI runs SITL with seed 42 produce SHA-256-identical
        .rrd output across multiple runs on the same backend.
        rivet validate links every run to a falcon test
        requirement.
    links:
      - type: derives-from
        target: STKH-FALCON-001

  - id: SYSREQ-FALCON-010
    type: system-req
    title: Multi-domain credit-evidence packaging
    status: approved
    description: >
      The system shall package its evidence chain (Verus proof
      certificates, Rocq theorem files, Lean compiled proofs,
      Kani results, proptest reports, witness MC/DC coverage,
      sanitizer logs, mutation testing reports, criterion
      benchmarks, SITL .rrd files) into per-domain credit
      bundles via rivet exports. Each bundle maps the falcon
      evidence onto the technique tables of one safety standard
      (DO-178C, ISO 26262, IEC 61508, IEC 62304, ECSS-Q-ST-80C,
      EN 50128).
    tags: [falcon, evidence, credit, dossier, certification]
    fields:
      req-type: non-functional
      priority: should
      verification-criteria: >
        rivet export --bundle do178c-dal-a produces a tarball
        with the technique coverage matrix and the underlying
        evidence files. Same for the other five standards.
    links:
      - type: derives-from
        target: STKH-FALCON-001

  - id: SYSREQ-FALCON-011
    type: system-req
    title: Safety — EKF divergence detection triggers Return-To-Launch
    status: approved
    description: >
      The system shall detect EKF state-estimate divergence at
      runtime and respond by triggering a Return-To-Launch (RTL)
      stored-command sequence. The relay-hs (Health & Safety)
      engine monitors the EKF innovation signal and latches a
      safe-state alert; relay-sc (Stored Command) executes the
      RTL sequence, retargeting the position controller to home.
      The latch is monotone — once a safe state is entered, the
      system does not exit it without an explicit operator clear.
    tags: [falcon, safety, fault-detection, rtl, health-safety, v0.8]
    fields:
      req-type: functional
      priority: must
      verification-criteria: >
        SITL fault-injection scenario in falcon-sitl-hover injects
        an accelerometer fault; the relay-hs EkfHealthMonitor
        latches RTL within 500 ms of fault onset, and the position
        controller is retargeted to home. Verus discharges the
        latch's monotonicity (HS-P06) and transition-only (HS-P07)
        contracts.
    links:
      - type: derives-from
        target: STKH-FALCON-001

  - id: SYSREQ-FALCON-012
    type: system-req
    title: Autonomous multi-waypoint mission via stored commands
    status: approved
    description: >
      The system shall execute a multi-waypoint mission
      autonomously, sequencing waypoint transitions through the
      verified relay-sc (Stored Command) engine rather than
      orchestrator-side per-leg logic. The same engine that
      executes RTL on a safety alert (SYSREQ-FALCON-011) drives
      the nominal mission — one Stored Command path, one set of
      ASIL-D properties (SC-P01..P05) carrying every dispatched
      waypoint.
    tags: [falcon, mission, autonomy, stored-command, relay-sc, v0.9]
    fields:
      req-type: functional
      priority: must
      verification-criteria: >
        SITL untethered scenario in falcon-sitl-hover loads a
        4-waypoint RTS (N → E → S → home, 8 s per leg) into
        relay-sc; each waypoint transition is dispatched by the
        verified engine; the vehicle reaches every waypoint
        within 2.5 m and returns home within 2.5 m.
    links:
      - type: derives-from
        target: STKH-FALCON-001

  - id: SYSREQ-FALCON-013
    type: system-req
    title: EASA U-space Network Identification telemetry
    status: approved
    description: >
      The system shall emit EASA U-space Network Identification
      (Remote ID) beacons — UAS ID + position/vector — over a
      network channel so U-space services (network identification,
      geo-awareness, traffic information) can subscribe to the
      vehicle's identity and trajectory. The Network ID codec
      is byte-stable and round-trips; downstream encoding to a
      specific ASTM F3411-22 bit-packed wire format is a v0.9.x
      compatibility layer over the same in-memory message types.
    tags: [falcon, easa, u-space, remote-id, telemetry, v0.9]
    fields:
      req-type: functional
      priority: must
      verification-criteria: >
        relay-nid Basic ID and Location / Vector messages encode
        into a fixed 25-byte frame and round-trip through decode;
        proptest covers arbitrary in-range field values; the
        decoder never panics on arbitrary input.
    links:
      - type: derives-from
        target: STKH-FALCON-001

  - id: SYSREQ-FALCON-014
    type: system-req
    title: Safety — geofence violation triggers RTL even under sensor spoofing
    status: approved
    description: >
      The system shall enforce a geofence on the vehicle's true
      position and trigger Return-To-Launch on the first violation.
      The verified relay-lc Geofence engine consumes a sensor-
      independent truth signal (per LC-P09 / LC-P10 — monotone
      latch + transition-only) so a spoofed position feeding the
      controller cannot mask a true-position excursion. On
      violation, the same relay-sc RTL RTS the EkfHealthMonitor
      uses (SYSREQ-FALCON-011) is fired — one cFS-DNA safety
      pattern (detect → relay-sc → cascade), two detectors.
    tags: [falcon, safety, geofence, rtl, ew, spoofing, v0.10]
    fields:
      req-type: functional
      priority: must
      verification-criteria: >
        SITL geofence scenario in falcon-sitl-hover spoofs the
        controller's position by −10 m N while commanding a
        waypoint at +25 m N; the true position drives past the
        +15 m fence; relay-lc latches and relay-sc dispatches the
        RTL command. Verus discharges LC-P09 (monotone latch) and
        LC-P10 (transition-only) on the Geofence state machine.
    links:
      - type: derives-from
        target: STKH-FALCON-001

  - id: SYSREQ-FALCON-015
    type: system-req
    title: Safety — HITL evidence under RF GPS spoofing
    status: approved
    description: >
      The geofence safety path (SYSREQ-FALCON-014) shall be
      exercised end-to-end against an RF GPS-spoofing source via a
      hardware-in-the-loop (HITL) harness. The harness drives the
      same verified relay-lc → relay-sc chain the SITL does, only
      the position source changes — from a synthetic spoof in the
      SITL to a real GPS receiver tracking a transmitted spoof in
      the HITL. The harness is also exercised in software via a
      deterministic stub backend so the contract holds even when
      no hardware is connected (regression protection for the
      driver).
    tags: [falcon, safety, hitl, gps-spoof, rf, v0.11]
    fields:
      req-type: functional
      priority: must
      verification-criteria: >
        falcon-hitl-rfspoof crate provides (a) a `HitlBench` trait
        + `run_scenario()` driver covering the verdict shape an
        EASA reviewer reads, (b) a deterministic `StubBench`
        backend with positive and negative-control tests
        (`stub_bench_trips_and_dispatches`,
        `stub_bench_no_violation_no_latch`), and (c) a `HackRfBench`
        backend whose `gps-sdr-sim` + `hackrf_transfer` argv shapes
        are pinned by unit tests. README documents the bench wiring,
        legal containment, and the single `position_cm()`
        replacement point a real telemetry source needs.
    links:
      - type: derives-from
        target: STKH-FALCON-001

  - id: SYSREQ-FALCON-016
    type: system-req
    title: Safety — HITL evidence with live-FC MAVLink telemetry
    status: approved
    description: >
      The HITL harness (SYSREQ-FALCON-015) shall consume position
      telemetry from a real flight controller via the MAVLink
      protocol — GLOBAL_POSITION_INT (id 33) over UDP — so the
      same verified relay-lc → relay-sc chain that drives the
      SITL and the stub-bench is driven by a live FC's view of
      the world. The MavlinkBench backend closes the live-
      telemetry gap recorded in FV-FALCON-HITL-001; the only
      remaining bench-only step is the FC + SDR wiring the user
      performs on a real lab.
    tags: [falcon, safety, hitl, mavlink, telemetry, v0.12]
    fields:
      req-type: functional
      priority: must
      verification-criteria: >
        MavlinkBench backend (examples/falcon-hitl-rfspoof/src/
        mavlink.rs) reads GLOBAL_POSITION_INT frames via a
        FrameSource trait (UdpFrameSource for real bench,
        InMemoryFrameSource for tests), projects MAVLink
        lat/lon/alt to local NED cm via an equirectangular Home
        reference, and feeds the cached position through the
        verified safety path each harness tick. Positive +
        negative-control tests + relay-mavlink codec round-trip
        tests + miri robust-testing all green.
    links:
      - type: derives-from
        target: STKH-FALCON-001
  - id: SYSREQ-FALCON-017
    type: system-req
    title: Environmental disturbance rejection — wind, gusts, drag, turbulence
    status: approved
    description: >
      The flight stack shall maintain stable, bounded control under
      realistic environmental disturbances: a sustained wind, time-varying
      gusts, aerodynamic body drag, altitude-dependent air density (thrust
      lapse), ground effect near the surface, and a turbulence spectrum
      (Dryden/von Karman). Each disturbance shall be modelled BOTH in the
      verifiable no_std SimBackend (a CI-gated bounded-drift test) AND in the
      gz Harmonic SITL (WindEffects / LiftDrag / <atmosphere> / a turbulence
      feeder) for physical realism. The ADRC ESO rejects the torque component;
      the position loop must reject the translational force component — this
      requirement makes that an explicit, tested obligation rather than an
      untested assumption.
    tags: [falcon, environment, wind, drag, turbulence, realism, v1.16]
    fields:
      req-type: functional
      priority: must
      verification-criteria: >
        Through the FlightBackend seam: position hold and mission tracking stay
        bounded (documented drift limit) under a sustained wind + gusts, body
        drag, and a turbulence spectrum; the gz SITL reproduces each with the
        built-in systems. Holds or falsifies — published either way.
    links:
      - type: derives-from
        target: STKH-FALCON-001
  - id: SYSREQ-FALCON-018
    type: system-req
    title: Sensor-fidelity robustness — bias drift, GNSS noise/outage, barometer
    status: approved
    description: >
      The estimator shall remain consistent (NEES/ANEES within bound) and the
      vehicle controllable under realistic sensor models richer than white
      Gaussian noise: IMU bias-instability (static bias + random-walk dynamic
      bias), magnetometer bias, GNSS position/velocity noise and intermittent
      outage, and a barometric altitude source fused for vertical robustness.
      Modelled in both the no_std SimBackend (CI-gated consistency tests) and
      the gz Harmonic sensors (the <noise> bias_mean/dynamic_bias parameters
      the current world omits; a barometer air_pressure sensor).
    tags: [falcon, sensors, bias, gnss, barometer, fidelity, v1.18]
    fields:
      req-type: functional
      priority: must
      verification-criteria: >
        The IEKF stays consistent (ANEES near dof, no over-confidence) under
        IMU random-walk bias drift and noisy/intermittent GNSS; altitude hold
        survives GPS-vertical loss via a fused barometer. Bench + unit tests.
    links:
      - type: derives-from
        target: STKH-FALCON-001
  - id: SYSREQ-FALCON-019
    type: system-req
    title: Energy realism — battery drain, voltage sag, endurance-driven failsafe
    status: approved
    description: >
      The low-battery failsafe (SYSREQ-FALCON-011 family) shall be exercised
      against a realistic energy model rather than a set voltage: battery
      charge drains with motor power draw and terminal voltage sags under load.
      Modelled in the no_std SimBackend (a draining pack whose voltage is a
      function of charge and current) and in the gz SITL via the
      LinearBatteryPlugin with a motor power-load bridge, so the failsafe fires
      on a genuine endurance limit.
    tags: [falcon, battery, energy, endurance, failsafe, realism, v1.21]
    fields:
      req-type: safety
      priority: must
      verification-criteria: >
        With a draining battery model, terminal voltage sags under hover/
        manoeuvre load and crosses the failsafe threshold at a realistic
        endurance; the supervisor actuates RTL/Land. SimBackend test + gz run.
    links:
      - type: derives-from
        target: STKH-FALCON-001
  - id: SYSREQ-FALCON-020
    type: system-req
    title: Verified flight core as a portable WebAssembly Component-Model artifact
    status: approved
    description: >
      The verified flight core shall be deployable as a WebAssembly Component
      Model component — a typed, portable artifact that runs unchanged in any CM
      runtime (wasmtime) and is the clean hand-off to the separate
      hardware-integration project (meld → loom → synth → gale → board).
      Separation of concerns: this repo proves the component RUNS and is CORRECT
      (the same verified IEKF → geometric → ADRC → mixer cascade, executed as a
      component, closing the loop against the analytic SimBackend); the
      integration project owns transcoding it to silicon. The component is the
      contract — typed and stable so the integration project depends on it
      without knowing this repo's internals.
    tags: [falcon, wasm, component-model, deployment, toolchain, v1.26]
    fields:
      req-type: architecture
      priority: must
      verification-criteria: >
        falcon-core builds as a falcon:flight Component Model component
        (cargo-component, wasm32-wasip2) and RUNS in wasmtime: run-stabilization
        recovers a tilted body to level (< 0.1 rad) and run-position-hold flies
        to a setpoint (< 0.6 m), both executed by wasmtime — gated by
        scripts/wasmtime-flight-test.sh.
    links:
      - type: derives-from
        target: STKH-FALCON-001
