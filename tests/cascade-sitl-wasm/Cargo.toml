[package]
name = "cascade-sitl-wasm"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone workspace, exactly like tests/rate-loop-proof: this pulls
# wasmtime, which must not enter the main workspace's dependency graph.
[workspace]

[features]
# Real gz bridge, same shape as examples/falcon-sitl-gz: the included physics.rs
# gates its `gz_real` module on this, so enabling it brings in the same
# GazeboPhysics the native bench flies. Needs the gz-transport13 dev libs on
# PKG_CONFIG_PATH and a running `gz sim`. Off by default so the mock path stays
# dependency-free.
gazebo = ["dep:gz-transport", "dep:gz-msgs", "dep:crossbeam-channel"]

[dependencies]
wasmtime = { version = "41", features = ["component-model"] }
anyhow = "1"
libm = "0.2"
relay-ekf = { path = "../../crates/relay-ekf" }

# The NATIVE half of the differential test. These are the exact crates the wasm
# stage components wrap, so running them in-process and through the Component
# Model is the same code by two routes — which is the claim the demo makes.
relay-iekf = { path = "../../crates/relay-iekf" }
relay-pos = { path = "../../crates/relay-pos" }
relay-att = { path = "../../crates/relay-att" }
relay-rate = { path = "../../crates/relay-rate" }
relay-mix-quad = { path = "../../crates/relay-mix-quad" }

# Optional — only with feature `gazebo`. Versions match examples/falcon-sitl-gz
# EXACTLY; a different gz-transport here would be a different bridge than the
# one every native SITL result was produced with, and the comparison would stop
# meaning anything.
gz-transport = { version = "0.10", features = ["harmonic"], optional = true }
gz-msgs = { version = "0.10", features = ["harmonic"], optional = true }
crossbeam-channel = { version = "0.5", optional = true }
