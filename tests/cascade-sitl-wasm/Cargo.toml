[package]
name = "cascade-sitl-wasm"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone workspace, exactly like tests/rate-loop-proof: this pulls
# wasmtime, which must not enter the main workspace's dependency graph.
[workspace]

[features]
# Real gz bridge: forwards to crates/falcon-plant's `gazebo`, the same
# GazeboPhysics the native bench flies. Needs the gz-transport13 dev libs on
# PKG_CONFIG_PATH and a running `gz sim`. Off by default so the mock path stays
# dependency-free.
gazebo = ["falcon-plant/gazebo"]

[dependencies]
wasmtime = { version = "50.0.3", features = ["component-model"] }
anyhow = "1"
libm = "0.2"
relay-ekf = { path = "../../crates/relay-ekf" }

# The plant (Physics, MockPhysics, the gz bridge behind `gazebo`) and the
# pacing decision, from the crate examples/falcon-sitl-gz also depends on
# (relay#705). One crate, so the two harnesses cannot drift.
falcon-plant = { path = "../../crates/falcon-plant" }

# The NATIVE half of the equivalence test: the SAME flight core the cascade
# component wraps. Both sides call falcon-core; only the route differs.
falcon-core = { path = "../../crates/falcon-core" }
