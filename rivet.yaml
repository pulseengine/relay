project:
  name: relay
  version: "0.1.0"
  schemas:
    - common
    - aspice
    - stpa
    - stpa-sec
  description: >
    Formally verified flight software framework. The cFS-isomorphic
    mission layer (16 verified engines, all Verus SMT/Z3 proven —
    drop-in replacements for NASA cFS apps) plus the falcon dual-DNA
    extension (PX4-style control cascade as verified WIT components,
    fused statically by meld; airframe variants quad/hex/coax/vtol/fw).

sources:
  - path: artifacts/sysreq
    format: generic-yaml
  - path: artifacts/swarch
    format: generic-yaml
  - path: artifacts/swreq
    format: generic-yaml
  - path: artifacts/swdd
    format: generic-yaml
  - path: artifacts/verification
    format: generic-yaml
  # STPA-Sec hazard analysis (the security front-end of the V) for the
  # relay-sec safety-protected comms layer. Control structure uses the native
  # stpa sections; the sec-* artifacts use the generic type-tagged shape.
  - path: artifacts/stpa
    format: stpa-yaml
  - path: artifacts/stpa-sec
    format: generic-yaml
  # artifacts/features/ is a release roadmap, not an ASPICE work
  # product — rivet 0.10's schema has no `feature` type. It stays a
  # human-maintained doc, intentionally outside rivet's validation.

docs:
  - docs

results: results
